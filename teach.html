}
/* 單元封面：上傳過照片就放照片，沒有就退回圖示。
   ⚠️ <img data-file> 是全站共用的約定，loadThumbs() 會自己批次去拿縮圖並快取。 */
function coverInner(u) {
  if (u && u.coverId) {
    return '<img data-file="' + esc(u.coverId) + '" data-thumb="" alt="' +
      esc(u.nameZh || u.nameEn || '單元封面') + '">';
  }
  return '<span>' + esc((u && u.icon) || '🎨') + '</span>';
}

function unitName(id) {
  var u = unitOf(id);
  return u ? (u.nameEn + ' ' + u.nameZh) : '';
}
/* 表格裡的單元名。擠在一個窄欄裡時「英文 中文」會從中間折開、看起來像兩個名字，
   所以刻意分兩行：英文小字在上、中文粗體在下（2026-09-15 他圈的）。 */
function unitCell(id) {
  var u = unitOf(id);
  if (!u) return '<span class="hint">—</span>';
  return '<span class="u-cell">' +
    (u.nameEn ? '<span class="e">' + esc(u.nameEn) + '</span>' : '') +
    (u.nameZh ? '<span class="z">' + esc(u.nameZh) + '</span>' : '') + '</span>';
}
function sortedUnits() {
  return S.units.slice().sort(function (a, b) { return (a.ord || 0) - (b.ord || 0); });
}
function sortedClasses() {
  return S.classes.slice().sort(function (a, b) {
    return (a.ord || 0) - (b.ord || 0) || String(a.code).localeCompare(String(b.code));
  });
}
/* 節次：label 不是空的（例如「午休」）就是休息時段，不能排課 */
function allPeriods() {
  return S.periods.slice().sort(function (a, b) { return Number(a.no) - Number(b.no); });
}
function labelOfPeriod(no) {
  var p = allPeriods().filter(function (x) { return Number(x.no) === Number(no); })[0];
  return p ? String(p.label || "") : "";
}
function teachPeriods() {
  return allPeriods().filter(function (p) { return !String(p.label || "").trim(); });
}

function progOf(cls, unitId) {
  for (var i = 0; i < S.progress.length; i++) {
    var p = S.progress[i];
    if (String(p.cls) === String(cls) && String(p.unitId) === String(unitId)) return p;
  }
  return null;
}
function dropPhotoLocal(id) {
  for (var k in (S.photoIdx || {})) {
    S.photoIdx[k] = S.photoIdx[k].filter(function (p) { return String(p.id) !== String(id); });
  }
  if (S.photoTotal) S.photoTotal--;
}
function photosOf(prgId) { return (S.photoIdx && S.photoIdx[prgId]) || []; }
function photoCount() {
  var n = 0;
  for (var k in (S.photoIdx || {})) n += S.photoIdx[k].length;
  return n;
}
/* ⚠️ 座號那一格可能不是座號。試算表會把「3/9」吃成 3 月 9 日，讀回來就是
   「2026-03-09」——2026-09-21 他截圖的那一格就是這樣，202 班的 3 號和 9 號
   變成一位叫「2026-03-09」的學生，人數也多算一個。
   後端（Code.gs 的 numsText_／fixEaten_）會把號碼撿回來並且寫回試算表，
   這裡是同一條規則的副本：舊分頁、離線預覽拿到的還是舊字串。 */
function seatsFix(s) {
  var t = String(s == null ? '' : s).trim();
  var m = t.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) {
    var a = Number(m[2]), b = Number(m[3]);   /* 月＝第一個號碼、日＝第二個 */
    if (a >= 1 && a <= 99 && b >= 1 && b <= 99) return a + ', ' + b;
  }
  return t;
}
/* 分成「看得懂的號碼」和「讀不懂的」兩堆。讀不懂的不算人頭、也不假裝是學生，
   但也不要偷偷丟掉——出席狀況那一頁會把它原樣列出來請他改。 */
function seatParse(s) {
  var ok = [], odd = [];
  seatsFix(s).split(',').forEach(function (x) {
    x = x.trim();
    if (!x) return;
    if (/^\d{1,2}$/.test(x) && Number(x) >= 1) ok.push(x); else odd.push(x);
  });
  return { ok: ok, odd: odd };
}
function seatList(s) { return seatParse(s).ok; }

/* ── 缺席怎麼算 ─────────────────────────────────────────────
   seats ＝那一週誰沒來（事實，補完課也不會消失）
   done  ＝這幾個已經補過進度了
   待補  ＝ seats 減掉 done
   ⚠️ 2026-09-21 之前按「已補課」是把號碼從 seats 刪掉，所以「這孩子連兩週
   都沒來」這件事會被自己擦掉。常請假的孩子最需要被看見，事實那一欄不要動。 */
function seatsDone(a) { return a ? seatList(a.done) : []; }
function seatsLeft(a) {
  var done = seatsDone(a);
  return seatList(a ? a.seats : '').filter(function (x) { return done.indexOf(x) < 0; });
}
/* 按 ✓ 馬上畫、背景再存（2026-10-06 優化）。以前每按一個要等兩三秒，
   一次補五個孩子就是十幾秒盯著轉圈。
   ⚠️ 存不進去一定要退回來、而且說清楚是哪一號——「已記錄的東西不能自己消失」，
      反過來，「沒記成功的不能看起來像記好了」也一樣（2026-10-06 那個 24 號就是這樣）。
   ⚠️ 排隊一個一個送：連按三個，三個的順序不能亂，也不會同時改同一格。 */
var SEATQ = Promise.resolve();
function absById(id) {
  return (S.absences || []).filter(function (x) { return String(x.id) === String(id); })[0];
}
function setSeatDone(a, seat, on) {
  var list = seatsDone(a).filter(function (x) { return x !== String(seat); });
  if (on) list.push(String(seat));
  list.sort(function (p, r) { return Number(p) - Number(r); });
  a.done = list.join(', ');
  S._seat = null;                    /* 缺席統計的快取跟著作廢 */
}
function seatDoneNow(id, seat, on, okMsg) {
  var a = absById(id);
  if (!a) return toast('找不到這筆缺席紀錄，請重新整理再按一次。', true);
  setSeatDone(a, seat, on);
  render();
  toast(okMsg);
  SEATQ = SEATQ.then(function () {
    return call('apiSeatDone', id, seat, on).then(function (r) {
      var b = absById(id);
      if (b && r && r.id && String(b.done) !== String(r.done)) { b.done = r.done; S._seat = null; render(); }
    }).catch(function (e) {
      var b = absById(id);
      if (b) { setSeatDone(b, seat, !on); render(); }
      if (isLocked(e)) return fail(e);
      fail(new Error(seat + ' 號沒有存進去，已經改回原樣：' + ((e && e.message) || e)));
    });
  });
}
function isDone(a, seat) { return seatsDone(a).indexOf(String(seat)) >= 0; }

/* 這學期每個孩子缺席了幾次、哪幾週、還有幾次沒補。
   key 是「班級|座號」。算一次就掛在 S 上，換資料時 S 整個被換掉，快取自然失效。 */
function seatStats() {
  if (S._seat) return S._seat;
  var m = {};
  (S.absences || []).forEach(function (a) {
    var done = seatsDone(a);
    seatList(a.seats).forEach(function (x) {
      var k = String(a.cls) + '|' + x;
      var o = m[k] || (m[k] = { cls: String(a.cls), seat: x, weeks: [], left: 0, runs: 0 });
      o.weeks.push({ week: Number(a.week), id: a.id, done: done.indexOf(x) >= 0 });
      if (done.indexOf(x) < 0) o.left++;
    });
  });
  for (var k in m) {
    var o = m[k];
    o.weeks.sort(function (p, q) { return p.week - q.week; });
    o.n = o.weeks.length;
    /* 連續＝相鄰兩次的週次差 1。中間那一週如果這班全到，就不算連續。 */
    o.run = 1;
    var run = 1;
    for (var i = 1; i < o.weeks.length; i++) {
      run = (o.weeks[i].week - o.weeks[i - 1].week === 1) ? run + 1 : 1;
      if (run > o.run) o.run = run;
    }
    o.last = o.weeks[o.weeks.length - 1].week;
    /* 本週之前缺席過幾次。手機的快速記錄要用這個：那一格可能還沒存，
       用總次數會少算一次、存完又會多算一次，只有「之前幾次」是穩的。 */
    o.before = o.weeks.filter(function (w) { return w.week < Number(S.wk.week); }).length;
  }
  S._seat = m;
  return m;
}
function seatStat(cls, seat) {
  return seatStats()[String(cls) + '|' + String(seat)] || null;
}
/* 這學期缺席不只一次的孩子，最該被看見的排前面 */
function repeatSeats() {
  var m = seatStats(), out = [];
  for (var k in m) if (m[k].n >= 2) out.push(m[k]);
  out.sort(function (a, b) {
    return (b.run - a.run) || (b.n - a.n) || (b.last - a.last) ||
           String(a.cls).localeCompare(String(b.cls)) || (Number(a.seat) - Number(b.seat));
  });
  return out;
}
function isArchived() {
  var a = String(S.settings.archived || '').split(',');
  return a.indexOf(S.settings.term) >= 0;
}
/* 今天是星期幾（1–5），週末回 0。
   ⚠️ 用後端給的 S.today，不要用瀏覽器的 new Date()——
   兩邊差一天的時候（跨午夜、時區、離線預覽）整頁的「今天」就會各說各話。 */
function todayDay() {
  return S && S.today ? dayOfDate(S.today) : 0;
}
function termLabel(t) {
  var p = String(t).split('-');
  return p[0] + ' ' + (p[1] === '2' ? '下學期' : '上學期');
}

/* ── 管理通行碼 ─────────────────────────────────────────────
 *  沒設通行碼的話這一段永遠不會跑到——後端不會丟 LOCKED 回來。
 * ─────────────────────────────────────────────────────────── */

/* 開啟時就被擋下來：整頁換成鎖定畫面，解開之後跑 after() */
function askPass(after) {
  $('app').style.display = 'none';
  $('boot').style.display = '';
  $('boot').className = '';
  $('boot').innerHTML =
    '<div class="lock"><div class="big">🔒</div>' +
    '<h2>請輸入管理通行碼</h2>' +
    '<p>這一頁只有你進得來。忘記通行碼的話，在 Apps Script 編輯器執行 ' +
    '<b>設定通行碼()</b> 換一組新的。</p>' +
    '<input id="pwIn" type="password" autocomplete="current-password" placeholder="通行碼">' +
    '<button class="btn" id="pwGo">進入 Enter</button>' +
    '<div class="err" id="pwErr"></div></div>';

  var go = function () {
    var v = $('pwIn').value;
    if (!v) return;
    $('pwGo').disabled = true;
    $('pwErr').textContent = '確認中…';
    unlock(v, function (err) {
      $('pwGo').disabled = false;
      if (err) {
        $('pwIn').value = '';
        $('pwErr').textContent = err;
        $('pwIn').focus();
        return;
      }
      $('boot').className = 'loading';
      $('boot').textContent = '載入中…　Loading…';
      after();
    });
  };
  $('pwGo').onclick = go;
  $('pwIn').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  $('pwIn').focus();
}

/* 用到一半通行證才過期：不要清掉畫面上的東西，跳個小視窗問一次就好 */
function relock() {
  openMask('<div class="modal"><h3><i class="ci ci-lock" aria-hidden="true">🔒</i> 需要重新輸入通行碼</h3>' +
    '<p class="hint" style="margin:0 0 12px">閒置太久，剛才那個動作還沒有存進去。' +
    '輸入通行碼之後，再按一次剛才那個按鈕就好。</p>' +
    '<input id="pw2" class="pw-in" type="password" autocomplete="current-password" placeholder="通行碼">' +
    '<div class="pw-err" id="pw2Err"></div>' +
    '<div class="acts"><button class="btn ghost" id="pw2No">取消</button>' +
    '<button class="btn" id="pw2Ok">解鎖</button></div></div>');

  var go = function () {
    var v = $('pw2').value;
    if (!v) return;
    $('pw2Ok').disabled = true;
    $('pw2Err').textContent = '確認中…';
    unlock(v, function (err) {
      $('pw2Ok').disabled = false;
      if (err) {
        $('pw2').value = '';
        $('pw2Err').textContent = err;
        $('pw2').focus();
        return;
      }
      closeModal();
      toast('已解鎖，請再按一次剛才那個按鈕。');
    });
  };
  $('pw2No').onclick = closeModal;
  $('pw2Ok').onclick = go;
  $('pw2').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  $('pw2').focus();
}

/* 共用的那一問。成功時 done()，失敗時 done('要給使用者看的話') */
function unlock(pass, done) {
  call('apiAdminUnlock', pass).then(function (r) {
    if (!r || !r.ok) {
      done(r && r.wait
        ? ('連續輸錯太多次了，請等 ' + r.wait + ' 秒再試一次。')
        : '通行碼不對。');
      return;
    }
    saveTok(r.token, r.hours);
    done('');
  }).catch(function (e) {
    done((e && (e.message || e.error)) ? String(e.message || e.error) : String(e));
  });
}

/* ── 啟動 ───────────────────────────────────────────────── */
function boot(week) {
  call('apiBootstrap', week || '').then(function (data) {
    S = data;
    $('boot').style.display = 'none';
    $('boot').className = 'loading';
    $('app').style.display = '';
    drawTop();
    drawNav();
    render();
    /* 每週自動備份：畫面先出來，再在背景問一聲（一週才真的做一次）。
       ⚠️ 失敗不吵——結果寫在系統設定的「系統狀態」裡。 */
    if (!boot.bk) { boot.bk = true; call('apiMaybeBackup').catch(function () {}); }
  }).catch(function (e) {
    if (isLocked(e)) return askPass(function () { boot(week); });
    $('boot').style.display = '';
    $('boot').className = 'loading';
    $('boot').innerHTML = '<div style="color:#98243c">載入失敗：' + esc(e && e.message || e) +
      '</div><div class="hint" style="margin-top:10px">' +
      '第一次開啟時 Google 會要求授權，請照著畫面按「允許」。</div>';
  });
}

/* 頂欄現在橫跨整個畫面，側欄要黏在它下面——高度會隨視窗寬度變（手機會折兩行），
   所以量一次寫進 --topH，不要寫死。 */
function fitTop() {
  var t = document.querySelector('.top');
  if (!t) return;
  document.documentElement.style.setProperty('--topH', Math.round(t.getBoundingClientRect().height) + 'px');
  /* 紙的上緣那條唇（.main::before）黏在側標下面，所以側標的高度也要量。
     側標會被 fitNav() 換排法、縮放，高度跟著變——用 ResizeObserver 盯著，
     不要靠每個改到它的地方記得呼叫。 */
  var n = $('nav');
  if (n) document.documentElement.style.setProperty('--navH', Math.round(n.getBoundingClientRect().height) + 'px');
  if (!fitTop.ro && window.ResizeObserver) {
    fitTop.ro = new ResizeObserver(function () { fitTop(); });
    fitTop.ro.observe(t);
    if (n) fitTop.ro.observe(n);
  }
}
window.addEventListener('resize', fitTop);

/* 拉動視窗、轉螢幕方向、分割畫面——寬度一變就要重新量一次導覽。
   ⚠️ 網頁字型是後來才換上去的，字換了寬度就變，所以字型備妥時也要再量一次；
      少了這一行，第一眼會看到用系統字算出來的那一版（2026-09-18）。 */
(function watchNav() {
  var t = null;
  function later() { clearTimeout(t); t = setTimeout(fitNav, 120); }
  window.addEventListener('resize', later);
  window.addEventListener('orientationchange', later);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fitNav(); });
})();

function drawTop() {
  /* 頂欄那兩顆的圖示。⚠️ 寫在這裡不是在 HTML 裡——圖示的路徑統一收在 ICONS，
     以後改一次就好；HTML 那邊只留一個空的 <span>。 */
  /* ⚠️ 這三顆是彩色 emoji，不是線條圖（2026-09-20 他要改回來）。
     線條圖是給「沒選到的側標」用的——那裡要跟著文字變灰；
     頂欄這一條不會變灰，彩色的才跟選到的那張側標是同一種語氣。
     ⚠️ 高度靠 .top .i 的 line-height:1 壓住，不要拿掉（emoji 的行框比字高一截，
        不壓的話整條頂欄會從 48 被撐到 60）。 */
  if ($('topYearIc') && !$('topYearIc').innerHTML) $('topYearIc').textContent = '🎒';
  if ($('topWeekIc') && !$('topWeekIc').innerHTML) $('topWeekIc').innerHTML = '<i class="ci ci-sched" aria-hidden="true">📅</i>';
  if ($('topFindIc') && !$('topFindIc').innerHTML) $('topFindIc').textContent = '🔍';
  /* 學年度和學期寫在同一顆上（以前是「115 學年度」一顆、「115 上學期」在教師名片裡，
     同一個學期寫了兩次）。⚠️「已封存·唯讀」本來掛在教師名片上，那張卡拿掉了，
     要收到這裡來，不然整個畫面就看不出自己在看一個唯讀的舊學期。 */
  $('topYear').textContent = S.settings.year + ' 學年度' +
    (String(S.settings.term).split('-')[1] === '2' ? '下學期' : '上學期') +
    (isArchived() ? ' · 唯讀' : '');
  $('topWeek').textContent = '第 ' + S.wk.week + ' 週';
  $('topRange').textContent = S.wk.monday.slice(5).replace('-', '/') + ' – ' +
                              S.wk.friday.slice(5).replace('-', '/');
  fitTop();
}

/* 手機上看得到的頁面。課表管理格子多、在手機上排不了課，藏起來 */
function navPages() {
  var phone = isPhone();
  return PAGES.filter(function (p) {
    return !(phone && (p.deskOnly || p.phoneHide)) && !(!phone && p.phoneOnly);
  });
}

/* 這一頁在這台裝置上看不到的話，換到對應的那一頁去 */
function fallbackPage(id) {
  var pg = PAGES.filter(function (p) { return p.id === id; })[0];
  if (!pg) return id;
  if (isPhone()  && pg.deskOnly)  return 'quick';
  if (!isPhone() && pg.phoneOnly) return 'check';   /* 快速記錄 → 進度檢核 */
  return id;
}

function drawNav() {
  var lastG = null, first = true;
  $('nav').innerHTML = navPages().map(function (p) {
    /* 橫排的導覽塞不下「每天記錄／課程／設定」這種標題，
       改成在換組的地方插一條細線，分組的感覺還在。 */
    var head = '';
    if (p.g !== lastG && !first) head = '<span class="nsep" aria-hidden="true"></span>';
    lastG = p.g || null;
    first = false;
    return head +
      '<a href="#' + p.id + '" data-p="' + p.id + '" class="' + (p.id === PAGE ? 'on' : '') + '"' +
      (p.id === PAGE ? ' aria-current="page"' : '') + '>' +
      '<span class="ic' + (p.id === PAGE ? ' em' : '') + '" aria-hidden="true">' +
        (p.id === PAGE ? '<i class="ci ci-' + p.id + '" aria-hidden="true">' + p.em + '</i>' : ico(p.ic)) + '</span>' +
      '<span class="lb"><span class="z">' + p.z + '</span>' +
      '<span class="e">' + p.e + '</span></span></a>';
  }).join('');
  fitNav();
  applyTint();
  Array.prototype.forEach.call($('nav').querySelectorAll('a'), function (a) {
    a.onclick = function (ev) { ev.preventDefault(); go(a.dataset.p); };
  });
}

function go(id) {
  id = fallbackPage(id);
  PAGE = id;
  location.hash = id;
  drawNav();
  render();
  window.scrollTo(0, 0);
}

/* 重新載入整包資料後再畫一次 */
function refresh(data, msg, again) {
  /* ⚠️ 存檔的 API 回來的一律是「本週」（後端不知道畫面在看哪一週）。
     正在看別週的時候——在課表登記下週停課、改下下週那一格——套上去畫面就跳回本週，
     剛改的東西看不到，像沒存進去（2026-10-06 健檢）。同一個學期才補抓那一週；
     切學期本來就該換週。 */
  /* ⚠️ 只補抓一次（again）：補抓回來的週次如果還是對不上（後端把週次夾住了、
     預覽的假資料不認週次），就照它給的畫，不要一直重抓——踩過，會無限迴圈。 */
  var keep = (!again && data && data.wk && S && S.wk && S.settings && data.settings &&
              String(data.settings.term) === String(S.settings.term) &&
              Number(data.wk.week) !== Number(S.wk.week)) ? S.wk.week : 0;
  if (keep) {
    return call('apiBootstrap', keep)
      .then(function (d) { refresh(d, msg, true); })
      .catch(function () { keep = 0; S = data; drawTop(); render(); if (msg) toast(msg); });
  }
  if (data) S = data;
  drawTop();
  render();
  if (msg) toast(msg);
}

function render() {
  var fn = ({
    quick:vQuick, home:vHome, sched:vSched, prog:vProg, notes:vNotes,
    check:vCheck, absent:vAbsent, res:vRes, set:vSet
  })[PAGE] || vHome;
  $('views').innerHTML = fn();
  if (window['a' + PAGE]) window['a' + PAGE]();     /* 綁事件 */

  /* 手機課表的星期分頁，首頁和課表管理共用 */
  Array.prototype.forEach.call(document.querySelectorAll('[data-ttd]'), function (b) {
    b.onclick = function () { UI.sched.day = Number(b.dataset.ttd); render(); };
  });

  bindEdit();
  bindFocusEdit();
  /* ⚠️ 集中在這裡呼叫一次就好。以前是 aquick／acheck／ares 各自呼叫，
     新加會出圖的地方（單元封面）就得記得補一行；漏了不會報錯，只是圖不出來。
     loadThumbs() 有 THUMBS 快取，重畫不會重抓。 */
  loadThumbs();
  /* ⚠️ 內容畫完才知道這一頁有沒有長到要出現直向捲軸；捲軸一出現，
     側標可用的寬度就少了十幾像素。drawNav() 是在內容之前量的，這裡再收一次。
     （Mac 和 iPad 的捲軸是浮在上面的、不佔寬度，這一行是給接滑鼠的桌機用的。） */
  fitNav();
}

/* ── 桌機看文字、手機直接打字 ───────────────────────────────
 *  桌機：先把寫過的內容攤開來讀，要改再按「編輯」——平常不會看到一片輸入框。
 *  手機：本來就是要邊上課邊打，直接給輸入框，少按一次。
 *  其他地方要用同一種鋪陳，套 editBlock() 就好。
 * ─────────────────────────────────────────────────────────── */
function editBlock(id, value, placeholder, title) {
  /* 手機：點一下才整片展開來打（見 feBlock）。直接攤一個輸入框的話，
     鍵盤一上來就把它推到看不見的地方。 */
  if (isPhone()) return feBlock(id, value, placeholder, title || '課堂札記 Class Note');
  if (UI.editing[id]) {
    return '<textarea id="' + id + '" placeholder="' + esc(placeholder) + '">' +
      esc(value) + '</textarea>';
  }
  return '<div class="ro">' +
    (value ? esc(value).replace(/\n/g, '<br>')
           : '<span class="ro-empty">' + esc(placeholder) + '</span>') +
    '</div>' +
    '<button class="btn ghost sm no-print" data-edit="' + id + '">✏️ 編輯</button>';
}

/* ── 專心打字（手機）───────────────────────────────────────
 *  他回報：手機打備註時「會被鍵盤和上下畫面擋住，看不見自己打什麼」。
 *  所以手機上頁面裡放的不是輸入框，而是一格「點一下打字」；點下去才整片蓋上來，
 *  畫面上只剩正在編輯的這一欄，高度跟著鍵盤縮（visualViewport）。
 *
 *  ⚠️ 值還是存在原本那個 textarea 裡（藏起來），只是不給他直接打。
 *     這樣 $('qNote').value、$('kNote').oninput 這些既有的程式一行都不用改。
 * ─────────────────────────────────────────────────────────── */
function feInner(value, placeholder) {
  return (value ? esc(value).replace(/\n/g, '<br>')
                : '<span class="ph">' + esc(placeholder) + '</span>') +
    '<span class="go">✏️ 點一下打字</span>';
}
function feBlock(id, value, placeholder, title) {
  return '<div class="tapbox" role="button" tabindex="0" data-fetap="' + esc(id) + '" ' +
      'data-feph="' + esc(placeholder) + '" data-fetitle="' + esc(title) + '">' +
      feInner(value, placeholder) + '</div>' +
    '<textarea id="' + esc(id) + '" style="display:none">' + esc(value) + '</textarea>';
}

var _fe = null;
/* 鍵盤推上來時，可見範圍會變小、還會被捲上去；跟著 visualViewport 重算，
   輸入框才會剛好停在鍵盤上面。沒有 visualViewport 的舊瀏覽器就維持 height:100%。 */
function feFit() {
  var vv = window.visualViewport;
  if (!_fe || !vv) return;
  _fe.style.height = vv.height + 'px';
  _fe.style.transform = 'translateY(' + vv.offsetTop + 'px)';
}
function feClose(save) {
  var box = _fe;
  if (!box) return;
  _fe = null;
  if (window.visualViewport) {
    window.visualViewport.removeEventListener('resize', feFit);
    window.visualViewport.removeEventListener('scroll', feFit);
  }
  /* 蓋著的時候如果整頁重畫過，box._ta 會變成已經被丟掉的那一個節點，
     值寫進去就不見了。所以先照 id 重新找一次現在畫面上的那個。 */
  var ta = box._ta && $(box._ta.id) ? $(box._ta.id) : box._ta;
  var v = box.querySelector('textarea').value;
  document.body.style.overflow = box._ovf || '';
  if (box.parentNode) box.parentNode.removeChild(box);
  if (!save) return;
  /* 呼叫的人自己要處理（像單元省思，值不在畫面上的哪個 textarea 裡） */
  if (box._done) return box._done(v);
  if (!ta) return;
  ta.value = v;
  /* 走一次原本綁的 oninput，值才會回到 UI.quick.note／UI.check.note */
  if (typeof ta.oninput === 'function') ta.oninput.call(ta, { target:ta });
  var show = document.querySelector('[data-fetap="' + ta.id + '"]');
  if (show) show.innerHTML = feInner(v, show.dataset.feph || '');
  /* ⚠️ 這條路是程式自己把值寫回去的，不會觸發 input 事件，
     watchDraft 收不到——草稿要在這裡自己存一次。 */
  if (typeof draftSave === 'function') draftSave();
}
/* ta 可以是畫面上那個藏起來的 <textarea>，也可以直接給一串文字
   （後者要配 onDone，按「完成」時把新的值交回去）。 */
function focusEdit(ta, title, placeholder, onDone) {
  if (_fe) return;
  if (!ta && !onDone) return;
  var box = el('<div class="fe"><div class="fe-hd">' +
    '<div class="t">' + esc(title || '課堂札記') + '</div>' +
    '<button class="btn ghost sm" id="feCancel">取消</button>' +
    '<button class="btn sm" id="feOk">✓ 完成</button></div>' +
    '<textarea placeholder="' + esc(placeholder || '') + '"></textarea>' +
    '<div class="fe-ft">打完按「完成」回到原本的畫面，別忘了再按儲存。</div></div>');
  box._ta   = (ta && typeof ta === 'object') ? ta : null;
  box._done = onDone || null;
  box._ovf  = document.body.style.overflow;
  document.body.appendChild(box);
  _fe = box;
  var ed = box.querySelector('textarea');
  ed.value = box._ta ? box._ta.value : String(ta || '');
  document.body.style.overflow = 'hidden';
  feFit();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', feFit);
    window.visualViewport.addEventListener('scroll', feFit);
  }
  $('feOk').onclick     = function () { feClose(true); };
  $('feCancel').onclick = function () { feClose(false); };
  /* ⚠️ focus() 一定要在這一次點擊的事件裡同步呼叫。
     包進 setTimeout 的話 iOS 會當成「不是使用者按的」，鍵盤不會跳出來。 */
  try {
    ed.focus();
    ed.setSelectionRange(ed.value.length, ed.value.length);
  } catch (e) {}
}
function bindFocusEdit() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-fetap]'), function (b) {
    b.onclick = function () {
      focusEdit($(b.dataset.fetap), b.dataset.fetitle, b.dataset.feph);
    };
  });
}

/* 英文不要超出中文那一行的最後一個字。中文四個字寬度固定，
   所以量一次「最長的英文」，算出一個共用的縮放比例寫進 --nav-en 就好。
   換標籤、換字級、使用者放大縮小都會重算，不用回來改數字。 */
function fitNavEn() {
  var nav = $('nav');
  if (!nav) return;
  nav.style.removeProperty('--nav-en');
  var zs = nav.querySelectorAll('.lb .z'), es = nav.querySelectorAll('.lb .e');
  if (!zs.length || !es.length) return;
  /* ⚠️ 要量「文字」的寬度，不是元素的寬度。.z 是區塊元素，寬度會被同一項
     比較長的英文撐開，拿它來算就會愈算愈寬（我第一版就是這樣）。 */
  var textW = function (el) {
    var r = document.createRange();
    r.selectNodeContents(el);
    return r.getBoundingClientRect().width;
  };
  var zw = 0, ew = 0;
  Array.prototype.forEach.call(zs, function (z) { zw = Math.max(zw, textW(z)); });
  Array.prototype.forEach.call(es, function (e) { ew = Math.max(ew, textW(e)); });
  if (!zw || !ew) return;
  var base = parseFloat(getComputedStyle(es[0]).fontSize) || 15;
  /* 2026-09-14 他要英文再大一點、側欄跟著寬一點點。
     原本的規則是「英文不能超出中文那一行」，現在放寬到 1.6 倍——
     側欄是 max-content，會自己跟著長，這正是他要的「再寬一點點」。
     還是保留上限（base）與下限（13px），換更長的標籤時不會失控。 */
  var size = Math.max(13, Math.min(base, base * (zw * 1.6) / ew));
  nav.style.setProperty('--nav-en', size.toFixed(2) + 'px');
}

/* ── 讓整條導覽塞進這台裝置的畫面 ─────────────────────────────
   三種排法（見樣式表「導覽的三種排法」），從寬到窄試，
   第一個放得下的就用它；同一種排法之內再用 --nav-k 連續縮。
   min 是那一種排法最多能縮到多小——再小字就讀不出來了，換下一種比較好看。
   ⚠️ 量的是 scrollWidth 與 clientWidth，不是視窗寬度。側標的寬度由文字決定，
      換標籤、換字型、使用者把系統字級調大，量出來的都還是對的。 */
var NAV_FITS = [
  { cls:'',           min:.90 },   /* 並排 */
  { cls:'stack',      min:.84 },   /* 疊排，保留英文 */
  { cls:'side mini',  min:.72 },   /* 並排，英文收起來 ← 手機從這一種開始試 */
  { cls:'stack mini', min:.60 }    /* 疊排，英文收起來（最省，塞不下才用） */
];

function setNavFit(nav, cls, k) {
  nav.className = 'nav' + (cls ? ' ' + cls : '');
  nav.style.setProperty('--nav-k', k.toFixed(3));
}

function fitNav() {
  var nav = $('nav');
  if (!nav) return;
  fitNavEn();
  /* 手機一律維持最省的那一種（圖示大、不放英文），
     不要因為橫著拿變寬了就跳回並排——那一排在手機上一格只剩兩公分。 */
  /* 手機從「並排 ＋ 英文收起來」開始試（2026-09-20 他要圖示和文字並排，
     一排三張側標放得下，看起來比圖示疊在上面精緻）。
     ⚠️ 不要從第一種開始——那一種要放英文，手機一格只剩兩公分。
     真的塞不下（很窄的手機、或以後側標變多）會自己掉到最後那一種疊排。 */
  var from = isPhone() ? NAV_FITS.length - 2 : 0;
  for (var i = from; i < NAV_FITS.length; i++) {
    var f = NAV_FITS[i], last = (i === NAV_FITS.length - 1);
    setNavFit(nav, f.cls, 1);
    /* ⚠️ 側標是 flex:1 1 0，放得下的時候會自己撐滿，
       所以 scrollWidth 一定 >= clientWidth，「剛好相等」就是放得下。
       這裡不要再自己減 1px 當安全距離——那樣永遠不會相等，會一路縮到最小
       （2026-09-18 踩到，整條導覽直接掉到 8px 的字）。 */
    var avail = nav.clientWidth;
    if (nav.scrollWidth <= avail) return;     /* 原尺寸就放得下 */
    var k = avail / nav.scrollWidth, fit = false;
    /* ⚠️ 不能只算一次。邊框（每張 2px）和左右內距是固定的，不跟著縮，
       所以「照比例算出來的 k」一定會差一點點，要拿量到的結果再收一兩次；
       每次多讓 0.004 出來，不然會卡在差 0.2px 的地方一直不過（2026-09-18 踩到）。 */
    for (var t = 0; t < 4 && k >= f.min; t++) {
      setNavFit(nav, f.cls, Math.max(f.min, k));
      if (nav.scrollWidth <= nav.clientWidth) { fit = true; break; }
      k = k * avail / nav.scrollWidth - 0.004;
    }
    if (fit || last) {
      if (!fit) setNavFit(nav, f.cls, f.min);   /* 最後一種，就算還差一點也只能這樣 */
      return;
    }
  }
}

function bindEdit() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function (b) {
    b.onclick = function () {
      UI.editing[b.dataset.edit] = true;
      render();
      var el = $(b.dataset.edit);
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    };
  });
}

/* 換班級／換單元／存好之後，收回唯讀狀態，不要一直停在編輯框 */
function closeEdit(id) { delete UI.editing[id]; }

/* ── 共用片段 ───────────────────────────────────────────── */
/* full=true 才是完整的大橫幅（只有首頁）。
   其他頁用壓扁版：標題＋一行中文，高度從 250px 收到 96px——
   每一頁都先看 250px 的圖，等於每次都要滑過去才看得到真正要動的東西。 */
function hero(en, zh, sub, l1, l2, deco, full) {
  if (!full) {
    return '<div class="hero slim"><h1>' + esc(en) + ' <span class="zh">' + esc(zh) + '</span></h1>' +
      '<div class="sub">' + esc(sub) + '</div>' +
      '<div class="art" aria-hidden="true"></div></div>';
  }
  return '<div class="hero"><h1>' + esc(en) + ' <span class="zh">' + esc(zh) + '</span></h1>' +
    '<div class="sub">' + esc(sub) + '</div>' +
    '<div class="lines"><div>' + esc(l1) + '</div><div>' + esc(l2) + '</div></div>' +
    '<div class="art" aria-hidden="true"></div></div>';
}

/* 首頁那句招呼跟著時間走。以前固定寫「Welcome, Teacher!」——
   這個站只有他一個人在用，寫死的招呼語等於沒有資訊（2026-09-18 他說要改）。 */
function greetEn() {
  var h = new Date().getHours();
  return h < 12 ? 'Good morning,' : h < 18 ? 'Good afternoon,' : 'Good evening,';
}
/* 設定裡的教師名稱是「楊明鑫老師 Teacher Chris」這種中英混寫，
   取最後一個純英文的字當招呼用的名字；取不到就退回 Teacher，不會變成空的。 */
function myName() {
  var t = String(S.settings.teacher || '').trim().split(/\s+/);
  for (var i = t.length - 1; i >= 0; i--) {
    if (/^[A-Za-z][A-Za-z.'-]*$/.test(t[i]) && !/^teacher$/i.test(t[i])) return t[i];
  }
  return 'Teacher';
}

function statCard(ic, tone, en, zh, n, unit) {
  return '<div class="stat"><div class="h">' +
    '<div class="ic c-' + tone + '" aria-hidden="true">' + ic + '</div>' +
    '<div class="tx"><div class="e">' + esc(en) + '</div><div class="z">' + esc(zh) + '</div></div>' +
    '<div class="n">' + n + (unit ? '<small>' + esc(unit) + '</small>' : '') + '</div>' +
    '</div></div>';
}

function selClasses(id, val, allLabel) {
  var o = allLabel ? '<option value="">' + esc(allLabel) + '</option>' : '';
  o += sortedClasses().map(function (c) {
    return '<option value="' + esc(c.code) + '"' +
      (String(c.code) === String(val) ? ' selected' : '') + '>' + esc(c.code) + '</option>';
  }).join('');
  return '<select id="' + id + '">' + o + '</select>';
}

function selUnits(id, val, allLabel) {
  var o = allLabel ? '<option value="">' + esc(allLabel) + '</option>' : '';
  o += sortedUnits().map(function (u) {
    return '<option value="' + esc(u.id) + '"' + (String(u.id) === String(val) ? ' selected' : '') +
      '>' + esc(u.nameEn + ' ' + u.nameZh) + '</option>';
  }).join('');
  return '<select id="' + id + '">' + o + '</select>';
}

function badge(status) {
  var s = ST[status];
  return s ? '<span class="badge ' + s.k + '">' + s.z + ' ' + s.e + '</span>' : '';
}

/* 一張課表。cells(day, period) 要回傳格子內容的 HTML（空字串＝沒課） */
/* 手機不畫五天的格子表——橫向捲動在手機上很難操作。
   改成「先選一天，再垂直列出那天的課」。 */
/* ⚠️ 這個條件一定要跟 CSS 手機斷點那一行一模一樣
   （`@media (max-width:600px), (max-height:520px) and (max-width:1024px)`）。
   橫著拿手機時寬度是 844，只看寬度就會判成桌機，然後整頁用桌機版面畫在手機上。 */
/* ⚠️ 2026-10-06 從 820 改成 600：直拿的 iPad（744～834）以前被當成手機，只剩三頁。
   他要平板直的也是完整版面；手機直拿最寬約 440，600 以下一定是手機。 */
var PHONE_MQ = '(max-width:600px), (max-height:520px) and (max-width:1024px)';
function isPhone() {
  return !!(window.matchMedia && window.matchMedia(PHONE_MQ).matches);
}

function timetable(cells, readonly) {
  if (isPhone()) return timetableDay(cells, readonly);
  return timetableGrid(cells, readonly);
}

function timetableDay(cells, readonly) {
  var d = Number(UI.sched.day) || todayDay() || 1;
  var h = '<div class="tt-days">' + [1, 2, 3, 4, 5].map(function (x) {
    return '<button data-ttd="' + x + '" class="' + (x === d ? 'on' : '') + '">' +
      '週' + DAYS[x].charAt(0) +
      '<small>' + esc(S.wk.days[x - 1].slice(5).replace('-', '/')) + '</small></button>';
  }).join('') + '</div>';

  var dHol = holidayOn(S.wk.days[d - 1]);
  if (dHol) h += '<div class="qk-pend ok" style="margin-bottom:10px">🏖️ 這一天放假：<b>' +
    esc(holName(dHol)) + '</b></div>';

  h += '<div class="tt-list">';
  var pers = allPeriods();
  for (var i = 0; i < pers.length; i++) {
    var p = pers[i];
    var lab = String(p.label || '').trim();
    if (lab) {
      h += '<div class="tt-r brk"><span class="tm">' + esc(p.start) + ' – ' + esc(p.end) + '</span>' +
           '<span class="nm">' + esc(lab) + '</span></div>';
      continue;
    }
    h += '<div class="tt-r"><span class="tm"><b>第 ' + esc(p.no) + ' 節</b>' +
         esc(p.start) + ' – ' + esc(p.end) + '</span>' +
         '<span class="cell">' + cells(d, Number(p.no)) + '</span></div>';
  }
  return h + '</div>';
}

function timetableGrid(cells, readonly) {
  var h = '<div class="scroll-x"><table class="tt' + (readonly ? ' ro' : '') + '"><thead><tr>' +
          '<th>Time / 時間</th>';
  var hols = [];
  for (var d = 1; d <= 5; d++) {
    var hd = holidayOn(S.wk.days[d - 1]);
    hols.push(hd);
    h += '<th' + (hd ? ' class="hol"' : '') + '>' +
         esc(S.wk.days[d - 1].slice(5).replace('-', '/')) + '（' + DAYS[d].charAt(0) + '）<br>' +
         (hd ? '<span class="hol-t">🏖️ ' + esc(holName(hd)) + '</span>'
             : '<span style="font-weight:500;color:#5e645f">' + DAYS[d].slice(2) + '</span>') +
         '</th>';
  }
  h += '</tr></thead><tbody>';
  var pers = allPeriods();
  for (var i = 0; i < pers.length; i++) {
    var p = pers[i];
    var lab = String(p.label || "").trim();
    h += "<tr><td class=\"tm\"><b>" + esc(p.start) + " – " + esc(p.end) + "</b>" +
         (lab ? esc(lab) : "第 " + esc(p.no) + " 節") + "</td>";
    if (lab) {                       /* 休息時段：橫跨整列，不排課 */
      h += "<td class=\"brk\" colspan=\"5\">" + esc(lab) + "</td></tr>";
      continue;
    }
    for (var d2 = 1; d2 <= 5; d2++) {
      h += '<td' + (hols[d2 - 1] ? ' class="hol"' : '') + '>' + cells(d2, Number(p.no)) + '</td>';
    }
    h += "</tr>";
  }
  return h + '</tbody></table></div>';
}

/* 「8:30」「8：30」「0830」都收，統一成「08:30」。後端也會再整理一次 */
function normTime(v) {
  v = String(v == null ? '' : v).trim().replace(/[：．.]/g, ':');
  if (!v) return '';
  var m = v.match(/^(\d{1,2})\s*:\s*(\d{1,2})$/) || v.match(/^(\d{1,2})(\d{2})$/);
  if (!m) return v;
  var h = Math.min(23, parseInt(m[1], 10)), mi = Math.min(59, parseInt(m[2], 10));
  if (isNaN(h) || isNaN(mi)) return v;
  return (h < 10 ? '0' : '') + h + ':' + (mi < 10 ? '0' : '') + mi;
}

function schedAt(day, period) {
  for (var i = 0; i < S.schedule.length; i++) {
    var r = S.schedule[i];
    if (Number(r.day) === Number(day) && Number(r.period) === Number(period)) return r;
  }
  return null;
}

/* ── 臨時異動：停課與調課 ───────────────────────────────────
   固定課表（`S.schedule`）是整個學期的，全校活動、調課**都不動它**——
   動了的話往後每一週都跟著錯（2026-09-19 他特別交代）。
   臨時的事情只認日期，分兩種：

   · **停課** `S.holidays` —— `periods` 空的＝整天（國定假日、颱風假）；
     填 `1|2` ＝只有那幾節（期中考、兒童節活動、大掃除）。其餘節次照常上課。
   · **調課** `S.moves` —— 某一天某一節的課，這一次挪到別天別節（可以跨週）。

   ⚠️ 要問「某一天的第幾節是哪一班」一律用 `slotOn(date, period)`。
   `schedAt(day, period)` 只回答固定課表本身，只有排課、編課表那兩處該用。 */
function perList(v) {
  if (v == null || v === '') return [];
  var arr = (v instanceof Array) ? v : String(v).split(/[|,、\s]+/);
  var out = [];
  for (var i = 0; i < arr.length; i++) {
    var n = Number(String(arr[i]).trim());
    if (n && !isNaN(n) && out.indexOf(n) < 0) out.push(n);
  }
  return out.sort(function (a, b) { return a - b; });
}
function perLabel(v) {
  var ps = perList(v);
  if (!ps.length) return '整天';
  return '第 ' + ps.join('、') + ' 節';
}

/* 那一天登記的停課。整天的排前面，判斷時先遇到 */
function blocksOn(date) {
  var d = ymd10(date);
  return (S.holidays || []).filter(function (h) { return ymd10(h.date) === d; })
    .sort(function (a, b) { return perList(a.periods).length - perList(b.periods).length; });
}
/* 這一節不上課嗎？回傳那一筆停課（整天的也算） */
function blockOn(date, period) {
  var bs = blocksOn(date);
  for (var i = 0; i < bs.length; i++) {
    var ps = perList(bs[i].periods);
    if (!ps.length || ps.indexOf(Number(period)) >= 0) return bs[i];
  }
  return null;
}
/* 整天不上課（假日、颱風假）。只佔幾節的活動不算——那天其他節還是要上課 */
function holidayOn(date) {
  var bs = blocksOn(date);
  for (var i = 0; i < bs.length; i++) if (!perList(bs[i].periods).length) return bs[i];
  return null;
}
function holName(h) { return (h && h.name) ? h.name : '放假'; }

/* 這一節的課被調走了 ／ 有別節的課被調到這一節 */
function movedOut(date, period) {
  return (S.moves || []).filter(function (m) {
    return ymd10(m.date) === ymd10(date) && Number(m.period) === Number(period);
  })[0] || null;
}
function movedIn(date, period) {
  return (S.moves || []).filter(function (m) {
    return ymd10(m.toDate) === ymd10(date) && Number(m.toPeriod) === Number(period);
  })[0] || null;
}

/* ⭐ 某一天的第幾節，實際上是哪一班。
   kind：`normal` 照課表｜`block` 停課｜`out` 調走了｜`in` 別節調過來｜`free` 空堂
   base ＝固定課表上本來是哪一班——停課那一格要寫「本來是 204」就靠它，
   他要的是「看得出哪個班的哪一節少掉了、為什麼」（2026-09-19）。 */
function slotOn(date, period) {
  var d = dayOfDate(date);
  var r = d ? schedAt(d, Number(period)) : null;
  var o = { no: Number(period), cls: r ? r.cls : '', base: r ? r.cls : '',
            room: r ? r.room : '', kind: r ? 'normal' : 'free',
            block: null, out: null, into: null };
  var b = blockOn(date, period);
  if (b) { o.cls = ''; o.kind = 'block'; o.block = b; return o; }
  var mo = r ? movedOut(date, period) : null;
  var mi = movedIn(date, period);
  /* 兩班對調時同一格既有人調走、又有人調進來：以調進來的為準 */
  if (mi) { o.cls = mi.cls; o.kind = 'in'; o.into = mi; o.out = mo; return o; }
  if (mo) { o.cls = ''; o.kind = 'out'; o.out = mo; return o; }
  return o;
}

/* 某一天實際要上的課（停課與調課都套過了），照節次排 */
function routeOn(date) {
  if (!dayOfDate(date)) return [];
  return teachPeriods().map(function (p) {
    var o = slotOn(date, Number(p.no));
    o.start = p.start; o.end = p.end;
    return o;
  }).filter(function (o) { return o.cls; });
}
/* 這一天少掉的課：本來有課、但被活動佔走或調到別節去了。
   首頁與動線卡要把原因寫出來——不然只會看到「今天少一節」卻不知道為什麼。 */
function lostOn(date) {
  if (!dayOfDate(date)) return [];
  return teachPeriods().map(function (p) { return slotOn(date, Number(p.no)); })
    .filter(function (o) { return o.base && (o.kind === 'block' || o.kind === 'out'); });
}
/* 這一節的異動，講成一句話 */
function slotWhy(o) {
  if (o.kind === 'block') return holName(o.block) +
    (o.base ? '（本來是 ' + o.base + '）' : '');
  if (o.kind === 'out') return '調到 ' + dateLabel(o.out.toDate) + ' 第 ' + o.out.toPeriod + ' 節';
  if (o.kind === 'in')  return '從 ' + dateLabel(o.into.date) + ' 第 ' + o.into.period + ' 節調來';
  return '';
}
function dateLabel(d) {
  var x = String(d || '');
  if (x.length < 10) return x;
  var w = ['日','一','二','三','四','五','六'][dayIdx(x)];
  return x.slice(5).replace('-', '/') + '（' + w + '）';
}
function uniq(arr) {
  var out = [];
  for (var i = 0; i < arr.length; i++) if (out.indexOf(arr[i]) < 0) out.push(arr[i]);
  return out;
}
function dayIdx(ymd) {
  var p = String(ymd || '').split('-');
  if (p.length < 3) return 0;
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getDay();
}

/* 某班「現在在上的單元」＝最後一次有紀錄、而且還沒完成的那個 */
/* 這一天、這一班、這個單元的札記。快速記錄那格與教學札記頁是同一份資料 */
function noteOf(date, cls, unitId) {
  var hit = S.notes.filter(function (n) {
    /* ⚠️ 日期過 ymd10() 再比，跟這一頁其他地方一致（2026-09-20 健檢補上）。
       札記那一格如果比不中，快速記錄會顯示成空白、存下去就把原本寫的蓋掉。 */
    return ymd10(n.date)    === ymd10(date) &&
           String(n.cls)    === String(cls) &&
           String(n.unitId) === String(unitId);
  })[0];
  return hit ? hit.text : '';
}

/* 這一班這個單元以前寫過的紀錄，新的在前面 */
function notesOf(cls, unitId, exceptDate) {
  return S.notes.filter(function (n) {
    return String(n.cls) === String(cls) && String(n.unitId) === String(unitId) &&
           String(n.date) !== String(exceptDate);
  }).sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
}

function currentUnit(cls) {
  var rows = S.progress.filter(function (p) { return String(p.cls) === String(cls); });
  rows.sort(function (a, b) { return String(b.updatedAt).localeCompare(String(a.updatedAt)); });
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].status !== 'done') return unitOf(rows[i].unitId);
  }
  return rows.length ? unitOf(rows[0].unitId) : null;
}

/* ── 節次紀錄 ─────────────────────────────────────────────────
   一節課一筆：哪一天、哪一節、哪一班、上的是哪個單元（「節次紀錄」分頁）。
   他一個班一次上兩節，兩節常常不是同一個單元（第一節把上次的收尾、
   第二節開新的），所以「這一班現在上到哪」不足以決定課表上每一格要寫什麼——
   以前後存的那一節會把整天蓋掉（2026-09-15 他回報）。
   ⚠️ 舊資料沒有節次紀錄，所有函式都要能退回原本那套「班級＋日期」的判斷。 */
function ymd10(x) { return String(x || '').slice(0, 10); }

function lessonAt(date, period, cls) {
  var ls = S.lessons || [];
  for (var i = 0; i < ls.length; i++) {
    var l = ls[i];
    if (ymd10(l.date) === ymd10(date) && Number(l.period) === Number(period) &&
        String(l.cls) === String(cls)) return l;
  }
  return null;
}
function lessonsOn(date, cls) {
  return (S.lessons || []).filter(function (l) {
    return ymd10(l.date) === ymd10(date) && (!cls || String(l.cls) === String(cls));
  });
}
/* 這一格該顯示哪個單元：有節次紀錄就照它，沒有才退回「這一班現在上到哪」 */
function unitForSlot(date, period, cls) {
  var l = lessonAt(date, period, cls);
  var u = l ? unitOf(l.unitId) : null;
  return u || currentUnit(cls);
}
/* 這一節記了沒。
   ⚠️ 有節次紀錄還不夠——進度被清掉時那一節也該算「還沒記」，
   不然卡片上會出現「還沒記」配「看紀錄」這種前後不一的組合。 */
function periodDone(date, period, cls) {
  var l = lessonAt(date, period, cls);
  if (l) return !!progOf(cls, l.unitId);
  if (lessonsOn(date, cls).length) return false;    /* 有別節的紀錄＝這一節真的還沒記 */
  return S.progress.some(function (p) {
    return String(p.cls) === String(cls) && ymd10(p.date) === ymd10(date);
  });
}
/* 這個單元一共上了幾節、平均一班幾節——下一輪排課要用的就是這個數字 */
function unitPeriods(unitId) {
  var ls = (S.lessons || []).filter(function (l) { return String(l.unitId) === String(unitId); });
  var byCls = {}, k, ks = [];
  for (var i = 0; i < ls.length; i++) byCls[ls[i].cls] = (byCls[ls[i].cls] || 0) + 1;
  for (k in byCls) ks.push(k);
  return { total: ls.length, classes: ks.length,
           avg: ks.length ? Math.round(ls.length / ks.length * 10) / 10 : 0 };
}
/* 某一天這一班實際有課的節次。
   ⚠️ 走 routeOn()，所以被活動佔掉的那一節不會跑出來，
   調到別天的那一節會出現在它真正上課的那一天。 */
function periodsOn(cls, date) {
  if (!cls) return [];
  return routeOn(date).filter(function (o) { return String(o.cls) === String(cls); })
    .map(function (o) { return o.no; });
}
/* 這一班今天預設要記哪一節：正在上的那節 → 第一節還沒記的 → 第一節 */
function periodFor(cls) {
  var ps = periodsOn(cls, S.today);
  if (!ps.length) return 0;
  var now = nowPeriodNo();
  if (ps.indexOf(now) >= 0) return now;
  for (var i = 0; i < ps.length; i++) {
    if (!periodDone(S.today, ps[i], cls)) return ps[i];
  }
  return ps[0];
}
</script>

<script>
/* ══════════════════════════════════════════════════════════════
   0. 快速記錄 Quick Record
      在班上拿手機用的那一頁：選班級 → 勾進度 → 點缺席號碼 →
      拍照 → 存。全部都是大按鈕，手指按得到。
   ══════════════════════════════════════════════════════════════ */
/* ── 今天上哪些班 ───────────────────────────────────────
   走進教室的時候，最想知道的是「現在這節是哪一班」。
   所以開啟時照時間自動選好，並且把整天的動線列出來。 */
function hhmmNow() {
  var d = new Date();
  return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' +
         (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
}

/* 今天實際要上的課（停課與調課都算過了），照時間排 */
function todayRoute() { return routeOn(S.today); }

/* 現在是第幾節（不在任何一節之內就回 0） */
/* 假日與停課的判斷都在上面那一區（blockOn／holidayOn／slotOn）。 */

/* 今天每一節走到哪一班、上哪個單元。
   課表管理（桌機右欄）和手機的教學總覽共用這一張——他說手機上也想看到，
   但不要為它多開一頁。 */
function routeCard(opts) {
  opts = opts || {};
  var h = '<div class="card' + (opts.action ? ' no-print' : '') + '"><h3>' +
    (opts.title || '<i class="ci ci-pin" aria-hidden="true">🗺️</i> 本日授課動線 <span class="en2">Today\'s Teaching Route</span>') +
    /* ⚠️ 只寫日期，不要再寫「第 N 週」——頂欄那顆卡一直寫著第幾週（2026-09-20 他圈的）。 */
    '<span class="right hint">' + esc(S.today.slice(5).replace('-', '/')) +
      '（' + ['日','一','二','三','四','五','六'][new Date().getDay()] + '）</span></h3>';
  var td = todayDay();
  if (!td) return h + '<div class="empty-note">今天是週末，沒有排課。</div></div>';
  var hd = holidayOn(S.today);
  if (hd) return h + '<div class="empty-note">🏖️ 今天放假：' + esc(holName(hd)) +
    '　好好休息。</div></div>';

  var nowNo = nowPeriodNo();
  h += '<div class="route">' + teachPeriods().map(function (p) {
    var o = slotOn(S.today, Number(p.no));
    /* 被全校活動佔掉的那一節：整列變灰，寫出活動名稱，
       後面補一句「本來是 204」——他要看得出哪個班的哪一節少掉了、為什麼。 */
    if (o.kind === 'block') {
      return '<div class="it off' + (Number(p.no) === nowNo ? ' now' : '') + '">' +
        '<div class="when"><span class="badge c-gray">停</span>' +
        '<span class="tm">' + esc(p.start) + ' – ' + esc(p.end) + '</span></div>' +
        '<div class="tx"><div class="a">' + esc(holName(o.block)) + '</div>' +
        '<div class="b">' + (o.base ? '這一節本來是 ' + esc(o.base) + '　不上課' : '全校活動') +
        '</div></div></div>';
    }
    /* 調到別天去了：這一節空下來，但要說清楚跑去哪 */
    if (o.kind === 'out') {
      return '<div class="it off' + (Number(p.no) === nowNo ? ' now' : '') + '">' +
        '<div class="when"><span class="badge c-gray">調</span>' +
        '<span class="tm">' + esc(p.start) + ' – ' + esc(p.end) + '</span></div>' +
        '<div class="tx"><div class="a">' + esc(o.out.cls) + ' 調課</div>' +
        '<div class="b">' + esc(slotWhy(o)) +
        (o.out.note ? '　' + esc(o.out.note) : '') + '</div></div></div>';
    }
    var r = o.cls ? { cls: o.cls } : null;
    /* ⚠️ 照「這一節」拿單元，不是照「這一班現在上到哪」。
       他一個班連上兩節、兩節可能不同單元（2026-09-15）。 */
    var u = r ? unitForSlot(S.today, Number(p.no), r.cls) : null;
    /* 手機首頁用同一張卡，但每一列多一顆「去記錄／看紀錄」——
       以前「今天要做的」和「本日授課動線」兩塊各列一次今天的節次，等於捲兩遍。 */
    var done = !!r && periodDone(S.today, Number(p.no), r.cls);
    return '<div class="it' + (r ? '' : ' free') + (Number(p.no) === nowNo ? ' now' : '') + '">' +
      '<div class="when"><span class="badge c-' + (r ? colorOf(r.cls) : 'gray') + '">' +
        esc(r ? r.cls : '–') + '</span>' +
        '<span class="tm">' + esc(p.start) + ' – ' + esc(p.end) + '</span></div>' +
      /* 手機（有「去記錄」那一版）右邊被按鈕吃掉寬度，
         單元名就只留中文、副標只留英文名，不要把整段說明也塞進來折三行。 */
      '<div class="tx"><div class="a">' +
        esc(r ? (u ? (opts.action ? (u.nameZh || u.nameEn) : u.nameEn) : '尚未開始單元')
              : '空堂 Free Period') +
        (o.kind === 'in' ? '<span class="swap-tag">調</span>' : '') + '</div>' +
      '<div class="b">' +
        (o.kind === 'in' ? esc(slotWhy(o)) + '　' : '') +
        esc(r ? (u ? (opts.action ? u.nameEn : u.nameZh + ' · ' + u.descZh)
                   : '到「進度檢核」選單元')
              : '可備課 · 整理教室') +
      '</div></div>' +
      (opts.action && r
        ? '<div class="act"><span class="s ' + (done ? 'ok' : 'no') + '">' +
          (done ? '✓ 已記錄' : '還沒記') + '</span>' +
          '<button class="btn ' + (done ? 'ghost ' : '') + 'sm" data-todo="' + esc(r.cls) +
          '" data-per="' + esc(p.no) + '">' +
          (done ? '看紀錄' : '去記錄') + '</button></div>'
        : '') +
      '</div>';
  }).join('') + '</div>';
  return h + (opts.extra || '') + '</div>';
}

function nowPeriodNo() {
  var now = hhmmNow(), pers = teachPeriods();
  for (var i = 0; i < pers.length; i++) {
    if (now >= pers[i].start && now <= pers[i].end) return Number(pers[i].no);
  }
  return 0;
}

/* 現在該記哪一班：正在上的那節，沒有就抓接下來最近的一節，
   都上完了就停在最後一節 */
function classNow() {
  var route = todayRoute();
  if (!route.length) return '';
  var now = hhmmNow();
  for (var i = 0; i < route.length; i++) {
    if (now <= route[i].end) return route[i].cls;
  }
  return route[route.length - 1].cls;
}

function quickInit() {
  var q = UI.quick;
  if (!q.cls) q.cls = classNow() || (sortedClasses()[0] || {}).code || '';
  if (!q.period) q.period = periodFor(q.cls);
  if (!q.unitId) {
    var u = unitForSlot(S.today, q.period, q.cls) || sortedUnits()[0];
    q.unitId = u ? u.id : '';
  }
  if (q.loaded !== q.cls + '|' + q.unitId) quickLoad();
}

/* 換班級或換節次之後，把單元切成「那一節上的那個」。
   那一節還沒記過就沿用這一班現在的單元。 */
function pickSlot(cls, period) {
  var q = UI.quick;
  q.pickUnit = false;                /* 換班級或換節次時，攤開的單元清單先收起來 */
  q.cls = cls;
  q.period = period || periodFor(cls);
  var u = unitForSlot(S.today, q.period, q.cls);
  if (u) q.unitId = u.id;
  quickLoad();
}

/* ── 打到一半的快速記錄，隨手存在這支手機上 ⭐ ─────────────────
 *  換頁不會弄丟（UI.quick 一直在記憶體裡），但**關掉分頁、重新整理、
 *  或手機把瀏覽器清掉**就沒了——下課後三十秒被叫走很常見（2026-09-15 他要的）。
 *  ⚠️ 只存這支手機，不會送到後端；存的是「還沒按儲存」的內容。
 *  ⚠️ 回填的規則很保守：**伺服器上這一班這個單元今天什麼都還沒有**才回填。
 *     已經存過的一律以伺服器為準，不能被舊草稿蓋掉。
 *  ⚠️ 只認今天的草稿。昨天沒存完的不要莫名其妙冒出來。 */
var DRAFT_K = 'tpDraftQuick';
var DRAFT_SAID = false;

function draftSave() {
  try {
    if (!S || PAGE !== 'quick') return;
    var q = UI.quick;
    var has = q.status || (q.note && q.note.trim()) || (q.seats && q.seats.length);
    if (!has) return localStorage.removeItem(DRAFT_K);
    localStorage.setItem(DRAFT_K, JSON.stringify({
      date: S.today, cls: q.cls, unitId: q.unitId,
      status: q.status || '', note: q.note || '', seats: q.seats || []
    }));
  } catch (e) { /* 無痕模式之類存不了，就只是沒有草稿 */ }
}

function draftRead() {
  try { return JSON.parse(localStorage.getItem(DRAFT_K) || 'null'); }
  catch (e) { return null; }
}

function draftClear() {
  DRAFT_SAID = false;
  try { localStorage.removeItem(DRAFT_K); } catch (e) {}
}

function quickLoad() {
  var q = UI.quick;
  q.loaded = q.cls + '|' + q.unitId;
  var p = progOf(q.cls, q.unitId);
  q.prgId  = p ? p.id : '';
  q.status = p ? p.status : '';      /* 沒紀錄就不預選，避免看起來已經選好 */
  q.note   = noteOf(S.today, q.cls, q.unitId) || (p ? p.note : '');
  var a = S.absences.filter(function (x) {
    return String(x.cls) === String(q.cls) && Number(x.week) === weekOfDate(S.today);
  })[0];
  q.seats = a ? seatList(a.seats).map(Number) : [];
  /* ⚠️ 日期一律先過 ymd10() 再比。試算表裡那一格如果不是日期格式、
     而是手打的字串（「2026-09-14 08:30」這種），後端只會把 Date 型別轉成 10 碼，
     字串是原樣傳回來的——直接用 === 比就會比不中，畫面上「今天記過了」
     就整個失效（2026-09-20 健檢抓到，整份只有三處漏掉）。 */
  q.savedToday = !!(p && ymd10(p.date) === S.today);

  /* 伺服器上這一格是空的，才把這支手機上沒存完的草稿接回來 */
  if (!q.status && !q.note && !q.seats.length) {
    var dr = draftRead();
    if (dr && dr.date === S.today &&
        String(dr.cls) === String(q.cls) && String(dr.unitId) === String(q.unitId)) {
      q.status = dr.status || '';
      q.note   = dr.note || '';
      q.seats  = dr.seats || [];
      if ((q.status || q.note || q.seats.length) && !DRAFT_SAID) {
        DRAFT_SAID = true;
        /* render 還在跑，等它畫完再說話 */
        setTimeout(function () { toast('幫你把上次沒存完的內容接回來了'); }, 60);
      }
    }
  }
}

/* 站在教室裡最該知道的一句話：現在點到的號碼裡，有誰已經常常不在。
   ⚠️ 只印一行。手機是拿來「快」的，不是拿來看統計的——詳細的在電腦版
   「出席狀況」那張『缺席不只一次的孩子』（2026-09-21）。 */
function repeatLine(cls, seats) {
  var hit = (seats || []).map(function (x) { return seatStat(cls, x); })
    .filter(function (o) { return o && o.before >= 1; })
    .sort(function (a, b) { return b.before - a.before || Number(a.seat) - Number(b.seat); });
  if (!hit.length) return '';
  return '<div class="qk-rep">⚠️ ' + hit.slice(0, 4).map(function (o) {
    var prev = o.weeks.filter(function (w) { return w.week < Number(S.wk.week); });
    var last = prev[prev.length - 1].week;
    return '<b>' + esc(o.seat) + ' 號</b>這學期第 ' + (o.before + 1) + ' 次' +
      (last === Number(S.wk.week) - 1 ? '（上週也沒來）' : '');
  }).join('、') + (hit.length > 4 ? ' 等' : '') + '</div>';
}

/* 這一班本週之前、還沒補進度的缺席紀錄，最近的排前面。
   ⚠️ 看的是「還沒補的」（seatsLeft），補完的號碼留在紀錄裡但不再出現在這裡。 */
/* 某一天是這學期第幾週（跟後端 weekInfo_ 同一條算法）。
   ⚠️ 記錄「某一天的課」時，缺席要對到那一天的那一週，不是畫面正在看的那一週
   （S.wk.week）——在課表按 › 看過下週再回來記，兩個就不一樣了（2026-10-06 健檢）。 */
/* ⚠️ 從「畫面這一週的星期一」往前後數，不從開學日算：兩個算出來本來一樣，
   但這樣就算設定裡的開學日有點怪，也不會跟頂欄寫的週次對不上。 */
function weekOfDate(d) {
  var mon = new Date(String(S.wk.monday || '').slice(0, 10) + 'T00:00:00+08:00');
  var t   = new Date(String(d || '').slice(0, 10) + 'T00:00:00+08:00');
  if (isNaN(mon) || isNaN(t)) return Number(S.wk.week);
  var w = Number(S.wk.week) + Math.floor(Math.round((t - mon) / 86400000) / 7);
  return Math.max(1, Math.min(Number(S.settings.weeks) || 20, w));
}

function pendingAbsent(cls) {
  return S.absences.filter(function (a) {
    return String(a.cls) === String(cls) &&
           Number(a.week) < Number(S.wk.week) &&
           seatsLeft(a).length;
  }).sort(function (a, b) { return Number(b.week) - Number(a.week); });
}

function weekLabel(w) {
  var d = Number(S.wk.week) - Number(w);
  if (d === 0) return '本週';
  if (d === 1) return '上週';
  if (d === 2) return '上上週';
  return '第 ' + w + ' 週';
}

function vQuick() {
  quickInit();
  var q = UI.quick, u = unitOf(q.unitId);
  var seatMax = Math.max(10, Math.min(60, Number(S.settings.seatMax) || 30));
  var phs = photosOf(q.prgId);
  var dayZh = ['日', '一', '二', '三', '四', '五', '六'][new Date().getDay()];

  var h = '<div class="qk">';

  /* ⚠️ 這裡本來有一張標題卡（班級牌 ＋「快速記錄」＋ 第幾週 ＋ 日期）。
     四樣裡有三樣是別的地方已經寫著的：「快速記錄」在側標上、「第 N 週」在頂欄、
     班級在底下那顆一直看得到的儲存鈕上（「儲存 106 班的紀錄」）。
     只有日期是它獨有的，所以日期併到「今天的課」那一行，整張卡拿掉，
     第一屏多出 63px（2026-09-20 他同意）。
     ⚠️「今天已記錄」那顆徽章也一起拿掉——同一件事在「今天的課」那張卡上是
     「已記」小標籤、在班級牌上是右上角那顆勾，已經講兩次了。 */

  /* 今天的課——走進教室第一眼要看到的 */
  var route = todayRoute(), nowNo = nowPeriodNo();
  var qHol = holidayOn(S.today);
  h += '<section><div class="lb">今天的課 <em>Today</em>' +
    '<span class="n">' + esc(S.today.slice(5).replace('-', '/')) + '（' + dayZh + '）・' +
    (qHol ? '放假' : (route.length ? route.length + ' 節' : '沒有排課')) +
    '</span></div>';
  if (qHol) {
    h += '<div class="qk-pend ok">🏖️ 今天放假：<b>' + esc(holName(qHol)) + '</b>。' +
      '要補記別天的紀錄，按下面的「換別班」挑一班。</div>';
  } else if (!route.length) {
    /* ⚠️ 班級清單預設是收起來的，所以這裡要寫「按換別班」，不是「在下面選班級」。 */
    h += '<div class="qk-pend ok">今天沒有排課。要補記別天的紀錄，' +
      '按下面的「換別班」挑一班。</div>';
  } else {
    h += '<div class="qk-route">' + route.map(function (r) {
      var done = periodDone(S.today, r.no, r.cls);
      return '<div class="qk-rt c-' + colorOf(r.cls) +
        (String(r.cls) === String(q.cls) && Number(r.no) === Number(q.period) ? ' on' : '') +
        (r.no === nowNo ? ' now' : '') +
        '" data-qr="' + esc(r.cls) + '" data-qrp="' + esc(r.no) + '">' +
        '<div class="p">第 ' + r.no + ' 節' + (r.no === nowNo ? '・現在' : '') +
          (r.kind === 'in' ? '・調' : '') + '</div>' +
        /* ⚠️ 班級和時間排同一行。本來是三行（節次／班級／時間），一張卡 83px 高，
           五節就佔掉大半個畫面（2026-09-20 他圈的）。併成兩行之後 57px，
           要看的東西一個都沒少。 */
        '<div class="b"><span class="c">' + esc(r.cls) + '</span>' +
        /* ⚠️ 記過了就把上課時間換成「已記」小標籤。
           不要塞勾、也不要「✓ 已記」——360 的手機一格只有 98px，
           多一顆勾就會斷成兩行、整排卡高低不齊（2026-09-20 量到的）。 */
        (done ? '<span class="tag"><b>已記</b></span>'
              : '<span class="t">' + esc(r.start) + '</span>') +
        '</div></div>';
    }).join('') + '</div>';
  }
  /* 今天少掉的那幾節，直接寫原因。
     在教室裡最怕的是「怎麼少一節」，而不是去別頁查為什麼（2026-09-19）。 */
  var qLost = lostOn(S.today);
  if (qLost.length) {
    h += '<div class="qk-lost">' + qLost.map(function (o) {
      return '<span><b>第 ' + o.no + ' 節</b> ' + esc(o.base) + '　' +
        esc(o.kind === 'block' ? holName(o.block) : slotWhy(o)) + '</span>';
    }).join('') + '</div>';
  }
  h += '</section>';

  /* 班級。⚠️ 平常用不到——今天要上的班在上面「今天的課」就點得到，
     這一整排九個大方塊佔掉半個畫面（2026-09-15 他問可不可以拿掉）。
     所以預設收起來，要補記別天／別班才展開；今天沒有課、
     或現在選的班不在今天的課裡，就自動打開（不然會找不到自己選的是哪一班）。 */
  /* ⚠️ q.showAll 是三態，不是 true/false：
     undefined＝還沒自己動過（預設收起來）；true／false＝他按過了，聽他的。
     以前寫成 `!!q.showAll || !route.length || !inRoute`，今天沒排課時
     後面那一項永遠是 true，按「收起來」整段不會收（2026-09-20 他回報）。
     ⚠️ 2026-09-20 再改：預設**一律收起來**，不要因為今天沒排課就自動攤開九張牌
     ——那一整排佔掉半個畫面，而要補記別天的時候按一下「換別班」就好。 */
  var allOpen = (q.showAll === undefined || q.showAll === null) ? false : !!q.showAll;
  h += '<section><div class="lb">' + (allOpen ? '所有班級' : '其他班級') +
    ' <em>All classes</em>' +
    '<button class="qk-more" data-qall="' + (allOpen ? '0' : '1') + '">' +
      (allOpen ? '收起來' + ico('up') : '換別班 · ' + S.classes.length + ' 班' + ico('down')) +
      '</button></div>' +
    (allOpen
      ? '<div class="qk-row">' + sortedClasses().map(function (c) {
          var done = S.progress.some(function (p) {
            return String(p.cls) === String(c.code) && ymd10(p.date) === S.today;
          });
          /* ⚠️ 只寫班級號碼。年級（「二年級」）九張牌寫九次，一個字都沒告訴他
             ——他自己的班全是二年級（2026-09-20 他說拿掉）。
             「今天記過了」改成右上角一顆小勾，不佔一整行。 */
          return '<div class="qk-cls c-' + colorOf(c.code) +
            (String(c.code) === String(q.cls) ? ' on' : '') +
            (done ? ' done' : '') +
            '" data-qc="' + esc(c.code) + '" title="' + esc(c.grade) + '">' + esc(c.code) +
            (done ? '<i class="tick" aria-label="今天記過了">' + ico('check') + '</i>' : '') +
            '</div>';
        }).join('') + '</div>'
      : '') + '</section>';

  /* 這一班今天連上兩節（含）以上時，要先說清楚「現在記的是哪一節」。
     兩節常常不是同一個單元——第一節把上次的收尾、第二節開新的（2026-09-15 他說的）。
     只有一節就不必問，免得多一次點擊。 */
  var myPers = periodsOn(q.cls, S.today);
  if (myPers.length > 1) {
    h += '<section><div class="lb">這是第幾節 <em>Period</em>' +
      '<span class="n">' + myPers.length + ' 節連堂</span></div><div class="qk-per">' +
      myPers.map(function (no) {
        var pl = lessonAt(S.today, no, q.cls);
        var pu = pl ? unitOf(pl.unitId) : null;
        return '<button data-qp="' + no + '"' +
          (Number(no) === Number(q.period) ? ' class="on"' : '') + '>' +
          '<b>第 ' + no + ' 節</b>' +
          '<span>' + (pu ? esc(pu.nameZh || pu.nameEn) : '還沒記') + '</span></button>';
      }).join('') + '</div></section>';
  }

  /* 上週沒來的人——走進教室第一件要知道的事 */
  var pend = pendingAbsent(q.cls);
  var pendN = pend.reduce(function (n, a) { return n + seatsLeft(a).length; }, 0);
  h += '<section><div class="lb">上週沒來 <em>Needs catch-up</em>' +
    '<span class="n">' + (pendN ? pendN + ' 人要補' : '全到') + '</span></div>';
  if (!pendN) {
    /* ⚠️ 全到就什麼都不畫。右邊那顆小字已經寫著「全到」，再鋪一整條綠框
       只是把下面要按的東西往下推 46px（2026-09-20 精簡）。 */
    h += '';
  } else {
    h += '<div class="qk-pend">' + pend.map(function (a) {
      return '<div class="r"><span class="wk">' + esc(weekLabel(a.week)) + '</span>' +
        '<span class="s">' + seatsLeft(a).map(function (x) {
          var st = seatStat(a.cls, x);
          return '<span class="seat' + (st && st.n >= 2 ? ' rep' : '') + '">' + esc(x) + ' 號' +
                 (st && st.n >= 2 ? '<i>×' + st.n + '</i>' : '') +
                 '<button data-qdone="' + esc(a.id) +
                 '" data-seat="' + esc(x) + '" title="已經補完了">✓</button></span>';
        }).join('') + '</span>' +
        (a.unitId ? '<span class="u">' + esc(unitName(a.unitId)) + '</span>' : '') + '</div>';
    }).join('') + '</div>' +
    '<div class="hint" style="margin-top:6px">補完進度就點號碼旁邊的 ✓，從清單移除。</div>';
  }
  h += '</section>';

  /* 單元。⚠️ 手機上不要用下拉選單——站著單手拿手機，選單要點兩次還看不到全貌
     （2026-09-15 他定的原則：能用按鈕就不要用選單）。
     但六個單元排成格子會佔掉大半個畫面，名字還被截掉（同一天他回報的）。
     所以平常**只顯示現在選的那一條**，點下去才整份攤開；
     攤開時一列一個，中英文名才放得完整。選完自動收回去。 */
  var allUnits = sortedUnits();
  var picking  = !!q.pickUnit;
  h += '<section><div class="lb">單元 <em>Unit</em>' +
    (picking
      ? '<button class="qk-more" data-qupick="0">取消' + ico('up') + '</button>'
      : '<span class="n">' + allUnits.length + ' 個</span>') + '</div>';
  if (picking) {
    h += '<div class="qk-units">' + allUnits.map(function (x) {
      return '<button data-qu="' + esc(x.id) + '"' +
        (String(x.id) === String(q.unitId) ? ' class="on"' : '') + '>' +
        '<span class="ic c-' + (x.color || 'blue') + '">' + coverInner(x) + '</span>' +
        '<span class="t"><b>' + esc(x.nameZh || x.nameEn) + '</b>' +
        '<span>' + esc(x.nameEn) + '</span></span></button>';
    }).join('') + '</div>';
  } else {
    h += '<button class="qk-unit-now" data-qupick="1">' +
      '<span class="ic c-' + ((u && u.color) || 'blue') + '">' + coverInner(u) + '</span>' +
      '<span class="t"><b>' + esc(u ? (u.nameZh || u.nameEn) : '還沒選單元') + '</b>' +
      '<span>' + esc(u ? u.nameEn : '點一下選一個') + '</span></span>' +
      '<span class="go">換單元' + ico('down') + '</span></button>';
      /* ⚠️ 這裡不要再印單元的教學目標。手機是站在教室裡用的，
         單元選好了就不必再讀一遍簡介，那三行把下面真正要按的東西推出畫面
         （2026-09-20 他圈掉）。要看簡介在「教學進度」那一頁。 */
  }
  h += '</section>';

  /* 進度 */
  h += '<section><div class="lb">進度到哪 <em>Progress</em></div><div class="qk-st">' +
    ST_ORDER.map(function (k) {
      var st = ST[k];
      return '<button data-qs="' + k + '" class="' + (q.status === k ? 'on ' + st.k : '') + '"' +
        (q.status === k ? ' style="color:' + st.c + '"' : '') + '>' +
        /* ⚠️ 用跟「狀態對照」「單元卡那排圓點」同一顆記號，不要另外畫一顆實心圓
           ——同一件事在這個網站上只能有一種長相（2026-09-20 他指出）。 */
        '<span class="dot ' + st.k + '">' + stMark(k) + '</span>' +
        '<span class="tx"><b>' + st.z + '</b><span>' + st.e + '</span></span></button>';
    }).join('') + '</div></section>';

  /* 缺席座號 */
  h += '<section><div class="lb">缺席座號 <em>Absent</em>' +
    '<span class="n">' + (q.seats.length ? q.seats.length + ' 人' : '全到') + '</span></div>' +
    '<div class="qk-pad">';
  for (var n = 1; n <= seatMax; n++) {
    h += '<button data-qn="' + n + '"' + (q.seats.indexOf(n) >= 0 ? ' class="on"' : '') + '>' + n + '</button>';
  }
  h += '</div><div class="qk-seats">' +
    (q.seats.length
      ? q.seats.slice().sort(function (a, b) { return a - b; }).map(function (x) {
          var st = seatStat(q.cls, x), k = st ? st.before + 1 : 1;   /* 含這一次 */
          return '<span class="seat' + (k >= 2 ? ' rep' : '') + '">' + x + ' 號' +
            (k >= 2 ? '<i>×' + k + '</i>' : '') +
            '<button data-qx="' + x + '">✕</button></span>';
        }).join('')
      : '<span class="none">沒有人缺席 · 點上面的號碼登記</span>') +
    '</div>' + repeatLine(q.cls, q.seats) + '</section>';

  /* 照片 */
  h += '<section><div class="lb">作品照片 <em>Photos</em>' +
    '<span class="n">' + phs.length + ' 張</span></div>' +
    '<button class="qk-cam" id="qCam">' + ico('cam') + '拍照 / 選照片</button>' +
    (phs.length ? '<div class="qk-photos">' + phs.map(function (p) {
      return '<div class="ph" data-ph="' + esc(p.id) + '">' +
        '<img data-file="' + esc(p.fileId) + '" data-thumb="' + esc(p.thumbId || '') + '" alt="學生作品">' +
        '<button class="x" data-delph="' + esc(p.id) + '" title="刪除">✕</button></div>';
    }).join('') + '</div>' : '') +
    '</section>';

  /* 課堂札記 */
  /* ⚠️ 這裡刻意不放輸入框——鍵盤一上來就會把它推到看不見的地方（見 feBlock）。
     藏在後面的 <textarea id="qNote"> 還在，底下那些 $('qNote').value 都照舊。 */
  h += '<section><div class="lb">課堂札記 <em>Class Note</em></div>' +
    feBlock('qNote', q.note, '今天學生們創意十足！', '課堂札記 Class Note') +
    '</section>';

  h += '<div class="qk-bar">' +
    '<button class="btn qk-save" id="qSave">' + ico('save') + '儲存 ' + esc(q.cls) + ' 班的紀錄</button>' +
    /* ⚠️ 一切正常的時候不要寫任何字。「進度、缺席、札記會一起存」是第一次用才需要的
       說明，每天看到只是佔掉一行、把頁尾往下推（2026-09-20 他劃掉）。
       只有「會刪掉紀錄」「這次少存一樣東西」這種要先知道的才留著。 */
    (q.status ? '' :
      '<div class="qk-hint">' +
      (q.prgId
        ? '⚠️ 沒有選進度狀態 —— 按儲存會把這個單元的進度紀錄刪掉。'
        : '沒有選進度狀態 —— 這次只會存缺席和札記。') +
      '</div>') +
    '</div>';

  return h + '</div>';
}

function aquick() {
  var q = UI.quick;

  Array.prototype.forEach.call(document.querySelectorAll('[data-qr]'), function (b) {
    b.onclick = function () {
      q.note = $('qNote') ? $('qNote').value : q.note;
      pickSlot(b.dataset.qr, Number(b.dataset.qrp || 0));
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-qc]'), function (b) {
    b.onclick = function () {
      q.note = $('qNote') ? $('qNote').value : q.note;
      pickSlot(b.dataset.qc, 0);
      render();
    };
  });

  /* 連堂時：換節次就把單元切成那一節上的那個 */
  Array.prototype.forEach.call(document.querySelectorAll('[data-qp]'), function (b) {
    b.onclick = function () {
      q.note = $('qNote') ? $('qNote').value : q.note;
      pickSlot(q.cls, Number(b.dataset.qp));
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-qu]'), function (b) {
    b.onclick = function () {
      q.note = $('qNote') ? $('qNote').value : q.note;
      q.unitId = b.dataset.qu;
      q.pickUnit = false;            /* 選完就收回去，不用再按一次 */
      quickLoad();
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-qupick]'), function (b) {
    b.onclick = function () {
      q.note = $('qNote') ? $('qNote').value : q.note;
      q.pickUnit = (b.dataset.qupick === '1');
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-qall]'), function (b) {
    b.onclick = function () {
      q.note = $('qNote') ? $('qNote').value : q.note;
      q.showAll = (b.dataset.qall === '1');   /* 按鈕上寫的就是按下去之後的狀態 */
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-qs]'), function (b) {
    b.onclick = function () {
      q.note = $('qNote').value;
      /* 點已經選起來的那個就取消——不小心點到才有辦法收回 */
      q.status = (q.status === b.dataset.qs) ? '' : b.dataset.qs;
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-qn]'), function (b) {
    b.onclick = function () {
      var n = Number(b.dataset.qn);
      var i = q.seats.indexOf(n);
      if (i >= 0) q.seats.splice(i, 1); else q.seats.push(n);
      q.note = $('qNote').value;
      render();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-qx]'), function (b) {
    b.onclick = function () {
      var i = q.seats.indexOf(Number(b.dataset.qx));
      if (i >= 0) q.seats.splice(i, 1);
      q.note = $('qNote').value;
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-qdone]'), function (b) {
    b.onclick = function () {
      q.note = $('qNote') ? $('qNote').value : q.note;
      seatDoneNow(b.dataset.qdone, b.dataset.seat, true, b.dataset.seat + ' 號已補完');
    };
  });

  $('qNote').oninput = function () { q.note = this.value; };

  $('qCam').onclick = function () {
    q.note = $('qNote').value;
    if (!q.status && !q.prgId) {
      return toast('照片要掛在進度紀錄上，請先點一個進度狀態。', true);
    }
    $('qCam').disabled = true;
    ensurePrg().then(function (id) {
      $('qCam').disabled = false;
      pickPhotos(id);
    }).catch(function (e) { $('qCam').disabled = false; fail(e); });
  };

  Array.prototype.forEach.call(document.querySelectorAll('[data-delph]'), function (b) {
    b.onclick = function (ev) {
      ev.stopPropagation();
      ask('刪掉之後會移到垃圾桶，無法從網頁復原。', '刪除', '刪除這張照片？').then(function (yes) {
        if (!yes) return;
        call('apiDeletePhoto', b.dataset.delph).then(function () {
          dropPhotoLocal(b.dataset.delph);     /* 不用重抓整包資料 */
          refresh(null, '照片已刪除');
        }).catch(fail);
      });
    };
  });

  $('qSave').onclick = function () {
    q.note = $('qNote').value;
    okToDropProgress(q.cls, q.unitId, q.prgId, q.status).then(function (go) {
      if (!go) return;
      $('qSave').disabled = true;
      saveQuick().then(function (d) {
        refresh(d, q.cls + ' 班已儲存');
      }).catch(function (e) {
        $('qSave').disabled = false;
        fail(e);
      });
    });
  };
}

/* 進度與缺席一起存，回傳整包新資料 */
/* 取消選取後按儲存＝要刪掉這筆進度紀錄。刪之前一定要問清楚，
   而且要講明照片會不會一起消失。
   回傳 Promise<true> 代表可以繼續（有選狀態、或本來就沒紀錄，就不必問）。 */
function okToDropProgress(cls, unitId, prgId, status) {
  if (status) return Promise.resolve(true); /* 有選狀態＝不是要刪 */
  if (!prgId) return Promise.resolve(true); /* 本來就沒紀錄，沒什麼好刪 */
  var n = photosOf(prgId).length;
  var u = unitOf(unitId);
  var name = u ? (u.nameZh || u.nameEn) : '這個單元';
  return ask(
    (n ? '這個單元的 ' + n + ' 張作品照片也會一起刪掉。\n\n' : '') +
    '（如果只是想改狀態，按取消，直接點另一個狀態就好。）',
    '刪掉紀錄',
    '要刪掉 ' + cls + ' 班「' + name + '」的進度紀錄嗎？');
}

function saveQuick() {
  var q = UI.quick;
  if (!q.unitId) return Promise.reject(new Error('請先選一個單元。'));
  /* 進度和缺席同一次呼叫就存完，不要跑兩趟 */
  return call('apiSaveClassRecord', {
    cls: q.cls, unitId: q.unitId, status: q.status,
    date: S.today, note: q.note, period: q.period,
    week: weekOfDate(S.today), seats: q.seats.join(',')
  }).then(function (r) {
    q.prgId = r.prgId;
    draftClear();            /* 存進去了，草稿就不用留了 */
    return r.data;
  });
}

/* 要上傳照片就得先有進度紀錄。沒有就先幫他存一筆，不要丟錯誤給他 */
function ensurePrg() {
  var q = UI.quick;
  if (q.prgId) return Promise.resolve(q.prgId);
  toast('先幫你存一筆紀錄…');
  return saveQuick().then(function (d) {
    S = d;
    quickLoad();
    return q.prgId;
  });
}

/* ══════════════════════════════════════════════════════════════

function vHome() {
  var td = todayDay();
  /* 放假那天不算課、也不算「還沒記」——不上課的日子不該變成待辦。
     ⚠️ 節數一律從 routeOn() 數，不要去數固定課表：
     被全校活動佔掉的那一節不該算、調過來的那一節要算（2026-09-19）。 */
  var hol = holidayOn(S.today);
  var todayRt = todayRoute();
  var todayCount = todayRt.length;
  var periodCount = teachPeriods().length;

  /* 今天有課、但今天還沒存進度的班級 */
  var todayCls = {}, pending = 0;
  todayRt.forEach(function (r) { todayCls[r.cls] = 1; });
  for (var c in todayCls) {
    var done = S.progress.some(function (p) {
      return String(p.cls) === c && ymd10(p.date) === S.today;
    });
    if (!done) pending++;
  }

  var units = sortedUnits();
  var nCls = S.classes.length || 1;
  var doneUnits = units.filter(function (u) {
    var n = S.progress.filter(function (p) {
      return String(p.unitId) === String(u.id) && p.status === 'done';
    }).length;
    return n >= nCls;
  }).length;

  var wkAbs = S.absences.filter(function (a) { return Number(a.week) === Number(S.wk.week); });
  var absN = wkAbs.reduce(function (n, a) { return n + seatList(a.seats).length; }, 0);

  /* 手機上這一頁只留「今天要做的」和「本週課表」兩塊。
     歡迎橫幅和五張統計卡在小螢幕上要滑很久才滑得到真正要動的東西；
     「本週重點」跟「教學進度」那一頁重複，2026-09-20 也拿掉了。 */
  var phone = isPhone();
  var h = phone ? '' : hero(greetEn(), myName() + '!',
    S.settings.motto || '用藝術陪伴孩子，發現更大的世界！',
    'Student-centered exploration. Joyful creation. Bilingual learning.',
    '以學生為中心，讓孩子在探索中學習，在創作中快樂成長。', '', true);

  if (!phone) {
    h += '<div class="grid g5" style="margin-bottom:16px">' +
      statCard('<i class="ci ci-today" aria-hidden="true">🎓</i>', 'blue',  "Today's Classes", '今日課程', todayCount, '/ ' + periodCount + ' 節') +
      statCard('<i class="ci ci-pending" aria-hidden="true">📄</i>', 'pink',  'Pending Records', '待完成紀錄', pending, '個班級') +
      statCard('<i class="ci ci-units" aria-hidden="true">📚</i>', 'green', 'Completed Units', '已完成單元', doneUnits, '/ ' + units.length) +
      statCard('<i class="ci ci-works" aria-hidden="true">🖼️</i>', 'purple', 'Student Works', '已拍攝學生作品', photoCount(), '件') +
      statCard('<i class="ci ci-chair" aria-hidden="true">👥</i>', 'yellow', 'Absences', '本週缺席', absN, '人次') +
      '</div>';
  }

  h += '<div class="cols cols-home"><div>';

  /* ── 今天要做的 ────────────────────────────────────────────
     首頁本來是把課表、單元、紀錄三張表再複述一次，看完還是不知道要動什麼。
     改成先講「今天有哪幾節、哪幾班還沒記」，而且點下去就直接進那一班。 */
  var route = todayRt, nowNo = nowPeriodNo();

  /* 還沒補進度的學生——這件事最容易忘，兩種版型都要放 */
  /* ⚠️ 「還沒補的」不分週次，跟出席狀況那一頁同一個定義——同一件事在兩頁
     報不同的數字，他會不知道該信哪一個（2026-09-21 對過）。 */
  var pend = S.absences.filter(function (a) { return seatsLeft(a).length; })
    .sort(function (a, b) { return Number(b.week) - Number(a.week); });
  var pendN = pend.reduce(function (n, a) { return n + seatsLeft(a).length; }, 0);
  var pendHtml = '<div class="todo-more">' + (pendN
    ? '⏰ 還有 <b>' + pendN + '</b> 個學生要補進度（' +
      pend.slice(0, 3).map(function (a) {
        return esc(weekLabel(a.week)) + ' ' + esc(a.cls) + ' 班'; }).join('、') +
      (pend.length > 3 ? ' 等' : '') + '）　' +
      (phone ? '<a href="#quick" data-go="quick">去處理</a>'   /* 手機在快速記錄的「上週沒來」就能清 */
             : '<a href="#absent" data-go="absent">去處理</a>')
    : '✓ 沒有要補進度的學生。') + '</div>';

  /* 手機：今天的課只畫一次。用動線卡的排法（班級牌在上、時間在下、右邊一顆去記錄），
     節次、班級、單元、狀態擠在同一列在手機上塞不下。
     ⚠️ 以前手機是「今天要做的」＋「本日授課動線」兩塊各列一次今天的節次，
     等於把同一件事捲兩遍（2026-09-14 他說的）。 */
  if (phone && !hol && route.length) {
    h += routeCard({ title:'<i class="ci ci-pin" aria-hidden="true">📌</i> 今天要做的 <span class="en2">Today</span>',
                     action:true, extra:pendHtml });
  } else {

  h += '<div class="card no-print"><h3><i class="ci ci-pin" aria-hidden="true">📌</i> 今天要做的 <span class="en2">Today</span>' +
    '<span class="right hint">' + esc(S.today.slice(5).replace('-', '/')) +
      '（' + ['日','一','二','三','四','五','六'][new Date().getDay()] + '）</span></h3>';

  if (hol) {
    h += '<div class="qk-pend ok">🏖️ <b>今天放假：' + esc(holName(hol)) + '</b>　沒有課，好好休息。' +
      '　要補記別天的紀錄，' +
      (phone ? '<a href="#quick" data-go="quick">到快速記錄</a>選班級就好。'
             : '<a href="#check" data-go="check">到進度檢核</a>選班級和日期就好。') + '</div>';
  } else if (!route.length) {
    h += '<div class="qk-pend ok">今天沒有排課。要補記別天的紀錄，' +
      (phone ? '<a href="#quick" data-go="quick">到快速記錄</a>選班級就好。'
             : '<a href="#check" data-go="check">到進度檢核</a>選班級和日期就好。') + '</div>';
  } else {
    /* ⚠️ 他一天通常只有一到三班。排成一列一列的話，卡片裡就是一條細線加一大片空白
       （2026-09-14 他圈的）。改成一班一張卡、欄數自己算：
       一班就占滿整列、兩班各半、三班各三分之一，看起來剛剛好，也塞得下更多資訊。 */
    h += '<div class="today-grid">' + route.map(function (r) {
      /* 這一節上的是哪個單元、那個單元的狀態。沒有節次紀錄才退回舊的判斷。 */
      var les = lessonAt(S.today, r.no, r.cls);
      var u   = les ? (unitOf(les.unitId) || currentUnit(r.cls)) : currentUnit(r.cls);
      var pr  = les ? progOf(r.cls, les.unitId)
                    : S.progress.filter(function (p) {
                        return String(p.cls) === String(r.cls) && ymd10(p.date) === S.today; })[0];
      var rec = periodDone(S.today, r.no, r.cls);
      var st = pr ? ST[pr.status] : null;
      var ab = S.absences.filter(function (x) {
        return String(x.cls) === String(r.cls) && Number(x.week) === Number(S.wk.week); })[0];
      var abN = ab ? seatList(ab.seats).length : 0;
      return '<div class="tcard' + (r.no === nowNo ? ' now' : '') + (rec ? ' done' : '') + '">' +
        '<div class="h"><span class="p">第 ' + r.no + ' 節' +
          (r.no === nowNo ? '・現在' : '') + '</span>' +
          '<span class="t">' + esc(r.start) + ' – ' + esc(r.end || '') + '</span></div>' +
        '<div class="m"><span class="plate c-' + colorOf(r.cls) + '">' + esc(r.cls) + '</span>' +
          '<div class="tx"><div class="a">' +
            esc(u ? (u.nameZh || u.nameEn) : '還沒選單元') + '</div>' +
          '<div class="b">' + esc(u ? u.nameEn : '到進度檢核選一個單元') + '</div></div></div>' +
        /* 狀態只留中文——整串「快完成 Almost There」在 287px 的卡裡會把
           缺席人數擠成一個字一行（改版當下就踩到了）。 */
        '<div class="f">' +
          (rec && st ? '<span class="badge ' + st.k + '">' + esc(st.z) + '</span>'
                     : '<span class="s no">還沒記</span>') +
          (abN ? '<span class="hint nw">缺席 ' + abN + ' 人</span>' : '') +
          '<button class="btn ' + (rec ? 'ghost ' : '') + 'sm" data-todo="' + esc(r.cls) +
          '" data-per="' + esc(r.no) + '">' +
          (rec ? '看紀錄' : '去記錄') + '</button></div>' +
        '</div>';
    }).join('') + '</div>';
  }

  /* 今天少掉的那幾節：哪一班、為什麼。放在卡片下緣一行，
     不要跟「要去記錄」的那幾張卡混在一起 */
  var lost = lostOn(S.today);
  if (lost.length) {
    h += '<div class="lost-row">' + lost.map(function (o) {
      return '<span class="lost-i"><b>第 ' + o.no + ' 節</b>' +

        esc(o.kind === 'block' ? holName(o.block) : slotWhy(o)) + '</span>';
    }).join('') + '</div>';
  }

  h += pendHtml + '</div>';
  }

  /* 本週課表。手機上看不到「課表管理」那一頁，所以這張要留著 */

  h += '<div class="card"><h3><i class="ci ci-sched" aria-hidden="true">📅</i> 本週課表 <span class="en2">This Week\'s Class Schedule</span>' +

        esc(holName(o.block)) + '</span>' +

      if (o.kind === 'out') return '<div class="slot moved"><span class="cn">' +

  var clsN  = S.classes.length;

    var rows = S.progress.filter(function (p) { return String(p.unitId) === String(u.id); });
    var doneN = rows.filter(function (p) { return p.status === 'done'; }).length;
    return { u:u, started:rows.length, doneN:doneN };
  }).filter(function (x) {
    return x.started > 0 && !(clsN && x.doneN >= clsN);
  });

  /* ⚠️ 手機上不顯示。它列的是六個單元和各班完成數，跟「教學進度」那個側標
     做的是同一件事，而且那一頁做得更完整；在手機上等於多滑一整個畫面
     （量到 762px，2026-09-20 他同意拿掉）。桌機維持原樣。 */
  if (!phone) {
  h += '<div class="card"><h3><i class="ci ci-target" aria-hidden="true">🎯</i> 本週重點 <span class="en2">This Week\'s Focus</span>' +
    '<a class="right" href="#prog" data-go="prog">查看全部</a></h3><div class="list">';

      /* ⚠️ 中文在前、英文在後（全站同一條規則，2026-09-20 統一）。

      ' <span style="color:var(--muted);font-weight:500">' + esc(u.nameEn) +

function ahome() {

  Array.prototype.forEach.call(document.querySelectorAll('[data-todo]'), function (b) {

      var per = Number(b.dataset.per || 0);
      var target = isPhone() ? 'quick' : 'check';
      var u = (per ? unitForSlot(S.today, per, cls) : currentUnit(cls));
      if (target === 'quick') {
        UI.quick.cls = cls;
        UI.quick.period = per || periodFor(cls);
        if (u) UI.quick.unitId = u.id;
        UI.quick.loaded = '';
      } else {
        UI.check.cls = cls;
        var cl = clsOf(cls); if (cl) UI.check.grade = cl.grade;
        if (u) UI.check.unitId = u.id;
        UI.check.date = S.today;
        UI.check.period = per || periodFor(cls);
        UI.check.loaded = '';
      }
      go(target);
    };
  });
}

function bindGo() {
