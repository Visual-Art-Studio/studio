  };

  if ($('pOff')) $('pOff').onclick = function () {

function setPass(oldPass, newPass, msg) {

/* ── 系統狀態 ───────────────────────────────────────────── */
function loadDiag() {
  var box = $('dgBody');
  if (!box) return;
  call('apiDiag').then(function (d) {
    if ($('dgBody')) drawDiag(d);
  }).catch(function (e) {
    if ($('dgBody')) $('dgBody').innerHTML =
      '<div class="empty-note" style="color:#98243c">' + esc(e && e.message || e) + '</div>';

}

function drawDiag(d) {
  /* 筆數用前端的 S 算就好，不用再打一趟伺服器 */
  var phN = 0;
  for (var k in S.photoIdx) phN += S.photoIdx[k].length;
  if (S.photoTotal) phN = S.photoTotal;       /* photoIdx 只有這學期的，容量要算全部 */
  var mb = phN * 0.4;                       /* 一張存大小兩份，合計約 0.4 MB */
  var size = mb >= 1024 ? (mb / 1024).toFixed(1) + ' GB' : Math.round(mb) + ' MB';

  var rows = [
    ['班級', S.classes.length + ' 班'],
    ['單元', S.units.length + ' 個'],
    ['課表', S.schedule.length + ' 節'],
    ['進度紀錄', S.progress.length + ' 筆'],
    ['課堂札記', S.notes.length + ' 筆'],
    ['缺席紀錄', S.absences.length + ' 筆'],
    ['教學資源', S.resources.length + ' 筆'],
    ['假日與停課', (S.holidays || []).length + ' 筆'],
    ['臨時調課', (S.moves || []).length + ' 筆'],
    ['作品照片', phN + ' 張<small>約 ' + size + '（估算）</small>']
  ];

  var hint = function (t) { return '<div class="b">' + t + '</div>'; };
  var h = '<div class="list">';

  h += '<div class="it"><div class="tx"><div class="a">程式碼版本</div>' +
    hint('這就是目前部署出去的版本。跟我給你的版本號對不上，就是部署沒更新。') +
    '</div><span class="badge c-blue">' + esc(d.ver) + '</span></div>';

  h += '<div class="it"><div class="tx"><div class="a">畫面版本</div>' +
    hint('Index.html 這一支的版本。只貼畫面、沒動 Code.gs 的時候，看這個才知道貼上去了沒。') +
    '</div><span class="badge c-gray">' + esc(UI_VER) + '</span></div>';

  h += '<div class="it"><div class="tx"><div class="a">管理通行碼</div>' +
    hint(d.passOn ? '已設定。光有管理網址進不來，還要知道這組碼。'
                  : '⚠️ 還沒設。拿到管理網址的人可以直接進來編輯。') +
    '</div><span class="badge ' + (d.passOn ? 'st-almost' : 'st-done') + '">' +
    (d.passOn ? '已設定' : '沒有設') + '</span></div>';

  h += '<div class="it"><div class="tx"><div class="a">Google 認得出你嗎</div>' +
    hint(d.owner ? ('認得出：' + esc(d.me))
                 : '認不出來——存取權設成「所有人」時本來就這樣，不是壞掉。' +
                   '管理入口靠網址上的金鑰，跟登入哪個帳號無關。') +
    '</div><span class="badge ' + (d.owner ? 'st-almost' : 'c-gray') + '">' +
    (d.owner ? '是' : '否') + '</span></div>';

  if (d.webUrl) {
    h += '<div class="it"><div class="tx"><div class="a">家長用的網址</div>' +
      hint('不帶參數的那一個。班級成果頁的連結是從這個長出來的。') +
      '<div class="u" style="margin-top:6px"><input type="text" readonly id="dgUrl" value="' +
        esc(d.webUrl) + '"><button class="btn ghost sm" id="dgCopy">複製</button></div>' +
      '</div></div>';
  }

  h += '<div class="it"><div class="tx"><div class="a">資料試算表</div>' +
    hint('所有資料都在這裡，可以直接開來看或備份') + '</div>' +
    '<a class="btn ghost sm" href="' + esc(d.ssUrl) + '" target="_blank" rel="noopener">開啟</a></div>';

  h += '<div class="it"><div class="tx"><div class="a">照片與檔案的資料夾</div>' +
    hint('作品照片、上傳的學習單都放在這裡') + '</div>' +
    '<a class="btn ghost sm" href="' + esc(d.folderUrl) + '" target="_blank" rel="noopener">開啟</a></div>';

  /* 每週自動備份的結果。⚠️ 失敗要寫出原因，不要只說「沒備份」 */
  var bk = String(d.backup || '');
  h += '<div class="it"><div class="tx"><div class="a">每週自動備份</div>' +
    hint(!bk ? '還沒備份過——下次打開網頁時會自動備份一份' :
         /^失敗/.test(bk) ? '⚠️ 上一次備份' + bk :
         '最近一次：' + bk + '。放在檔案資料夾裡的「備份」，留最近 8 份') + '</div></div>';

  h += '<div class="it"><div class="tx"><div class="a">列印本頁</div>' +
    hint('側欄與按鈕不會印出來') + '</div>' +
    '<button class="btn ghost sm" onclick="window.print()">列印</button></div>';

  h += '</div>';

  h += '<div class="dg-grid">' + rows.map(function (r) {
    return '<div class="dg-i"><span class="k">' + r[0] + '</span>' +
      '<span class="v">' + r[1] + '</span></div>';
  }).join('') + '</div>';

  h += '<div class="hint" style="margin-top:10px">' +
    '進不去這一頁的時候（例如通行碼忘了），把網址的 <b>?admin=…</b> 換成 <b>?diag=1</b>，' +
    '還是看得到版本和身分——那一頁不需要任何權限。</div>';

  $('dgBody').innerHTML = h;
  if ($('dgCopy')) {
    $('dgCopy').onclick = function () {
      $('dgUrl').select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      /* ⚠️ execCommand 失敗時不一定丟錯，是回 false——要看回傳值，不然會謊報「已複製」 */
      toast(ok ? '網址已複製' : '沒有複製成功，請手動選取上面那一行', !ok);
    };
  }
}

/* ── 班級成果頁的管理介面 ───────────────────────────────── */
function loadShow() {
  var box = $('shBody');
  if (!box) return;
  call('apiShowList').then(function (d) {
    if (!$('shBody')) return;           /* 使用者已經換頁了 */
    drawShow(d);
  }).catch(function (e) {
    if ($('shBody')) $('shBody').innerHTML =
      '<div class="empty-note" style="color:#98243c">' + esc(e && e.message || e) + '</div>';
  });
}

function drawShow(d) {
  if (!d.rows.length) {
    $('shBody').innerHTML = '<div class="empty-note">還沒有班級。先到上面的「班級」新增。</div>';
    return;
  }
  $('shBody').innerHTML = d.rows.map(function (r) {
    return '<div class="sh-row">' +
      '<div class="h"><span class="badge c-' + colorOf(r.cls) + '">' + esc(r.cls) + '</span>' +
        '<span class="st" style="color:' + (r.open ? '#1d7348' : '#626862') + '">' +
          (r.open ? '開放中' : '未開放') + '</span>' +
        '<span class="n">' + r.photos + ' 張照片</span></div>' +
      '<div class="pw">確認碼 <b>' + esc(r.pass || r.cls) + '</b>' +
        (r.pass ? '（自訂通行碼）' : '（班級號碼）') + '</div>' +
      '<div class="u"><input type="text" readonly value="' + esc(r.url) + '" data-shurl="' +
        esc(r.cls) + '">' +
        '<button class="btn ghost sm" data-shcopy="' + esc(r.cls) + '">複製</button></div>' +
      '<div class="b">' +
        /* 👀 預覽（2026-10-05 他要的：「每次想看成果頁都要去複製連結」）。
           開新分頁、帶 pv=1：不用打確認碼，還沒開放的班也看得到（見 Show.html 的 preview()）。
           ⚠️ 一定要是絕對網址＋target=_blank：沙箱 iframe 裡的相對連結開不了，而且不報錯。 */
        (d.base
          ? '<a class="btn ghost sm" target="_blank" rel="noopener" data-shpv="1" href="' +
              esc(r.url + '&pv=1') + '">預覽</a>'
          : '') +
        '<button class="btn ' + (r.open ? 'ghost' : 'green') + ' sm" data-shto="' + esc(r.cls) +
          '" data-on="' + (r.open ? '0' : '1') + '">' + (r.open ? '關閉' : '開放') + '</button>' +
        '<button class="btn ghost sm" data-shpw="' + esc(r.cls) + '">通行碼</button>' +
        '<button class="btn ghost sm" data-shnew="' + esc(r.cls) + '">換網址</button>' +
      '</div></div>';
  }).join('');

  /* 「只記到關掉分頁」的通行證在 sessionStorage，新分頁拿不到——
     按下去的那一刻放一份到 localStorage 交棒，成果頁讀完就刪、一分鐘後也作廢。 */
  Array.prototype.forEach.call(document.querySelectorAll('[data-shpv]'), function (a) {
    a.onclick = function () {
      try {
        if (ADMTOK && !localStorage.getItem('tpAdminTok')) {
          localStorage.setItem('tpPvTok', JSON.stringify({ tok: ADMTOK, at: Date.now() }));
        }
      } catch (e) { /* 存不了就算了，成果頁會退回輸入確認碼 */ }
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-shto]'), function (b) {
    b.onclick = function () {
      var row = findShow(b.dataset.shto);
      call('apiShowSet', b.dataset.shto, b.dataset.on === '1', row ? row.pass : '')
        .then(function (d2) { drawShow(d2); toast(b.dataset.shto + ' 班已' +
          (b.dataset.on === '1' ? '開放' : '關閉')); }).catch(fail);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-shpw]'), function (b) {
    b.onclick = function () {
      var row = findShow(b.dataset.shpw);
      askText(b.dataset.shpw + ' 班的自訂通行碼',
              '留白＝用班級號碼 ' + b.dataset.shpw + '。',
              row ? row.pass : '', '更新').then(function (v) {
        if (v === null) return;
        call('apiShowSet', b.dataset.shpw, row ? row.open : false, v.trim())
          .then(function (d2) { drawShow(d2); toast('通行碼已更新'); }).catch(fail);
      });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-shnew]'), function (b) {
    b.onclick = function () {
      ask('舊網址會立刻失效，已經發出去的連結就打不開了。', '換新網址',
          '要換掉 ' + b.dataset.shnew + ' 班的網址嗎？').then(function (yes) {
        if (!yes) return;
        call('apiShowRegen', b.dataset.shnew)
          .then(function (d2) { drawShow(d2); toast('已換新網址，記得重新發給家長'); }).catch(fail);
      });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-shcopy]'), function (b) {
    b.onclick = function () {
      var inp = document.querySelector('[data-shurl="' + b.dataset.shcopy + '"]');
      inp.select();
      inp.setSelectionRange(0, 9999);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (ok) toast(b.dataset.shcopy + ' 班的網址已複製');
      else toast('複製不了，網址已經選起來了，請按 ⌘C', true);
    };
  });

  SHOW_ROWS = d.rows;
}

var SHOW_ROWS = [];
function findShow(cls) {
  for (var i = 0; i < SHOW_ROWS.length; i++) {
    if (String(SHOW_ROWS[i].cls) === String(cls)) return SHOW_ROWS[i];
  }
  return null;
}

function openMask(html) {
  $('maskBody').innerHTML = html;
  $('mask').className = 'mask on';
  $('mask').onclick = function (ev) { if (ev.target === $('mask')) closeModal(); };
}
function closeModal() {
  askDone(ASK_NO);                 /* 還沒回答的問題一律當成「取消」 */
  $('mask').className = 'mask';
  $('maskBody').innerHTML = '';
}

/* ══════════════════════════════════════════════════════════════
   「確定嗎？」「知道了」「請輸入」
   ⚠️ 不要用瀏覽器的 confirm()／alert()／prompt()。
      這一頁跑在 Apps Script 的沙箱 iframe 裡，手機上的內建瀏覽器
      （LINE、FB、Gmail 點開的那種）與 Chrome 對跨來源 iframe 的規則，
      都可能直接把它們忽略掉——**而且完全不報錯**，只是回傳 false／null，
      程式一看到就 return，按鈕於是變成「按了沒反應」。
      2026-09-13 在另一套網站（就視藝起來記錄）踩到並全部改掉，這邊一起改。
   ══════════════════════════════════════════════════════════════ */
var ASK = null;         /* 還沒有答案的那一題 */
var ASK_NO = false;     /* 那一題「取消」要回什麼（ask 回 false、askText 回 null） */
function askDone(v) {
  var f = ASK; ASK = null;
  if (f) f(v);
}
/** 回傳 Promise<boolean>。Esc、點外面、按取消，都是 false。 */
function ask(text, okText, title) {
  return new Promise(function (res) {
    askDone(ASK_NO);               /* 保險：上一題還開著就先當取消 */
    ASK = res; ASK_NO = false;
    openMask('<div class="modal ask"><h3>' + esc(title || '確定嗎？') + '</h3>' +
      '<p class="ask-t">' + esc(text) + '</p>' +
      '<div class="acts"><button class="btn ghost" id="mCancel">取消</button>' +
      '<button class="btn pink" id="mOk">' + esc(okText || '確定') + '</button></div></div>');
    $('mCancel').onclick = closeModal;
    $('mOk').onclick = function () { askDone(true); closeModal(); };
  });
}
/** 只有一顆「知道了」。取代 alert()。 */
function say(title, text) {
  askDone(ASK_NO);
  openMask('<div class="modal ask"><h3>' + esc(title) + '</h3>' +
    '<p class="ask-t">' + esc(text) + '</p>' +
    '<div class="acts"><button class="btn" id="mOk">知道了</button></div></div>');
  $('mOk').onclick = closeModal;
}
/** 取代 prompt()。回傳 Promise<字串|null>；取消是 null，跟 prompt 一樣。 */
function askText(title, label, value, okText) {
  return new Promise(function (res) {
    askDone(ASK_NO);
    ASK = res; ASK_NO = null;
    openMask('<div class="modal ask"><h3>' + esc(title) + '</h3>' +
      '<p class="ask-t">' + esc(label) + '</p>' +
      '<input class="pw-in" id="askIn" value="' + esc(value || '') + '">' +
      '<div class="acts"><button class="btn ghost" id="mCancel">取消</button>' +
      '<button class="btn" id="mOk">' + esc(okText || '確定') + '</button></div></div>');
    var ok = function () { var v = $('askIn').value; askDone(v); closeModal(); };
    $('mCancel').onclick = closeModal;
    $('mOk').onclick = ok;
    $('askIn').onkeydown = function (e) { if (e.key === 'Enter') ok(); };
    /* 手機上自動聚焦會把鍵盤叫出來，正好省一次點擊 */
    setTimeout(function () { try { $('askIn').focus(); $('askIn').select(); } catch (e) {} }, 30);
  });
}

function modal(title, body, onOk) {
  openMask('<div class="modal"><h3>' + esc(title) + '</h3>' + body +
    '<div class="acts"><button class="btn ghost" id="mCancel">取消</button>' +
    '<button class="btn" id="mOk">確定</button></div></div>');
  $('mCancel').onclick = closeModal;
  $('mOk').onclick = function () { if (onOk() !== false) closeModal(); };
}

function search(q) {
  q = String(q || '').trim().toLowerCase();
  if (!q) return;
  var hit = [];
  sortedUnits().forEach(function (u) {
    if ((u.nameEn + u.nameZh + u.descZh).toLowerCase().indexOf(q) >= 0) {
      hit.push({ t:'單元', a:u.nameEn + ' ' + u.nameZh, b:u.descZh, p:'prog' });
    }
  });
  S.classes.forEach(function (c) {
    if ((c.code + c.grade).toLowerCase().indexOf(q) >= 0) {
      hit.push({ t:'班級', a:c.code + ' ' + c.grade, b:'到進度檢核', p:'check', cls:c.code });
    }
  });
  S.notes.forEach(function (n) {
    if (String(n.text).toLowerCase().indexOf(q) >= 0) {
      hit.push({ t:'札記', a:n.date + ' ' + (n.cls || ''), b:n.text.slice(0, 80), p:'notes' });
    }
  });
  S.resources.forEach(function (r) {
    if ((r.title + r.note).toLowerCase().indexOf(q) >= 0) {
      hit.push({ t:'資源', a:r.title, b:r.note || r.url, p:'res' });
    }
  });
  openMask('<div class="modal"><h3>搜尋「' + esc(q) + '」　' + hit.length + ' 筆</h3>' +
    (hit.length ? '<div class="list">' + hit.slice(0, 40).map(function (x, i) {
      return '<div class="it"><span class="badge c-gray">' + x.t + '</span>' +
        '<div class="tx"><div class="a">' + esc(x.a) + '</div><div class="b">' + esc(x.b) + '</div></div>' +
        '<button class="btn ghost sm" data-hit="' + i + '">前往</button></div>';
    }).join('') + '</div>' : '<div class="empty-note">沒有找到。</div>') +
    '<div class="acts"><button class="btn ghost" id="mCancel">關閉</button></div></div>');
  $('mCancel').onclick = closeModal;
  Array.prototype.forEach.call(document.querySelectorAll('[data-hit]'), function (b) {
    b.onclick = function () {
      var x = hit[Number(b.dataset.hit)];
      if (x.cls) { UI.check.cls = x.cls; loadProg(); }
      closeModal(); go(x.p);
    };
  });
}

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (_fe) return feClose(false);      /* 正在專心打字就先收那一層 */
  closeModal();
});

window.addEventListener('hashchange', function () {
  var id = location.hash.replace('#', '');
  if (id && PAGES.some(function (p) { return p.id === id; })) {
    id = fallbackPage(id);
    if (id !== PAGE) go(id);
  }
});

var PHONE = isPhone();

/* 轉螢幕方向／拉動視窗，跨過手機與桌機的界線時整頁重畫。
   以前不重畫，轉橫再轉直會留著另一種版面的 HTML，欄位就縮不回去（2026-09-15 他回報）。
   只有「跨界線」才重畫，拉視窗時不會一直重繪。 */
(function watchViewport() {
  var was = isPhone(), t = null;
  function check() {
    var now = isPhone();
    if (now === was) return;
    was = now;
    if (!S) return;                  /* 資料還沒到，等 render 自己來 */
    drawNav();
    PAGE = fallbackPage(PAGE);
    render();
  }
  function later() { clearTimeout(t); t = setTimeout(check, 150); }
  window.addEventListener('resize', later);
  window.addEventListener('orientationchange', later);
})();

/* 快速記錄打到一半，隔一下就把草稿存一份（見 draftSave）。
   ⚠️ 用捕獲階段（第三個參數 true）。按鈕的 onclick 常常會整頁重畫，
      元素被換掉之後事件就不會再冒泡到 document，捕獲才一定收得到；
      真正要存的動作延後 600ms，那時候 UI.quick 已經更新好了。 */
(function watchDraft() {
  var t = null;
  function later() {
    if (PAGE !== 'quick') return;
    clearTimeout(t);
    t = setTimeout(draftSave, 600);
  }
  document.addEventListener('input', later, true);
  document.addEventListener('click', later, true);
})();

(function init() {
  var id = location.hash.replace('#', '');
  if (id && navPages().some(function (p) { return p.id === id; })) PAGE = id;
  else if (id) PAGE = fallbackPage(id);
  else if (PHONE) PAGE = 'quick';      /* 手機打開就直接進快速記錄 */
  document.addEventListener('DOMContentLoaded', function () {
    $('q').onkeydown = function (e) { if (e.key === 'Enter') search(this.value); };
  });
  if (document.readyState !== 'loading') {
    $('q').onkeydown = function (e) { if (e.key === 'Enter') search(this.value); };
  }
  boot('');
})();
</script>
