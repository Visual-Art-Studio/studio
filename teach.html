<title>Chris的雙語視覺藝術工作室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   基本設定
   字級是刻意放大的（正文 16px、行距 1.75、12px 以下只給裝飾）。
   顏色對比一律 4.8:1 以上，改版時不要為了「柔和」調淡回去。
   ══════════════════════════════════════════════════════════════ */
:root{
  /* ── 紙與墨（2026-09-17 美術改版）──────────────────────────
     底色從冷灰藍換成暖白的圖畫紙，主色從藍換成龍埔綠——跟「就視藝起來記錄」
     那一套同一組顏色。同一個老師、同一門課，兩個網站打開來要像同一間教室。
     ⚠️ 十三個班級色（.c-* / .k-*）與四個進度狀態色**一個字都沒動**：
        那是老師在設定裡選的、而且 Show.html 有一份一模一樣的副本。 */
  /* ⚠️ --muted 2026-10-05 從 #636e67 加深一階：小卡改成玻璃之後（底下透出頁面的紙色），
     次要字只剩 4.4。這一支跟成果頁同一個值。 */
  --ink:#22332d; --ink2:#44574f; --muted:#56605a;
  --line:#e6dcc7; --line2:#f1eadb;
  --bg:#faf7ec; --card:#fffdf6;
  /* 側標那一條、以及整頁左右兩側的深色外框（同一個顏色，往下延伸成邊框）。
     現在是牛皮紙資料夾的顏色，中間那張紙浮在它上面。
     ── 2026-10-05 換成**藍色牛皮紙**（他要的）。原本是 #ddd0b3 的黃牛皮紙。
     做法跟配色/theme.py 一樣：**換色相、不換亮度**——每個顏色都是「藍色系裡、
     亮度跟原本一模一樣」的那一個，所以疊在上面的字，對比一個都不會變。
     ⚠️ 牛皮紙的顏色全部集中在底下這一組 --kraft-*，要換回黃的或換別的藍，
        只改這一組就好（黃的那一組寫在每一行的註解裡）。
     ⚠️ 只換「資料夾」這一面：紙、墨、龍埔綠、八頁的紙色、十三個班級色都沒動。 */
  --frame:#c7d2dd;                    /* 黃：#ddd0b3 */
  --kraft-tab:#c3d0da;                /* 沒選到的頁籤（實色退路）　黃：#dbcdae */
  --kraft-line:#b5c5d2;               /* 頁籤的邊　黃：#d0c1a0 */
  --kraft-hover:#d8e0e7;              /* 滑過去　黃：#e9dec6 */
  /* 沒選到的頁籤的字。⚠️ 不是照亮度換的：黃的那支 #6e6553 本來就只有 3.6，
     低於全站 4.8（2026-10-05 健檢抓到）。這一支算過，在頁籤上 4.9。 */
  --kraft-ink:#3f5466;                /* 黃：#6e6553（3.6，不合格） */
  /* 玻璃頁籤的兩層（上淡下深）與滑過去的兩層 */
  --kraft-ga:rgba(206,216,225,.52);   /* 黃：rgba(226,214,187,.52) */
  --kraft-gb:rgba(189,203,215,.58);   /* 黃：rgba(214,200,169,.58) */
  --kraft-ha:rgba(231,236,240,.72);   /* 黃：rgba(243,235,214,.72) */
  --kraft-hb:rgba(216,224,231,.72);   /* 黃：rgba(233,222,198,.72) */
  /* ── 藍底之後的整體色調（2026-10-05 他要的：「整體色調也因為變藍色底而應該有些改變」）──
     影子和玻璃的邊本來都帶暖褐（88,72,44），是配黃牛皮紙的；底變灰藍之後，
     暖褐的影子會在藍色上浮出一圈髒髒的土色。全站 38 處影子改吃這一支。
     ⚠️ 只寫 R,G,B 三個數字，用的時候是 rgba(var(--shade), .1)。
     黃牛皮紙時代的值：--shade 88,72,44　--edge 160,142,104　--edge-l 190,174,140 */
  --shade:44,62,82;                   /* 影子：石板藍 */
  --edge:96,118,142;                  /* 玻璃邊緣收暗的那一段、卡片標題的分隔線 */
  --edge-l:150,168,188;               /* 欄位的邊 */
  /* 資料夾那一面：牛皮紙 ＋ 兩片壓在 8% 以下的水彩暈。
     ⚠️ 頂欄、側標、整頁的底都吃這一支。三個地方都要**同一個值＋
     background-attachment:fixed**，水彩才會對得起來，看起來是同一張紙；
     只要有一個地方自己填一塊純色，那一條就會浮出來變成另一塊（2026-09-20 他圈的）。 */
  --folder:
    radial-gradient(900px 520px at 4% 0%, rgba(169,214,223,.30), rgba(169,214,223,0) 62%),
    radial-gradient(820px 460px at 98% 6%, rgba(243,170,127,.22), rgba(243,170,127,0) 60%),
    var(--frame);
  /* 那張「紙」左右各留多少給邊框。改這一個值，側標、內容、外框會一起跟著動。 */
  --pad:14px;
  /* 這一頁的顏色，換頁時由 applyTint() 覆寫 */
  --pg-sheet:#faf7ec; --pg-ink:#285a4a; --pg-line:#dfe5d3;
  /* 主色：龍埔綠。2026-09-17 之前是藍色（--blue），換色時連變數名一起改，
     免得以後看到 --blue 卻是綠的。 */
  --grn:#285a4a; --grn-d:#1c463a; --grn-l:#e7efe3;
  /* 四個「藝術色」：珊瑚、葉綠、麥黃、天藍。深的那支是**文字色**（白底對比 4.8 以上），
     淺的那支才是底色。⚠️ 不要拿淺色當文字色，也不要把珊瑚色拿去寫字。 */
  --pink:#b2432c; --pink-l:#fbe7dc;
  --green:#2c6b48; --green-l:#e4efdb;
  --yellow:#8a6210; --yellow-l:#fbf0d3;
  --purple:#6b46c1; --purple-l:#efe8fb;
  --violet:#8b3fbf; --violet-l:#f6e9fb;
  --red:#b13048; --red-l:#fbe6e6;
  /* 影子帶一點暖褐，白紙上才不會浮出一圈冷灰 */
  --shadow:0 1px 2px rgba(var(--shade),.06), 0 6px 18px rgba(var(--shade),.07);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px; line-height:1.75; color:var(--ink);
  /* 桌面＝牛皮紙資料夾，兩片水彩暈壓在 8% 以下——是材質，不是裝飾 */
  background:var(--folder);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  /* ⚠️ viewport-fit=cover 之後整頁會鋪到瀏海和圓角底下，左右要自己讓開那一條，
     不然橫著拿有瀏海的手機時，最左邊那一顆會被切掉一半。
     加在 body 上，頂欄、側標、內容才會一起讓，三條邊界不會錯開；
     直著拿、或沒有瀏海的裝置，這兩個值都是 0，看起來完全一樣。 */
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
button,input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink)}
a{color:var(--grn-d)}
h1,h2,h3,h4{margin:0; line-height:1.4}

/* ── 版面骨架 ────────────────────────────────────────────── */
/* 頂欄、導覽、內容由上而下三層，整頁等寬（2026-09-14 拿掉左側欄之後）。 */
.app{display:flex; flex-direction:column; min-height:100vh}
/* 內容那一「頁」：左右兩側留給深色外框，看起來就是一張夾在資料夾裡的紙。
   ⚠️ 1644＝.wrap 的 1600 ＋ 左右各 22 的內距，這樣側標、內容、外框三條線才對得齊。
   ⚠️ width:100% 不能省——flex 項目一旦有 margin:auto 就不會被拉伸（踩過）。 */
.main{
  flex:1; min-width:0; display:flex; flex-direction:column;
  width:100%; max-width:calc(1600px + var(--pad) * 2); margin:0 auto;
  /* 紙本身：右上角與左下角各提一點光，看起來像一張有厚度的紙，不是一塊色板 */
  background:
    radial-gradient(900px 520px at 100% 0, rgba(255,255,255,.55), rgba(255,255,255,0) 62%),
    radial-gradient(760px 440px at -6% 100%, rgba(255,255,255,.42), rgba(255,255,255,0) 60%),
    var(--pg-sheet);
  border:1px solid var(--line); border-radius:14px;
  box-shadow:0 2px 10px rgba(var(--shade),.07);
}
/* ── 紙的上緣跟著側標走（2026-10-06 他圈的）───────────────
   側標是 sticky，紙不是：一往下捲，紙左上／右上那兩個圓角就捲走了，
   側標底下剩一條方方的邊。這一條「唇」黏在側標正下方，永遠畫著那兩個圓角
   ＋上緣那條線，看起來紙的上緣一直都在。
   做法：只畫「圓角外面那一小塊」（資料夾的底）＋ 那條墨線，**中間是透明的**——
   底下捲過去的紙和內容照樣透上來。不要在中間填紙色：紙右上角有一片提亮的光，
   填一塊固定的顏色，捲動時那一條就會跟底下的紙對不上。
   ⚠️ 高度 14 ＝ .main 的圓角；邊線色 ＝ .main 的 border。改其中一個要一起改。
   ⚠️ 資料夾的底一樣要 fixed，才會跟旁邊那面接得起來（見 --folder）。
   ⚠️ top 用量出來的 --topH ＋ --navH（fitTop() 寫的），不要寫死。
   ⚠️ 外推 1px 蓋住 .main 自己的邊框；margin-bottom 抵掉自己的高度，不佔版面。
   z-index 28：蓋得過內容（卡片、玻璃），讓得出側標（29）——
   選到的那張側標往下壓的 1px 才會蓋在這條線上面，照樣「翻進內容」。 */
.main::before{
  content:''; display:block; flex:0 0 auto; pointer-events:none;
  position:sticky; top:calc(var(--topH,72px) + var(--navH,60px)); z-index:28;
  height:14px; margin:-1px -1px -13px;
  background:
    radial-gradient(circle at 14px 14px, transparent 12.5px, var(--line) 13px, var(--line) 13.8px, transparent 14.3px) left top/14px 14px no-repeat,
    radial-gradient(circle at 0 14px, transparent 12.5px, var(--line) 13px, var(--line) 13.8px, transparent 14.3px) right top/14px 14px no-repeat,
    linear-gradient(var(--line), var(--line)) center top/calc(100% - 28px) 1px no-repeat,
    var(--folder);
  background-attachment:scroll, scroll, scroll, fixed, fixed;
  -webkit-mask:
    radial-gradient(circle at 14px 14px, transparent 12.5px, #000 13px) left top/14px 14px no-repeat,
    radial-gradient(circle at 0 14px, transparent 12.5px, #000 13px) right top/14px 14px no-repeat,
    linear-gradient(#000, #000) top/100% 1px no-repeat;
          mask:
    radial-gradient(circle at 14px 14px, transparent 12.5px, #000 13px) left top/14px 14px no-repeat,
    radial-gradient(circle at 0 14px, transparent 12.5px, #000 13px) right top/14px 14px no-repeat,
    linear-gradient(#000, #000) top/100% 1px no-repeat;
}
@media print{ .main::before{display:none} }

/* ── 頂欄 ───────────────────────────────────────────────── */
.top{
  /* ⚠️ 上下只留 4px（2026-09-23 他要「不要留那麼多空間、可以頂到上下」）。
     這一條就是貼紙能長多大的天花板：頂欄的高度＝貼紙 ＋ 8。
     左右維持 20px——那是整條頂欄的呼吸，不是貼紙的。 */
  /* ⚠️ align-items 是 end 不是 center（2026-09-23 他決定的）：貼紙長到 140 之後，
     右邊那一組（搜尋、學年度、週次）浮在正中間，上下各空 41——整組改成往下靠，
     空白集中到上面那一塊，再用 .top::before 那條手繪小圖去填。 */
  /* ⚠️ 左右內距跟 .nav 用同一條公式（2026-10-15 他用大螢幕回報「週次、日期、搜尋列跑掉」）：
     內容和側標最寬 1600 置中，頂欄以前卻是整條撐滿、右邊那一組貼著螢幕右緣——
     2560 寬量到週次比紙的右緣還多出去 446。1612 以下算出來就是原本的 20，窄畫面不變。
     ⚠️ .top::before 的 right 也吃這個變數，改這裡兩邊一起跟。 */
  --topX:max(20px, calc((100% - 1600px) / 2 + var(--pad)));
  display:flex; align-items:end; gap:12px; padding:4px var(--topX);
  background:linear-gradient(180deg,#fffdf7,#fdfaf0);
  border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:30;
}
/* ── 右上角那一條手繪小圖（2026-09-23）────────────────────
   右邊那一組往下靠之後，上面空出來的那一塊由它填（他畫的，純裝飾）。
   ⚠️ 絕對定位＝**它不參與版面**，所以它再怎麼樣都不會把頂欄撐高、
      也擠不到搜尋框。空間不夠時它只是變小或整條收起來。
   ⚠️ z-index:-1 讓它畫在頂欄自己的底之上、其它東西之下；.top 是 sticky（已經是
      一個堆疊環境），所以負的 z-index 不會掉到整頁的底下去。
   高度 ＝ 頂欄高 − 64（下面那 64 是留給搜尋／學年度／週次那一列的 44 ＋ 內距與間距）。
   圖用 `right bottom/contain` 貼齊右下角，所以它永遠對齊在那一組的正上方。
   ⚠️ 寬度要**剛好等於右邊那一組**，不能寫 vw：寫 vw 的話窄畫面它會往左伸到貼紙
      底下，從貼紙透明的地方透出來（1150 量到疊了 167px）。那一組量出來是
      搜尋 380 ＋ 學年度 233 ＋ 週次 220 ＋ 兩道間距 24 ＝ 857；
      1150 以下搜尋框收起來，剩 233 ＋ 220 ＋ 12 ＝ 465。
   量出來（圖是 2063×201、10.26:1）：
     1920 → 857×84　1600 → 857×83　1512 → 667×65　1024 → 465×45
   ⚠️ 1151～1400 這一段要整條收起來：那一段搜尋框還在、貼紙被擠到只剩 55~75 高，
      頂欄只有 63~95，扣掉 64 之後根本沒地方放（1180 甚至是負的）。
      手機（820 以下）同理，頂欄只有 47。 */
.top::before{
  content:''; display:none; position:absolute; z-index:-1; pointer-events:none;
  right:var(--topX,20px); top:8px; height:calc(100% - 64px); width:857px; max-width:calc(100% - var(--topX,20px) * 2);
  background:var(--art-doodle, none) right bottom/contain no-repeat;
}
@media (min-width:821px) and (max-width:1150px), (min-width:1401px){
  .top::before{display:block}
}
@media (max-width:1150px){ .top::before{width:465px} }

/* 頂欄底下一條顏料盤：四個藝術色刷過去，跟頁尾那條水彩橫條是同一件事的兩端。
   ⚠️ 只有 3px，而且壓在 .top 自己的邊線上——它是材質，不是一條分隔線。 */
.top::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:3px;
  background:linear-gradient(90deg,#f5d66f 0%,#f3aa7f 26%,#e78972 48%,#a9d6df 72%,#285a4a 100%);
  opacity:.5; pointer-events:none;
}
/* ⚠️ flex:0 0 auto——標題不跟著縮。以前是 0 1 auto，視窗拉到 1024 時
   中文標題會被 ellipsis 咬掉一截（2026-09-18 量到 265→202）。
   要讓的是搜尋框，不是網站的名字；1000 以下搜尋框整個收起來，更不會擠到。 */
/* ⚠️ margin-right:auto 掛在標題上，不要掛在搜尋框上。搜尋框在窄畫面會整個收起來，
   靠右那件事就跟著不見了——學年度和週次會縮回標題旁邊，右邊空掉一大塊
   （2026-09-18 他用平板拍回來的）。掛在標題上，右邊那一組永遠靠右。 */
.brand{display:flex; align-items:center; gap:12px; min-width:0; flex:0 0 auto; margin-right:auto}
.brand>div{min-width:0}
.brand .logo{
  /* 四角圓角各不相同＋歪兩度＝像一塊蓋上去的顏料色票，不是一顆系統圖示 */
  width:44px; height:44px; flex:0 0 44px; border-radius:14px 11px 15px 10px;
  background:
    radial-gradient(circle at 26% 24%, rgba(245,214,111,.85) 0 26%, rgba(245,214,111,0) 28%),
    radial-gradient(circle at 74% 30%, rgba(169,214,223,.85) 0 26%, rgba(169,214,223,0) 28%),
    radial-gradient(circle at 46% 78%, rgba(221,235,213,.95) 0 30%, rgba(221,235,213,0) 32%),
    #fffdf6;
  display:grid; place-items:center; font-size:24px;
  border:1px solid var(--line); transform:rotate(-2deg);
}
/* 中文大、英文小，排同一行（2026-09-18 他說不用上下排）。
   原本下面那一行是「老師名字 ＋ 學期」，跟右上角那兩張卡重複了，整條拿掉——
   這個網站只有他一個人用，名字寫在標題裡就夠了。
   ⚠️ 中文在前、英文在後，跟側標和全站的讀法一致（最早是英文在前）。 */
.brand .t1{
  font-size:27px; font-weight:700; letter-spacing:.2px; line-height:1.28;
  color:var(--grn-d); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.brand .t1 .enpart{
  font-size:14px; font-weight:500; color:var(--muted);
  letter-spacing:.01em; margin-left:10px;
}
/* 標題貼紙（2026-09-23 換掉上面那行字）。
   ⚠️ 圖不在這裡，在 Art.html（--art-wordmark）；連「把 .t1 換成這張圖」那一條
      也寫在 Art.html。所以 Art.html 沒貼的時候，標題會**退回上面那行字**，
      版面不會壞——在這裡改 .t1 的人要知道上面那行字現在平常看不到。

   ── 怎麼長大的（2026-09-23 第三版，他挑了 124 那一級）─────────
   這一塊**把左邊那段空間整個吃下來**（`.brand` 在 Art.html 裡改成 flex:1 1 0），
   然後靠 `background-position:center` 把貼紙擺在那段空間的正中央——
   他要的「移到空間的置中位置」就是這一件事，不是靠 margin 推過去。

   寬度吃滿、高度由 `aspect-ratio` 算出來、再用 `max-height` 封頂，所以：
     · 空間放得下 → 貼紙就是 140 高，左右各留一半的空白（置中）
     · 空間不夠   → 自己縮到剛好塞滿，**不會去擠搜尋框**（以前會）
   算出來（搜尋 380 ＋ 學年度 233 ＋ 週次 220 ＋ 間距內距 68 ＝ 901）：
     1280 → 75 高　1440 → 107　1600 → 139　1700 以上 → 140（封頂）
     1150 以下搜尋框整條收起來，天花板變成「視窗寬 − 521」：1024 → 100
   ⚠️ 上限 140 是跟 `.top` 的上下內距 4px 綁在一起算的（頂欄 ＝ 140 ＋ 8 ＝ 148）。
      要再大就是頂欄再高，兩個數字一起改。
   ⚠️ `background-size:contain` 是這一套的關鍵：盒子被 max-height 壓扁的時候，
      圖**不會跟著變形**，只會維持比例縮在盒子裡。不要改成 cover 或 100% 100%。
   ⚠️ 貼紙自己帶白邊和陰影，所以不要再加 border／box-shadow——
      那是「同一個地方兩圈線」。 */
.brand .wordmark{
  display:none;                     /* 貼了 Art.html 才會顯示 */
  width:100%; min-width:0;
  aspect-ratio:2165/436;
  max-height:140px;
  background:var(--art-wordmark, none) center/contain no-repeat;
}
.chip{
  display:flex; align-items:center; gap:10px; padding:7px 14px;
  border:1px solid var(--line); border-radius:13px 11px 13px 11px; background:#fffdf6;
  white-space:nowrap;
}
/* 週次那一張現在是頂欄右邊唯一的一張卡（教師名片拿掉了），字跟著放大，
   跟旁邊 20px 的學年度才是同一個量級（2026-09-18 他說再大一點）。 */
.chip .k{font-size:15px; color:var(--ink2); line-height:1.35}
/* ⚠️ 日期區間本來是 --muted，坐在半透明的卡上、底下透出資料夾，只剩 4.15（2026-10-05 健檢）。 */
.chip .v{font-size:19px; font-weight:700; line-height:1.35}
/* 週次那一張：第幾週和日期區間排同一行（2026-09-18 他說空間夠）。
   整條頂欄也因此矮了一截——本來就是這張卡兩行在撐高度。
   ⚠️ 901 以下才不並排：那一段（平板直拿、分割畫面）並排會把週次擠出畫面，
      再窄就進手機版面，日期區間本來就整個收起來了。 */
@media (min-width:901px){
  .chip>div{display:flex; align-items:baseline; gap:9px}
}
.search{
  display:flex; align-items:center; gap:8px; padding:8px 14px;
  /* 以前是「把中間的空白全部吃掉」，在寬螢幕上變成一條七百多像素的長溝
     （2026-09-18 他圈的）。改成夠打字就好，而且整組靠右：
     空白落在標題和搜尋框之間，右半邊就是「搜尋 · 學期 · 週次」一組。 */
  flex:0 1 380px; min-width:0; line-height:1.4;
  border:1px solid var(--line); border-radius:13px 11px 13px 11px; background:#fffdf6;
}
/* ⚠️ 選擇器一定要帶 [type=text]。全域那條 input[type=text]{padding:9px 12px;
   border:1px solid; border-radius:10px; background:#fffdf6} 權重是 0,1,1，
   跟 `.search input` 一樣，而且寫在後面——所以一直是全域那條贏：
   搜尋框裡面**又畫了一個框**（他 2026-09-18 的截圖上看得到兩層圓角），
   上下還各多墊 9px，整條頂欄因此從 73 被撐成 84。
   帶上 [type=text] 之後權重變 0,2,1 才蓋得掉。 */
.search input[type=text]{
  border:0; outline:0; background:transparent; width:100%;
  padding:0; font-size:15px; line-height:1.4;
}
/* 焦點的框畫在外面那顆膠囊上，不是裡面的輸入框（裡面已經沒有框了） */
.search input[type=text]:focus{box-shadow:none}
.search:focus-within{border-color:var(--grn); box-shadow:0 0 0 3px rgba(40,90,74,.16)}
.search>span{font-size:15px; line-height:1; display:flex; align-items:center}
/* 頂欄那兩顆卡裡的線條圖示 */
/* ⚠️ line-height:1 ＋ height:1em 把 emoji 的行框壓回字的高度。
   emoji 的行框比同字級的中文高一截，不壓的話整條頂欄矮不下來（量過 46 vs 35）。 */
.top .i{
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  font-size:1.05em; line-height:1; height:1em;
}
.search .i{font-size:17px; opacity:.75}
.year-badge{
  display:inline-flex; align-items:center; gap:8px; padding:11px 20px;
  border-radius:999px; font-size:20px; font-weight:700; line-height:1.2;
  color:var(--grn-d); white-space:nowrap;
  background:linear-gradient(118deg,#f4ead0,#fdf3e4 52%,#e9f0e2);
  border:1px solid #e6dcc0;
}

/* ── 導覽：一頁一張小卡，橫著排在頂欄下面 ────────────────────
   2026-09-14 從左側欄改過來。側欄佔著左邊一條，右邊的內容永遠是偏的；
   橫著排之後整頁等寬，下面能用的空間也大一截。
   ⚠️ 黏在頂欄下面，所以 top 是量出來的 --topH，不要寫死。 */
/* ── 資料夾側標 ─────────────────────────────────────────────
   他要的是「一個資料夾、上面一排側標」的整體感，不要頁籤一條、內容一塊，
   中間橫著一條分隔線（2026-09-14）。做法是最經典的那一種：
     · 頁籤條的底色比內容深一點，底部一條線＝資料夾的上緣
     · 沒選到的頁籤是淺白色的小標籤，坐在那條線上面
     · **選到的那一張跟內容同色**，而且 margin-bottom:-1px 壓在線上——
       線被它蓋掉，看起來就是從側標直接翻進這一頁的內容。
   ⚠️ `align-items:flex-end` 不能省，頁籤要貼齊底線才連得起來。 */
.nav{
  /* 導覽的縮放係數，由 fitNav() 量過之後寫進來（1 ＝ 原尺寸）。
     ⚠️ 這一區的尺寸一律寫成 calc(基準 * var(--nav-k))，以後新增的也要跟著寫，
        漏掉的那一項不會跟著縮，整條側標又會凸出畫面。 */
  --nav-k:1;
  position:sticky; top:var(--topH,72px); z-index:29;
  display:flex; align-items:flex-end; gap:calc(6px * var(--nav-k));
  /* ⚠️ 左右要跟下面的內容切齊，不然側標比內容寬（或窄）一截，
     就不像同一頁了（2026-09-14 他畫了兩條紅線）。
     .wrap 是 max-width:1600 置中 ＋ var(--pad) 內距，這裡算出同一條邊界。
     ⚠️ 底線改畫在那張「紙」上（.main 的 border），這裡不要再畫一條，
     否則圓角外面會多出一條橫線。 */
  padding:10px max(var(--pad), calc((100% - 1600px) / 2 + var(--pad))) 0;
  /* ⚠️ 跟 body 同一支底、同樣 fixed：側標這一條是資料夾的一部分，不是另一塊色塊。 */
  background:var(--folder);
  background-attachment:fixed;
  overflow-x:auto;
}
/* 圖示在左、中英文在右（跟以前側欄同一種讀法）。
   ⚠️ 圖示放上面的話整條導覽會變成 103px 高，等於把上面的空間又吃掉一截。 */
.nav a{
  flex:1 1 0; min-width:max-content; position:relative;
  display:flex; align-items:center; justify-content:center; gap:calc(8px * var(--nav-k));
  padding:calc(7px * var(--nav-k)) calc(10px * var(--nav-k)) calc(8px * var(--nav-k));
  border:1px solid var(--kraft-line); border-bottom:0;
  border-radius:14px 12px 0 0;
  background:var(--kraft-tab); text-decoration:none; color:var(--kraft-ink);
}
/* 沒選到的頁籤整張壓下去（底色更暗、文字轉灰、圖示去色），
   選到的那一張才是亮的、有顏色的——差距要一眼看得出來（2026-09-14）。 */
/* 線條圖示：一律 1em，跟著旁邊的字縮放。⚠️ 不要在 HTML 裡寫死 width／height。 */
.ico{width:1em; height:1em; display:block; flex:0 0 auto}
/* ⚠️ 換成線條圖示之後不要再用 grayscale——圖示本來就吃 currentColor，
   跟著頁籤的文字色走。以前 emoji 只能整顆去色再調到 .5，調完就看不清是什麼。 */
.nav a .ic{opacity:.72}
/* ⚠️ 只有「有游標」的裝置才給 hover。觸控螢幕沒有「停在上面」這回事——
   點過的那一顆會一直停在 hover 的樣子，看起來像還被按著（2026-09-18 平板健檢）。 */
@media (hover:hover){
  .nav a:hover{background:var(--kraft-hover); color:var(--ink2)}
  .nav a:hover .ic{opacity:.95}
}
/* 跟整張頁同色＝連成一體；下緣多墊 1px 把底線蓋掉。
   顏色是這一頁的代表色（--pg-sheet / --pg-ink，見 applyTint）。 */
/* ⚠️ 只有選到的那一張往下壓 1px，蓋掉紙張上緣的線＝側標翻進內容。
   沒選到的貼齊就好，不然那條線會被每一張頁籤咬掉一段。 */
.nav a.on{
  background:var(--pg-sheet); color:var(--pg-ink); border-color:var(--pg-line);
  z-index:1; margin-bottom:-1px; padding-bottom:calc(9px * var(--nav-k)); font-weight:700;
  box-shadow:0 -2px 6px rgba(var(--shade),.08);
}
/* 選到的那一張上緣多一條這一頁的顏色——像資料夾上那張標籤貼紙 */
.nav a.on::before{
  content:''; position:absolute; left:10px; right:10px; top:-1px; height:3px;
  border-radius:99px; background:var(--pg-ink); opacity:.55;
}
.nav a.on .ic{opacity:1}
.nav .ic{font-size:calc(22px * var(--nav-k)); line-height:1.1; flex:0 0 auto; display:flex}
/* ⚠️ emoji 的字面比線條圖小一圈，字級要補回來，切換時大小才不會跳。 */
.nav .ic.em{font-size:calc(20px * var(--nav-k)); line-height:1.25}
.nav.stack .ic.em{font-size:calc(21px * var(--nav-k))}
.nav.mini .ic.em{font-size:calc(25px * var(--nav-k))}
/* 分組之間插一條細線（「每天記錄／課程／設定」橫排時塞標題反而亂） */
.nav .nsep{flex:0 0 1px; width:1px; background:var(--line2); margin:6px 3px}
/* 中文在上、英文在下，兩行都置中。中文四個字、字距 .12em，
   英文字級由 fitNavEn() 算（上限 15px、下限 13px）。
   ⚠️ 不要寫死寬度或英文字級——換標籤、換字級都會自己重算。 */
.nav .lb{min-width:0; text-align:left}
.nav .lb .z,.nav .lb .e{display:block; white-space:nowrap}
.nav .lb .z{
  font-size:calc(15.5px * var(--nav-k)); font-weight:700; line-height:1.25;
  letter-spacing:.1em; margin-right:-.1em;      /* 最後一個字後面那格要扣掉 */
}
.nav .lb .e{
  font-size:calc(var(--nav-en, 14px) * var(--nav-k)); font-weight:500; color:inherit; opacity:.8;
  line-height:1.3; letter-spacing:.01em;
}
.nav a.on .lb .e{color:var(--pg-ink); font-weight:700; opacity:.95}
/* ⚠️ 沒選到的那幾張，英文不要再打八折（2026-10-05 健檢）：頁籤的字本來就是壓下去的顏色，
   再乘 .8 只剩 3.8。層次靠字級（英文比中文小一號）就夠了。 */
.nav a:not(.on) .lb .e{opacity:1}
/* ── 導覽的三種排法 ────────────────────────────────────────────
   同一條側標要塞得進 27 吋螢幕，也要塞得進平板橫著拿的 1024。
   以前中間那一段（901–1210）是「放不下就自己橫向捲」，結果最後一兩張側標
   被切在畫面外（2026-09-17 他用平板拍給我看的就是這個）。
   現在由 fitNav() 從寬到窄試三種排法，第一個放得下的就用：
     1. 並排　圖示在左、中英文在右（原本的樣子）
     2. 疊排　圖示在上、中英文在下，省掉圖示橫向佔的那一截
     3. 最省　疊排 ＋ 英文收起來、圖示放大當辨識點（手機一直是這一種）
   每一種再乘上 --nav-k，所以縮的過程是連續的，不會「跳一階」。
   ⚠️ 不要再用寬度斷點去切換這三種——側標的寬度是文字量決定的，
      換一組標籤（或使用者調大系統字級）斷點就不對了，量出來的才準。 */
.nav.stack a{
  flex-direction:column; gap:calc(1px * var(--nav-k));
  padding:calc(5px * var(--nav-k)) calc(9px * var(--nav-k)) calc(7px * var(--nav-k));
}
.nav.stack a.on{padding-bottom:calc(8px * var(--nav-k))}
.nav.stack .ic{font-size:calc(22px * var(--nav-k)); line-height:1.05}
.nav.stack .lb{text-align:center}
.nav.stack .lb .z{letter-spacing:.04em; margin-right:-.04em}
/* 最省的那一種＝手機一直以來的樣子，數字跟改版前的 @media (max-width:900px) 一樣，
   手機上看起來要一模一樣（2026-09-18 改版時對過） */
.nav.mini{gap:calc(5px * var(--nav-k)); padding-top:6px}
/* 2026-09-20 整條壓扁一點：頁籤本來 66px 高，捲動時一直佔著。 */
.nav.mini a{
  gap:calc(1px * var(--nav-k));
  padding:calc(6px * var(--nav-k)) calc(6px * var(--nav-k)) calc(7px * var(--nav-k));
}
.nav.mini a.on{padding-bottom:calc(8px * var(--nav-k))}
.nav.mini .ic{font-size:calc(27px * var(--nav-k)); margin-bottom:calc(1px * var(--nav-k))}
.nav.mini .lb .e{display:none}
.nav.mini .lb .z{font-size:calc(14px * var(--nav-k))}
.nav.mini .nsep{display:none}
/* 並排 ＋ 英文收起來：圖示在左、四個中文在右。手機預設就是這一種。
   ⚠️ 上面那些 .nav.mini 的數字是給「疊排」用的（gap 1px、圖示 27px），
   並排要自己一組，不然圖示會貼著字、還大得不成比例。
   ⚠️ 這個模式叫 side 不叫 row——`.row` 是整個網站共用的通用類（帶 flex-wrap:wrap），
   名字撞到的話側標會折成兩行，而且 fitNav 量不出來（折行之後 scrollWidth
   永遠等於 clientWidth，它會以為放得下）。踩過一次。 */
.nav.side.mini a{
  flex-direction:row; gap:calc(8px * var(--nav-k));
  /* ⚠️ 左 8、右 10 是**視覺置中**，不是打錯。
     量出來的左右空白本來就一樣大（13.8 / 13.2），但線條圖示的墨只佔 21px 方框的
     中間約 17px，左邊等於多兩格空白，看起來就偏右（2026-09-20 他圈的）。
     整組往左挪 1px，圖示的「墨」和文字的「墨」到兩邊才一樣遠。
     ⚠️ 以後換圖示（換成填滿型的、或改線寬）要重看一次這兩個數字。 */
  padding:calc(9px * var(--nav-k)) calc(10px * var(--nav-k)) calc(10px * var(--nav-k))
          calc(8px * var(--nav-k));
}
/* 一疊卡的前後關係（2026-09-20 他要的「前後頁的空間感」）：
   ⚠️ 三件事一起做才有立體感，少一件就只是三張並排的卡：
     1. 互相**重疊** 9px（gap 改成 0，用負 margin 疊上去）
     2. 每張往左邊投一道影子，壓在前一張上面
     3. 沒選到的**上緣低 3px**（padding-top 少 3），等於整張往後退一階
   選到的那一張 z-index 拉到最上面，蓋掉左右兩邊的影子和邊線。
   ⚠️ 疊的順序靠 DOM 先後（後面的蓋前面的），所以影子一律往**左**投。 */
.nav.side.mini{gap:0}
.nav.side.mini a{
  position:relative; margin-right:calc(-9px * var(--nav-k));
  padding-top:calc(6px * var(--nav-k));
  box-shadow:3px 0 7px rgba(var(--shade),.13);     /* 影子往**右**投，壓在下一張上面 */
}
.nav.side.mini a:last-child{margin-right:0}
/* ⚠️ 由左到右往下疊：左邊那張在最上面，右邊每一張都塞到前一張底下。
   靠 z-index 由大到小排，不能靠 DOM 先後（那樣會變成右邊蓋左邊）。
   ⚠️ 用 nth-of-type 不是 nth-child——側標之間還夾著分組線 .nsep，
      手機上它是 display:none，但 nth-child 照樣把它算成一格。
   每往右一張再低 2px，像一疊卡往右下角散開；選到的那張永遠站回最高、最前面。 */
.nav.side.mini a:nth-of-type(1){z-index:6}
.nav.side.mini a:nth-of-type(2){z-index:5; padding-top:calc(8px * var(--nav-k))}
.nav.side.mini a:nth-of-type(3){z-index:4; padding-top:calc(10px * var(--nav-k))}
.nav.side.mini a:nth-of-type(4){z-index:3; padding-top:calc(12px * var(--nav-k))}
.nav.side.mini a:nth-of-type(5){z-index:2; padding-top:calc(14px * var(--nav-k))}
.nav.side.mini a:nth-of-type(n+6){z-index:1; padding-top:calc(16px * var(--nav-k))}
.nav.side.mini a.on{
  z-index:9; padding-top:calc(9px * var(--nav-k)); padding-bottom:calc(11px * var(--nav-k));
  box-shadow:-4px 0 10px rgba(var(--shade),.16), 4px 0 10px rgba(var(--shade),.16),
             0 -2px 6px rgba(var(--shade),.08);
}
.nav.side.mini .ic{font-size:calc(21px * var(--nav-k))}
.nav.side.mini .ic.em{font-size:calc(19px * var(--nav-k))}
.nav.side.mini .lb{text-align:left}
.nav.side.mini .lb .z{font-size:calc(15px * var(--nav-k)); letter-spacing:.04em; margin-right:-.04em}
/* 頁尾的水彩插圖（本來在側欄最下面）。
   ⚠️ 插圖要左右**鋪滿整頁**，而且兩側不能有生硬的切邊
   （2026-09-14 他畫了兩條線指出來）。做法：橫向平鋪填滿，
   再用左右淡出的遮罩把兩端化掉；上緣同樣淡入，不要一刀切。 */
.foot{
  margin-top:auto; padding:22px 0 0; text-align:center;
  background:linear-gradient(180deg,rgba(255,253,246,0),#fdf4e4);
  -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,0) 0, #000 62px);
  mask-image:linear-gradient(180deg, rgba(0,0,0,0) 0, #000 62px);
}
/* 手寫字上面那條水彩顏料盤，左右鋪滿、兩端淡出 */
.foot .strip{
  height:34px; margin-bottom:10px;
  background:var(--art-strip, none) center bottom / auto 100% repeat-x;
  -webkit-mask-image:linear-gradient(90deg, rgba(0,0,0,0) 0, #000 18%, #000 82%, rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(90deg, rgba(0,0,0,0) 0, #000 18%, #000 82%, rgba(0,0,0,0) 100%);
}
/* 最下面那排彩色鉛筆，同樣鋪滿並淡出 */
.foot .pencils{
  height:104px; margin-top:14px;
  background:var(--art-pencils, none) center bottom / auto 100% repeat-x;
  -webkit-mask-image:linear-gradient(90deg, rgba(0,0,0,0) 0, #000 16%, #000 84%, rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(90deg, rgba(0,0,0,0) 0, #000 16%, #000 84%, rgba(0,0,0,0) 100%);
}
.foot .q{font-family:"Caveat",cursive; font-size:26px; line-height:1.18; color:#a8562f}
.foot .q b{color:var(--grn)}
.foot .q .hb{color:#c2603f}
.foot .p{margin-top:6px; font-size:13px; line-height:1.5; color:var(--muted); font-style:italic}

/* ── 內容區 ─────────────────────────────────────────────── */
/* 內容區給一個上限並置中。沒有上限的話，27 吋螢幕上每張卡片都被拉到一千六百多像素，
   欄位之間、表格右邊全是空的。置中之後左右留白是對稱的，看起來是刻意的留白而不是缺角。
   1400 以下（含他自己的螢幕）完全不受影響。 */
/* ⚠️ width:100% 不能省。.main 是 flex column，flex 項目一旦有 margin:auto
   就不會被拉伸，會縮成內容寬度（整頁被擠成一條，我踩過）。 */
/* 導覽移到上面之後整頁都是內容，上限跟著放寬（1400 → 1600）。 */
.wrap{padding:16px var(--pad) 40px; width:100%; max-width:1600px; margin:0 auto}

/* ── Hero 橫幅 ──────────────────────────────────────────── */
.hero{
  border-radius:20px 16px 20px 16px; padding:28px 32px; margin-bottom:18px; min-height:238px;
  border:1px solid var(--line); box-shadow:var(--shadow);
  /* 右半邊收成米白紙色，跟插圖本身的水彩紙接得起來，才不會出現一條界線。
     左上是葉綠、左下是麥黃的水彩暈——顏色改成調色盤上的四個藝術色，
     不再是原來的粉紅＋薄荷（那兩個在暖白紙上會發冷）。 */
  background:
    radial-gradient(620px 260px at 4% 14%, #e6f0dd 0%, rgba(230,240,221,0) 60%),
    radial-gradient(560px 240px at 24% 104%, #fbf0d3 0%, rgba(251,240,211,0) 62%),
    linear-gradient(103deg,#fffdf8 0%, #fffcf3 50%, #fdf6e8 100%);
  position:relative; overflow:hidden;
}
/* 左上角一段紙膠帶。⚠️ 橫幅是 overflow:hidden，所以它會被切在邊上——
   那正是要的樣子（膠帶貼過紙的邊緣）。手機上整條收掉，見最下面的媒體查詢。 */
.hero::before{
  content:''; position:absolute; left:-34px; top:12px; width:132px; height:24px;
  background:linear-gradient(180deg,rgba(245,214,111,.30),rgba(245,214,111,.58) 40%,rgba(245,214,111,.30));
  box-shadow:0 1px 2px rgba(var(--shade),.10);
  transform:rotate(-38deg); z-index:0; pointer-events:none;
}
.hero h1{font-family:"Caveat",cursive; font-size:42px; color:var(--grn); line-height:1.12}
/* 中文那半截改用手寫楷體——英文是 Caveat 的手寫，中文跟著走才是同一枝筆。 */
/* ⚠️ Caveat 要排在楷體前面。Caveat 沒有中文字，中文會自己掉到楷體；
   而首頁這一格放的是英文（"Teacher!"），排在前面才跟前半句同一枝筆。 */
.hero h1 .zh{
  font-family:"Caveat","LXGW WenKai TC","Noto Sans TC",sans-serif;
  color:var(--grn-d); font-size:.86em; font-weight:700; letter-spacing:.02em;
}
.hero .sub{
  margin-top:6px; font-size:21px; font-weight:700; color:#a8492f;
  font-family:"LXGW WenKai TC","Noto Sans TC",sans-serif;
}
.hero .lines{margin-top:10px; font-size:15px; color:var(--ink2)}
.hero .lines div+div{margin-top:2px}
/* 右邊那張水彩插圖：從藍圖裁下來的，定義在 Art.html。
   沒貼 Art.html 時 var() 拿不到值，整塊就不顯示，版面不會壞。 */
.hero .art{
  position:absolute; right:0; top:0; bottom:0; z-index:0;
  /* 用 aspect-ratio 讓這一塊剛好等於圖片本身的大小，
     遮罩才會跟圖片的左緣對齊——不然就會看到那一條界線。
     ⚠️ 這個比例要等於 Art.html 裡那張圖的比例。換圖就要跟著改，
     不然 background-size:cover 會把圖的上下或左右裁掉。 */
  aspect-ratio:2178 / 650; max-width:64%;
  background-image:var(--art-hero, none);
  background-size:cover; background-position:right center; background-repeat:no-repeat;
  /* ⚠️ 只在最左邊收一小段就收完（2026-09-19 換成小怪獸那張時改的）。
     舊的小畫家那張左半邊是空白水彩紙，所以淡出可以拉到 56% 都不心疼；
     小怪獸那張是四隻從左邊排到右邊，淡出拉長會把最左邊那隻粉紅的洗掉。
     圖本身的左緣是水彩暈開的，收這一小段就夠接上米白底，不會看到直切邊。 */
  /* 兩道遮罩相交：左緣收一小段，下緣也收一小段。
     下緣那道是因為視窗變窄、max-width 卡住時，插圖會比橫幅矮一截，
     不收的話會看到一條橫的直切邊（2026-09-19 在成果頁量到的，兩頁用同一組值）。 */
  -webkit-mask-image:linear-gradient(to right,
      transparent 0%, rgba(0,0,0,.8) 4%, #000 8%),
    linear-gradient(to bottom, #000 78%, transparent 100%);
          mask-image:linear-gradient(to right,
      transparent 0%, rgba(0,0,0,.8) 4%, #000 8%),
    linear-gradient(to bottom, #000 78%, transparent 100%);
  -webkit-mask-composite:source-in; mask-composite:intersect;
  pointer-events:none;
}
/* 插圖不再淡進文字底下，所以文字要自己讓開，別壓到最左邊那隻怪獸。 */
.hero h1,.hero .sub,.hero .lines{position:relative; z-index:1; max-width:41%}
/* 視窗變窄時插圖跟著縮，不然標題會壓到怪獸臉上 */
@media (max-width:1440px){
  .hero{min-height:212px}
  .hero .art{max-width:58%}
  .hero h1{font-size:36px}
}
@media (max-width:1180px){
  .hero .art{display:none}
  .hero h1,.hero .sub,.hero .lines{max-width:100%}
}
/* 內頁的壓扁版：標題和中文說明並排成一行，插圖只留右邊一條。
   每一頁都先看一張 238px 的圖，等於每次都要先滑過去才看得到要動的東西。 */
/* 壓扁版的尺寸調過兩次：238px 太占位、66px 又太小。
   現在是 ~96px——標題還是一眼看得到，但不必先滑過一張大圖。 */
.hero.slim{
  min-height:0; padding:20px 28px; margin-bottom:16px;
  display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
}
.hero.slim h1{font-size:36px}
.hero.slim .sub{margin-top:0; font-size:18px}
.hero.slim .art{max-width:34%; opacity:.92}
@media (max-width:1180px){ .hero.slim .art{display:none} }

/* ── 卡片 ───────────────────────────────────────────────── */
/* ⚠️ 四角的圓角刻意各差一兩像素（15/13/16/12）——這是「手裁的紙」跟
   「系統元件」的差別，但差距要小到讀的時候不會發現，只會覺得沒那麼硬。 */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:15px 13px 16px 12px;
  box-shadow:var(--shadow); padding:16px 18px; margin-bottom:16px;
}
.card>h3{
  display:flex; align-items:center; gap:9px; font-size:17px; margin-bottom:12px;
  padding-bottom:10px; border-bottom:1px solid var(--line2); flex-wrap:wrap;
}
.card>h3 .en2{font-size:15px; color:var(--muted); font-weight:500; white-space:nowrap}
.card>h3 .right{margin-left:auto; font-size:14px; font-weight:500; white-space:nowrap}
.grid{display:grid; gap:16px}
/* ⚠️ 一律 minmax(0,1fr)，不要只寫 1fr。`1fr` 的下限是「內容最小寬度」，
   裡面只要有一顆 white-space:nowrap 的按鈕，整個格線就會撐破卡片跑到外面
   （2026-09-14 快速操作那四顆就是這樣跑出框：欄寬 302，內容 346）。 */
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
/* 欄數自己算：放得下就並排，放不下就自動變一欄。
   側欄（340px）那種窄容器要用這個，不要寫死欄數。
   min(100%,…) 是給更窄的手機用的，否則容器比 180 還窄時一樣會爆出去。 */
.auto{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.cols{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start}
/* 首頁例外：右欄的寬度用上面那排統計卡（.g5 五欄、gap 16）的尺寸去算。
   ⚠️ 這條要寫在下面那個 media query 之前沒有用——它的權重比 .cols 高，
   所以窄畫面那一條也得把 .cols-home 一起寫進去。
   一開始是「剛好一欄」，但本週重點和最近札記太窄、單元名一直折行，
   2026-09-15 他要求改成 **1.5 欄**：分欄線落在第四張統計卡的正中間。 */
.cols.cols-home{grid-template-columns:minmax(0,1fr) calc((100% - 64px) / 5 * 1.5 + 8px)}
@media (max-width:1280px){
  .cols,.cols.cols-home{grid-template-columns:1fr}
  .g5{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:980px){ .g5,.g4{grid-template-columns:repeat(2,1fr)} }
@media (max-width:700px){
  .g5,.g4,.g2{grid-template-columns:1fr}
}

/* 數字統計卡 */
.stat{
  background:var(--card); border:1px solid var(--line); border-radius:15px 12px 16px 13px;
  box-shadow:var(--shadow); padding:15px 17px;
}
/* 數字本來自己一行，右邊空掉一大半、卡片又高（2026-09-15 他圈的）。
   改成跟標題同一列、靠右對齊：一張卡就一行，整列鋪滿，高度也少了四十幾像素。
   ⚠️ 數字要 nowrap，標題那一欄才是唯一會折行的地方。 */
.stat .h{display:flex; align-items:center; gap:11px; min-height:46px}
.stat .ic{
  /* 像一塊蓋上去的色票：四角不一樣、歪兩度半 */
  width:42px; height:42px; flex:0 0 42px; border-radius:13px 10px 14px 9px;
  display:grid; place-items:center; font-size:21px; transform:rotate(-2.5deg);
}
.stat .tx{min-width:0}
.stat .e{font-size:13.5px; color:var(--ink2); font-weight:500; line-height:1.35}
.stat .z{font-size:15px; font-weight:700; line-height:1.35}
.stat .n{
  margin-left:auto; font-size:30px; font-weight:700; line-height:1.1; white-space:nowrap;
}
.stat .n small{font-size:14px; font-weight:500; color:var(--muted); margin-left:3px}

/* ── 班級／單元配色 ─────────────────────────────────────── */
/* 十三色，一個年級九個班也夠分。
   每一組的文字對底色都在 5:1 以上（最低 5.06），調色時先算對比再改。 */
.c-pink  {background:#fde7ef; color:#b22c62}
.c-coral {background:#fdeae3; color:#af3f29}
.c-orange{background:#fcefd8; color:#8f5406}
.c-yellow{background:#fbf3d4; color:#7f6200}
.c-lime  {background:#eff7da; color:#4a7011}
.c-green {background:#e2f6ea; color:#1d7348}
.c-teal  {background:#ddf2f7; color:#0e6d80}
.c-blue  {background:#e3f0fd; color:#1a64bf}
.c-indigo{background:#dde1f9; color:#3a4aa8}
.c-purple{background:#e7dcfa; color:#6335c0}
.c-violet{background:#fadff2; color:#a0308f}
.c-brown {background:#efe3d1; color:#74512f}
.c-gray  {background:#e4eaf0; color:#4f5a65}

/* 只要文字顏色、不要底色。
   ⚠️ 彩色方塊**不能**直接坐在頁面的底色上——每一頁的底色本身就是一個色名，
   量過十三個班級色 × 八個頁面色有三十幾組 ΔE 不到 10，一定會糊在一起
   （2026-09-15 他先後圈了手機的 202 和進度檢核的 203）。
   規則：要嘛把方塊排在白底上，要嘛就用這一組——白底＋深色字＋一條同色的槓。 */
.k-pink  {color:#b22c62} .k-coral {color:#af3f29} .k-orange{color:#8f5406}
.k-yellow{color:#7f6200} .k-lime  {color:#4a7011} .k-green {color:#1d7348}
.k-teal  {color:#0e6d80} .k-blue  {color:#1a64bf} .k-indigo{color:#3a4aa8}
.k-purple{color:#6335c0} .k-violet{color:#a0308f} .k-brown {color:#74512f}
.k-gray  {color:#4f5a65}

/* ── 課表 ───────────────────────────────────────────────── */
table{border-collapse:collapse; width:100%}
.tt th,.tt td{border:1px solid var(--line); padding:7px; text-align:center}
.tt th{background:#f6efdd; font-size:14px; font-weight:700; color:var(--ink2)}
.tt td.tm{background:#fdfaf0; font-size:14px; color:var(--ink2); white-space:nowrap; width:120px}
.tt td.brk{background:#fdf6ec; color:#8a6d3b; font-size:14px; font-weight:700; letter-spacing:2px}
.tt td.tm b{display:block; font-size:15px; color:var(--ink)}
.slot{
  border-radius:10px; padding:8px 6px; min-height:52px;
  display:flex; flex-direction:column; justify-content:center; gap:2px;
  cursor:pointer; border:1px solid transparent;
}
.slot .cn{font-size:18px; font-weight:700}
.slot .un{font-size:13px; line-height:1.35}
.slot.empty{color:#8e8877; background:#fbf8ed; font-size:18px}
@media (hover:hover){
  .slot:hover{border-color:var(--grn); }
}
.tt.ro .slot{cursor:default}
@media (hover:hover){
  .tt.ro .slot:hover{border-color:transparent}
}

/* 手機版課表：一次一天，垂直排，不用橫向捲 */
.tt-days{display:flex; gap:6px; margin-bottom:10px}
.tt-days button{
  flex:1 1 0; min-width:0; padding:9px 2px; border-radius:12px; cursor:pointer;
  border:1px solid var(--line); background:#fffdf6; font-size:15px; font-weight:700;
}
.tt-days button small{display:block; font-size:13px; font-weight:500; color:var(--muted)}
.tt-days button.on{background:var(--grn); border-color:var(--grn); color:#fff}
.tt-days button.on small{color:rgba(255,255,255,.88)}
.tt-list{display:flex; flex-direction:column; gap:6px}
.tt-r{
  display:flex; align-items:center; gap:10px; padding:7px 9px;
  border:1px solid var(--line2); border-radius:12px; background:#fffdf6;
}
.tt-r .tm{flex:0 0 104px; font-size:13px; color:var(--muted); line-height:1.45}
.tt-r .tm b{display:block; font-size:15px; color:var(--ink); font-weight:700}
.tt-r .cell{flex:1; min-width:0}
/* 手機課表一列只排一個班，格子很寬，靠左就浮在左邊了。置中、字放大。
   桌機的課表格子很窄，不套這一條（選擇器限定在 .tt-r 底下）。 */
.tt-r .cell .slot{min-height:54px; align-items:center; text-align:center}
.tt-r .cell .slot .cn{font-size:24px; line-height:1.2}
.tt-r .cell .slot.empty{font-size:20px}
.tt-r.brk{background:#fdf6ec; border-color:#f0e2c8}
.tt-r.brk .nm{flex:1; text-align:center; font-weight:700; color:#8a6d3b; letter-spacing:3px}

/* ── 進度狀態 ───────────────────────────────────────────── */
.st-just  {background:#efeade; color:#55604d}
.st-half  {background:#fdf2d6; color:#8a5d00}
.st-almost{background:#e4efdb; color:#1f6340}
.st-done  {background:#fde8ee; color:#b02a4c}
.badge{
  display:inline-block; padding:2px 11px; border-radius:999px;
  font-size:14px; font-weight:700; white-space:nowrap;
}
.dot{
  width:26px; height:26px; border-radius:50%; display:inline-grid; place-items:center;
  font-size:14px; font-weight:700; border:1px solid rgba(0,0,0,.06);
}
/* 記號畫得比字級大一點才填得滿圓圈，線也要粗一點才看得清楚 */
.dot .ico{width:1.35em; height:1.35em; stroke-width:2.2}

/* 四顆狀態選擇卡 */
/* 進度檢核的「狀態／課堂札記／缺席」三欄。
   ⚠️ 手機上這三欄硬排會把每一格壓到 50px 寬（進度檢核是 phoneHide，
   打網址還是進得去，所以不能不管），≤820 改成直的一欄。 */
.k3{grid-template-columns:minmax(0,2.3fr) minmax(0,1.2fr) 210px}
@media (max-width:820px){ .k3{grid-template-columns:1fr} }
/* 進度檢核最上面那一列：班級牌 ＋ 單元資訊。
   ⚠️ 不要寫死 230px（以前是寫在 vCheck 裡的 inline style，連媒體查詢都蓋不掉）。
   手機上 230px 一吃掉，右邊只剩九十幾像素，「A Mysterious Creature」被壓成
   一行兩三個字（2026-09-15 健檢量到的）。這一頁手機導覽雖然沒放，
   但網址帶著 #check 還是進得去，所以不能不管。
   班級牌改成可以縮的 minmax，窄畫面直接上下排。 */
.k-head{
  display:grid; gap:16px; margin-bottom:16px;
  grid-template-columns:minmax(150px,230px) minmax(0,1fr);
}
@media (max-width:820px){ .k-head{grid-template-columns:minmax(0,1fr)} }
/* ⚠️ 排 2×2，不要一列四顆。這張卡只有 790px，四顆並排每顆剩 185px，
   「一半 Halfway Through 持續創作中」一定折成三行、右邊還空一塊
   （2026-09-15 他圈的）。兩顆一列各 385px，中英文和說明排得開。 */
.picks{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
@media (max-width:560px){ .picks{grid-template-columns:minmax(0,1fr)} }
/* 中文在前、英文接在後面、說明再接下去——本來英文一行、中文一行、說明一行，
   一顆按鈕三行高，右邊還空一大塊（2026-09-15 他圈的）。 */
.pick{
  border:2px solid var(--line); border-radius:13px; padding:11px 13px;
  cursor:pointer; background:#fffdf6; text-align:left;
}
@media (hover:hover){
  .pick:hover{border-color:#d6c9ac}
}
.pick .h{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.pick .dot{flex:0 0 26px; align-self:center}
.pick .e{font-size:13px; color:var(--muted); font-weight:500}
.pick .z{font-size:17px; font-weight:700}
.pick .d{margin-top:3px; font-size:13px; color:var(--muted)}
.pick.on{border-color:currentColor}
.pick.on .z{color:inherit}

/* ── 表單元件 ───────────────────────────────────────────── */
.field{display:flex; flex-direction:column; gap:5px}
.field>label{font-size:14px; font-weight:700; color:var(--ink2)}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%; padding:9px 12px; border:1px solid #ddd2ba; border-radius:10px;
  background:#fffdf6; outline:0;
}
input:focus,select:focus,textarea:focus{border-color:var(--grn); box-shadow:0 0 0 3px rgba(40,90,74,.16)}
textarea{min-height:92px; resize:vertical; line-height:1.7}
/* ⚠️ 這個顏色不能太深。#7b7463 跟正文的 --muted #636e67 只差一點，
   空白的「缺席座號」看起來就像真的記了號碼（2026-09-20 他就是這樣被騙到）。 */
::placeholder{color:#a0977f}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 18px; border-radius:11px; border:1px solid transparent;
  background:var(--grn); color:#fff; font-weight:700; cursor:pointer;
  text-decoration:none; white-space:nowrap;
}
@media (hover:hover){
  .btn:hover{filter:brightness(1.07)}
}
.btn:disabled{opacity:.55; cursor:default; filter:none}
.btn.ghost{background:#fffdf6; color:var(--ink); border-color:#ddd2ba}
@media (hover:hover){
  .btn.ghost:hover{background:#f6f0e0; filter:none}
}
.btn.green{background:#2c6b48}
.btn.pink{background:#b13048}
/* 相機那顆（快速記錄）本來是紫的，換成調色盤上的赤陶色 */
.btn.purple{background:#b2432c}
.btn.sm{padding:6px 13px; font-size:14px; border-radius:9px}
.btn.lg{padding:15px 18px; font-size:16px; border-radius:13px; flex-direction:column; gap:3px}
.btn.lg .z{font-size:17px}
.btn.lg .e{font-size:13px; font-weight:500}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end}
.row>.field{flex:1 1 180px; min-width:0}

/* ⚠️ 欄位一律要有寬度上限，而且上限要加在 .field 容器上，不是加在 input／select 上。
   加在控制項上的話容器還是會被撐開，欄位與欄位之間就空出一大塊——
   我第一次就是這樣改錯的。沒有上限則更糟：量過資源頁的說明欄在 1920 下被撐到 1591px，
   一個空的文字框橫在那裡，就是「看起來很空」最主要的來源。
   之後新增欄位請沿用這個規則。 */
#views .field{max-width:520px}
#views .field.wide{max-width:760px}          /* 多行輸入本來就該寬一點 */
.qk .field{max-width:none}                   /* 快速記錄是手機優先的單欄版面，刻意滿版 */

/* ── 列表 ───────────────────────────────────────────────── */
.list{display:flex; flex-direction:column}
.list .it{
  display:flex; align-items:center; gap:12px; padding:11px 4px;
  border-bottom:1px solid var(--line2);
}
.list .it:last-child{border-bottom:0}
.list .it .tx{min-width:0; flex:1}
.list .it .tx .a{font-weight:700}
.list .it .tx .b{font-size:14px; color:var(--muted)}
/* 表格一律填滿卡片。
   試過 max-width:max-content 讓它縮到自然寬度，結果表頭有底色，
   縮完就在卡片裡留出一條邊界明顯的缺口——那比「最後一欄偏寬」更難看。
   要收的是欄位本身（見下面 #cBody 的備註上限），不是整張表。 */
.tb{width:100%; font-size:15px}
.tb th{
  text-align:left; font-size:14px; color:var(--ink2); font-weight:700;
  padding:9px 10px; background:#f6efdd; border-bottom:1px solid var(--line);
  white-space:nowrap;
}
.tb td{padding:9px 10px; border-bottom:1px solid var(--line2); vertical-align:middle}
/* 單元名是「英文 ＋ 中文」，擠在一個窄欄裡會從中間折成兩行、看起來像兩個名字
   （2026-09-15 他圈的）。改成刻意分兩行：英文在上、中文在下，欄位也放寬。 */
/* 節次時間那張表。
   ⚠️ 表頭要對齊的是**框裡的字**，不是框的左緣（2026-09-19 他圈的）——
   input 自己有 1px 框線＋12px 內距，所以表頭在 td 的 10px 之外再補 13px。
   ⚠️ 上限加在**表格**上，不要加在 input 上：加在 input 上格子還是被撐開，
   兩個時間框中間反而空出一大塊（這一輪試過，就是那個樣子）。
   版面收成一欄時（≤1100px）這張表本來會被拉到整頁寬、時間框長到 543px。 */
.per-tb{max-width:430px}
.per-tb th:nth-child(2),.per-tb th:nth-child(3){padding-left:23px}
.tb .u-cell{line-height:1.45}
.tb .u-cell .e{display:block; font-size:14px; color:var(--ink2)}
.tb .u-cell .z{display:block; font-size:15px; font-weight:700}
/* 班級有九列，用一般列高整張卡就 774px。這裡壓緊一點，看起來才不會那麼佔版面。
   備註平常是空的，單欄版面下會被撐到 550px 寬——一個空的大框特別顯眼，所以設上限。 */
#cBody td{padding:5px 10px}
#cBody input,#cBody select{padding:7px 11px}
#cBody [data-c="note"]{max-width:380px}
@media (hover:hover){
  .tb tr:hover td{background:#fdf9ec}
}
.scroll-x{overflow-x:auto}
.empty-note{padding:26px 10px; text-align:center; color:var(--muted)}

/* ── 照片 ───────────────────────────────────────────────── */
.photos{display:grid; grid-template-columns:repeat(auto-fill,minmax(126px,1fr)); gap:12px}
/* 作品加一圈白色裱框（照片是內容，框是紙）。
   ⚠️ border 要用白色、外面再用 box-shadow 描一條暖線——直接把邊框調粗會變成
   一個粗框框住照片，而不是「裱起來」。全站 box-sizing:border-box，所以
   aspect-ratio 1/1 仍然是整格的比例，版面不會被撐開。 */
.ph{
  border:4px solid #fffdf6; border-radius:12px; overflow:hidden; background:#f4efe1;
  box-shadow:0 0 0 1px var(--line), 0 2px 7px rgba(var(--shade),.12);
  position:relative; aspect-ratio:1/1;
}
.ph img{width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in}
.ph .x{
  position:absolute; right:6px; top:6px; width:28px; height:28px; border-radius:50%;
  border:0; background:rgba(255,255,255,.94); color:var(--red); cursor:pointer;
  font-size:16px; font-weight:700; line-height:1; box-shadow:0 1px 4px rgba(0,0,0,.2);
}
.ph .cap{
  position:absolute; left:0; right:0; bottom:0; padding:4px 7px;
  background:rgba(32,40,34,.68); color:#fff; font-size:13px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ph.add{
  display:grid; place-items:center; cursor:pointer; border-style:dashed;
  border-color:#d0c3a4; color:var(--grn-d); background:#fbf7ea;
}
.ph.add div{text-align:center; font-size:14px; font-weight:700}
.ph.add div span{display:block; font-size:26px; font-weight:400}

/* ── 單元卡 ─────────────────────────────────────────────── */
.unit{background:#fffdf6; border:1px solid var(--line); border-radius:var(--r);
      box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column;
      padding:13px 15px 14px}
/* ── 同一列的卡，內部每一段都要切齊 ─────────────────────────
   說明文字有的一行、有的兩行，下面的「進度／班級／狀態」就會一張高一張低
   （量過：英文說明兩行的那張，進度列低了 21px）。
   靠 subgrid 把每張卡的段落掛到同一組列軌上，行數再怎麼不一樣都對得齊。
   ⚠️ .bd 是包在外面的一層，它自己也要是 subgrid，不然只對齊到 .bd 的上緣。 */
.units{grid-auto-rows:auto}
@supports (grid-template-rows:subgrid){
  /* 橫式卡：標題整排、左邊封面、右邊說明／進度／班級／狀態。
     每一段各佔外層一條列軌（subgrid），所以同一列的兩張卡段段切齊。
     ⚠️ row-gap:0 不能省——subgrid 預設沿用外層的 gap:16px，
     卡片內部每條線之間都會多出一道縫（量過：卡片從 447 變 527）。
     ⚠️ .bd 用 display:contents 讓它的四個孩子直接變成卡片的格子，
     不然只會對齊到 .bd 的上緣。 */
  .units>.unit{
    display:grid; grid-row:span 5; grid-template-rows:subgrid; row-gap:0;
    grid-template-columns:150px minmax(0,1fr); column-gap:15px;
  }
  .units>.unit>.hd{grid-column:1 / -1; grid-row:1}
  .units>.unit>.cover{grid-column:1; grid-row:2 / span 4; height:auto; min-height:126px; margin:0}
  .units>.unit>.bd{display:contents}
  .units>.unit .d1{grid-column:2; grid-row:2}
  .units>.unit .d2{grid-column:2; grid-row:3}
  .units>.unit .prog-line{grid-column:2; grid-row:4}
  .units>.unit .cls-grid{grid-column:2; grid-row:5}
}
/* 單欄（手機）時回到直的，封面本來就藏起來了 */
@media (max-width:700px){
  .units>.unit{grid-template-columns:minmax(0,1fr)}
  .units>.unit>.hd,.units>.unit .d1,.units>.unit .d2,
  .units>.unit .prog-line,.units>.unit .cls-grid{grid-column:1}
}
/* 瀏覽器太舊沒有 subgrid 時的退路：先替英文說明預留兩行 */
@supports not (grid-template-rows:subgrid){
  .unit .d2{min-height:3.2em}
}
.unit .hd{display:flex; align-items:center; gap:11px; padding:0 0 10px}
.unit .no{
  width:32px; height:32px; flex:0 0 32px; border-radius:11px 8px 12px 8px; display:grid;
  place-items:center; font-weight:700; font-size:17px; transform:rotate(-2deg);
}
/* 標題：英文和中文同一行，放不下才折。
   （以前是上下兩行＋預留兩行高度，中間會空一段；橫式卡有的是寬度，不需要了。） */
.unit .nm{min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 9px}
.unit .nm .e{font-size:16.5px; font-weight:700; line-height:1.3}
.unit .nm .z{font-size:16px; font-weight:700; color:var(--ink2); line-height:1.3}
/* 圖示要把這塊填起來——42px 的小圖擺在 150×126 的色塊中間，
   看起來就是一塊空的（2026-09-15 他圈的）。
   再加一層很淡的斜向漸層＋內圈細線，看起來才像一張封面，不是一塊色塊。 */
.unit .cover{
  height:104px; margin:0; border-radius:13px 10px 14px 9px; position:relative; overflow:hidden;
  display:grid; place-items:center; font-size:66px; line-height:1;
  background-image:linear-gradient(135deg, rgba(255,255,255,.75), rgba(255,255,255,0) 58%);
  box-shadow:inset 0 0 0 1px rgba(var(--shade),.08);
}
/* 上傳過封面就整塊鋪滿；沒有的話那一格還是圖示 */
.unit .cover img{width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in}

/* 編輯單元視窗裡的封面預覽 */
.cov-edit{display:flex; gap:12px; align-items:flex-start}
.cov-pv{
  flex:0 0 150px; width:150px; height:104px; border-radius:11px; overflow:hidden;
  display:grid; place-items:center; font-size:46px; line-height:1;
  box-shadow:inset 0 0 0 1px rgba(var(--shade),.08);
  background-image:linear-gradient(135deg, rgba(255,255,255,.75), rgba(255,255,255,0) 58%);
}
.cov-pv img{width:100%; height:100%; object-fit:cover; display:block}
.cov-act{min-width:0; flex:1 1 200px; display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start}
.cov-act .hint{flex:1 1 100%; margin-top:2px}
@media (max-width:560px){ .cov-edit{flex-direction:column} }
.unit .bd{padding:0}
.unit .d1{font-size:14px; font-weight:500}
.unit .d2{font-size:13px; color:var(--muted); line-height:1.6}
/* 「x 節/班」：進度條旁邊那個小字，不要被擠成兩行 */
.prog-line .lp,.refl .pg .lp{white-space:nowrap}
.bar{height:9px; border-radius:99px; background:#eae3d2; overflow:hidden; flex:1}
.bar i{display:block; height:100%; background:var(--grn); border-radius:99px}
.prog-line{display:flex; align-items:center; gap:10px; margin-top:11px; font-size:14px}
.cls-grid{margin-top:11px; display:grid; gap:4px}
/* ⚠️ 標籤欄 34px 不是隨便訂的：卡片變成四欄之後只剩 307px，
   九個班的格子要 232px，標籤留 40px 就差 1px 擠不下、整排折成兩行。 */
.cls-grid .r{display:grid; grid-template-columns:34px minmax(0,1fr); align-items:center; gap:4px}
.cls-grid .r .lb{font-size:13px; color:var(--muted)}
/* 班級與狀態兩排共用同一組欄——用 grid 而不是 flex，兩排就一定對得齊，
   而且會往右鋪開（橫式卡右邊本來空一大塊，2026-09-14 他圈的）。 */
.cls-grid .cells{
  display:grid; gap:5px; justify-content:start;
  /* ⚠️ 用 auto-fit 而不是 grid-auto-flow:column——欄排的話卡片一窄就擠爆
     （量到 205px 的欄位裡硬要塞 294px）。auto-fit 放不下會折行，
     而兩排的格子數與寬度一樣，折行的位置也一樣，所以照樣對得齊。 */
  /* 1fr＝把整行鋪滿，右邊不留空白（2026-09-14 他圈的）。
     auto-fit 會把多出來的空軌收掉，所以九個班就是九等分；
     下限 24px，卡片窄到排不下時才折行。 */
  grid-template-columns:repeat(auto-fit,minmax(24px,1fr));
}
.cls-grid .cells>*{text-align:center}
.cls-grid .cells .dot{width:24px; height:24px; font-size:13px; justify-self:center}
.cell-cls{font-size:13px; font-weight:700; border-radius:6px; padding:2px 0}

/* ── 單元省思卡（教學札記那一頁的重點）─────────────────────
   一個單元一張。欄數自己算，同一列的卡用 subgrid 對齊
   （標題、進度、省思、頁尾各自切齊，說明長短不一也不會一張高一張低）。 */
/* 一排兩張（2026-09-15 他指定）。一排四張時每張只有三百出頭，
   一則省思寫下來就變成又窄又長的一條。 */
.refls{
  display:grid; gap:14px; grid-auto-rows:auto;
  grid-template-columns:repeat(2,minmax(0,1fr));
}
@media (max-width:820px){ .refls{grid-template-columns:minmax(0,1fr)} }
@supports (grid-template-rows:subgrid){
  /* ⚠️ 卡片裡多一段（課堂札記）就要把 span 加一，不然最後一列會跑出格線外 */
  .refls>.refl{grid-row:span 5; grid-template-rows:subgrid; row-gap:0}
}
.refl{
  display:grid; background:#fffdf6; border:1px solid var(--line); border-radius:13px;
  padding:13px 15px 12px;
}
.refl .hd{display:flex; align-items:center; gap:11px}
.refl .no{
  width:30px; height:30px; flex:0 0 30px; border-radius:11px 8px 12px 8px; display:grid;
  place-items:center; font-weight:700; font-size:16px; transform:rotate(-2deg);
}
.refl .nm{min-width:0}
.refl .nm .e{font-size:15px; font-weight:700; line-height:1.35}
.refl .nm .z{font-size:15px; font-weight:700; color:var(--ink2)}
.refl .pg{display:flex; align-items:center; gap:9px; margin-top:10px; font-size:13px}
.refl .tx{
  margin-top:10px; font-size:15px; line-height:1.8; white-space:pre-wrap;
  word-break:break-word; align-self:start;
}
/* 還沒寫的那些也要看得出「這裡可以寫」，但不要跟寫過的搶注意力 */
.refl .tx.none{color:var(--muted); font-size:14px}
/* 這個單元的課堂札記，直接列在省思底下 */
.refl .rn{margin-top:11px; padding-top:9px; border-top:1px dashed var(--line); align-self:start}
.refl .rn.none{color:var(--muted); font-size:13px}
.refl .rn .lb{font-size:13px; font-weight:700; color:var(--ink2); margin-bottom:5px}
.refl .rn .r{
  display:flex; align-items:baseline; gap:7px; padding:3px 0; font-size:13.5px; line-height:1.6;
}
.refl .rn .r .d{flex:0 0 auto; color:var(--muted); font-size:12.5px}
.refl .rn .r .badge{flex:0 0 auto; font-size:12.5px; padding:1px 8px}
.refl .rn .r .t{min-width:0; color:var(--ink2)}
.refl .rn .more{margin-top:4px; font-size:12.5px; color:var(--muted)}
.refl .ft{
  display:flex; align-items:center; gap:10px; margin-top:11px;
  padding-top:10px; border-top:1px dashed var(--line); align-self:end;
}
.refl .ft .btn{margin-left:auto}
.refl.done{border-color:#d5e3c9; background:#f4f6ea}

/* ══ 快速記錄（手機在班上用的那一頁）════════════════════════
   全部都是大按鈕：站著拿手機、單手、可能還沾著顏料。
   最小觸控目標 44px，重要的按鈕更大。 */
.qk{max-width:760px; margin:0 auto}
.qk section{display:block; margin-bottom:13px}
.qk .lb{
  display:flex; align-items:baseline; gap:8px; margin-bottom:6px;
  font-size:16px; font-weight:700;
}
.qk .lb em{font-style:normal; font-size:14px; color:var(--muted); font-weight:500}
.qk .lb .n{margin-left:auto; font-size:14px; color:var(--muted); font-weight:500}

/* 班級全部排出來，不要橫向捲——一眼就要看得到哪幾班記過了 */
.qk-row{
  display:grid; gap:9px; padding:11px;
  grid-template-columns:repeat(auto-fill, minmax(72px, 1fr));
}
/* ⚠️ 班級牌一定要排在白底上。整頁的底色是那一頁的代表色（--pg-sheet），
   班級牌的底色是班級的代表色——兩邊撞到同一色系時整格就消失了
   （2026-09-15 他圈的：快速記錄是藍頁，202 是藍班，看不到）。
   十三個班級色都是照白底算的對比，鋪一張白紙在下面，每一色就都站得住。 */
.qk-row,.qk-route{
  background:#fffdf6; border:1px solid var(--line); border-radius:18px;
}
/* 班級牌上只有三個數字。⚠️ 不要再加第二行小字——他的班全是二年級，
   「二年級」寫九次佔掉的高度比它說的事情多（2026-09-20 他要求拿掉）。
   ⚠️ 高度改用 min-height 撐住，不要靠第二行的字撐——不然沒有字的時候整排會塌。 */
.qk-cls{
  position:relative; min-width:0; padding:9px 6px; border-radius:15px;
  display:flex; align-items:center; justify-content:center;
  border:1.5px solid rgba(var(--shade),.10); text-align:center; cursor:pointer;
  font-size:24px; font-weight:700; line-height:1.1;
  font-variant-numeric:tabular-nums; letter-spacing:.01em;
}
/* 52＝手指按得到的下限再多一點點。⚠️ 不要再往下壓，34 是可點的底線。 */
.qk-row .qk-cls{min-height:52px}
.qk-cls.on{border-width:2px; border-color:currentColor; box-shadow:0 3px 10px rgba(var(--shade),.16)}
/* 今天記過了＝一顆白勾墊在深綠底上，十三個班級色底下都看得到。
   ⚠️ 班級牌和「今天的課」共用同一顆，整頁只有一種「記過了」的記號。 */
.qk .tick{
  display:grid; place-items:center; border-radius:50%;
  width:19px; height:19px; font-size:12px; color:#fff;
  background:var(--grn); box-shadow:0 1px 3px rgba(var(--shade),.22);
}
.qk .tick .ico{stroke-width:2.6}
.qk-cls .tick{position:absolute; top:5px; right:5px}
/* 今天的課：「已記」接在班級號碼後面，做成班級色的實心小印章。
   ⚠️ 字要寫在裡面那顆 <b> 上。background:currentColor 取的是**這個元素自己的**
   文字色，直接在同一層寫 color:#fff 的話底色也會跟著變白（踩過）。 */
.qk-rt .tag{
  background:currentColor; border-radius:999px; padding:2px 6px;
  font-size:11px; line-height:1.3;
  /* ⚠️ 往上挪 4px＝讓標籤的**下緣**壓在班級號碼的底線上（2026-09-20 他要的）。
     基線對齊（align-items:baseline）對的是兩邊的**文字基線**，標籤還有內距和
     下伸部，看起來就會比數字低一截（量出來多 4.2px）。
     ⚠️ 這 4px 是照現在的 11px 字級和 2px 內距量的，改字級或內距要重量一次。 */
  transform:translateY(-4px);
}
.qk-rt .tag b{color:#fff; font-weight:700}

.qk-st{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.qk-st button{
  display:flex; align-items:center; gap:8px; padding:10px 11px;
  border:2px solid var(--line); border-radius:16px; background:#fffdf6;
  cursor:pointer; text-align:left;
}
/* 手機上這顆是整顆按鈕唯一的圖，放大到 30 才看得出是空的、半的還是打勾的。
   ⚠️ 不要再往上加。34 的時候「Halfway Through」就被擠到第二行，
   那一排兩顆按鈕一高一低（2026-09-20 量到的）。 */
.qk-st button .dot{width:30px; height:30px; flex:0 0 30px; font-size:17px}
/* ⚠️ 文字這一塊要 flex:1，中文才有「整個按鈕的寬度」可以置中。
   字距用固定的 .12em，不要用兩端對齊（text-align-last:justify）——按鈕寬度是英文
   撐出來的，攤到滿版四個字會散得太開（2026-09-20 他說再緊一點）。
   中英文都置中，兩行就對在同一條中線上（他要的「英文照中文的寬度置中」）。 */
.qk-st button .tx{flex:1 1 auto; min-width:0; text-align:center}
.qk-st button b{font-size:17px; display:block; letter-spacing:.12em; margin-right:-.12em}
/* ⚠️ 選擇器要寫到 .tx 裡面。寫成 `.qk-st button span` 的話，左邊那顆記號
   （它也是 <span class="dot">）會被一起打成 display:block，
   裡面的圖就不再置中、整顆往上跑 2.5px（2026-09-20 他拍回來的）。 */
.qk-st button .tx span{display:block; font-size:13px; color:var(--muted)}
.qk-st button.on{border-color:currentColor; box-shadow:0 3px 10px rgba(var(--shade),.14)}
.qk-st button.on b{color:inherit}
/* ⚠️ 選到之後的那四個字改用各狀態的「文字色」（.st-* 那一組，2026-10-05 健檢）。
   外框和記號照舊吃狀態色（currentColor）——那是「哪一個狀態」的身分，不動；
   但狀態色本身是拿來畫點和框的，直接寫字只有 2.3（黃）～4.4（綠），
   「進行一半」在教室的光線下幾乎看不清。 */
.qk-st button.on.st-just b,  .pick.on.st-just .z  {color:#55604d}
.qk-st button.on.st-half b,  .pick.on.st-half .z  {color:#8a5d00}
.qk-st button.on.st-almost b,.pick.on.st-almost .z{color:#1f6340}
.qk-st button.on.st-done b,  .pick.on.st-done .z  {color:#b02a4c}

/* 單元圖示的選盤（編輯單元的彈出視窗裡） */
.emoji-pick{display:flex; flex-direction:column; gap:7px}
.emoji-pick .g{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.emoji-pick .g>span{font-size:13px; color:var(--muted); flex:0 0 68px}
.emoji-pick button{
  width:38px; height:38px; flex:0 0 38px; padding:0; cursor:pointer;
  border:1px solid var(--line); border-radius:10px; background:#fffdf6;
  font-size:21px; line-height:1;
}
@media (hover:hover){
  .emoji-pick button:hover{border-color:#d0c3a4; background:#fbf7ea}
}
.emoji-pick button.on{border-color:var(--grn); box-shadow:0 0 0 2px rgba(40,90,74,.20)}

/* 「換別班」：平常收起來，點一下才把九個班攤開 */
.qk-more{
  margin-left:auto; display:inline-flex; align-items:center; justify-content:center; gap:4px;
  min-height:34px;                       /* ⚠️ 手指按得到的下限，量到只有 31 */
  border:1px solid var(--line); background:#fffdf6; border-radius:999px;
  padding:0 12px 0 15px; font-size:14.5px; font-weight:700; line-height:1;
  color:var(--grn-d); cursor:pointer;
}
.qk-more .ico{font-size:15px; opacity:.8}
.qk-more:active{background:var(--grn-l)}

/* 平常只有一條：現在選的那個單元，右邊一顆「換單元」 */
.qk-unit-now{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:8px 11px; border:2px solid rgba(var(--shade),.10); border-radius:18px;
  background:#fffdf6; cursor:pointer;
}
/* ⚠️ 單元圖卡從 36 放大到 48（2026-09-23 他說還是太小）。
   這一列的高度本來由「換單元」那顆 44 決定，48 之後改由這張圖決定：
   8 ＋ 48 ＋ 8 ＋ 邊框 4 ＝ 68（本來 64）。
   圖是 object-fit:cover，放大不會變形，只是裁切少一點。
   ⚠️ 攤開的那一份清單（.qk-units button .ic）維持 34——那一份是一次列八個單元，
   放大會把下面真正要按的東西推出畫面（2026-09-20 他圈過一次）。 */
.qk-unit-now .ic{
  flex:0 0 48px; width:48px; height:48px; border-radius:13px; overflow:hidden;
  display:grid; place-items:center; font-size:29px;
}
.qk-unit-now .ic img{width:100%; height:100%; object-fit:cover; display:block}
.qk-unit-now .t{min-width:0; flex:1 1 auto}
.qk-unit-now .t b{display:block; font-size:16.5px; line-height:1.3}
.qk-unit-now .t span{
  display:block; font-size:13px; color:var(--muted); line-height:1.35;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
/* ⚠️ 這顆按鈕要跟旁邊的東西一樣高。單元換成圖卡之後左邊那張圖是 36、
   兩行字加起來 39，這顆只有 31，站在那張卡裡看起來就變小了（2026-09-23 他圈的）。
   44 是手指的下限，也讓這一列的高度由它決定（8 ＋ 44 ＋ 8 ＋ 邊框 4 ＝ 64）。
   ⚠️ 用 min-height 不要用 align-self:stretch——單元名稱換行的時候
      整顆會被拉成兩倍高。 */
.qk-unit-now .go{
  flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; gap:4px;
  min-height:44px; line-height:1;
  font-size:14.5px; font-weight:700; color:var(--grn-d);
  border:1px solid var(--line); border-radius:999px; padding:0 12px 0 15px;
}
.qk-unit-now .go .ico{font-size:15px; opacity:.8}

/* 攤開時一列一個——排成格子的話中英文名都會被截掉（2026-09-15 他回報） */
.qk-units{
  display:grid; gap:8px; padding:10px;
  grid-template-columns:minmax(0,1fr);
  background:#fffdf6; border:1px solid var(--line); border-radius:18px;
}
.qk-units button{
  display:flex; align-items:center; gap:9px; min-width:0; text-align:left;
  padding:8px 9px; border:2px solid rgba(var(--shade),.10); border-radius:14px;
  background:#fffdf6; cursor:pointer;
}
.qk-units button .ic{
  flex:0 0 34px; width:34px; height:34px; border-radius:10px; overflow:hidden;
  display:grid; place-items:center; font-size:21px;
}
.qk-units button .ic img{width:100%; height:100%; object-fit:cover; display:block}
.qk-units button .t{min-width:0}
.qk-units button .t b{display:block; font-size:15px; line-height:1.3}
.qk-units button .t span{display:block; font-size:13px; color:var(--muted); line-height:1.35}
/* ⚠️ 選到的底色用 --grn-l（#e7efe3），不要用 #eff4ea：
   快速記錄改成綠色的紙之後，#eff4ea 跟整頁的底色 #eff4e9 幾乎同一色，
   「選到的那一條」等於沒有底色（2026-09-20 改紙色時才浮出來的）。 */
.qk-units button.on{border-color:var(--grn); background:var(--grn-l)}

/* 連堂時選「現在記的是第幾節」。一列就兩三顆，按鈕要夠大。 */
.qk-per{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr)); gap:10px}
.qk-per button{
  padding:9px 10px; border:2px solid var(--line); border-radius:15px; background:#fffdf6;
  cursor:pointer; text-align:center; line-height:1.3;
}
.qk-per button b{display:block; font-size:17px}
.qk-per button span{font-size:13px; color:var(--muted)}
.qk-per button.on{border-color:var(--grn); color:var(--grn-d); background:var(--grn-l)}
.qk-per button.on span{color:inherit}

.qk-pad{display:grid; grid-template-columns:repeat(6,1fr); gap:7px}
@media (min-width:560px){ .qk-pad{grid-template-columns:repeat(8,1fr)} }
/* ⚠️ 本來是正方形（aspect-ratio:1/1），六欄的手機上一顆就 54px 高，
   三十二號排下來佔掉一整頁。改成固定高度，寬度照樣撐滿。 */
.qk-pad button{
  min-height:44px; border:1px solid var(--line); border-radius:11px;
  background:#fffdf6; font-size:17px; font-weight:700; cursor:pointer; color:var(--ink2);
}
.qk-pad button.on{background:#fdeaee; border-color:#dda2b1; color:#98243c}
.qk-seats{margin-top:10px; min-height:30px; font-size:15px}
.qk-seats .none{color:var(--muted)}

/* 顏色重複的班級：標出來，不然課表上兩個班會長一樣 */
/* ── 班級設定：班級牌 ＋ 色票 ───────────────────────────── */
/* 一列只有「班級牌＋年級＋備註＋✕」，在寬螢幕上單獨佔一整列會拖出一條空白。
   夠寬就兩欄並排，窄的時候自己掉回一欄——跟班級成果頁同一招。 */
/* ⚠️ minmax 的下限一定要用 min(…,100%) 包住。直接寫 minmax(360px,1fr) 的話，
   容器只有 330px 時還是會硬撐出 360px 的軌道，手機上整頁就爆出去（踩過）。 */
#cBody{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr)); gap:0 18px}
.cls-row{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:7px 0; border-bottom:1px solid var(--line2);
}
.chip-wrap{position:relative}
.cls-chip{
  min-width:74px; padding:9px 14px; border:2px solid transparent; border-radius:12px;
  font-size:19px; font-weight:700; line-height:1.15; cursor:pointer; text-align:center;
}
@media (hover:hover){
  .cls-chip:hover{border-color:rgba(var(--shade),.26)}
}
.cls-chip.dup{border-color:#c2354a}
/* ⚠️ 選擇器要用 #cBody 開頭。全域的 input[type=text]{width:100%} 權重比單一 class 高，
   只寫 .cls-grade 會被蓋掉，每個欄位都變成整列寬（踩過）。
   年級固定寬；備註用 flex 吃掉剩下的空間，整列才會是滿的。 */
#cBody .cls-grade{width:7.5em; flex:0 0 auto}
/* 備註吃掉那一列剩下的空間，整列才會是滿的；窄的時候至少留十個字寬 */
#cBody .cls-note{flex:1 1 10ch; width:auto; min-width:10ch}
/* ✕ 就接在備註後面。用 margin-left:auto 推到最右邊反而拉出一條空白 */
#cBody [data-delcls]{flex:0 0 auto}

.sw-pop{
  position:absolute; z-index:40; top:calc(100% + 8px); left:0; width:230px;
  background:#fffdf6; border:1px solid var(--line); border-radius:14px;
  box-shadow:0 8px 28px rgba(var(--shade),.18); padding:12px;
}
.sw-t{font-size:13px; font-weight:700; color:var(--ink2); margin-bottom:8px}
.sw-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.sw{
  aspect-ratio:1/1; border:2px solid rgba(var(--shade),.14); border-radius:8px; cursor:pointer;
  padding:0;
}
@media (hover:hover){
  .sw:hover{transform:scale(1.12)}
}
.sw.on{border-color:var(--ink); box-shadow:0 0 0 2px #fff inset}
.sw-code{margin-top:10px; display:flex; align-items:center; gap:8px}
.sw-code label{font-size:13px; font-weight:700; color:var(--ink2); white-space:nowrap}
.sw-code input{padding:7px 10px}
#cBody .dup{outline:0}
.dup-note{margin-top:8px; color:#98243c; font-weight:700}

/* 成果頁清單。右欄只有 340px，按鈕擠一行會把文字壓成一字一行 */
#shBody{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(285px,100%),1fr)); gap:10px}
.sh-row{border:1px solid var(--line); border-radius:13px; padding:11px 12px}
.sh-row .h{display:flex; align-items:center; gap:9px; margin-bottom:6px}
.sh-row .h .st{font-weight:700}
.sh-row .h .n{margin-left:auto; font-size:13px; color:var(--muted); white-space:nowrap}
.sh-row .pw{font-size:14px; color:var(--ink2); margin-bottom:8px; line-height:1.5}
.sh-row .u{display:flex; gap:6px; margin-bottom:8px}
.sh-row .u input{font-size:13px; padding:7px 9px; min-width:0; flex:1}
.sh-row .b{display:flex; gap:6px; flex-wrap:wrap}
/* 四顆（預覽／開放／通行碼／換網址）平分一列。⚠️ 2026-10-05 多了「預覽」之後，
   照原本的內距「換網址」會自己掉到第二行；內距收到 10px、平分，285 的最窄欄寬也排得下。 */
.sh-row .b .btn{flex:1 1 auto; padding-left:10px; padding-right:10px}

.qk-route{
  display:grid; gap:8px; padding:10px;
  grid-template-columns:repeat(auto-fill, minmax(96px, 1fr));
}
.qk-rt{
  border:2px solid rgba(var(--shade),.10); border-radius:14px; padding:6px 6px 7px;
  text-align:center; cursor:pointer; line-height:1.15;
}
.qk-rt .p{font-size:12.5px; font-weight:500}
/* ⚠️ 「第 3 節」和下面的時間本來各打 .85／.8 折，在班級色上只剩 3.5～4.3（2026-10-05 健檢）。
   這兩行是在教室裡一眼要看到的，層次靠字級就夠了。 */
/* 班級和時間同一行，用基線對齊——大字和小字才不會一高一低 */
.qk-rt .b{
  display:flex; align-items:baseline; justify-content:center; gap:5px; margin-top:2px;
  white-space:nowrap;
}
.qk-rt .c{font-size:21px; font-weight:700}
.qk-rt .t{font-size:12.5px}
.qk-rt.on{border-color:currentColor; box-shadow:0 3px 10px rgba(var(--shade),.16)}
.qk-rt.now{outline:3px solid rgba(40,90,74,.38); outline-offset:1px}

.qk-pend{
  border:1px solid #f0ddc4; background:#fffaf0; border-radius:14px; padding:9px 12px;
}
.qk-pend.ok{color:var(--ink2); background:#eff5e8; border-color:#d3e3ca}
.qk-pend .r{display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:4px 0}
.qk-pend .r + .r{border-top:1px dashed #eadfc8; margin-top:4px}
.qk-pend .wk{font-size:14px; font-weight:700; color:#8a6d3b; flex:0 0 54px}
.qk-pend .u{font-size:13px; color:var(--muted); flex:1 1 100%}
.qk-pend .seat{font-size:17px; padding:5px 11px 5px 13px}
.qk-pend .seat button{font-size:17px; padding:0 4px; min-width:30px}

.qk-cam{
  display:flex; align-items:center; justify-content:center; gap:9px;
  width:100%; padding:13px; border:0; border-radius:16px;
  background:#b2432c; color:#fff; font-size:18px; font-weight:700; cursor:pointer;
}
.qk-cam .ico{font-size:22px}
.qk-save .ico{font-size:22px}
.qk-cam:disabled{opacity:.55}
.qk-photos{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px}
.qk-photos .ph{aspect-ratio:1/1}

/* 底部那條儲存列。⚠️ 底色要用**這一頁的紙色**，不要用白的：
   白的一條壓在有色的紙上，看起來像另外貼上去的一塊（2026-09-20 他圈的，
   跟頂欄那次是同一個毛病）。上緣用漸層化開、不要畫線——內容捲到下面時
   是「淡出」而不是「被一條線切掉」。 */
.qk-bar{
  position:sticky; bottom:0; z-index:20; margin:14px calc(var(--pad) * -1) 0;
  padding:16px var(--pad) calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,
    rgba(255,255,255,0) 0, var(--pg-sheet) 20px, var(--pg-sheet) 100%);
  border-top:0;
}
.qk-save{
  width:100%; padding:14px; font-size:18.5px; border-radius:16px;
  display:flex; flex-direction:row; align-items:center; justify-content:center; gap:9px;
}
.qk-hint{text-align:center; font-size:14px; color:var(--muted); margin-top:8px}

/* ── 其他 ───────────────────────────────────────────────── */
.seat{
  display:inline-flex; align-items:center; gap:6px; padding:3px 10px 3px 12px;
  border-radius:999px; background:var(--red-l); color:var(--red);
  font-weight:700; font-size:15px; margin:3px 5px 3px 0;
}
.seat button{
  border:0; background:transparent; color:inherit; cursor:pointer;
  font-size:14px; padding:0 2px; opacity:.88;
}
@media (hover:hover){
  .seat button:hover{opacity:1}
}
/* 已經補完進度的號碼：留在紀錄上，但要一眼看得出它不用再處理了。
   ⚠️ 不要把它藏起來——「這孩子那一週沒來」是事實，只是後來補完了。 */
.seat.done{background:#eef1ea; color:#5d6a5f}
/* 這學期不只缺席一次：號碼後面一個小小的次數。
   ⚠️ 只加一個角標，不要換底色——一整排紅底看起來像全班都出事
   （2026-09-21 加的時候量過：底色一換，本週缺席那張卡就變成一面紅牆）。 */
.seat.rep{box-shadow:inset 0 0 0 1.5px var(--red)}
.seat.done.rep{box-shadow:inset 0 0 0 1.5px #b9c2b4}
.seat i{
  font-style:normal; font-size:12.5px; font-weight:700;
  letter-spacing:.02em;
}
/* 缺席不只一次的孩子（出席狀況頁）。一列一個孩子，不是一列一週。
   ⚠️ 容器叫 .rep-list 不叫 .rep——`.rep` 會連座號牌上的 `.seat.rep` 一起吃掉，
   那顆牌就從 inline-flex 變成 flex，整個撐滿一列（2026-09-21 量出來的）。 */
.rep-list{display:flex; flex-direction:column; gap:7px}
.rep-r{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:9px 12px; border:1px solid var(--line); border-radius:12px;
  background:#fffdf6;
}
.rep-r.warn{border-color:#f0c9bd; background:#fdf4f1}
.rep-r .who{font-weight:700; font-size:16.5px; color:var(--ink)}
.rep-r .cnt{font-size:14.5px; color:var(--ink2)}
.rep-r .cnt b{font-size:16px; color:var(--red)}
.rep-r .cnt em{
  font-style:normal; margin-left:8px; font-weight:700; font-size:13.5px;
  color:#a4471f; background:#fdf1e6; border-radius:999px; padding:2px 9px;
}
.rep-r .wks{display:flex; flex-wrap:wrap; gap:4px; align-items:center}
.rep-r .wks .w{
  font-size:13px; font-weight:600; color:var(--ink2);
  background:#f3f1e6; border-radius:8px; padding:2px 8px;
}
/* 連著的那幾次接成一條，一眼看得出「連兩週」不是「隔了三週」 */
.rep-r .wks .w.join{border-left:3px solid #d4703f; border-radius:3px 8px 8px 3px}
.rep-r .wks .w.done{color:#5d6a5f; background:#eef1ea}
.rep-r .left{margin-left:auto; font-size:13.5px; color:var(--muted)}
/* 整列都補完了的，淡下去但不要消失 */
.tb tr.all-done td{color:#626862}
/* ⚠️ 以前是整列 opacity:.62，疊上 .seat.done 的灰綠之後號碼只剩 2.4（2026-10-05 健檢）。
   「補完了」用換色表示就好，字還是要讀得到——那一週沒來是事實，不能淡到看不見。 */
/* 手機快速記錄：點到的號碼裡有誰常常不在，只印一行 */
.qk-rep{
  margin-top:8px; font-size:14px; line-height:1.65;
  color:#a4471f; background:#fdf1e6; border:1px solid #f0d6bd;
  border-radius:10px; padding:7px 10px;
}
.qk-rep b{color:#8a3a18}
/* ⚠️ 底色不能再用淡黃：教學札記整頁的底色就是淡黃（--pg-sheet），
   兩邊撞在一起整張卡就消失了（2026-09-15 他圈的）。
   改成白底＋左邊一條琥珀色，字也放大一級。 */
.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  background:#2b3a33; color:#fff; padding:12px 22px; border-radius:12px;
  box-shadow:0 8px 28px rgba(0,0,0,.28); z-index:200; max-width:88vw;
  font-size:15px; display:none;
}
.toast.err{background:#98243c}
.toast.on{display:block}
.mask{
  position:fixed; inset:0; background:rgba(40,44,34,.58); z-index:150;
  display:none; align-items:center; justify-content:center; padding:24px;
}
.mask.on{display:flex}
.modal{
  background:#fffdf6; border-radius:16px; padding:20px 22px; width:min(560px,100%);
  max-height:88vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal h3{font-size:19px; margin-bottom:14px}
.modal .acts{display:flex; gap:10px; justify-content:flex-end; margin-top:18px}
/* ask()／say()／askText() 的樣子。窄一點，因為裡面只有一句話。 */
.modal.ask{width:min(430px,100%)}
.modal .ask-t{
  margin:0; font-size:15px; line-height:1.85; color:var(--ink2);
  white-space:pre-line;          /* 訊息裡的換行照原樣斷行，不必改成 <br> */
}
.modal.ask input{margin-top:12px}
.lightbox img{max-width:min(92vw,1100px); max-height:86vh; border-radius:12px; display:block}
.loading{padding:60px 20px; text-align:center; color:var(--muted); font-size:17px}

/* 管理通行碼的鎖定畫面。刻意做得跟家長端的關卡像，一眼就知道是同一套 */
.lock{
  max-width:380px; margin:70px auto; padding:28px 26px; text-align:center;
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--r); box-shadow:var(--shadow);
}
.lock .big{font-size:40px; line-height:1}
.lock h2{font-size:20px; margin:10px 0 8px}
.lock p{margin:0 0 16px; color:var(--ink2); font-size:15px; text-align:left}
.lock input{
  width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
  text-align:center; font-size:20px; letter-spacing:.18em; background:#fffdf6;
}
.lock .btn{width:100%; margin-top:12px; justify-content:center}
.lock .err{color:var(--red); font-size:14px; min-height:22px; margin-top:8px}
/* 橫拿的手機只有 390 高，上面空 70 的話「進入」那顆剛好掉到畫面外（2026-10-06 量到 422） */
@media (max-height:520px){
  .lock{margin:14px auto; padding:16px 22px}
  .lock .big{font-size:28px}
}
/* 手機上狀態圓點只有 28px、彼此只隔 5px：左右沒地方長，觸控範圍往上下長 */
@media (pointer:coarse){ .dot.tap::after{inset:-7px -2px} }
.pw-err{color:var(--red); font-size:14px; min-height:22px}
.pw-in{width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px}
/* editBlock() 的唯讀樣子。刻意不畫框——有框就又變成「一片輸入框」了 */
.ro{
  min-height:34px; padding:2px 0 10px; line-height:1.8; font-size:15px;
  white-space:normal; word-break:break-word;
}
.ro-empty{color:var(--muted)}

/* ══ 按下去要馬上看得出來 ═══════════════════════════════════
   伺服器一趟要一兩秒。按鈕如果一點變化都沒有，他會以為自己沒按到又按一次
   （2026-09-14 回報：上下學期切換「不曉得自己有沒有按到」）。
   只要有任何一支 call() 還在飛，畫面最上緣就跑這條進度條。 */
.loadbar{
  position:fixed; left:0; top:0; height:3px; width:100%; z-index:220;
  overflow:hidden; pointer-events:none; opacity:0; transition:opacity .15s;
}
html.busy .loadbar{opacity:1}
.loadbar i{
  display:block; height:100%; width:38%; border-radius:0 3px 3px 0;
  background:linear-gradient(90deg,rgba(40,90,74,0),var(--grn));
  animation:loadslide 1.05s ease-in-out infinite;
}
@keyframes loadslide{ from{margin-left:-38%} to{margin-left:100%} }
/* 切換中的那顆先變色（畫面先切過去），再淡一點表示還在等伺服器 */
.pill-term button{transition:background .12s}
.pill-term button.wait{opacity:.72}

/* ══ 專心打字（手機）═══════════════════════════════════════
   手機打備註時，鍵盤吃掉半個畫面，上面的標題、下面那顆儲存鈕還壓著輸入框，
   打到第二行就看不見自己在寫什麼。所以打字時整片蓋掉，只留這一格。
   ⚠️ 高度要跟著 visualViewport 走，不能寫 100vh 或 height:100%——
      iOS 的 100vh 是「鍵盤還沒出現時」的高度，鍵盤一推上來照樣蓋住輸入框。 */
.fe{
  position:fixed; left:0; top:0; width:100%; height:100%; z-index:210;
  background:#fffdf6; display:flex; flex-direction:column;
}
.fe .fe-hd{
  display:flex; align-items:center; gap:10px; flex:0 0 auto;
  padding:11px 14px; border-bottom:1px solid var(--line);
}
.fe .fe-hd .t{font-size:17px; font-weight:700; margin-right:auto}
.fe .fe-hd .t em{font-style:normal; font-weight:500; font-size:14px; color:var(--muted)}
.fe textarea{
  flex:1 1 auto; min-height:0; width:100%; border:0; border-radius:0;
  padding:13px 14px; font-size:17px; line-height:1.85; resize:none;
}
.fe textarea:focus{box-shadow:none}
.fe .fe-ft{
  flex:0 0 auto; font-size:13px; color:var(--muted);
  padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
}
/* 手機版 editBlock()：不直接攤一個輸入框，點一下才展開整個畫面來打 */
.tapbox{
  display:block; width:100%; text-align:left; font:inherit; color:var(--ink);
  background:#fffdf6; border:1px solid #ddd2ba; border-radius:10px;
  padding:11px 12px; min-height:78px; line-height:1.8;
  white-space:pre-wrap; word-break:break-word; cursor:text;
}
.tapbox .ph{color:#7b7463}
.tapbox .go{display:block; margin-top:7px; font-size:13px; font-weight:700; color:var(--grn)}
/* 同一班同一單元以前寫過的紀錄，壓成一小段，別跟現在要填的搶注意力 */
.past{margin-top:12px; border-top:1px dashed var(--line); padding-top:10px}
.past .t{font-size:13px; font-weight:700; color:var(--muted); margin-bottom:6px}
.past .it{display:flex; gap:10px; font-size:14px; color:var(--ink2); padding:3px 0}
.past .it .d{flex:0 0 46px; color:var(--muted)}
.past .it .x{min-width:0}
/* 系統狀態的資料筆數 */
/* ⚠️ 每一格寬度一樣的話，字多的那一格（作品照片＋估算容量）會被壓成三行。
   改成 auto-fit＋內容自己決定：標題一行、數字一行，
   後面附帶的說明（例如「約 9 MB」）自己掉到第三行，不會把數字擠爛。 */
.dg-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));
  gap:8px; margin-top:14px;
}
.dg-i{
  display:flex; flex-direction:column; gap:2px; padding:9px 12px;
  border:1px solid var(--line2); border-radius:11px; background:#fdfaf0;
}
.dg-i .k{font-size:13px; color:var(--muted)}
.dg-i .v{font-weight:700; font-size:17px; line-height:1.35}
.dg-i .v small{font-size:12.5px; font-weight:500; color:var(--muted); display:block}
.todo-more{margin-top:12px; padding-top:10px; border-top:1px dashed var(--line); font-size:14px}

/* ── 本日授課動線 ───────────────────────────────────────────
   班級牌和時間疊成同一欄。原本兩者並排（52＋104），在 340px 的側欄裡
   右邊的單元名只剩 130px，四個字就折一行，整張卡看起來又長又碎
   （2026-09-14 他回報的就是這個）。疊起來之後文字那一欄多了 70px。 */
.route .it{
  display:flex; align-items:flex-start; gap:12px;
  padding:10px 4px; border-bottom:1px solid var(--line2);
}
.route .it:last-child{border-bottom:0}
.route .when{flex:0 0 86px; text-align:center}
.route .when .badge{min-width:52px}
.route .when .tm{
  display:block; margin-top:4px; font-size:12.5px; color:var(--muted); white-space:nowrap;
}
.route .tx{min-width:0; flex:1}
.route .tx .a{font-weight:700; font-size:15px; line-height:1.35}
.route .tx .b{font-size:13.5px; color:var(--muted); line-height:1.6; margin-top:2px}
/* 空堂淡一點，一眼就看得出哪幾節要站上台 */
.route .it.free .tx .a{font-weight:600; color:var(--ink2)}
.route .it.now{background:var(--grn-l); border-radius:10px; padding-left:10px; padding-right:10px}
.hint{font-size:13px; color:var(--muted)}
/* 狀態對照橫幅：四格，跟上面的統計卡、下面的單元卡共用同一組直線 */
/* 首頁「今天要做的」：一班一張卡，欄數自己算。
   他一天只有一到三班，排成長長一列會整片空白。 */
.today-grid{
  display:grid; gap:12px;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));
}
.tcard{
  border:1px solid var(--line); border-radius:13px; padding:12px 14px;
  display:flex; flex-direction:column; gap:9px; background:#fffdf6;
}
.tcard.now{border-color:#cbd9bf; background:var(--grn-l)}
.tcard .h{display:flex; align-items:baseline; gap:9px; font-size:13.5px}
.tcard .h .p{font-weight:700}
.tcard .h .t{color:var(--muted)}
.tcard .m{display:flex; align-items:center; gap:12px; min-width:0}
.tcard .plate{
  flex:0 0 auto; min-width:64px; text-align:center; border-radius:12px;
  padding:6px 10px; font-size:24px; font-weight:700; line-height:1.2;
}
.tcard .m .tx{min-width:0}
.tcard .m .a{font-size:16px; font-weight:700; line-height:1.35}
.tcard .m .b{font-size:13px; color:var(--muted); line-height:1.45}
.tcard .f{display:flex; align-items:center; gap:8px; margin-top:auto; flex-wrap:wrap}
.tcard .f .badge,.tcard .f .nw{white-space:nowrap}
.tcard .f .btn{margin-left:auto}
.tcard .f .s{font-size:14px; font-weight:700}
.tcard .f .s.no{color:var(--red)}

/* 進度檢核左邊那張班級大牌：整張置中，不要上面擠一行、下面空一大塊 */
/* ⚠️ 不要整張填班級色：進度檢核整頁的底色是綠的，203 班也是綠的，
   整張牌就跟背景糊在一起（2026-09-15 他圈的）。
   改成白底、數字用班級的深色（.k-*）、頂上一條同色的槓——哪一頁都不會撞。
   高度也從 143 收到 100 左右，右邊那張單元卡就不用陪著長高。 */
.cls-plate{
  margin:0; position:relative; overflow:hidden;
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; text-align:center; gap:0;
  padding:16px 14px 14px;
}
.cls-plate::before{
  content:''; position:absolute; top:0; left:0; right:0; height:6px;
  background:currentColor;
}
.cls-plate .n{font-size:46px; font-weight:700; line-height:1.05; color:inherit}
.cls-plate .hint{color:var(--muted)}

/* 右上角的教師名片（藍圖上就有這一塊） */

/* 卡片標題左邊那一條藍槓——藍圖的每張卡都有，是整個版面的識別 */
.card>h3::before, .card.fold>summary::before{
  content:''; flex:0 0 5px; width:5px; height:20px; border-radius:99px;
  background:var(--pg-ink); margin-right:3px; transform:rotate(9deg);
}

/* 班級顏色對照：九個班一排就好（2026-09-15 他圈的，本來會折成兩排、
   第二排右邊空一大截）。每一格平分整列，班號和年級排同一行。 */
.cl-legend{display:flex; flex-wrap:wrap; gap:8px}
.cl-lg{
  flex:1 1 96px; min-width:0; display:flex; align-items:baseline;
  justify-content:center; gap:6px; padding:9px 10px; border-radius:12px;
}
.cl-lg b{font-size:19px; font-weight:700}
.cl-lg i{font-style:normal; font-size:13px}

/* 系統設定右欄只有 340px：欄位兩兩並排，短欄位不再各佔一列、右邊空一半
   （2026-09-15 他圈的）。.w2 的整列寬留給日期、姓名、標語。 */
.set-2{
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px 12px; max-width:520px;
}
.set-2 .w2{grid-column:1 / -1}

/* 出席狀況：這一頁只是「看誰沒來」，登記在手機上做（2026-09-15 他說的）。
   預設是唯讀的班級卡，要在電腦上補改才按「✏️ 編輯」換成輸入框。 */
.ab-grid{
  display:grid; gap:10px;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));
}
.ab-c{border:1px solid var(--line); border-radius:13px; padding:11px 13px; background:#fffdf6}
.ab-c.ok{background:#f4f6ea; border-color:#d5e3c9}
.ab-c .hd{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.ab-c .hd .badge{font-size:21px; padding:4px 15px}
.ab-c .hd .n{margin-left:auto; font-size:13px; color:var(--muted); font-weight:500}
.ab-c .s{min-height:30px}
.ab-c .s .seat{font-size:17px; padding:3px 12px}
.ab-c .s .none{font-size:14.5px; font-weight:500; color:#1d7348}
/* 讀不懂的座號。⚠️ 不要畫成號碼牌——那樣又會被當成真的有這個學生
   （2026-09-21 就是「2026-03-09」被當成一位學生）。 */
.ab-c .ab-odd{
  margin-top:6px; font-size:13.5px; line-height:1.6;
  color:#a4471f; background:#fdf1e6; border:1px solid #f0d6bd;
  border-radius:9px; padding:6px 9px;
}

/* 本週重點的單元縮圖：藍圖上是一張張小圖，這裡用單元自己的顏色＋圖示 */
.list .it .thumb{
  flex:0 0 42px; width:42px; height:42px; border-radius:11px;
  display:grid; place-items:center; font-size:22px;
}

/* 教學進度：全部班級都完成的單元收在這一張裡（預設關著） */
.done-units>summary .n{
  font-size:14px; font-weight:700; color:var(--grn-d);
  background:#eff4ea; border:1px solid #d7e3cf; border-radius:999px; padding:2px 9px;
}
.done-units>summary .en2{font-size:14px; color:var(--muted); font-weight:500}
.done-units[open]{margin-bottom:16px}
.done-units .units{margin-bottom:0}

/* 收合式卡片。一年才動一次的東西（封存、開新學期、通行碼）預設收起來，
   系統設定一次攤開八張卡，真正常用的反而要找。 */
.card.fold{padding-top:14px; padding-bottom:14px}
.card.fold>summary{
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  font-size:17px; font-weight:700; cursor:pointer; list-style:none;
}
.card.fold>summary::-webkit-details-marker{display:none}
.card.fold>summary::after{
  content:'＋'; margin-left:auto; color:var(--muted); font-weight:700;
}
.card.fold[open]>summary::after{content:'−'}
.card.fold[open]>summary{
  margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--line2);
}
@media (hover:hover){
  .card.fold>summary:hover{color:var(--grn)}
}

/* 固定在畫面底部的儲存列（進度檢核桌機版）。
   .wrap 有左右內距，用負 margin 讓它整條到底才不會看起來卡在中間。 */
.save-bar{
  position:sticky; bottom:0; z-index:30;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  /* ⚠️ 負的左右邊界要跟 .wrap 的內距（--pad）一樣。寫死 -22px 是 2026-09-14m 之前
     的舊值，那一版把 --pad 從 22 收到 14 之後這條沒跟著改，
     進度檢核那一頁就一直多出 16px 的橫向捲動（2026-09-15 量到的）。 */
  margin:16px calc(var(--pad) * -1) -40px;
  padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));
  background:rgba(255,253,246,.97); border-top:1px solid var(--line);
  box-shadow:0 -6px 20px rgba(var(--shade),.08);
}
.save-bar .btn{margin-left:auto}
.save-bar b{font-size:15px}

/* 動線列右邊那一欄（手機首頁的「去記錄」） */
.route .act{
  display:flex; flex-direction:column; align-items:flex-end; gap:5px;
  flex:0 0 auto; margin-left:auto;
}
.route .act .s{font-size:13px; font-weight:700; white-space:nowrap}
.route .act .s.ok{color:var(--green)}
.route .act .s.no{color:var(--red)}

/* 手機上可以按的那些圓點，給一點「按得下去」的樣子 */
.dot.tap{cursor:pointer; box-shadow:0 0 0 1px rgba(40,90,74,.28); position:relative}
/* ⚠️ 這顆點在手機上是入口（按下去直接去記錄那一班），但九個排一列只有 24px，
   按下去很容易點到隔壁那班（2026-09-20 量到的）。
   用一層看不見的外框把「按得到的範圍」撐到 34，圓點本身的大小和排版一格都沒動。 */
.dot.tap::after{content:''; position:absolute; inset:-3px}
.dot.tap:active{transform:scale(.92)}

/* 新增資源的表單：欄位一起排進格線，整列鋪滿（欄位有上限會右邊空一塊） */
.res-form{
  display:grid; gap:12px;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));
}
#views .res-form .field{max-width:none}

/* 教學資源：一張張卡，照片直接出縮圖（點下去放大）。
   以前是一列一列的清單，一個單元三份資源就佔掉整個畫面高度。 */
.res-grid{
  display:grid; gap:12px;
  /* ⚠️ 一定要 auto-fill，不能用 auto-fit。auto-fit 會把空軌道收掉，
     一個單元只有一筆資源時那張卡就被拉到整列寬，圖片跟著撐成一條橫幅
     （2026-09-15 他圈的）。auto-fill 留著空軌道，卡片就維持縮圖大小。 */
  grid-template-columns:repeat(auto-fill,minmax(min(100%,196px),1fr));
}
.res-i{
  display:flex; flex-direction:column; border:1px solid var(--line);
  border-radius:12px; overflow:hidden; background:#fffdf6;
}
.res-i .pic{
  display:grid; place-items:center; height:124px; background:#f4efe1;
  overflow:hidden; text-decoration:none;
}
.res-i .pic img{width:100%; height:100%; object-fit:cover; cursor:zoom-in; display:block}
.res-i .pic.ic{font-size:38px}
.res-i .t{padding:9px 11px 0; font-size:14.5px; font-weight:700; line-height:1.4}
.res-i .t a{color:var(--grn)}
.res-i .b{padding:3px 11px 0; font-size:13px; color:var(--muted); line-height:1.55}
.res-i .f{
  display:flex; align-items:center; gap:8px; margin-top:auto;
  padding:8px 11px 9px;
}
.res-i .f .x{
  margin-left:auto; border:0; background:transparent; color:var(--muted);
  cursor:pointer; font-size:14px; border-radius:7px; padding:3px 7px;
}
@media (hover:hover){
  .res-i .f .x:hover{background:#fdeaee; color:#c2354a}
}

/* 假日小卡。一天一張、自動排欄——一列一列往下加的話，
   登記十天就是十列空蕩蕩的長條（2026-09-14 他回報）。 */
/* 一天一張小卡，日期和名稱排**同一行**——本來上下兩行、右邊又空掉一半
   （2026-09-15 他圈的）。卡片寬度跟著字走，一排放得下就放得下。 */
.hol-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.hol-i{
  position:relative; background:#fffaf0; border:1px solid #f0e2b6;
  border-radius:11px; padding:8px 34px 8px 12px;
  display:flex; align-items:baseline; gap:9px; flex:0 1 auto;
}
.hol-i .d{font-size:13px; font-weight:700; color:#9b5d28; white-space:nowrap}
.hol-i .n{font-size:15px; font-weight:700; word-break:break-word}
.hol-i .x{
  position:absolute; top:6px; right:6px; width:24px; height:24px; line-height:1;
  border:0; border-radius:7px; background:transparent; color:var(--muted);
  cursor:pointer; font-size:14px;
}
@media (hover:hover){
  .hol-i .x:hover{background:#f4e3c4; color:var(--ink)}
}

/* 一排小標籤（目前用在「還沒有資源的單元」） */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip-u{
  display:inline-flex; align-items:center; border-radius:999px;
  padding:5px 13px; font-size:14px; font-weight:700;
}

/* 卡片群組的小標題（不是卡片，所以不會把裡面的欄位推開） */
.sec-t{
  display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;
