function asched() {
  $('wkPrev').onclick = function () { boot(Math.max(1, S.wk.week - 1)); };
  $('wkNext').onclick = function () { boot(S.wk.week + 1); };
  $('wkNow').onclick  = function () { boot(''); };
  $('scTerm').onchange = function () {
    var sel = this;
    call('apiSwitchTerm', sel.value).then(function (d) { refresh(d, '已切換學期'); })
      .catch(function (e) { sel.value = S.settings.term; fail(e); });   /* 沒切成功，選單要跟著退回來 */
  };
  $('scTeacher').onchange = function () {
    call('apiSaveSettings', { teacher: this.value }).then(function (d) {
      refresh(d, '已更新教師名稱'); }).catch(fail);
  };
  $('scAdd').onclick = function () { editSlot(1, 1); };

  /* 停課：整天或只有幾節。「整天」和節次是互斥的，按哪一邊就把另一邊關掉 */
  if ($('hPers')) {
    Array.prototype.forEach.call($('hPers').querySelectorAll('button'), function (b) {
      b.onclick = function () {
        var all = $('hPers').querySelector('[data-hp="all"]');
        if (b.dataset.hp === 'all') {
          Array.prototype.forEach.call($('hPers').querySelectorAll('button'), function (x) {
            x.classList.toggle('on', x === b);
          });
        } else {
          b.classList.toggle('on');
          all.classList.remove('on');
          /* 一節都沒勾就退回「整天」，不要留在什麼都沒選的狀態 */
          if (!$('hPers').querySelector('button.on')) all.classList.add('on');
        }
      };
    });
  }
  if ($('hAdd')) $('hAdd').onclick = function () {
    var d = $('hDate').value;
    if (!d) return toast('請先選日期。', true);
    var ps = [];
    Array.prototype.forEach.call($('hPers').querySelectorAll('button.on'), function (b) {
      if (b.dataset.hp !== 'all') ps.push(Number(b.dataset.hp));
    });
    $('hAdd').disabled = true;
    call('apiSaveHoliday', { date:d, name:$('hName').value.trim(), periods:ps })
      .then(function (r) { refresh(r, ps.length ? '已登記停課' : '已登記放假'); })
      .catch(function (e) { $('hAdd').disabled = false; fail(e); });
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-delhol]'), function (b) {
    /* 那顆 ✕ 很小、又在課表格子旁邊，誤觸就少一筆停課——先問一句 */
    b.onclick = function () {
      ask('取消之後，那一天的課會照固定課表算回來。', '取消這一筆', '要取消這一筆停課嗎？')
        .then(function (yes) {
          if (!yes) return;
          call('apiDeleteHoliday', b.dataset.delhol)
            .then(function (r) { refresh(r, '已取消這一筆停課'); }).catch(fail);
        });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-delmov]'), function (b) {
    b.onclick = function () {
      ask('取消之後，課會回到原本那一節。', '取消這筆調課', '要取消這筆調課嗎？')
        .then(function (yes) {
          if (!yes) return;
          call('apiDeleteMove', b.dataset.delmov)
            .then(function (r) { refresh(r, '已取消這筆調課，課回到原本那一節'); }).catch(fail);
        });
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('.slot[data-d]'), function (s) {
    s.onclick = function () { editSlot(Number(s.dataset.d), Number(s.dataset.p)); };
  });

  Array.prototype.forEach.call($('perBody').querySelectorAll('input'), function (i) {
    i.onblur = function () { i.value = normTime(i.value); };
  });

  $('perSave').onclick = function () {
    var map = {};
    Array.prototype.forEach.call($('perBody').querySelectorAll('input'), function (i) {
      var n = i.dataset.per;
      map[n] = map[n] || { no: Number(n), label: labelOfPeriod(n) };
      map[n][i.dataset.f] = normTime(i.value);
    });
    var rows = [];
    for (var k in map) rows.push(map[k]);
    rows.sort(function (a, b) { return Number(a.no) - Number(b.no); });
    call('apiSavePeriods', rows).then(function (d) { refresh(d, '節次時間已儲存'); }).catch(fail);
  };
}

/* 點一格課表 → 選班級／教室 */
function editSlot(day, period) {
  if (isArchived()) return toast('這個學期已封存，只能查看。', true);
  var cur  = schedAt(day, period) || { cls:'', room:'', note:'' };
  var date = S.wk.days[day - 1];
  modal('編輯課程',
    '<div class="row"><div class="field"><label>星期</label><select id="mDay">' +
      [1,2,3,4,5].map(function (d) {
        return '<option value="' + d + '"' + (d === day ? ' selected' : '') + '>週' + DAYS[d] + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label>節次</label><select id="mPer">' +
      teachPeriods().map(function (p) {
        return '<option value="' + p.no + '"' + (Number(p.no) === period ? ' selected' : '') +
          '>第 ' + p.no + ' 節　' + p.start + '–' + p.end + '</option>';
      }).join('') + '</select></div></div>' +
    '<div class="row" style="margin-top:12px"><div class="field"><label>班級</label>' +
      '<select id="mCls"><option value="">（這節沒課）</option>' +
      sortedClasses().map(function (c) {
        return '<option value="' + esc(c.code) + '"' + (String(c.code) === String(cur.cls) ? ' selected' : '') +
          '>' + esc(c.code) + '　' + esc(c.grade) + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label>教室（可留白）</label>' +
      '<input type="text" id="mRoom" value="' + esc(cur.room) + '" placeholder="例如 美術教室 A"></div></div>' +
    '<div class="hint" style="margin-top:8px">上面這一塊是<b>整個學期</b>的固定課表，改了每一週都會變。</div>' +
    onceBox(date, period),
    function () {
      var d = Number($('mDay').value), p = Number($('mPer').value);
      var rows = S.schedule.filter(function (r) {
        return !(Number(r.day) === day && Number(r.period) === period) &&
               !(Number(r.day) === d && Number(r.period) === p);
      });
      var code = $('mCls').value;
      if (code) rows.push({ day:d, period:p, cls:code, room:$('mRoom').value.trim(), note:'' });
      call('apiSaveSchedule', rows).then(function (x) {
        closeModal(); refresh(x, code ? '課表已更新' : '已清空這一節');
      }).catch(fail);
      return false;
    });
  onceWire(date, period);
}

/* ── 「只有這一天」──────────────────────────────────────────
   臨時的事情全部集中在這裡：這一節停課（全校活動），或這一節這次調到別處。
   ⚠️ 固定課表不動——他明講過臨時調整不可以改到整學期的課表（2026-09-19）。
   登記一律從「有課的那一格」出發：空堂格子不給調課，
   不然還要先問「要把誰調過來」，在課表上點兩次反而容易點錯。 */
function onceBox(date, period) {
  var o = slotOn(date, period);
  var head = '<div class="once"><div class="once-h">只有這一天　<b>' +
    esc(dateLabel(date)) + ' 第 ' + esc(period) + ' 節</b></div>';

  if (o.kind === 'block') {
    var ps = perList(o.block.periods);
    return head + '<div class="once-now">這一節已登記不上課：<b>' + esc(holName(o.block)) + '</b>' +
      '（' + esc(perLabel(o.block.periods)) + '）' +
      (o.base ? '　本來是 ' + esc(o.base) + '　' : '') +
      '</div><div class="once-act"><button class="btn ghost sm" id="oDelHol">' +
      (ps.length ? '取消這筆停課' : '取消整天放假') + '</button></div></div>';
  }
  if (o.kind === 'out') {
    return head + '<div class="once-now">這一節（' + esc(o.out.cls) + '）已經調到 <b>' +
      esc(dateLabel(o.out.toDate)) + ' 第 ' + esc(o.out.toPeriod) + ' 節</b>' +
      (o.out.note ? '　' + esc(o.out.note) : '') +
      '</div><div class="once-act"><button class="btn ghost sm" id="oDelMov">取消調課</button>' +
      '</div></div>';
  }
  if (o.kind === 'in') {
    return head + '<div class="once-now">這一節是 <b>' + esc(o.into.cls) + '</b> 從 ' +
      esc(dateLabel(o.into.date)) + ' 第 ' + esc(o.into.period) + ' 節調過來的。' +
      '</div><div class="once-act"><button class="btn ghost sm" id="oDelMov">取消調課（課回到原本那一節）</button>' +
      '</div></div>';
  }
  if (!o.cls) {
    return head + '<div class="hint">這一節是空堂。要把別節的課調到這裡，' +
      '請點<b>那一節</b>的格子，在它的「只有這一天」裡選調到這一節。</div></div>';
  }

  /* 有課，而且這一天還沒有任何異動 */
  return head +
    '<div class="once-r"><div class="field" style="max-width:260px"><label>這一節停課</label>' +
      '<input type="text" id="oWhy" placeholder="期中考 · 兒童節活動 · 大掃除"></div>' +
      '<div><button class="btn ghost sm" id="oBlock">登記停課</button></div></div>' +
    '<div class="once-r"><div class="field" style="max-width:190px"><label>這次調到哪一天</label>' +
      '<input type="date" id="oDate" value="' + esc(date) + '"></div>' +
      '<div class="field" style="max-width:170px"><label>第幾節</label><select id="oPer">' +
      teachPeriods().map(function (p) {
        return '<option value="' + esc(p.no) + '"' +
          (Number(p.no) === Number(period) ? ' selected' : '') + '>第 ' + esc(p.no) + ' 節</option>';
      }).join('') + '</select></div>' +
      '<div><button class="btn sm" id="oMove">調過去</button></div></div>' +
    '<div class="hint" id="oTip"></div>' +
    '<div class="hint">調到別一週也可以，日期直接選。' +
    '紀錄、缺席都照<b>實際上課那一天</b>算，不用另外處理。</div></div>';
}

function onceWire(date, period) {
  var o = slotOn(date, period);

  if ($('oDelHol')) $('oDelHol').onclick = function () {
    $('oDelHol').disabled = true;
    call('apiDeleteHoliday', o.block.id)
      .then(function (r) { closeModal(); refresh(r, '已取消停課，這一節恢復上課'); })
      .catch(function (e) { $('oDelHol').disabled = false; fail(e); });
  };
  if ($('oDelMov')) $('oDelMov').onclick = function () {
    var m = o.out || o.into;
    $('oDelMov').disabled = true;
    call('apiDeleteMove', m.id)
      .then(function (r) { closeModal(); refresh(r, '已取消調課，課回到原本那一節'); })
      .catch(function (e) { $('oDelMov').disabled = false; fail(e); });
  };
  if ($('oBlock')) $('oBlock').onclick = function () {
    $('oBlock').disabled = true;
    call('apiSaveHoliday', { date:date, periods:[Number(period)], name:$('oWhy').value.trim() })
      .then(function (r) { closeModal(); refresh(r, '這一節已登記停課'); })
      .catch(function (e) { $('oBlock').disabled = false; fail(e); });
  };

  /* 目標那一節現在是什麼，邊選邊講——兩班對調時才不會忘了另外那一筆 */
  function tip() {
    if (!$('oTip')) return;
    var d = $('oDate').value, p = Number($('oPer').value);
    if (!d || !p) return;
    if (d === date && p === Number(period)) {
      $('oTip').textContent = '這就是原本那一節。要調課請改日期或節次。';
      return;
    }
    var t = slotOn(d, p);
    var msg;
    if (t.kind === 'block') msg = '⚠️ ' + dateLabel(d) + ' 第 ' + p + ' 節是「' +
      holName(t.block) + '」，那一節不上課。';
    else if (t.cls) msg = '⚠️ ' + dateLabel(d) + ' 第 ' + p + ' 節本來是 ' + t.cls +
      ' 的課。兩班對調的話，記得也幫 ' + t.cls + ' 登記一筆。';
    else msg = '✓ ' + dateLabel(d) + ' 第 ' + p + ' 節是空堂。';
    $('oTip').textContent = msg;
  }
  if ($('oDate')) { $('oDate').onchange = tip; }
  if ($('oPer'))  { $('oPer').onchange  = tip; tip(); }

  if ($('oMove')) $('oMove').onclick = function () {
    var d = $('oDate').value, p = Number($('oPer').value);
    if (!d || !p) return toast('請選要調到哪一天的第幾節。', true);
    $('oMove').disabled = true;
    call('apiSaveMove', { date:date, period:Number(period), cls:o.cls,
                          toDate:d, toPeriod:p, note:'' })
      .then(function (r) {
        closeModal();
        refresh(r, o.cls + ' 已改到 ' + dateLabel(d) + ' 第 ' + p + ' 節');
      })
      .catch(function (e) { $('oMove').disabled = false; fail(e); });
  };
}

</script>

<script>
/* ══════════════════════════════════════════════════════════════
   3. 教學進度 Teaching Progress
      看的是「每個單元，各班進行到哪裡」的總覽。
   ══════════════════════════════════════════════════════════════ */
function unitStage(u, classes) {
  var rows = S.progress.filter(function (p) {
    return String(p.unitId) === String(u.id) &&
           classes.some(function (c) { return String(c.code) === String(p.cls); });
  });
  if (!rows.length) return 'none';
  var doneN = rows.filter(function (r) { return r.status === 'done'; }).length;
  if (doneN >= classes.length && classes.length) return 'done';
  if (rows.some(function (r) { return r.status === 'almost' || r.status === 'done'; })) return 'almost';
  return 'in';
}

function vProg() {
  /* 手機上這一頁只做一件事：一眼看到各班進行到哪裡。
     橫幅、學期切換、年級／班級篩選、統計卡、狀態對照全部收起來，
     還沒開始的單元也不列——沒開始的看了也沒資訊。 */
  var phone = isPhone();
  var h = phone ? '' : hero('Teaching Progress', '教學進度', '追蹤孩子的學習旅程，看見創意的成長！',
    'Track the learning journey. Nurture creativity. Celebrate every step!',
    '每個單元，各班進行到哪裡，這一頁一次看完。');

  var grades = [];
  S.classes.forEach(function (c) { if (grades.indexOf(c.grade) < 0) grades.push(c.grade); });
  var fG = UI.prog.grade || '', fC = UI.prog.cls || '';
  var classes = sortedClasses().filter(function (c) {
    return (!fG || c.grade === fG) && (!fC || String(c.code) === String(fC));
  });

  /* ⚠️ 學期這組按鈕也要包在 .field 裡、也要給它標籤。沒有標籤的話，
     這一排只有中間兩格有標籤那一行，左邊的學期、右邊的按鈕就空了 31px 在上面，
     看起來像兩個標籤浮在半空中（2026-09-20 他圈出來的就是這個）。
     flex:0 0 auto ＝ 不要跟著長，寬度照按鈕本身。 */
  if (!phone) h += '<div class="card no-print"><div class="row">' +
    '<div class="field" style="flex:0 0 auto"><label>學期 Semester</label>' +
    '<div class="pill-term">' +
      '<button data-sem="1" class="' + (S.settings.semester === '1' ? 'on' : '') + '">上學期 First Semester</button>' +
      '<button data-sem="2" class="' + (S.settings.semester === '2' ? 'on' : '') + '">下學期 Second Semester</button>' +
    '</div></div>' +
    '<div class="field" style="max-width:200px"><label>年級 Grade</label><select id="fGrade">' +
      '<option value="">全部年級 All Grades</option>' + grades.map(function (g) {
        return '<option value="' + esc(g) + '"' + (g === fG ? ' selected' : '') + '>' + esc(g) + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field" style="max-width:200px"><label>班級 Class</label>' +
      selClasses('fCls', fC, '全部班級 All Classes') + '</div>' +
    '<div style="margin-left:auto"><button class="btn" id="uAdd">＋ 新增單元 Add Unit</button></div>' +
    '</div></div>';

  var units = sortedUnits();
  var cnt = { none:0, in:0, almost:0, done:0 };
  units.forEach(function (u) { cnt[unitStage(u, classes)]++; });

  if (!phone) {
    h += '<div class="grid g4" style="margin-bottom:16px">' +
      statCard('<i class="ci ci-units" aria-hidden="true">📚</i>', 'blue',   'Total Units',      '總單元數', units.length, '個單元') +
      statCard('<i class="ci ci-inprog" aria-hidden="true">🔄</i>', 'yellow', 'In Progress',      '進行中',   cnt['in'],    '個單元') +
      statCard('<i class="ci ci-almost" aria-hidden="true">⏳</i>', 'green',  'Almost Complete',  '即將完成', cnt.almost,   '個單元') +
      statCard('<i class="ci ci-done" aria-hidden="true">✅</i>', 'pink',   'Completed',        '已完成',   cnt.done,     '個單元') +
      '</div>';
  } else {
    units = units.filter(function (u) { return unitStage(u, classes) !== 'none'; });
  }

  /* ⚠️ 這一頁整頁共用同一組四欄格線：上面四張統計卡、中間狀態對照、下面單元卡，
     直線全部對得起來。以前單元卡是「三欄＋右邊 340px 的狀態對照」，
     跟統計卡的四欄錯開十幾個像素——2026-09-14 他圈出來的就是這個。 */
  /* 狀態對照做成四張小卡，跟統計卡、單元卡**同一條格線**。
     包在一張卡裡的話，裡面那四格會被卡片內距推開 9px，直線就又對不齊了。 */
  if (!phone) h += '<div class="sec-t">⭐ 狀態對照 <span class="en2">Status Legend</span>' +
    '<span class="hint">單元卡下面那排圓點就是這四種</span></div>' +
    '<div class="grid g4" style="margin-bottom:16px">' + ST_ORDER.map(function (k) {
      var st = ST[k];
      return '<div class="card lg-i" style="margin:0"><span class="dot ' + st.k + '">' +
        stMark(k) + '</span>' +
        '<div class="tx"><span class="a">' + st.z + '</span>' +
        '<span class="hint">' + st.e + '</span>' +
        '<span class="b">' + st.d + '</span></div></div>';
    }).join('') + '</div>';

  /* 一列兩張的橫式卡（2026-09-14 他畫的）。
     直式一列四張時每張只有 307px，封面小、說明擠；
     橫式之後左邊放封面、右邊放說明與各班狀態，看得清楚多了。
     ⚠️ 中間那條直線還是落在 50%，跟上面四欄的統計卡對得起來。 */
  /* ⚠️ 九個班都「全部完成」的單元**只有手機才收起來**（2026-09-21 他改的）。
     手機是站在教室裡快速看「這一週還有哪幾班沒跟上」用的，做完的單元佔一整張卡
     就會把還在進行的擠出畫面；桌機不一樣，他要的是整學期的全貌，
     收起來反而要多點一下（2026-09-20 本來是三種裝置同一套，這次改掉）。
     ⚠️ 這條規則以後也照這個方向：**要精簡就只精簡手機，桌機看得到全部。** */
  var foldDone  = phone;
  var liveUnits = foldDone
    ? units.filter(function (u) { return unitStage(u, classes) !== 'done'; })
    : units;
  var doneUnits = foldDone
    ? units.filter(function (u) { return unitStage(u, classes) === 'done'; })
    : [];

  function unitCard(u) {
    var doneN = classes.filter(function (c) {
      var p = progOf(c.code, u.id); return p && p.status === 'done';
    }).length;
    var pct = classes.length ? Math.round(doneN / classes.length * 100) : 0;
    var lp  = unitPeriods(u.id);
    return '<div class="unit"><div class="hd">' +
      '<div class="no c-' + (u.color || 'blue') + '">' + esc(u.ord) + '</div>' +
      /* 中英文排成同一行（放不下才折）。上下兩行時中間會空出一段，
         右邊又剩一大塊白——2026-09-14 他圈的就是這個。 */
      /* ⚠️ 中文在前、英文在後（全站同一條規則，2026-09-20 統一）。 */
      '<div class="nm"><span class="z">' + esc(u.nameZh) + '</span>' +
        '<span class="e">' + esc(u.nameEn) + '</span></div>' +
      '<button class="btn ghost sm no-print" style="margin-left:auto" data-eu="' + esc(u.id) + '">編輯</button>' +
      '</div>' +
      '<div class="cover c-' + (u.color || 'blue') + '">' + coverInner(u) + '</div>' +
      '<div class="bd">' +
        '<div class="d1">' + esc(u.descZh) + '</div>' +
        '<div class="d2">' + esc(u.descEn) + '</div>' +
        '<div class="prog-line"><span class="hint">進度 ' + doneN + '/' + classes.length + ' 班</span>' +
          '<span class="bar"><i style="width:' + pct + '%"></i></span><b>' + pct + '%</b>' +
          /* 下一輪排課要知道「這個單元要留幾節」——2026-09-15 他要的就是這個數字。
             一個班連上兩節、兩節不同單元時，節次紀錄才分得出來。 */
          (lp.total ? '<span class="hint lp">' + lp.avg + ' 節/班</span>' : '') + '</div>' +
        '<div class="cls-grid">' +
          '<div class="r"><span class="lb">班級</span><span class="cells">' +
            classes.map(function (c) {
              return '<span class="cell-cls c-' + colorOf(c.code) + '">' + esc(c.code) + '</span>';
            }).join('') + '</span></div>' +
          '<div class="r"><span class="lb">狀態</span><span class="cells">' +
            classes.map(function (c) {
              var p = progOf(c.code, u.id);
              var s = p ? ST[p.status] : null;
              /* 手機上這顆圓點是入口：按下去直接進快速記錄，班級與單元都選好，
                 不用再自己切頁、選班級、選單元（2026-09-14 加的）。 */
              return '<span class="dot ' + (s ? s.k : 'c-gray') + (phone ? ' tap' : '') + '"' +
                (phone ? ' data-qgo="' + esc(c.code) + '|' + esc(u.id) + '"' : '') +
                ' title="' + esc(c.code + ' ' + (s ? s.z : '未開始') +
                  (phone ? '（點一下去記錄）' : '')) + '">' +
                (s ? stMark(p.status) : '–') + '</span>';
            }).join('') + '</span></div>' +
        '</div>' +
      '</div></div>';
  }

  h += '<div class="grid g2 units">';
  h += liveUnits.map(unitCard).join('') ||
    '<div class="card empty-note">' +
    (units.length
      ? '🎉 所有單元、所有班級都完成了。下面可以打開來看。'
      : (phone ? '還沒有班級記過進度。到「快速記錄」記一筆就會出現在這裡。'
               : '還沒有單元，按右上角「新增單元」。')) + '</div>';
  h += '</div>';

  if (doneUnits.length) {
    h += '<details class="card fold done-units"><summary><i class="ci ci-done" aria-hidden="true">✅</i> 全部班級都完成的單元' +
      '<span class="n">' + doneUnits.length + ' 個</span>' +
      '<span class="en2">All classes complete</span></summary>' +
      '<div class="grid g2 units">' + doneUnits.map(unitCard).join('') + '</div></details>';
  }

  /* 這裡本來還有一張「📋 Unit List 單元管理」，列的是左邊同一批單元、
     連編輯鈕都一樣，等於同一頁把清單印兩次。2026-09-13 拿掉。
     狀態對照本來在右邊那條 340px 的側欄，2026-09-14 改成上面那條四欄的橫幅。 */
  return h;
}

function aprog() {
  /* 切換學期要跑一趟伺服器（重新讀整包資料），一兩秒跑不掉。
     所以按下去先把畫面切過去、鎖住按鈕、跳一句話，不要讓他站在那裡猜按到沒有。
     真的失敗再切回來——寧可晚一秒說「失敗」，也不要一秒都沒有反應。 */
  var sems = document.querySelectorAll('[data-sem]');
  Array.prototype.forEach.call(sems, function (b) {
    b.onclick = function () {
      if (b.className.indexOf('on') >= 0) return;   /* 已經在這個學期了 */
      var to = b.dataset.sem;
      Array.prototype.forEach.call(sems, function (x) {
        x.className = (x === b) ? 'on wait' : '';
        x.disabled = true;
      });
      toast('切換到' + (to === '2' ? '下' : '上') + '學期…');
      call('apiSwitchTerm', S.settings.year + '-' + to)
        .then(function (d) { refresh(d, '已切換到' + (to === '2' ? '下' : '上') + '學期'); })
        .catch(function (e) {
          Array.prototype.forEach.call(sems, function (x) {
            x.className = (x.dataset.sem === S.settings.semester) ? 'on' : '';
            x.disabled = false;
          });
          fail(e);
        });
    };
  });
  /* 手機上這三個沒有畫出來（見 vProg），所以要先確認存在 */
  if ($('fGrade')) $('fGrade').onchange = function () { UI.prog.grade = this.value; render(); };
  if ($('fCls'))   $('fCls').onchange   = function () { UI.prog.cls   = this.value; render(); };
  if ($('uAdd'))   $('uAdd').onclick    = function () { editUnit(null); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-eu]'), function (b) {
    b.onclick = function () { editUnit(b.dataset.eu); };
  });
  /* 手機：點某一班的圓點 → 帶著那個班、那個單元跳進快速記錄 */
  Array.prototype.forEach.call(document.querySelectorAll('[data-qgo]'), function (b) {
    b.onclick = function () {
      var x = b.dataset.qgo.split('|');
      UI.quick.cls = x[0];
      UI.quick.unitId = x[1];
      quickLoad();
      go('quick');
    };
  });
}

function editUnit(id) {
  if (isArchived()) return toast('這個學期已封存，只能查看。', true);
  var u = id ? unitOf(id) : { ord:S.units.length + 1, color:'blue' };

  modal(id ? '編輯單元' : '新增單元',
    '<div class="row"><div class="field" style="flex:0 0 90px"><label>序號</label>' +
      '<input type="number" id="uOrd" value="' + esc(u.ord || 1) + '" min="1"></div>' +
    '<div class="field"><label>英文名稱</label>' +
      '<input type="text" id="uEn" value="' + esc(u.nameEn || '') + '" placeholder="All About Me"></div>' +
    '<div class="field"><label>中文名稱</label>' +
      '<input type="text" id="uZh" value="' + esc(u.nameZh || '') + '" placeholder="關於我"></div></div>' +
    '<div class="field" style="margin-top:12px"><label>中文說明</label>' +
      '<input type="text" id="uDz" value="' + esc(u.descZh || '') + '" placeholder="探索自我 · 自畫像"></div>' +
    '<div class="field" style="margin-top:12px"><label>英文說明</label>' +
      '<input type="text" id="uDe" value="' + esc(u.descEn || '') + '"></div>' +
    '<div class="field" style="margin-top:12px"><label>教學目標（中文）</label>' +
      '<textarea id="uGz" placeholder="運用線條、形狀與色彩，創造出想像中的…">' + esc(u.goalZh || '') + '</textarea></div>' +
    '<div class="field" style="margin-top:12px"><label>教學目標（英文）</label>' +
      '<textarea id="uGe">' + esc(u.goalEn || '') + '</textarea></div>' +
    '<div class="row" style="margin-top:12px"><div class="field" style="flex:0 0 120px"><label>圖示</label>' +
      '<input type="text" id="uIc" value="' + esc(u.icon || '') + '" placeholder="🎨" maxlength="4"></div>' +
    '<div class="field"><label>代表色</label><select id="uCo">' +
      colorOptions(u.color || 'blue') + '</select></div></div>' +
    /* 挑好的一盤，點一下就換。自己貼別的 emoji 也還是可以（上面那格）。 */
    '<div class="field" style="margin-top:10px"><label>挑一個圖示</label>' +
      '<div class="emoji-pick" id="uIcPick">' + UNIT_ICONS.map(function (g) {
        return '<div class="g"><span>' + esc(g[0]) + '</span>' + g[1].map(function (e) {
          return '<button type="button" data-ic="' + esc(e) + '"' +
            (e === u.icon ? ' class="on"' : '') + '>' + e + '</button>';
        }).join('') + '</div>';
      }).join('') + '</div></div>' +
    '<div class="field" style="margin-top:12px"><label>封面範例 Cover</label>' +
      (id
        ? '<div class="cov-edit">' +
            '<div class="cov-pv c-' + (u.color || 'blue') + '" id="uCovPv">' +
              coverInner(u) + '</div>' +
            '<div class="cov-act">' +
              '<button type="button" class="btn ghost sm" id="uCovUp">📷 ' +
                (u.coverId ? '換一張' : '上傳封面') + '</button>' +
              '<button type="button" class="btn ghost sm" id="uCovDel" ' +
                'style="color:#c2354a;border-color:#f0c2cb' +
                (u.coverId ? '' : ';display:none') + '">移除封面</button>' +
              '<div class="hint">放一張學生作品或範例照片，教學進度頁的單元卡、' +
              '手機的單元按鈕都會用它當封面。沒放就顯示上面挑的圖示。' +
              '（會自動縮成長邊 1000，不會佔空間。）</div>' +

    /* ── 成果頁（家長端）的內容。全部選填，沒填那一塊就不會出現在成果頁。
       ⚠️ 這裡的「課堂觀察」跟教學札記頁的「單元省思」不是同一份：
          省思是你自己看的，這一段會公開給家長。 */
    '<details class="card fold" style="margin-top:14px"><summary><i class="ci ci-palette" aria-hidden="true">🎨</i> 成果頁內容' +
      '<span class="en2">給家長看的，全部可以留白</span></summary>' +
    '<div class="hint" style="margin-bottom:12px">' +
    '填了才會出現在班級成果頁。每一格都可以先空著，之後想到再回來補。<br>' +
    '成果頁上只會出現兩塊說明：<b>「今天，我們在學什麼？」</b>和' +
    '<b>「這堂課練習的，不只是畫畫」</b>。' +
    '「孩子怎麼學」和「課堂英文」留在這裡當課程資訊，家長看不到。<br>' +
    '⚠️ 這個單元要<b>照片上傳完＋進度標成「完成」</b>，家長那邊才看得到整個單元。</div>' +
    '<div class="field"><label>今天，我們在學什麼？（一段話）</label>' +
      '<textarea id="uLearn" placeholder="一個簡單的形狀，可以變成多少種不同的東西？…">' +
      esc(u.learnZh || '') + '</textarea>' +
      '<div class="hint">留白的話，成果頁上這一塊就不出現。</div></div>' +
    '<div class="field" style="margin-top:12px"><label>四個步驟（一行一個，中文｜英文）</label>' +
      '<textarea id="uSteps" placeholder="看一看|LOOK&#10;想一想|IMAGINE&#10;變一變|TRANSFORM&#10;畫出來|CREATE">' +
      esc(u.steps || '') + '</textarea></div>' +
    '<div class="field" style="margin-top:12px"><label>孩子怎麼學？（一段話）' +
      '<span class="hint" style="font-weight:500">　· 課程資訊，不會出現在成果頁</span></label>' +
      '<textarea id="uHow" placeholder="我沒有先告訴孩子這個形狀應該畫成什麼，而是…">' +
      esc(u.howZh || '') + '</textarea></div>' +
    '<div class="field" style="margin-top:12px"><label>課堂裡的英文句子（一行一句，英文｜中文）' +
      '<span class="hint" style="font-weight:500">　· 課程資訊，不會出現在成果頁</span></label>' +
      '<textarea id="uPhr" placeholder="What do you see?|你看到了什麼？&#10;What could it be?|它還可能變成什麼？">' +
      esc(u.phrases || '') + '</textarea></div>' +
    '<div class="field" style="margin-top:12px"><label>這堂課練習的能力（一行一項，名稱｜說明）</label>' +
      '<textarea id="uSkl" placeholder="觀察力|從形狀中發現特徵&#10;想像力|讓一個答案變成很多可能">' +
      esc(u.skills || '') + '</textarea></div>' +
    '<div class="field" style="margin-top:12px"><label>課堂觀察（寫給家長看的，可以分段）</label>' +
      '<textarea id="uNote" placeholder="一開始有些孩子會說「我不知道要畫什麼」，但當我們把紙轉一轉…">' +
      esc(u.noteZh || '') + '</textarea></div>' +
    '<div class="field" style="margin-top:12px"><label>想留給家長的一句話</label>' +
      '<input type="text" id="uQuote" value="' + esc(u.quoteZh || '') +
      '" placeholder="比起畫得像不像，我更在意孩子相信自己的想法值得被畫出來。"></div>' +
    /* 作品區上面那一句（2026-10-05）。本來寫死「每個孩子，看見的都不一樣」，
       八個單元都同一句；每個單元的作品不一樣，這一句也要各自寫。 */
    '<div class="field" style="margin-top:12px"><label>學生作品上面的那一句（中文）</label>' +
      '<input type="text" id="uGalZ" value="' + esc(u.galZh || '') +
      '" placeholder="例：同一捲紙膠帶，有人鋪成路，有人砌成牆。">' +
      '<div class="hint">每個單元的作品不一樣，這一句也各寫各的。留白的話只寫「學生作品」。</div></div>' +
    '<div class="field" style="margin-top:12px"><label>那一句的英文小標（選填）</label>' +
      '<input type="text" id="uGalE" value="' + esc(u.galEn || '') +
      '" placeholder="例：Same Tape. Different Mazes."></div>' +
    '<div class="field" style="margin-top:12px"><label>回家可以聊的問題</label>' +
      '<input type="text" id="uHomeQ" value="' + esc(u.homeQ || '') +
      '" placeholder="如果再給你一次同樣的形狀，你會把它變成什麼？"></div>' +
    '<div class="field" style="margin-top:12px"><label>再補一句（選填）</label>' +
      '<input type="text" id="uHomeT" value="' + esc(u.homeTip || '') +
      '" placeholder="沒有標準答案，聽聽孩子怎麼說就好。"></div>' +
    '</details>' +
    (id ? '<div style="margin-top:16px"><button class="btn ghost sm" id="uDel" ' +
          'style="color:#c2354a;border-color:#f0c2cb">刪除這個單元</button>' +
          '<div class="hint">連同這個單元的進度紀錄與作品照片一起刪掉，無法復原。</div></div>' : ''),
    function () {
      var o = {
        id:id, ord:Number($('uOrd').value) || 1,
        nameEn:$('uEn').value.trim(), nameZh:$('uZh').value.trim(),
        descZh:$('uDz').value.trim(), descEn:$('uDe').value.trim(),
        goalZh:$('uGz').value.trim(), goalEn:$('uGe').value.trim(),
        color:$('uCo').value, icon:$('uIc').value.trim(),
        /* 成果頁那一組。⚠️ 一定要全部送——後端是「有送才寫」，
           少送一個那一格就永遠改不掉（但也不會被洗掉）。 */
        learnZh:$('uLearn').value.trim(), steps:$('uSteps').value.trim(),
        howZh:$('uHow').value.trim(),     phrases:$('uPhr').value.trim(),
        skills:$('uSkl').value.trim(),    noteZh:$('uNote').value.trim(),
        quoteZh:$('uQuote').value.trim(), homeQ:$('uHomeQ').value.trim(),
        homeTip:$('uHomeT').value.trim(),
        galZh:$('uGalZ').value.trim(),    galEn:$('uGalE').value.trim()
      };
      if (!o.nameEn && !o.nameZh) { toast('請至少填一個單元名稱。', true); return false; }
      call('apiSaveUnit', o).then(function (d) { closeModal(); refresh(d, '單元已儲存'); }).catch(fail);
      return false;
    });
  /* 封面：上傳／移除。⚠️ 存完用 refresh() 就好——彈出視窗掛在 #mask 底下，
     不在 #views 裡面，render() 不會把它關掉；只有預覽要自己換一下。 */
  function setCover(b64) {
    toast(b64 ? '上傳封面中…' : '移除封面中…');
    call('apiSaveUnitCover', id, b64 || '', 'image/jpeg').then(function (d) {
      var nu = (d.units || []).filter(function (x) { return String(x.id) === String(id); })[0];
      if ($('uCovPv')) $('uCovPv').innerHTML = coverInner(nu || {});
      if ($('uCovUp')) $('uCovUp').textContent = (nu && nu.coverId) ? '📷 換一張' : '📷 上傳封面';
      if ($('uCovDel')) $('uCovDel').style.display = (nu && nu.coverId) ? '' : 'none';
      refresh(d, b64 ? '封面已更新' : '封面已移除');
    }).catch(fail);
  }
  if ($('uCovUp')) {
    $('uCovUp').onclick = function () {
      var inp = $('filePick');
      inp.value = ''; inp.multiple = false;
      inp.onchange = function () {
        var f = (inp.files || [])[0];
        inp.multiple = true;                 /* 還原，作品照片那邊是多選 */
        if (!f) return;
        shrink(f, 1000, 0.85).then(setCover).catch(fail);
      };
      inp.click();
    };
  }
  if ($('uCovDel')) $('uCovDel').onclick = function () { setCover(''); };

  if ($('uIcPick')) {
    Array.prototype.forEach.call($('uIcPick').querySelectorAll('[data-ic]'), function (b) {
      b.onclick = function () {
        $('uIc').value = b.dataset.ic;
        Array.prototype.forEach.call($('uIcPick').querySelectorAll('[data-ic]'), function (x) {
          x.classList.toggle('on', x === b);
        });
      };
    });
  }
  if (id && $('uDel')) {
    $('uDel').onclick = function () {
      /* ⚠️ ask() 會把這個編輯視窗整個換掉。按「取消」要把它原封不動放回來——
         以前直接關掉，剛打的字全沒了（2026-10-06 健檢）。
         搬的是 DOM 節點本身，所以打的字和綁好的事件都還在。 */
      var body = $('maskBody'), keep = Array.prototype.slice.call(body.childNodes);
      keep.forEach(function (n) { body.removeChild(n); });
      ask('它的進度紀錄與作品照片也會一起刪掉，無法復原。', '刪除',
          '確定要刪掉「' + (u.nameZh || u.nameEn) + '」？').then(function (yes) {
        if (!yes) {
          body.innerHTML = '';
          keep.forEach(function (n) { body.appendChild(n); });
          $('mask').className = 'mask on';
          return;
        }
        call('apiDeleteUnit', id).then(function (d) { closeModal(); refresh(d, '單元已刪除'); }).catch(fail);
      });
    };
  }
}

/* ══════════════════════════════════════════════════════════════
   4. 教學札記 Teaching Notes
   ══════════════════════════════════════════════════════════════ */
function vNotes() {
  /* 這一頁分兩層，由上而下：
     1)「單元省思」——一個單元教完之後的總結，資訊卡，是這一頁的重點
     2)「每週課堂札記」——手機上隨手記的那些，留著查
        （下週上課前先翻一下上週有沒有特殊情況）
     手機上隨手記的入口在「快速記錄」，不在這裡。 */
  var h = hero('Teaching Notes', '教學札記', '教完一個單元，停下來想一想。',
    'Reflect after each unit. Keep what worked, change what did not.',
    '上面是每個單元教完後的總結省思，下面是每週課堂上隨手記的那些。');

  /* ⚠️ 「補一筆課堂札記」那張表單本來常駐攤開在最上面，佔掉整個第一屏——
     但那件事平常在手機的「快速記錄」就做完了，這一頁的重點是**單元省思**
     （2026-09-15 他說的）。改成單元省思卡右上角一顆按鈕，要補才打開彈出視窗。 */

  /* ── 單元省思 ───────────────────────────────────────── */
  var classes = sortedClasses();
  var units   = sortedUnits();
  var wrote   = units.filter(function (u) { return String(u.reflect || '').trim(); }).length;

  h += '<div class="card"><h3><i class="ci ci-sprout" aria-hidden="true">🌱</i> 單元省思 <span class="en2">Unit Reflections</span>' +
    '<span class="right" style="display:flex;gap:10px;align-items:center">' +
      '<span class="hint">' + units.length + ' 個單元 · 已經寫了 ' + wrote + ' 則</span>' +
      '<button class="btn ghost sm no-print" id="nAdd">✍️ 補一筆札記</button></span></h3>' +
    '<div class="hint" style="margin:-4px 0 12px">一個單元一則，教完之後寫。' +
    '整體效果如何、哪裡卡住、下次再教要怎麼調整——下一輪再教這個單元時，這裡就是起點。</div>' +
    '<div class="refls">';

  h += units.map(function (u) {
    var doneN = classes.filter(function (c) {
      var pr = progOf(c.code, u.id); return pr && pr.status === 'done';
    }).length;
    var pct  = classes.length ? Math.round(doneN / classes.length * 100) : 0;
    var lp   = unitPeriods(u.id);
    var txt  = String(u.reflect || '').trim();
    var when = String(u.reflectAt || '').slice(0, 10);
    return '<div class="refl' + (txt ? ' done' : '') + '"><div class="hd">' +
      '<div class="no c-' + (u.color || 'blue') + '">' + esc(u.ord) + '</div>' +
      '<div class="nm"><div class="e">' + esc(u.nameEn) + '</div>' +
        '<div class="z">' + esc(u.nameZh) + '</div></div></div>' +
      '<div class="pg"><span class="hint">' + doneN + '/' + classes.length + ' 班完成</span>' +
        '<span class="bar"><i style="width:' + pct + '%"></i></span><b>' + pct + '%</b>' +
        (lp.total ? '<span class="hint lp">' + lp.avg + ' 節/班</span>' : '') + '</div>' +
      (txt ? '<div class="tx">' + esc(txt) + '</div>'
           : '<div class="tx none">' +
             (pct === 100 ? '這個單元各班都上完了，可以寫了。'
                          : '教完之後在這裡寫下這個單元的總結。') + '</div>') +
      /* 這個單元的課堂札記直接列在省思底下——寫省思之前想知道
         「這個單元的課堂上發生過什麼」，不用再捲到下面那張表去翻
         （2026-09-15 他要的）。最多列五則，其餘只報數字。 */
      (function () {
        var ns = S.notes.filter(function (x) { return String(x.unitId) === String(u.id); })
          .sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
        if (!ns.length) return '<div class="rn none">還沒有課堂札記。</div>';
        return '<div class="rn"><div class="lb">課堂札記 ' + ns.length + ' 則</div>' +
          ns.slice(0, 5).map(function (x) {
            return '<div class="r"><span class="d">' +
              esc(String(x.date).slice(5).replace('-', '/')) + '</span>' +
              '<span class="badge c-' + colorOf(x.cls) + '">' + esc(x.cls || '—') + '</span>' +
              '<span class="t">' + esc(x.text) + '</span></div>';
          }).join('') +
          (ns.length > 5 ? '<div class="more">還有 ' + (ns.length - 5) + ' 則，在下面那張表裡</div>' : '') +
          '</div>';
      })() +
      '<div class="ft"><span class="hint">' +
        (when ? esc(when) + ' 更新' : '還沒寫') + '</span>' +
        '<button class="btn ghost sm no-print" data-rf="' + esc(u.id) + '">' +
        (txt ? '✏️ 編輯' : '✏️ 寫省思') + '</button></div></div>';
  }).join('') || '<div class="empty-note">還沒有單元。到「教學進度」新增一個。</div>';
  h += '</div></div>';

  /* ── 每週課堂札記 ───────────────────────────────────── */
  var fC = UI.notes.cls || '', fW = UI.notes.wk || '';
  var list = S.notes.slice().sort(function (a, b) {
    return String(b.date).localeCompare(String(a.date)) || String(b.at).localeCompare(String(a.at));
  }).filter(function (n) { return !fC || String(n.cls) === String(fC); });

  if (fW) {
    var r = weekRange(fW === 'last' ? -1 : 0);
    list = list.filter(function (n) {
      var d = String(n.date).slice(0, 10);
      return d >= r.a && d <= r.b;
    });
  }

  h += '<div class="card" style="margin-top:16px"><h3><i class="ci ci-pending" aria-hidden="true">📄</i> 每週課堂札記 <span class="en2">Weekly Class Notes</span>' +
    '<span class="right no-print" style="display:flex; gap:8px">' +
      '<select id="nWk" style="max-width:150px">' +
        '<option value="">全部週次</option>' +
        '<option value="this"' + (fW === 'this' ? ' selected' : '') + '>本週（第 ' + S.wk.week + ' 週）</option>' +
        '<option value="last"' + (fW === 'last' ? ' selected' : '') + '>上週（第 ' + Math.max(1, S.wk.week - 1) + ' 週）</option>' +
      '</select>' + selClasses('nFil', fC, '全部班級') + '</span></h3>';
  h += list.length ? ('<div class="scroll-x"><table class="tb"><thead><tr>' +
    '<th style="width:110px">日期</th><th style="width:76px">班級</th><th style="width:270px">單元</th>' +
    '<th>內容</th><th style="width:90px" class="no-print"></th></tr></thead><tbody>' +
    list.map(function (n) {
      return '<tr><td>' + esc(n.date) + '</td>' +
        '<td><span class="badge c-' + colorOf(n.cls) + '">' + esc(n.cls || '—') + '</span></td>' +
        '<td>' + unitCell(n.unitId) + '</td>' +
        '<td style="white-space:pre-wrap">' + esc(n.text) + '</td>' +
        '<td class="no-print"><button class="btn ghost sm" data-dn="' + esc(n.id) + '">刪除</button></td></tr>';
    }).join('') + '</tbody></table></div>') :
    ('<div class="empty-note">' + (fC || fW ? '這個條件下沒有札記。' : '還沒有課堂札記。') + '</div>');
  h += '</div>';
  return h;
}

/* 第幾週的星期一到星期日。0＝本週、-1＝上週 */
function weekRange(offset) {
  var m = new Date(S.wk.monday + 'T00:00:00');
  m.setDate(m.getDate() + offset * 7);
  var e = new Date(m.getTime());
  e.setDate(e.getDate() + 6);
  var ymd = function (d) {
    return d.getFullYear() + '-' +
      ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  };
  return { a: ymd(m), b: ymd(e) };
}

/* 補一筆課堂札記。⚠️ 常駐攤開在頁面最上面會佔掉整個第一屏，
   但這件事平常在手機的「快速記錄」就做完了——所以收成彈出視窗，要補才開。
   預設帶入今天、以及「單元省思」那一格的單元（從那張卡點進來的話）。 */
function addNote(unitId) {
  if (isArchived()) return toast('這個學期已封存，只能查看。', true);
  modal('補一筆課堂札記',
    '<div class="row">' +
      '<div class="field" style="max-width:190px"><label>日期 Date</label>' +
        '<input type="date" id="nDate" value="' + esc(S.today) + '"></div>' +
      '<div class="field" style="max-width:170px"><label>班級 Class</label>' +
        selClasses('nCls', '', '（不指定）') + '</div>' +
    '</div>' +
    '<div class="field" style="margin-top:12px"><label>單元 Unit</label>' +
      selUnits('nUnit', unitId || '', '（不指定）') + '</div>' +
    '<div class="field wide" style="margin-top:12px"><label>札記內容</label>' +
      '<textarea id="nText" placeholder="今天學生們創意十足！大多數已完成上色，下週進行作品分享。"></textarea></div>' +
    '<div class="hint" style="margin-top:8px">課堂上隨手記通常在手機的「快速記錄」就寫完了，' +
    '這裡是事後想補一筆、或補別天的時候用。</div>',
    function () {
      var o = { date:$('nDate').value, cls:$('nCls').value,
                unitId:$('nUnit').value, text:$('nText').value.trim() };
      if (!o.text) { toast('請先寫點東西。', true); return false; }
      call('apiSaveNote', o)
        .then(function (d) { closeModal(); refresh(d, '札記已儲存'); })
        .catch(fail);
      return false;                       /* 存完才自己關，失敗要留在視窗裡 */
    });
  if ($('nText')) $('nText').focus();
}

function anotes() {
  if ($('nAdd')) $('nAdd').onclick = function () { addNote(''); };
  $('nFil').onchange = function () { UI.notes.cls = this.value; render(); };
  $('nWk').onchange  = function () { UI.notes.wk  = this.value; render(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-rf]'), function (b) {
    b.onclick = function () { editReflect(b.dataset.rf); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-dn]'), function (b) {
    b.onclick = function () {
      ask('刪掉之後就找不回來了。', '刪除', '確定刪掉這筆札記？').then(function (yes) {
        if (!yes) return;
        call('apiDeleteNote', b.dataset.dn).then(function (d) { refresh(d, '已刪除'); }).catch(fail);
      });
    };
  });
}

/* 單元省思。桌機用彈出視窗，手機走「專心打字」那一層（見 focusEdit）。 */
function editReflect(id) {
  if (isArchived()) return toast('這個學期已封存，只能查看。', true);
  var u = unitOf(id);
  if (!u) return;
  var name = (u.nameZh || '') + (u.nameEn ? ' ' + u.nameEn : '');
  var ph   = '整體效果如何？哪裡卡住？下次再教要怎麼調整？';
  var save = function (v) {
    call('apiSaveReflect', id, v)
      .then(function (d) { closeModal(); refresh(d, v ? '省思已儲存' : '省思已清空'); })
      .catch(fail);
  };
  if (isPhone()) return focusEdit(String(u.reflect || ''), '單元省思 · ' + (u.nameZh || u.nameEn),
                                  ph, function (v) { save(String(v).trim()); });
  modal('單元省思 · ' + name,
    '<div class="field wide"><label>教完這個單元之後的總結</label>' +
      '<textarea id="rfTx" style="min-height:200px" placeholder="' + esc(ph) + '">' +
      esc(u.reflect || '') + '</textarea></div>' +
    '<div class="hint" style="margin-top:8px">清空再按確定，就是把這則省思刪掉。</div>',
    function () { save($('rfTx').value.trim()); return false; });
}

</script>

<script>
/* ══════════════════════════════════════════════════════════════
   5. 進度檢核 Progress Check
      這是每堂課下課後會用的那一頁：勾狀態、記缺席、上傳作品照。
   ══════════════════════════════════════════════════════════════ */
function checkInit() {
  var c = UI.check;
  if (!c.cls)    c.cls    = (sortedClasses()[0] || {}).code || '';
  if (!c.unitId) {
    var cu = currentUnit(c.cls) || sortedUnits()[0];   /* 預設帶入這一班正在上的單元 */
    c.unitId = cu ? cu.id : '';
  }
  if (!c.date)   c.date   = S.today;
  /* 這一筆是哪一節上的。連堂時兩節可能不同單元，不記節次就分不出來
     （2026-09-15 他提的）。課表上沒有這一班就留 0＝不寫節次紀錄。 */
  if (!c.period) c.period = checkPeriodFor(c.cls, c.date);
  var cl = clsOf(c.cls);
  if (!c.grade && cl) c.grade = cl.grade;
  /* 只有換班級或換單元時才重讀，否則會把使用者剛勾的狀態蓋回舊值 */
  if (c.loaded !== c.cls + "|" + c.unitId + "|" + c.date) loadProg();
}

/* 某一天課表上這一班的節次（進度檢核可以挑別天，所以要照那一天的星期算） */
function dayOfDate(ymd) {
  var p = String(ymd || '').split('-');
  if (p.length < 3) return 0;
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getDay();
  return (d >= 1 && d <= 5) ? d : 0;
}
function checkPeriods(cls, date) { return periodsOn(cls, date); }
function checkPeriodFor(cls, date) {
  var ps = checkPeriods(cls, date);
  if (!ps.length) return 0;
  for (var i = 0; i < ps.length; i++) {
    if (!lessonAt(date, ps[i], cls)) return ps[i];
  }
  return ps[0];
}

/* 把已存在的紀錄讀進表單 */
function loadProg() {
  var c = UI.check;
  c.loaded = c.cls + "|" + c.unitId + "|" + c.date;
  closeEdit('kNote');                /* 換班級或換日期就收回唯讀 */
  var p = progOf(c.cls, c.unitId);
  c.prgId  = p ? p.id : '';
  c.status = p ? p.status : '';      /* 同上 */
  /* 課堂札記＝那一天的那一筆。舊資料還留在進度列上，讀不到才退回去拿 */
  c.note   = noteOf(c.date, c.cls, c.unitId) || (p ? p.note : '');
  var a = S.absences.filter(function (x) {
    return String(x.cls) === String(c.cls) && Number(x.week) === weekOfDate(c.date);
  })[0];
  c.absId = a ? a.id : '';
  c.seats = seatsFix(a ? a.seats : '');   /* 被吃成日期的先撿回來再帶進輸入框 */
}

function vCheck() {
  checkInit();
  var c = UI.check, cl = clsOf(c.cls) || {}, u = unitOf(c.unitId);
  var grades = [];
  S.classes.forEach(function (x) { if (grades.indexOf(x.grade) < 0) grades.push(x.grade); });

  var h = hero('Progress Check', '進度檢核', '快速記錄 · 掌握進度 · 看見每一個孩子的創造力！',
    'Quick record · Track progress · Celebrate every child\'s creativity!',
    '下課後三十秒：勾一個狀態、記下缺席號碼、拍幾張作品照，就完成了。',
    'Small Steps<br><em>Big Artists!</em>');

  var kPers = checkPeriods(c.cls, c.date);

  h += '<div class="card no-print"><div class="row">' +
    '<div class="field"><label>Grade 年級</label><select id="kGrade">' +
      grades.map(function (g) {
        return '<option value="' + esc(g) + '"' + (g === c.grade ? ' selected' : '') + '>' + esc(g) + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label>Class 班級</label>' + selClasses('kCls', c.cls) + '</div>' +
    '<div class="field" style="flex:2 1 280px"><label>Unit / Task 單元 / 任務</label>' +
      selUnits('kUnit', c.unitId) + '</div>' +
    '<div class="field"><label>Date 日期</label>' +
      '<input type="date" id="kDate" value="' + esc(c.date) + '"></div>' +
    /* 連堂才問是第幾節；只有一節（或那天沒這一班）就不多問。 */
    (kPers.length > 1
      ? '<div class="field" style="max-width:200px"><label>Period 第幾節</label>' +
        '<select id="kPer">' + kPers.map(function (no) {
          var pl = lessonAt(c.date, no, c.cls), pu = pl ? unitOf(pl.unitId) : null;
          return '<option value="' + no + '"' +
            (Number(no) === Number(c.period) ? ' selected' : '') + '>第 ' + no + ' 節' +
            (pu ? '（' + esc(pu.nameZh || pu.nameEn) + '）' : '') + '</option>';
        }).join('') + '</select></div>'
      : '') +
    '</div><div class="hint" style="margin-top:8px">' +
    '改上面任何一項都會自動把該班的紀錄帶出來，不用再按載入。' +
    (kPers.length > 1
      ? '　這一班這天連上 ' + kPers.length + ' 節，兩節上不同單元時記得先選節次——' +
        '課表上每一節就會各自顯示自己的單元。'
      : '') + '</div></div>';

  /* 班級牌 ＋ 單元資訊 */
  h += '<div class="k-head">' +
    /* 年級那一行拿掉了（上面的下拉本來就寫著年級），剩下的置中對齊，
       整張牌不再上面擠、下面空（2026-09-14 他圈的）。 */
    '<div class="card cls-plate k-' + (cl.color || 'blue') + '">' +
      '<div class="n">' + esc(c.cls) + '</div>' +
      '<div class="hint">Class ' + esc(c.cls) + '</div></div>' +
    '<div class="card" style="margin:0">' +
      (u ? '<h3 style="border:0;padding:0;margin-bottom:6px">' +
             '<span class="dot c-' + (u.color || 'blue') + '">' + esc(u.ord) + '</span>' +
             esc(u.nameZh || u.nameEn) + ' <span class="en2">' + esc(u.nameEn) + '</span></h3>' +
           '<div style="font-size:14px;font-weight:700;color:#3d4852">教學目標 Learning Objectives</div>' +
           '<div>' + esc(u.goalZh || u.descZh || '（還沒填教學目標，可到「教學進度」頁編輯單元補上。）') + '</div>' +
           '<div class="hint" style="font-size:14px">' + esc(u.goalEn || u.descEn || '') + '</div>'
         : '<div class="empty-note">還沒有單元，請先到「教學進度」新增。</div>') +
    '</div></div>';

  /* 狀態 ＋ 課堂札記 ＋ 缺席 */
  h += '<div class="grid k3" style="margin-bottom:16px">';

  h += '<div class="card" style="margin:0"><h3><i class="ci ci-target" aria-hidden="true">🎯</i> 本次進度狀態 <span class="en2">Progress Status</span></h3>' +
    '<div class="picks">' + ST_ORDER.map(function (k) {
      var s = ST[k];
      return '<button class="pick ' + (c.status === k ? 'on ' + s.k : '') + '" data-st="' + k + '" ' +
        'style="' + (c.status === k ? 'color:' + s.c : '') + '">' +
        '<span class="h"><span class="dot ' + s.k + '">' + stMark(k) + '</span>' +
        '<span class="z">' + s.z + '</span><span class="e">' + s.e + '</span></span>' +
        '<span class="d">' + s.d + '</span></button>';
    }).join('') + '</div></div>';

  /* 這裡寫的就是「教學札記」那一頁看到的同一筆，不再是各存各的 */
  var past = notesOf(c.cls, c.unitId, c.date).slice(0, 4);
  h += '<div class="card" style="margin:0"><h3><i class="ci ci-notes" aria-hidden="true">✏️</i> 課堂札記 <span class="en2">Class Note</span>' +
    '<span class="right hint">' + esc(c.date) + '</span></h3>' +
    editBlock('kNote', c.note, '今天學生們創意十足！大多數已完成上色，下週進行作品分享。',
              '課堂札記 Class Note') +
    (past.length
      ? '<div class="past"><div class="t">這一班這個單元以前寫過的</div>' +
        past.map(function (n) {
          return '<div class="it"><span class="d">' +
            esc(String(n.date).slice(5).replace('-', '/')) + '</span>' +
            '<span class="x">' + esc(n.text) + '</span></div>';
        }).join('') + '</div>'
      : '') +
    '</div>';

  h += '<div class="card" style="margin:0"><h3><i class="ci ci-chair" aria-hidden="true">👥</i> 缺席座號 <span class="en2">Absent</span></h3>' +
    '<input type="text" id="kSeats" value="' + esc(c.seats) + '" ' +
    'placeholder="例如 9, 17, 25">' +
    repeatLine(c.cls, seatList(c.seats)) +
    '<div class="hint" style="margin-top:6px">以逗號分隔，沒人缺席就留空。' +
    '存檔時會一起記到「出席狀況」那頁的第 ' +
    S.wk.week + ' 週。</div></div>';

  h += '</div>';

  /* 作品照片 ＋ 快速操作 */
  var phs = photosOf(c.prgId);
  h += '<div class="cols"><div class="card" style="margin:0">' +
    '<h3><i class="ci ci-works" aria-hidden="true">📷</i> 學生作品照片 <span class="en2">Student Work Photos</span>' +
    '<span class="right hint">' + phs.length + ' 張</span></h3><div class="photos" id="kPhotos">' +
    phs.map(function (p) {
      return '<div class="ph" data-ph="' + esc(p.id) + '">' +
        '<img data-file="' + esc(p.fileId) + '" data-thumb="' + esc(p.thumbId || '') + '" alt="' +
          esc(p.cap || '學生作品') + '">' +
        '<button class="x no-print" data-delph="' + esc(p.id) + '" title="刪除">✕</button>' +
        (p.cap ? '<div class="cap">' + esc(p.cap) + '</div>' : '') + '</div>';
    }).join('') +
    '<div class="ph add no-print" id="kAddPh"><div><span>＋</span>新增照片<br>Add Photo</div></div>' +
    '</div><div class="hint" style="margin-top:10px">' +
    '照片會自動縮成兩份（顯示用的小圖、保存用的大圖）存進雲端硬碟，不會塞爆試算表。</div></div>';

  /* ⚠️ 這張卡在右邊那條 340px 的側欄裡，寫死兩欄會爆出框（見 .auto 的註解）。
     用 .auto 讓它自己算：側欄裡排成一欄，側欄收掉變整頁寬時自動並排。 */
  h += '<div><div class="card"><h3><i class="ci ci-quick" aria-hidden="true">⚡</i> 快速操作 <span class="en2">Quick Actions</span></h3>' +
    '<div class="grid auto">' +
    '<button class="btn lg" id="kSave"><span class="z">💾 儲存本次紀錄</span><span class="e">Save Record</span></button>' +
    '<button class="btn purple lg" id="kCopy"><span class="z">📋 複製上週紀錄</span><span class="e">Copy Last Week</span></button>' +
    /* 「標記單元完成」和「新增作品照片」2026-09-15 拿掉了：前者就是上面那排
       狀態裡的「完成」，後者就是照片那張卡的「＋」，同一件事在同一頁畫兩次。 */
    '</div></div>';
  /* 「教學省思」那張小卡 2026-09-14 搬到教學札記那一頁去了——
     下課後三十秒要做的事，不該跟慢慢想的省思擠在同一頁。 */
  h += '</div></div>';

  /* 班級進度一覽 */
  /* ⚠️ 已完成的預設不列——他要掌握的是「還在進行的班級」（2026-09-14）。
     但不是刪掉：右上角那顆可以把完成的叫回來，偶爾要查還是查得到。 */
  var all = S.progress.slice().sort(function (a, b) {
    return String(a.cls).localeCompare(String(b.cls)) ||
           String(b.updatedAt).localeCompare(String(a.updatedAt));
  });
  var doneRows = all.filter(function (p) { return p.status === 'done'; }).length;
  var rows = UI.check.showDone ? all : all.filter(function (p) { return p.status !== 'done'; });

  h += '<div class="card" style="margin-top:16px"><h3><i class="ci ci-prog" aria-hidden="true">📊</i> 班級進度一覽 <span class="en2">Class Progress Overview</span>' +
    '<span class="right hint">點任一列可載入該班資料</span>' +
    (doneRows ? '<button class="btn ghost sm no-print" id="kDoneToggle" style="margin-left:10px">' +
       (UI.check.showDone ? '只看進行中' : '顯示已完成（' + doneRows + '）') + '</button>' : '') +
    '</h3><div class="scroll-x">' +
    '<table class="tb"><thead><tr><th style="width:84px">年級</th><th style="width:78px">班級</th>' +
    '<th style="width:270px">單元 / 任務</th><th style="width:132px">進度狀態</th>' +
    '<th style="width:118px">上次紀錄</th><th style="width:120px">缺席座號</th>' +
    '<th>課堂札記</th></tr></thead><tbody>';
  h += rows.length ? rows.map(function (p) {
    var cc = clsOf(p.cls) || {};
    var ab = S.absences.filter(function (x) {
      return String(x.cls) === String(p.cls) && Number(x.week) === Number(S.wk.week); })[0];
    var on = (String(p.cls) === String(c.cls) && String(p.unitId) === String(c.unitId));
    return '<tr data-row="' + esc(p.cls) + '|' + esc(p.unitId) + '"' +
      (on ? ' style="background:#fdf6e3"' : '') + '>' +
      '<td>' + esc(cc.grade || '') + '</td>' +
      '<td><span class="badge c-' + colorOf(p.cls) + '">' + esc(p.cls) + '</span></td>' +
      '<td>' + unitCell(p.unitId) + '</td>' +
      '<td>' + badge(p.status) + '</td>' +
      '<td>' + esc(p.date) + '</td>' +
      '<td>' + esc(ab && ab.seats ? ab.seats : '–') + '</td>' +
      '<td>' + esc(p.note) + '</td></tr>';
  }).join('') : '<tr><td colspan="7" class="empty-note">' +
    (all.length ? '所有班級的進度都完成了 🎉' : '還沒有任何進度紀錄。') + '</td></tr>';
  h += '</tbody></table></div></div>';

  /* ⚠️ 桌機版的「儲存」本來只在右欄下面，勾完狀態要往下滑才按得到——
     這是他每天按最多次的按鈕。改成跟手機一樣，固定在畫面底部。
     按的是同一支 saveCheck()（acheck 裡把兩顆綁在一起）。 */
  if (!isPhone()) {
    var stNow = c.status ? ST[c.status] : null;
    h += '<div class="save-bar no-print">' +
      '<span class="badge c-' + colorOf(c.cls) + '">' + esc(c.cls) + '</span>' +
      '<b>' + esc(unitName(c.unitId) || '還沒選單元') + '</b>' +
      '<span class="hint">' + esc(c.date) + '　' +
        (stNow ? stNow.z + ' ' + stNow.e : '還沒選進度狀態') + '</span>' +
      '<button class="btn" id="kSaveBar">💾 儲存本次紀錄</button></div>';
  }
  return h;
}

/* 換班級／日期／節次之後，把單元切成「那一節上的那個」 */
function pickCheckSlot(period) {
  var c = UI.check;
  c.period = period || checkPeriodFor(c.cls, c.date);
  var u = (c.period ? unitForSlot(c.date, c.period, c.cls) : currentUnit(c.cls));
  if (u) c.unitId = u.id;
  loadProg();
}

function acheck() {
  var c = UI.check;
  if ($('kSaveBar')) $('kSaveBar').onclick = function () { $('kSave').click(); };
  if ($('kDoneToggle')) $('kDoneToggle').onclick = function () {
    c.showDone = !c.showDone;
    render();
  };
  $('kGrade').onchange = function () {
    c.grade = this.value;
    var first = sortedClasses().filter(function (x) { return x.grade === c.grade; })[0];
    if (first) c.cls = first.code;
    pickCheckSlot(0); render();
  };
  $('kCls').onchange  = function () { c.cls = this.value; pickCheckSlot(0); render(); };
  $('kUnit').onchange = function () { c.unitId = this.value; loadProg(); render(); };
  /* 換日期＝看另一天的紀錄，所以也要重讀 */
  $('kDate').onchange = function () { c.date = this.value; pickCheckSlot(0); render(); };
  if ($('kPer')) $('kPer').onchange = function () { pickCheckSlot(Number(this.value)); render(); };

  Array.prototype.forEach.call(document.querySelectorAll('[data-st]'), function (b) {
    b.onclick = function () {
      if ($('kNote')) c.note = $('kNote').value;
      c.seats = $('kSeats').value;
      /* 點已經選起來的那個就取消 */
      c.status = (c.status === b.dataset.st) ? '' : b.dataset.st;
      render();
    };
  });
  if ($('kNote')) $('kNote').oninput = function () { c.note = this.value; };
  $('kSeats').oninput = function () { c.seats = this.value; };

  $('kSave').onclick = function () { saveCheck(c.status); };
  $('kCopy').onclick = function () {
    call('apiCopyLast', c.cls, c.unitId).then(function (r) {
      if (!r) return toast('這一班還沒有其他紀錄可以複製。', true);
      c.status = r.status; c.note = r.note; render();
      toast('已帶入上一次的狀態與札記，確認後請按「儲存本次紀錄」。');
    }).catch(fail);
  };

  $('kAddPh').onclick = function () {
    ensureCheckPrg().then(function (id) { if (id) pickPhotos(id); })
      .catch(function () { /* 訊息已經提示過了 */ });
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-delph]'), function (b) {
    b.onclick = function (ev) {
      ev.stopPropagation();
      ask('刪掉之後會移到垃圾桶，無法從網頁復原。', '刪除', '刪除這張照片？').then(function (yes) {
        if (!yes) return;
        call('apiDeletePhoto', b.dataset.delph).then(function () {
          dropPhotoLocal(b.dataset.delph);     /* 不用重抓整包資料 */
          refresh(null, '照片已刪除');
        }).catch(fail);
      });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-row]'), function (tr) {
    tr.style.cursor = 'pointer';
    tr.onclick = function () {
      var p = tr.dataset.row.split('|');
      c.cls = p[0]; c.unitId = p[1];
      var cl = clsOf(c.cls); if (cl) c.grade = cl.grade;
      loadProg(); render(); window.scrollTo(0, 0);
    };
  });
}

function saveCheck(status) {
  var c = UI.check;
  /* ⚠️ 每一條路都要回 Promise：ensureCheckPrg()（還沒存就先按拍照）接在後面。
     問「要不要刪」變成非同步之後，這件事比以前更重要。 */
  if (!c.unitId) { toast('請先選一個單元。', true); return Promise.resolve(null); }
  c.note  = $('kNote') ? $('kNote').value : c.note;
  c.seats = $('kSeats') ? $('kSeats').value : c.seats;
  closeEdit('kNote');
  return okToDropProgress(c.cls, c.unitId, c.prgId, status).then(function (go) {
    if (!go) return null;
    var btns = document.querySelectorAll('.btn.lg');
    Array.prototype.forEach.call(btns, function (b) { b.disabled = true; });

    /* 進度和缺席同一次呼叫就存完（座號空白＝全到，後端會把那一列刪掉）。
       回傳 Promise，「還沒存就先按拍照」那條路才接得上。 */
    return call('apiSaveClassRecord', { cls:c.cls, unitId:c.unitId, status:status,
                                 date:c.date, note:c.note, period:c.period,
                                 week:weekOfDate(c.date), seats:c.seats })
      .then(function (r) {
        c.prgId = r.prgId;
        return r.data;
      })
      .then(function (d) {
        refresh(d, '已儲存 ' + c.cls + ' 班的紀錄' + (status === 'done' ? '，單元標記為完成' : ''));
        return d;
      })
      .catch(function (e) {
        Array.prototype.forEach.call(btns, function (b) { b.disabled = false; });
        fail(e);
        throw e;
      });
  });
}

/* 要上傳照片就得先有進度紀錄。快速記錄本來就會自動先存一筆，
   檢核頁以前卻是丟一句「請先按儲存」把人擋回去——兩邊行為統一。 */
function ensureCheckPrg() {
  var c = UI.check;
  if (c.prgId) return Promise.resolve(c.prgId);
  if (!c.unitId) { toast('請先選一個單元。', true); return Promise.reject(); }
  if (!c.status) { toast('請先點一個進度狀態，才存得了紀錄。', true); return Promise.reject(); }
  toast('先幫你存一筆紀錄…');
  return saveCheck(c.status).then(function () { return UI.check.prgId; });
}

/* ── 照片：讀縮圖、選檔、壓縮、上傳 ─────────────────────── */
/* 縮圖一次抓八張。
   一張一趟的話，十張照片就要等十趟伺服器往返，畫面會一格一格慢慢長出來。 */
/* ── 縮圖：捲到才抓 ─────────────────────────────────────────
 *  ⚠️ 以前一進頁面就把畫面上所有縮圖排隊抓完。一個班一個單元二十幾張，
 *     等於一開頁就要搬兩三 MB 的 base64，但第一眼看得到的只有幾張
 *     （2026-09-15 他回報照片顯示得慢）。現在只抓「快捲到」的，提前 600px。
 *  ⚠️ 每次重畫要先 disconnect——舊的 <img> 已經被 innerHTML 換掉了。
 *  ⚠️ call() 會自己開關最上面那條 .loadbar，所以捲動時會一直閃；
 *     縮圖走 quiet:true 這條路，不要碰進度條。
 */
var TH_Q = [], TH_T = null, TH_OB = null;

function thumbSeen(img) {
  if (img.dataset.q) return;
  img.dataset.q = '1';
  TH_Q.push(img);
  clearTimeout(TH_T);
  TH_T = setTimeout(thumbFlush, 40);
}

function thumbWatch(img) {
  if (!window.IntersectionObserver) return thumbSeen(img);   /* 舊瀏覽器就照舊全抓 */
  if (!TH_OB) {
    TH_OB = new IntersectionObserver(function (es) {
      for (var i = 0; i < es.length; i++) {
        if (!es[i].isIntersecting) continue;
        TH_OB.unobserve(es[i].target);
        thumbSeen(es[i].target);
      }
    }, { rootMargin: '600px 0px' });
  }
  TH_OB.observe(img);
}

var TH_NET = null;

function loadThumbs() {
  if (TH_OB) TH_OB.disconnect();
  TH_Q = [];
  clearTimeout(TH_NET);

/* ⚠️ 保險絲：三秒後把剩下的也抓一抓。
   IntersectionObserver 在 LINE／FB 那種內建瀏覽器裡不一定可靠，
   萬一它不觸發，照片就永遠是空的——寧可晚一點載，也不能不出現。
   （第一屏還是只抓看得到的，所以「開起來很快」這件事不受影響。） */
  TH_NET = setTimeout(function () {
    Array.prototype.forEach.call(document.querySelectorAll('img[data-file]'), function (im) {
      if (!im.src && !THUMBS[im.dataset.file]) thumbSeen(im);
    });
  }, 3000);

  Array.prototype.forEach.call(document.querySelectorAll('img[data-file]'), function (img) {
    var f = img.dataset.file;
    if (img.dataset.nozoom === undefined) img.onclick = function () { lightbox(f); };
    if (THUMBS[f]) { img.src = THUMBS[f]; return; }
    img.dataset.q = '';
    thumbWatch(img);
  });
}

function thumbFlush() {
  while (TH_Q.length) {
    var batch = TH_Q.splice(0, 8);
    (function (bt) {
      var pairs = [], want = {};
      for (var i = 0; i < bt.length; i++) {
        var f = bt[i].dataset.file;
        if (want[f] || THUMBS[f]) continue;
        want[f] = 1;
        pairs.push([f, bt[i].dataset.thumb || '']);
      }
      if (!pairs.length) return;
      call('apiGetThumbs', pairs)
        .then(function (map) { if (map) apply(map); })
        .catch(function () { /* 讀不到就留空，不要吵 */ });

      function apply(map) {
        for (var f in map) THUMBS[f] = map[f];
        Array.prototype.forEach.call(document.querySelectorAll('img[data-file]'), function (im) {
          var k = im.dataset.file;
          if (!im.src && THUMBS[k]) im.src = THUMBS[k];
        });
      }
    })(batch);
  }
}

function lightbox(fileId) {
  openMask('<div class="lightbox"><img alt="學生作品" id="lbImg" src="' +
           (THUMBS[fileId] || '') + '"></div>');
  call('apiGetPhotoData', fileId).then(function (uri) {
    var i = $('lbImg'); if (i && uri) i.src = uri;
  }).catch(function () {});
}

function pickPhotos(prgId) {
  var inp = $('filePick');
  inp.value = '';
  inp.onchange = function () {
    var files = Array.prototype.slice.call(inp.files || []);
    if (!files.length) return;
    uploadPhotos(prgId, files);
  };
  inp.click();
}

/* ⚠️ 一張失敗**不要**讓整批停下來。
   以前十張接在同一條鏈上，第 5 張斷線（或剛好撞到一個單元 30 張的上限），
   後面 5 張就再也不會傳，而且畫面只會閃一句錯誤、不會說停在第幾張
   （2026-09-15 健檢時抓到的）。現在失敗的記下來，最後一次交代清楚。 */
/* 一批還在傳的時候再點「拍照」，會變成兩批同時跑（2026-10-06 健檢） */
var UPLOADING = false;
function uploadPhotos(prgId, files) {
  if (UPLOADING) return toast('上一批照片還在傳，傳完再選。', true);
  UPLOADING = true;
  var done = 0, bad = [], locked = null;
  toast('處理照片中…（' + files.length + ' 張）');
  var chain = Promise.resolve();
  files.forEach(function (f) {
    chain = chain.then(function () {
      if (locked) return;            /* 鎖起來了，後面的不用再試，一張一張報錯沒有意義 */
      return shrink(f, 1600, 0.82).then(function (big) {
        /* ⚠️ 縮圖只是格子上的預覽（桌機約 250px、手機約 210px）。
           以前存 800／0.75，在 2 倍螢幕上其實用不到那麼大，
           每張多出的幾十 KB 乘上二十幾張就很有感。640／0.72 看起來一樣清楚。
           （只影響之後上傳的，已經存過的維持原樣。） */
        return shrink(f, 640, 0.72).then(function (small) {
          return call('apiAddPhoto', prgId, '', big, small, 'image/jpeg').then(function (r) {
            /* 傳好一張就直接放進畫面用的資料：縮圖手上就有，不用再跟伺服器要
               （2026-10-06 優化：以前整批傳完還要重抓整包資料、再一張一張讀縮圖） */
            var ph = r && r.photo;
            if (ph) {
              (S.photoIdx[prgId] = S.photoIdx[prgId] || []).push(ph);
              THUMBS[ph.fileId] = 'data:image/jpeg;base64,' + small;
              if (S.photoTotal) S.photoTotal++;
            }
          });
        });
      }).then(function () {
        done++; toast('已上傳 ' + done + ' / ' + files.length + ' 張');
      }).catch(function (e) {
        if (isLocked(e)) { locked = e; return; }
        bad.push((f.name || '照片') + '：' + ((e && e.message) || e));
        toast('有 1 張沒成功，繼續傳下一張…', true);
      });
    });
  });
  chain.then(function () {
    UPLOADING = false;
    if (locked) throw locked;        /* 交給 fail()：它會叫出輸入通行碼的畫面 */
  }).then(function () {
    refresh(null, bad.length
      ? ('上傳完成 ' + done + ' 張，有 ' + bad.length + ' 張沒成功')
      : ('照片上傳完成，共 ' + done + ' 張'));
    if (bad.length) {
      say('有 ' + bad.length + ' 張沒有上傳成功',
        bad.slice(0, 5).join('\n') +
        (bad.length > 5 ? '\n（還有 ' + (bad.length - 5) + ' 張）' : '') +
        '\n\n只要再選沒成功的這幾張就好——已經上傳的再選一次，會多出一張一樣的。');
    }
  }).catch(function (e) { UPLOADING = false; fail(e); });
}

/* 用 canvas 把照片縮到 max 邊長，回傳 base64（不含 data: 前綴） */
function shrink(file, max, quality) {
  return new Promise(function (ok, no) {
    var fr = new FileReader();
    fr.onerror = function () { no(new Error('讀不到這個檔案：' + file.name)); };
    fr.onload = function () {
      var img = new Image();
      img.onerror = function () { no(new Error('這不是可以顯示的圖片：' + file.name)); };
      img.onload = function () {
        var w = img.width, hh = img.height;
        var r = Math.min(1, max / Math.max(w, hh));
        var cv = document.createElement('canvas');
        cv.width = Math.round(w * r); cv.height = Math.round(hh * r);
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        ok(cv.toDataURL('image/jpeg', quality).split(',')[1]);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
</script>

<script>
/* ══════════════════════════════════════════════════════════════
   6. 出席狀況 Attendance
      一列＝某班某一週缺席的座號。下週上課時照著這張表叫人補進度。
   ══════════════════════════════════════════════════════════════ */
function vAbsent() {
  var h = hero('Attendance', '出席狀況', '不讓任何一個孩子掉在後面。',
    'Nobody gets left behind.',
    '記下這週缺席的號碼，下週上課時一眼就知道誰要補進度。');

  var wk = UI.absent.week || S.wk.week;

  /* ⚠️ 登記是在手機的「快速記錄」點號碼完成的（2026-09-15 他指定）。
     這一頁預設只「呈現」結果：班級牌放大、列出沒來的號碼，全到就寫「無人缺席」。
     年級拿掉了——九個班都是同一個年級，每一格重複一次只是佔位子。
     電腦上要補改時按右上角的「✏️ 編輯」，才換成一排輸入框。 */
  var abEdit = !!UI.absent.edit;
  h += '<div class="card no-print"><h3><i class="ci ci-chair" aria-hidden="true">👥</i> 本週缺席 <span class="en2">This Week\'s Absences</span>' +
    '<span class="right" style="display:flex;gap:6px;align-items:center">' +
      '<button class="btn ghost sm" id="abPrev">‹</button>' +
      '<b>第 ' + wk + ' 週</b>' +
      '<button class="btn ghost sm" id="abNext">›</button>' +
      '<button class="btn ghost sm" id="abNow">本週</button>' +
      '<button class="btn ghost sm" id="abEdit">' +
        (abEdit ? '✕ 取消編輯' : '✏️ 編輯') + '</button></span></h3>' +
    '<div class="ab-grid">' + sortedClasses().map(function (c) {
      var a = S.absences.filter(function (x) {
        return String(x.cls) === String(c.code) && Number(x.week) === Number(wk); })[0];
      var badge = '<span class="badge c-' + colorOf(c.code) + '">' + esc(c.code) + '</span>';
      if (abEdit) {
        /* 輸入框帶的是「撿回來之後」的號碼：他按儲存，被吃掉的那一格就順手復原了 */
        return '<div class="ab-c"><div class="hd">' + badge + '</div>' +
          '<input type="text" data-ab="' + esc(c.code) + '" data-was="' + esc(seatsFix(a ? a.seats : '')) +
          '" value="' + esc(seatsFix(a ? a.seats : '')) +
          '" placeholder="缺席座號，例如 9, 17, 25"></div>';
      }
      var pr = seatParse(a ? a.seats : ''), seats = pr.ok;
      /* 讀不懂的東西不算人頭、也不畫成號碼牌，但要讓他看見（見 seatParse） */
      var odd = pr.odd.length
        ? '<div class="ab-odd">⚠️ 這一格有讀不懂的內容：' +
          pr.odd.map(function (x) { return '「' + esc(x) + '」'; }).join('') +
          '，請按右上角「✏️ 編輯」改成號碼。</div>'
        : '';
      var left = seatsLeft(a).length;
      return '<div class="ab-c' + (seats.length || pr.odd.length ? '' : ' ok') + '"><div class="hd">' + badge +
        '<span class="n">' + (seats.length
          ? seats.length + ' 人沒來' + (left < seats.length ? '・' + (seats.length - left) + ' 人已補' : '')
          : (pr.odd.length ? '—' : '全到')) + '</span></div>' +
        /* 只有警示的時候不要留一塊空的 .s，那是 30px 的空白（min-height） */
        (seats.length || !pr.odd.length
          ? '<div class="s">' + (seats.length
              ? seats.map(function (x) { return seatChip(c.code, x, a); }).join('')
              : '<span class="none">✓ 無人缺席</span>') + '</div>'
          : '') + odd + '</div>';
    }).join('') + '</div>' +
    (abEdit
      ? '<div style="margin-top:14px;display:flex;gap:10px;align-items:center">' +
        '<button class="btn" id="abSave">儲存第 ' + wk + ' 週缺席</button>' +
        '<span class="hint">留白＝這一班這週全到。存檔會覆蓋原本的號碼。</span></div>'
      : '<div class="hint" style="margin-top:12px">' +
        '平常在手機的「快速記錄」點號碼就登記好了，這裡只看結果。' +
        '要在電腦上補或改，按右上角的「✏️ 編輯」。</div>') +
    '</div>';

  /* ── 同一個孩子缺席不只一次 ───────────────────────────────
     他 2026-09-21 提的：「有些孩子會比較常請假，也許剛好連二週星期一都請假，
     這樣也需要被看見。」一列一個孩子（不是一列一週），看的是這學期累積下來的樣子。 */
  var rep = repeatSeats();
  h += '<div class="card"><h3><i class="ci ci-swap" aria-hidden="true">🔁</i> 缺席不只一次的孩子 <span class="en2">Repeat Absences</span>' +
    '<span class="right hint">這學期累計・連續沒來的排最前面</span></h3>';
  h += rep.length ? ('<div class="rep-list">' + rep.map(function (o) {
    var wks = o.weeks.map(function (w, i) {
      var join = i > 0 && w.week - o.weeks[i - 1].week === 1;   /* 跟前一次連著 */
      return '<span class="w' + (join ? ' join' : '') + (w.done ? ' done' : '') + '">第 ' +
        w.week + ' 週' + (w.done ? ' ✓' : '') + '</span>';
    }).join('');
    return '<div class="rep-r' + (o.run >= 2 ? ' warn' : '') + '">' +
      '<span class="badge c-' + colorOf(o.cls) + '">' + esc(o.cls) + '</span>' +
      '<span class="who">' + esc(o.seat) + ' 號</span>' +
      '<span class="cnt">缺席 <b>' + o.n + '</b> 次' +
        (o.run >= 2 ? '<em>連續 ' + o.run + ' 次沒來</em>' : '') + '</span>' +
      '<span class="wks">' + wks + '</span>' +
      '<span class="left">' + (o.left ? '還有 ' + o.left + ' 次沒補' : '都補完了 ✓') + '</span>' +
      '</div>';
  }).join('') + '</div>' +
    '<div class="hint" style="margin-top:10px">' +
    '「連續」是指相鄰兩次上課都沒來（中間那一週這班如果全到，就不算連續）。' +
    '週次牌上的 ✓ ＝ 那一次的進度已經補完了。</div>')
    : '<div class="empty-note">這學期還沒有孩子缺席超過一次。👏</div>';
  h += '</div>';

  /* ── 這學期的缺席紀錄：補課狀態就在這裡點 ──────────────────
     ⚠️ 補完課的號碼不會從清單上消失，只會變成灰色的 ✓，再點一下可以取消。
     以前是直接刪掉，按錯就回不來了，而且整列被清空還會連整筆紀錄一起刪掉。 */
  var log = S.absences.filter(function (a) { return seatList(a.seats).length; })
    .sort(function (a, b) { return Number(b.week) - Number(a.week) ||
                                   String(a.cls).localeCompare(String(b.cls)); });
  var leftN = log.reduce(function (n, a) { return n + seatsLeft(a).length; }, 0);

  h += '<div class="card"><h3><i class="ci ci-today" aria-hidden="true">⏰</i> 待補進度 <span class="en2">Needs Catch-up</span>' +
    '<span class="right hint">' + (leftN ? '還有 <b>' + leftN + '</b> 個要補・' : '') +
    '點號碼 ＝ 已補課，再點一下取消</span></h3>';
  h += log.length ? ('<div class="scroll-x"><table class="tb"><thead><tr>' +
    '<th style="width:82px">週次</th><th style="width:110px">日期</th><th style="width:78px">班級</th>' +
    '<th style="width:270px">單元</th><th>缺席座號</th></tr></thead><tbody>' +
    log.map(function (a) {
      var seats = seatList(a.seats);
      var all = seatsLeft(a).length === 0;
      return '<tr' + (all ? ' class="all-done"' : '') + '>' +
        '<td>' + (Number(a.week) === Number(S.wk.week) ? '本週' : '第 ' + esc(a.week) + ' 週') + '</td>' +
        /* 日期不要斷行：1366 寬時會被擠成「2024-09-」「30」兩行（2026-10-05 健檢） */
        '<td style="white-space:nowrap">' + esc(a.date) + '</td>' +
        '<td><span class="badge c-' + colorOf(a.cls) + '">' + esc(a.cls) + '</span></td>' +
        '<td>' + unitCell(a.unitId) + '</td>' +
        '<td>' + seats.map(function (x) {
          var d = isDone(a, x);
          return '<span class="seat' + (d ? ' done' : '') + '">' + esc(x) + ' 號' +
                 '<button data-ab-id="' + esc(a.id) + '" data-seat="' + esc(x) + '"' +
                 ' data-on="' + (d ? '0' : '1') + '"' +
                 ' title="' + (d ? '取消「已補課」' : '標記已補課') + '">✓</button></span>';
        }).join('') + '</td></tr>';
    }).join('') + '</tbody></table></div>')
    : '<div class="empty-note">這學期還沒有缺席紀錄。👏</div>';
  h += '</div>';
  return h;
}

/* 一顆座號牌。常缺席的孩子帶一個小小的次數，按錯不會怎麼樣——它不能點。 */
function seatChip(cls, seat, a) {
  var st = seatStat(cls, seat);
  var d  = isDone(a, seat);
  return '<span class="seat' + (d ? ' done' : '') + (st && st.n >= 2 ? ' rep' : '') + '"' +
    (st && st.n >= 2 ? ' title="這學期第 ' + st.n + ' 次缺席"' : '') + '>' +
    esc(seat) + (d ? ' ✓' : '') +
    (st && st.n >= 2 ? '<i>×' + st.n + '</i>' : '') + '</span>';
}

function aabsent() {
  var wk = UI.absent.week || S.wk.week;
  $('abPrev').onclick = function () { UI.absent.week = Math.max(1, wk - 1); render(); };
  $('abNext').onclick = function () { UI.absent.week = wk + 1; render(); };
  $('abNow').onclick  = function () { UI.absent.week = S.wk.week; render(); };
  $('abEdit').onclick = function () { UI.absent.edit = !UI.absent.edit; render(); };

  /* 唯讀模式沒有這顆——底下的補課清單還是要綁，所以不能整段跳過 */
  /* ⚠️ 只送有改過的那幾班（2026-10-06 健檢）。以前九班全部一班一班送，
     每一班都回整包資料，按一次要等十幾秒；中間那段按鈕還按得下去，
     再按一次就整輪重跑。哪一班失敗也要說出來，前面存好的照樣畫上去。 */
  if ($('abSave')) $('abSave').onclick = function () {
    var btn = this;

      .filter(function (i) { return i.value.trim() !== String(i.dataset.was || '').trim(); });
    if (!items.length) { UI.absent.edit = false; render(); return toast('沒有改動。'); }
    btn.disabled = true;
    var chain = Promise.resolve(), last = null, now = '';
    items.forEach(function (i) {
      chain = chain.then(function () {
        now = i.dataset.ab;
        return call('apiSaveAbsence', { cls:i.dataset.ab, week:wk, seats:i.value })
          .then(function (d) { last = d; i.dataset.was = i.value.trim(); });
      });
    });
    chain.then(function () {
      UI.absent.edit = false;
      refresh(last, '第 ' + wk + ' 週缺席已儲存（' + items.length + ' 班）');
    }).catch(function (e) {
      btn.disabled = false;
      /* ⚠️ 不重畫：還沒存的那幾格是老師剛打的字，重畫就沒了。
         存好的那幾班已經把 data-was 換成新值，再按一次只會送剩下的。 */
      if (last) S = last;
      if (isLocked(e)) return fail(e);
      fail(new Error(now + ' 班沒有存進去：' + (e && e.message || e)));
    });
  };

  Array.prototype.forEach.call(document.querySelectorAll('[data-ab-id]'), function (b) {
    b.onclick = function () {
      var on = b.dataset.on !== '0';
      seatDoneNow(b.dataset.abId, b.dataset.seat, on,
                  b.dataset.seat + ' 號' + (on ? '已補課' : '改回還沒補'));
    };
  });
}

function kindIcon(r) {
  if (r.kind === 'link') {
    var u = String(r.url).toLowerCase();
    if (u.indexOf('canva') >= 0) return '🎨';
    if (u.indexOf('youtu') >= 0) return '▶️';
    if (u.indexOf('docs.google') >= 0) return '📄';
    if (u.indexOf('slides') >= 0 || u.indexOf('presentation') >= 0) return '📊';
    return '🔗';
  }
  var m = String(r.mime);
  if (m.indexOf('pdf') >= 0) return '📕';
  if (m.indexOf('image') >= 0) return '🖼️';
  if (m.indexOf('presentation') >= 0 || m.indexOf('powerpoint') >= 0) return '📊';
  if (m.indexOf('word') >= 0 || m.indexOf('document') >= 0) return '📝';
  return '📎';
}

function ares() {
  function sync() {
    var file = $('rKind').value === 'file';
    $('rUrlBox').style.display = file ? 'none' : '';
  }
  $('rKind').onchange = sync; sync();
  $('rUnit').onchange = function () { UI.res.unitId = this.value; };

  $('rSave').onclick = function () {
    var title = $('rTitle').value.trim();
    if (!title) return toast('請先填資源名稱。', true);
    var meta = { unitId:$('rUnit').value, title:title, note:$('rNote').value.trim() };
    if ($('rKind').value === 'link') {
      var url = $('rUrl').value.trim();
      if (!url) return toast('請貼上連結網址。', true);
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      meta.kind = 'link'; meta.url = url;
      call('apiSaveResource', meta).then(function (d) { refresh(d, '資源已儲存'); }).catch(fail);
      return;
    }
    var inp = $('docPick');
    inp.value = '';
    inp.onchange = function () {
      var f = (inp.files || [])[0];
      if (!f) return;
      if (f.size > 10 * 1024 * 1024) {
        return toast('檔案超過 10 MB，請改用連結的方式。', true);
      }
      toast('上傳中…');
      var fr = new FileReader();
      fr.onload = function () {
        meta.name = f.name;
        meta.mime = f.type || 'application/octet-stream';
        call('apiUploadResource', meta, String(fr.result).split(',')[1])
          .then(function (d) { refresh(d, '檔案已上傳'); }).catch(fail);
      };
      fr.readAsDataURL(f);
    };
    inp.click();
  };

  Array.prototype.forEach.call(document.querySelectorAll('[data-dr]'), function (b) {
    b.onclick = function () {
      ask('上傳的檔案也會移到垃圾桶。', '刪除', '確定刪掉這項資源？').then(function (yes) {
        if (!yes) return;
        call('apiDeleteResource', b.dataset.dr).then(function (d) { refresh(d, '已刪除'); }).catch(fail);
      });
    };
  });
  /* 上傳的圖片直接出縮圖，點下去放大——跟作品照片共用同一套（見 render() 收尾的 loadThumbs） */
}

    '進度、缺席、課堂札記、單元省思不會複製，重新開始記。<br>' +
    '起始日每個學期各記各的，切回上學期時週次不會跟著跑掉。</div></details>';

  h += '</div></div>';
  return h;
}

function closeSwatches(except) {
  Array.prototype.forEach.call(document.querySelectorAll('#cBody .sw-pop'), function (p) {
    if (p !== except) p.hidden = true;
  });
}

function bindColorCells() {
  Array.prototype.forEach.call(document.querySelectorAll('#cBody .cls-row'), function (row) {
    var pop  = row.querySelector('.sw-pop');
    var hid  = row.querySelector('[data-c="color"]');
    var chip = row.querySelector('.cls-chip');
    var code = row.querySelector('[data-c="code"]');
    var note = row.querySelector('.cls-note');

    chip.onclick = function (ev) {
      ev.stopPropagation();
      var open = pop.hidden;
      closeSwatches(pop);
      pop.hidden = !open;
      if (open && code) code.focus();
    };
    pop.onclick = function (ev) { ev.stopPropagation(); };

    Array.prototype.forEach.call(pop.querySelectorAll('.sw'), function (b) {
      b.onclick = function () {
        hid.value = b.dataset.col;
        Array.prototype.forEach.call(pop.querySelectorAll('.sw'), function (x) {
          x.classList.toggle('on', x === b);
        });
        syncColorCells();
        pop.hidden = true;
      };
    });

    if (code) code.oninput = function () {
      chip.textContent = this.value.trim() || '？';
    };

    row.querySelector('[data-delcls]').onclick = function () { row.remove(); syncColorCells(); };
  });
}

/* 點別的地方就把色票收起來 */
document.addEventListener('click', function () { closeSwatches(null); });

/* 班級一列。顏色以前是「藍／綠／紫羅蘭」的文字下拉——要先看懂字才知道會變成什麼樣。
   改成點班級牌就跳色票，選完那張牌立刻變成那個顏色，所見即所得。
   班級代碼也收進同一個小視窗裡，一次改完。 */
function clsRow(c, ord) {
  var col = c.color || autoColor((ord || 1) - 1);
  var code = c.code || '';
  return '<div class="cls-row">' +
    '<div class="chip-wrap">' +
      '<button type="button" class="cls-chip c-' + col + '" data-swatch title="點一下換顏色">' +
        esc(code || '？') + '</button>' +
      '<input type="hidden" data-c="color" value="' + esc(col) + '">' +
      '<div class="sw-pop" hidden>' +
        '<div class="sw-t">換個顏色</div>' +
        '<div class="sw-grid">' + COLORS.map(function (x) {
          return '<button type="button" class="sw c-' + x.k + (x.k === col ? ' on' : '') +
            '" data-col="' + x.k + '" title="' + esc(x.z) + '"></button>';
        }).join('') + '</div>' +
        '<div class="sw-code"><label>班級代碼</label>' +
          '<input type="text" data-c="code" value="' + esc(code) + '" placeholder="201"></div>' +
      '</div>' +
    '</div>' +
    '<input class="cls-grade" type="text" data-c="grade" value="' + esc(c.grade || '') +
      '" placeholder="年級">' +
    '<input class="cls-note" type="text" data-c="note" value="' + esc(c.note || '') +
      '" placeholder="備註">' +
    '<button class="btn ghost sm no-print" data-delcls title="刪掉這一列">✕</button>' +
    '</div>';
}

function aset() {

      year:$('sYear').value, semester:$('sSem').value, teacher:$('sTeacher').value.trim(),
      startDate:$('sStart').value, weeks:$('sWeeks').value, motto:$('sMotto').value.trim(),
      seatMax:$('sSeat').value,
      /* 成果頁的開場白與結尾（收在摺疊卡裡，沒展開也讀得到值） */
      showQuoteZh:$('sQz') ? $('sQz').value.trim() : '',
      showQuoteEn:$('sQe') ? $('sQe').value.trim() : '',
      showFoot:   $('sFt') ? $('sFt').value.trim() : ''
    }).then(function (d) { refresh(d, '設定已儲存'); }).catch(fail);
  };
  $('cAdd').onclick = function () {
    $('cBody').appendChild(el(clsRow({ color: freeColor() }, 0)));
    bindColorCells();
    syncColorCells();
    var last = $('cBody').lastElementChild;
    last.querySelector('.cls-chip').click();     /* 新的一列先把代碼填起來 */
  };
  $('cRecolor').onclick = function () {
    Array.prototype.forEach.call($('cBody').querySelectorAll('.cls-row'), function (row, i) {
      var col = autoColor(i);
      row.querySelector('[data-c="color"]').value = col;
      var chip = row.querySelector('.cls-chip');
      chip.className = 'cls-chip c-' + col;
      Array.prototype.forEach.call(row.querySelectorAll('.sw'), function (b) {
        b.classList.toggle('on', b.dataset.col === col);
      });
    });
    syncColorCells();
    toast('顏色重排好了，按「儲存班級」才會存進去。');
  };
  $('cSave').onclick = function () {
    var rows = [];
    Array.prototype.forEach.call($('cBody').querySelectorAll('.cls-row'), function (row, i) {
      var o = { ord:i + 1 };
      Array.prototype.forEach.call(row.querySelectorAll('[data-c]'), function (f) {
        o[f.dataset.c] = f.value.trim();
      });
      if (o.code) rows.push(o);
    });
    call('apiSaveClasses', rows).then(function (d) { refresh(d, '班級已儲存'); }).catch(fail);
  };
  $('sPerSave').onclick = function () {
    var n = Math.max(1, Math.min(12, Number($('sPer').value) || 7));
    var teach = teachPeriods();
    /* 午休這類休息時段保留，只加減上課的節次 */
    var rows = allPeriods().filter(function (p) { return String(p.label || '').trim(); });
    for (var i = 1; i <= n; i++) {
      var old = teach[i - 1];
      rows.push({ no:i, start:old ? old.start : '', end:old ? old.end : '', label:'' });
    }
    rows.sort(function (a, b) { return Number(a.no) - Number(b.no); });
    call('apiSavePeriods', rows).then(function (d) { refresh(d, '節次已套用'); }).catch(fail);
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-arch]'), function (b) {
    b.onclick = function () {
      call('apiSetArchived', b.dataset.arch, b.dataset.on === '1')
        .then(function (d) { refresh(d, b.dataset.on === '1' ? '已封存' : '已解除封存'); }).catch(fail);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-goterm]'), function (b) {
    b.onclick = function () {
      call('apiSwitchTerm', b.dataset.goterm).then(function (d) { refresh(d, '已切換'); }).catch(fail);
    };
  });
  bindColorCells();
  syncColorCells();

  loadShow();
  $('shReload').onclick = loadShow;

  loadDiag();
  $('dgReload').onclick = loadDiag;

  $('nGo').onclick = function () {
    var t = $('nYear').value + '-' + $('nSem').value;
    var copy = $('nCopy').value;
    if (S.terms.indexOf(t) >= 0) {
      return toast('「' + termLabel(t) + '」已經有資料了。要看它的話，用上面的學期選單切過去。', true);
    }
    if (!$('nStart').value) return toast('請填新學期第 1 週的星期一。', true);
    ask((copy ? '會把「' + termLabel(copy) + '」的課表與單元整份複製過去。\n' : '') +
        '建立後畫面會切到新學期，舊學期的資料都還在，隨時切得回去。',
        '建立', '要建立「' + termLabel(t) + '」嗎？').then(function (yes) {
      if (!yes) return;
      call('apiNewTerm', t, copy, $('nStart').value, $('sWeeks') ? $('sWeeks').value : '')
        .then(function (d) { refresh(d, '已建立 ' + termLabel(t) + '，課表已經帶過來了'); })
        .catch(fail);
    });
  };

  bindPass();
}

/* ── 管理通行碼的按鈕 ───────────────────────────────────── */
function bindPass() {
  var oldPass = function () { return $('pOld') ? $('pOld').value : ''; };

  $('pSave').onclick = function () {
    var a = $('pNew').value, b = $('pNew2').value;
