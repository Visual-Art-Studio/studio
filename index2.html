  }

  d.units.filter(function (u) { return u.ord === TAB; }).forEach(function (u) {
    /* 關鍵字：中文說明本來就是「觀察形狀・發揮想像・用畫面說故事」這種寫法，
       拆開就是現成的小標，不用他再多打一次。 */
    var tags = String(u.descZh || '').split(/[・·、|]+/)
      .map(function (x) { return x.trim(); }).filter(Boolean);

    h += '<div class="card unit tabbed" id="u' + u.ord + '">';

    /* 抬頭。⚠️ 中文名不要再寫一次——上面那排頁籤就是中文名（2026-09-15 他說的）。
       圖示方塊也只有在「真的上傳過封面照片」時才留；單純一個 emoji 沒有資訊量。 */
    h += '<div class="uh">' +
      (u.coverId ? '<div class="ic"><img alt="" data-file="' + esc(u.coverId) +
                   '" data-thumb=""></div>' : '') +
      '<div class="un"><span class="e">' + esc(u.nameEn || u.nameZh) + '</span></div>' +
      '<div class="cnt"><b>' + u.photos.length + ' 件</b>' +
        (u.updated ? ' · ' + esc(md(u.updated)) : '') + '</div>' +
      (tags.length ? '<div class="tagrow">' + tags.map(function (t) {
        return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
      '</div>';

    /* 說明區。手機收起來、桌機攤開（syncFold 負責）。 */
    var cards = '';
    /* ⚠️ 沒打就不要出現。本來沒填會退回「教學目標」——那是寫給老師看的句子，
       出現在家長頁上很突兀（2026-09-15 他回報）。 */
    if (u.learnZh) {
      cards += '<div class="u-card b"><h3>今天，我們在學什麼？<span class="en2">What Are We Learning?</span></h3>' +
        '<p>' + esc(u.learnZh) + '</p>' + steps(u.steps) + '</div>';
    }
    /* ⚠️ 「孩子怎麼學？」和「課堂裡，我們這樣說」**不在成果頁呈現**
       （2026-09-15 他畫叉的兩塊）。欄位還是留著、管理端照樣填得到，
       那兩段是課程資訊，不是要給家長讀的。家長端只留兩塊：
       「今天我們在學什麼」和「這堂課練習的，不只是畫畫」。 */
    var sk = pairs(u.skills);
    if (sk.length) {
      cards += '<div class="u-card p"><h3>這堂課練習的，不只是畫畫</h3><p class="skl">' +
        sk.map(function (x) {
          return '<b>' + esc(x[0]) + '</b>：' + esc(x[1] || ''); }).join('<br>') + '</p></div>';
    }
    if (cards) {
      h += '<details class="fold"><summary>這個單元在學什麼</summary>' +
           '<div class="u-grid">' + cards + '</div></details>';
    }

    /* 老師寫給家長的課堂觀察 */
    if (u.noteZh || u.quoteZh) {
      h += '<div class="tnote"><h3>' + esc(teacherShort(d.teacher)) +
        ' 的課堂觀察<span class="en2">Teacher\'s Note</span></h3>' +
        String(u.noteZh || '').split(/\n+/).filter(Boolean).map(function (p) {
          return '<p>' + esc(p) + '</p>'; }).join('') +
        (u.quoteZh ? '<div class="q">' + esc(u.quoteZh) + '</div>' : '') + '</div>';
    }

    /* 作品。手機上這一塊排在說明前面（見 .unit 的 order）。 */
    h += '<div class="gallery-wrap"><div class="ghead">' +
      /* ⚠️ 這一句每個單元各寫各的（2026-10-05 他說的：「每個單元的作品呈現都不同」）。
         本來八個單元都寫死「每個孩子，看見的都不一樣」——那句只對得上「從形狀到故事」。
         沒填就只寫「學生作品」，不要退回那句寫死的，不然又變成每個單元都一樣。 */
      '<div><h3>' + esc(u.galZh || '學生作品') + '</h3>' +
        (u.galEn ? '<p>' + esc(u.galEn) + '</p>' : '') + '</div>' +
      '<div class="lbl">STUDENT GALLERY</div></div>' +
      '<div class="grid">' +
      u.photos.map(function (p) {
        var i = ALL.length;
        ALL.push({ fileId: p.fileId, cap: p.cap, unit: u.nameZh });
        return '<div class="ph" data-i="' + i + '">' +
          '<img alt="' + esc(p.cap || '學生作品') + '" data-file="' + esc(p.fileId) +
          '" data-thumb="' + esc(p.thumbId) + '">' +
          (p.cap ? '<div class="cap">' + esc(p.cap) + '</div>' : '') + '</div>';
      }).join('') + '</div></div>';

    /* 回家聊聊 */
    if (u.homeQ) {
      h += '<div class="home"><h3>回家聊聊藝術<span class="en2">Talk About Art at Home</span></h3>' +
        '<div class="q">💬 ' + esc(u.homeQ) +
        (u.homeTip ? '<span class="t">' + esc(u.homeTip) + '</span>' : '') + '</div></div>';
    }

    h += '</div>';
  });

  $('body').innerHTML = h;
  if (ALL.length) {
    /* ⚠️ 這兩句是他定的文案（2026-09-15，長按存圖已經在他的手機上實測可行）。
       第一句整句粗體＝這是「可以動手做的事」；第二句是提醒，維持原樣。 */
    $('footTip').innerHTML = '<b>長按照片就能儲存小小藝術家們的作品喔！</b><br>' +
      '這個頁面只給這一班的家長，請勿轉傳到其他群組。';
  }

  /* 頁籤：換單元就重畫。⚠️ 重畫之後要捲回頁籤那一排，
     不然在手機上按了會停在原來的捲動位置，看起來像沒反應。 */
  Array.prototype.forEach.call(document.querySelectorAll('.jrn [data-tab]'), function (b) {
    b.onclick = function () {
      if (Number(b.dataset.tab) === TAB) return;
      TAB = Number(b.dataset.tab);
      show(DATA);
      var j = document.querySelector('.jrn');
      if (j) j.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('details.fold'), function (dd) {
    dd.addEventListener('toggle', function () { dd.dataset.touched = '1'; });
  });
  /* ⚠️ 頁籤那一排在手機上是橫捲的。選到的那一張如果在畫面外（單元一多就會），
     看起來就像「按了沒反應」——把它捲進來。
     用 scrollLeft 自己算，不要用 scrollIntoView：那個會連整頁一起捲。 */
  (function centerTab() {
    var j = document.querySelector('.jrn');
    var on = j && j.querySelector('.step.on');
    if (!j || !on) return;
    var want = on.offsetLeft - (j.clientWidth - on.offsetWidth) / 2;
    j.scrollLeft = Math.max(0, want);
  })();
  syncFold();
  loadThumbs();
}

var CACHE = {};
var ALL = [];        /* 所有照片照畫面上的順序，放大時可以一張一張翻 */
var TAB = 0;         /* 現在看的是哪一個單元（旅程那一排的頁籤） */
var AT  = -1;        /* 現在翻到第幾張 */


/* ── 縮圖：捲到才抓 ─────────────────────────────────────────
 *  ⚠️ 以前是一進頁面就把「畫面上所有」的縮圖排隊抓完。一個單元二十五張，
 *     等於一開頁就要搬兩三 MB 的 base64 —— 家長第一眼看到的其實只有四到六張
 *     （2026-09-15 他回報照片顯示得慢）。
 *     現在只抓「快要捲到」的（提前 600px），其餘等捲到再抓。
 *  ⚠️ 每次重畫都要先 disconnect：舊的 <img> 已經被 innerHTML 換掉了，
 *     還留在 observer 裡只會佔記憶體，而且永遠不會觸發。
 */
var TH_Q = [], TH_T = null, TH_OB = null;

function thumbSeen(img) {
  if (img.dataset.q) return;
  img.dataset.q = '1';
  TH_Q.push(img);
  clearTimeout(TH_T);
  TH_T = setTimeout(thumbFlush, 40);
}

function thumbWatch(img) {
  if (!window.IntersectionObserver) return thumbSeen(img);   /* 舊瀏覽器就照舊全抓 */
  if (!TH_OB) {
    TH_OB = new IntersectionObserver(function (es) {
      for (var i = 0; i < es.length; i++) {
        if (!es[i].isIntersecting) continue;
        TH_OB.unobserve(es[i].target);
        thumbSeen(es[i].target);
      }
    }, { rootMargin: '600px 0px' });
  }
  TH_OB.observe(img);
}

/* 縮圖一次抓八張。一張一趟的話，十七張作品就要等十七趟往返 */
var TH_NET = null;

function loadThumbs() {
  if (TH_OB) TH_OB.disconnect();
  TH_Q = [];
  clearTimeout(TH_NET);

/* ⚠️ 保險絲：三秒後把剩下的也抓一抓。
   IntersectionObserver 在 LINE／FB 那種內建瀏覽器裡不一定可靠，
   萬一它不觸發，照片就永遠是空的——寧可晚一點載，也不能不出現。
   （第一屏還是只抓看得到的，所以「開起來很快」這件事不受影響。） */
  TH_NET = setTimeout(function () {
    Array.prototype.forEach.call(document.querySelectorAll('img[data-file]'), function (im) {
      if (!im.src && !CACHE[im.dataset.file]) thumbSeen(im);
    });
  }, 3000);

  var imgs = Array.prototype.slice.call(document.querySelectorAll('img[data-file]'));
  imgs.forEach(function (img) {
    var f = img.dataset.file;
    if (CACHE[f]) { img.src = CACHE[f]; return; }
    img.dataset.q = '';
    thumbWatch(img);
  });

  Array.prototype.forEach.call(document.querySelectorAll('.ph'), function (box) {
    box.onclick = function () { big(Number(box.dataset.i)); };
  });
}

function thumbFlush() {
  if (TH_HOLD) return;      /* 確認過班號後 loadThumbs() 會重排一次，見 enterSaved() */
  while (TH_Q.length) {
    var batch = TH_Q.splice(0, 8);
    (function (bt) {
      var pairs = [], want = {};
      for (var i = 0; i < bt.length; i++) {
        var f = bt[i].dataset.file;
        if (want[f] || CACHE[f]) continue;
        want[f] = 1;
        pairs.push([f, bt[i].dataset.thumb || '']);
      }
      if (!pairs.length) return apply({});
      grab(1);

      /* ⚠️ 失敗不要就這樣算了。以前「讀不到就留空」，那幾格就**永遠**是灰方塊，
         家長也不知道是壞了還是還沒載完（訊號差的地方很常見；2026-09-15 健檢抓到的）。
         隔一下再試一次，第二次還不行才放棄。 */
      function grab(tries) {
        call('apiShowThumbs', KEY, ANSWER, pairs)
          .then(function (map) { if (map) apply(map); })
          .catch(function () {
            if (tries < 2) setTimeout(function () { grab(tries + 1); }, 1500);
          });
      }

      function apply(map) {
        for (var f in map) CACHE[f] = map[f];
        if (!PV_AUTH) thumbsKeep(KEY, map);
        /* ⚠️ 同一個 fileId 可能出現在好幾個 <img>（例如單元封面），整頁掃一次 */
        Array.prototype.forEach.call(document.querySelectorAll('img[data-file]'), function (im) {
          var k = im.dataset.file;
          if (!im.src && CACHE[k]) im.src = CACHE[k];
        });
      }
    })(batch);
  }
}

/* ── 放大看：原圖也要留著 ⭐ ─────────────────────────────────
 *  ⚠️ 以前每按一次左右箭頭都重新跟後端要一次原圖，同一張看第二次還是要重等
 *     （2026-09-15 健檢抓到的）。家長打開第一張之後幾乎都是一路按到最後一張。
 *  ⚠️ 而且要**趁他在看這一張的時候先把下一張拿回來**，按下去才是立刻換。
 *  ⚠️ 原圖一張三五百 KB，手機記憶體有限——只留最近 FULL_MAX 張，舊的丟掉。 */
var FULL = {}, FULL_Q = [], FULL_MAX = 10;

function fullPut(id, uri) {
  if (!uri || FULL[id]) return;
  FULL[id] = uri;
  FULL_Q.push(id);
  while (FULL_Q.length > FULL_MAX) delete FULL[FULL_Q.shift()];
}

/* 拿第 i 張的原圖（有就直接給、沒有才去要）。then 可以不給——那就是先抓起來放著。 */
function fullGet(i, then) {
  var p = ALL[i];
  if (!p) return;
  if (FULL[p.fileId]) { if (then) then(FULL[p.fileId]); return; }
  call('apiShowFull', KEY, ANSWER, p.fileId).then(function (uri) {
    fullPut(p.fileId, uri);
    if (then) then(uri);
  }).catch(function () { /* 拿不到就維持縮圖，至少看得到東西 */ });
}

function big(i) {
  if (i < 0 || i >= ALL.length) return;
  AT = i;
  var p = ALL[i];
  $('maskImg').src = FULL[p.fileId] || CACHE[p.fileId] || '';
  $('maskCap').innerHTML = esc(p.cap || p.unit || '') +
    '<span class="n">' + (i + 1) + ' / ' + ALL.length + '</span>';
  $('maskPrev').disabled = (i <= 0);
  $('maskNext').disabled = (i >= ALL.length - 1);
  $('mask').className = 'mask on';
  var want = p.fileId;
  fullGet(i, function (uri) {
    if (uri && ALL[AT] && ALL[AT].fileId === want) $('maskImg').src = uri;
    fullGet(i + 1);          /* 先把下一張抓起來放著 */
  });
}
function closeBig() { $('mask').className = 'mask'; AT = -1; }
function step(n) { if (AT >= 0) big(AT + n); }

$('maskX').onclick    = closeBig;
$('maskPrev').onclick = function (e) { e.stopPropagation(); step(-1); };
$('maskNext').onclick = function (e) { e.stopPropagation(); step(1); };
$('mask').onclick = function (e) { if (e.target === $('mask')) closeBig(); };
document.addEventListener('keydown', function (e) {
  if ($('mask').className.indexOf('on') < 0) return;
  if (e.key === 'Escape')     closeBig();
  if (e.key === 'ArrowLeft')  step(-1);
  if (e.key === 'ArrowRight') step(1);
});

/* 手機左右滑。⚠️ 要濾掉直向的滑動，不然家長想捲畫面也會被當成翻頁。 */
(function swipe() {
  var x0 = 0, y0 = 0, on = false;
  var m = $('mask');
  m.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; on = true;
  }, { passive: true });
  m.addEventListener('touchend', function (e) {
    if (!on) return; on = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    step(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

start();
</script>
<script id="show2-js">
/* ══ 成果頁・工作室版（index2.html，2026-11-04）══════════════════════════
   接在 Show.html 原本的程式後面：
   - 把原版橫幅（.hero）換成展覽牆。原版程式會寫的幾個 id（heroSub／heroWho／heroLead／heroId）照樣留著，
     入口那一步（gate）寫學期和老師時才寫得進來。
   - 接手 show(d)：畫面重畫成「掛畫繩八幅畫框＋這個單元的展覽區＋最下面明信片與上一個／下一個」。
   - 資料、班號、縮圖（loadThumbs：捲到才抓）、放大（big）全部用原版那一套，只改長相。
   ⚠️ 不要在這裡宣告 var ALL／CACHE／TAB——要用原版那幾個全域變數，宣告了就變成另一份。 */
(function () {
  document.body.classList.add('sw');

  var old = document.querySelector('.hero');
  var wall = document.createElement('section');
  wall.className = 'x-wall';
  wall.innerHTML =
    '<div class="x-top">' +
      '<div class="x-sign"><h1><em>Small Artists</em>小小藝術家</h1>' +
        '<div class="x-sub" id="heroSub">孩子的作品，值得被看見</div><div class="x-who" id="heroWho"></div></div>' +
      '<div class="x-lead" id="heroLead" hidden></div>' +
      '<div class="x-plate"><div class="x-no" id="xNo" hidden></div></div>' +
      '<div class="x-mtutu" id="xMTutu" hidden></div>' +
      '<div id="heroId" hidden></div>' +
    '</div>' +
    '<div class="x-railwrap" id="xRail" hidden></div>';
  if (old) {
    /* gate() 可能已經寫過學期／老師（原版程式先跑），搬過來 */
    var w0 = old.querySelector('#heroWho');
    if (w0 && w0.textContent) wall.querySelector('#heroWho').textContent = w0.textContent;
    old.parentNode.insertBefore(wall, old);
    old.remove();
  }

  /* 頁尾：兩句提醒講的是同一件事，併成一句（他 11-04 要精簡）；「長按存圖」進去之後才出現 */
  var priv = document.querySelector('.foot .priv');
  if (priv) priv.textContent = '照片僅供本班家長留存，請勿轉傳或張貼到公開網路。';
  if ($('footTip')) $('footTip').innerHTML = '';

  /* ── 等待：讓人一眼看出在等（他 11-04：「讓人明確知道在等待」）──
     原版在好幾個地方寫 '<div class="loading">載入中…</div>'（開頁、記住班號直接進、老師預覽），
     這裡統一接手：看到那一行就換成「圖圖舉相機在跳＋一句話＋三顆輪流跳的點」。 */
  function waitify() {
    var l = $('body').firstElementChild;
    if (l && l.classList.contains('loading') && !l.querySelector('.x-wait')) {
      l.innerHTML = '<div class="x-wait"><div class="fig"></div><b>載入中…</b><span>圖圖正在把作品掛上牆</span>' +
                    '<i class="dots"><i></i><i></i><i></i></i></div>';
    }
  }
  waitify();
  new MutationObserver(waitify).observe($('body'), { childList: true });

  var PF = 5;
  var COLOR = { pink:'#f6c9d6', blue:'#c6dcf4', green:'#c9e9d2', yellow:'#f8e3a6', purple:'#ddd0f4', orange:'#f9d6b8', red:'#f4c3c0', teal:'#c4e6e4' };

  function newestOrd(units) {
    var b = null;
    units.forEach(function (u) { if (!b || String(u.updated || '') >= String(b.updated || '')) b = u; });
    return b ? b.ord : 0;
  }
  function unitOf(ord) { return (DATA.units || []).filter(function (u) { return u.ord === ord; })[0]; }
  function tripOf(ord) { return (DATA.trip || []).filter(function (t) { return t.ord === ord; })[0]; }

  /* 小框裡放單元封面（老師上傳的方形圖卡）；沒有封面就放單元圖示＋單元顏色，不拿作品頂 */
  function cover(ord) {
    var u = unitOf(ord), t = tripOf(ord) || u || {};
    if (u && u.coverId) return '<span class="x-cv"><img alt="" data-file="' + esc(u.coverId) + '" data-thumb=""></span>';
    return '<span class="x-cv" style="background:' + (COLOR[t.color] || '#f3ecdc') + '"><span class="ic">' + esc(t.icon || '🎨') + '</span></span>';
  }

  window.show = function (d) {
    DATA = d;
    if (d.thumbs) { for (var sk in d.thumbs) { if (d.thumbs[sk] && !CACHE[sk]) CACHE[sk] = d.thumbs[sk]; } }
    document.body.classList.add('sw-in');
    var units = d.units || [];
    var NEW = newestOrd(units);
    if (!unitOf(TAB)) TAB = NEW;
    document.title = '小小藝術家 · ' + d.cls + ' 班';

    /* ── 牆上 ── */
    $('heroSub').textContent = d.motto || '孩子的作品，值得被看見';
    $('heroWho').textContent = (d.term || '') + '　' + (d.teacher || '');   /* 學期＋老師只寫一次：木牌裡 */
    $('xNo').hidden = false; $('xNo').textContent = d.cls;
    if (d.quoteZh || d.quoteEn) {
      $('heroLead').hidden = false;
      $('heroLead').innerHTML = esc(d.quoteZh || '') + (d.quoteEn ? '<em>' + esc(d.quoteEn) + '</em>' : '');
    }
    /* 總件數只寫一次：圖圖的名牌（桌機站在牆邊、手機是頭像） */
    var tag = '<div class="x-tag"><b>' + d.total + ' 件作品</b> · ' + units.length + ' 個單元' +
              (d.updated ? '<br>更新到 ' + esc(md(d.updated)) : '') + '</div>';
    $('xMTutu').hidden = false;
    $('xMTutu').innerHTML = '<div class="fig"></div>' + tag;

    var trip = (d.trip && d.trip.length) ? d.trip
             : units.map(function (u) { return { ord: u.ord, nameZh: u.nameZh, nameEn: u.nameEn, icon: u.icon, color: u.color, done: true }; });
    var rail = trip.map(function (t, i) {
      var lab = 'UNIT ' + ('0' + (i + 1)).slice(-2), u = unitOf(t.ord);
      if (!t.done || !u) {
        return '<div class="x-fr soon"><div class="pic"><span class="x-cv">還沒開始</span></div>' +
               '<span class="u">' + lab + '</span><b>' + esc(t.nameZh || t.nameEn) + '</b><span class="n">&nbsp;</span></div>';
      }
      return '<button class="x-fr pf-' + (i % PF) + (t.ord === TAB ? ' on' : '') + '" data-tab="' + t.ord + '">' +
        (t.ord === NEW ? '<span class="x-new">最新 NEW</span>' : '') +
        '<div class="pic">' + cover(t.ord) + '</div><span class="u">' + lab + '</span><b>' + esc(t.nameZh || t.nameEn) + '</b>' +
        '<span class="n">' + u.photos.length + ' 件' + (u.updated ? ' · ' + esc(md(u.updated)) : '') + '</span></button>';
    }).join('');
    $('xRail').hidden = false;
    $('xRail').innerHTML = '<div class="x-rope"></div><div class="x-rail">' + rail + '</div>' +
      '<div class="x-tutu"><div class="fig"></div>' + tag + '</div>';
    /* 頁尾的「長按存圖」放回去 */
    $('footLead').textContent = d.foot || '';

    ALL = [];
    var h = '';
    if (!units.length) {
      h = '<div class="card gate"><div class="big">📷</div><h2>還沒有照片</h2><p>老師還在拍，過幾天再來看看。</p></div>';
      $('body').innerHTML = h;
      $('footTip').innerHTML = '';
      return;
    }

    var u = unitOf(TAB);
    var idx = trip.map(function (t) { return t.ord; }).indexOf(TAB);
    var tags = String(u.descZh || '').split(/[・·、|]+/).map(function (x) { return x.trim(); }).filter(Boolean);
    h += '<section class="x-room"><div class="x-uh">' +
      '<span class="k">UNIT ' + ('0' + (idx + 1)).slice(-2) + '</span>' +
      '<h2>' + esc(u.nameEn || u.nameZh) + (u.nameEn && u.nameZh ? '<small>' + esc(u.nameZh) + '</small>' : '') + '</h2>' +
      '<span class="cnt"><b>' + u.photos.length + ' 件</b>' + (u.updated ? ' · ' + esc(md(u.updated)) : '') + '</span>' +
      (tags.length ? '<span class="x-chips">' + tags.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</span>' : '') +
      '</div><div class="x-body">';

    /* 說明：原版家長端只留「學什麼」「練習的」兩塊＋老師的觀察（「孩子怎麼學」「課堂裡這樣說」不在成果頁，2026-09-15 他畫叉的） */
    var learn = '', skc = '', note = '';
    if (u.learnZh) {
      var ss = pairs(u.steps);
      learn = '<div class="x-card x-learn"><h3>今天，我們在學什麼？<span class="en">What Are We Learning?</span></h3><p>' + esc(u.learnZh) + '</p>' +
        (ss.length ? '<div class="x-proc">' + ss.map(function (x) { return '<div>' + esc(x[0]) + (x[1] ? '<i>' + esc(x[1]) + '</i>' : '') + '</div>'; }).join('') + '</div>' : '') + '</div>';
    }
    var sk = pairs(String(u.skills || '').replace(/｜/g, '|'));   // 他打的是全形「｜」
    if (sk.length) {
      skc = '<div class="x-card x-skc"><h3>這堂課練習的，不只是畫畫</h3><div class="x-skl">' +
        sk.map(function (x) { return '<div><b>' + esc(x[0]) + '</b>' + (x[1] ? '<span>' + esc(x[1]) + '</span>' : '') + '</div>'; }).join('') + '</div></div>';
    }
    if (u.noteZh || u.quoteZh) {
      note = '<div class="x-card x-note"><h3>' + esc(teacherShort(d.teacher)) + ' 的課堂觀察<span class="en">Teacher\'s Note</span></h3>' +
        String(u.noteZh || '').split(/\n+/).filter(Boolean).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
        (u.quoteZh ? '<div class="q">' + esc(u.quoteZh) + '</div>' : '') + '</div>';
    }
    if (learn || skc || note) {
      /* 三塊都在：學什麼｜信 一排、能力橫跨一排；少了任何一塊就一塊接一塊往下排 */
      var full = learn && skc && note;
      h += '<details class="fold x-fold"><summary>這個單元在學什麼 ▾</summary><div class="x-cards' + (full ? '' : ' solo') + '">' +
           learn + skc + note + '</div></details>';
    }

    h += '<div class="x-gwall"><div class="x-gh"><div><h3>' + esc(u.galZh || '學生作品') + '</h3>' +
      (u.galEn ? '<p>' + esc(u.galEn) + '</p>' : '') + '</div><div class="lbl">STUDENT GALLERY</div></div><div class="x-grid">' +
      u.photos.map(function (p) {
        var i = ALL.length;
        ALL.push({ fileId: p.fileId, cap: p.cap, unit: u.nameZh });
        return '<div class="x-ph" data-i="' + i + '"><img alt="' + esc(p.cap || '學生作品') + '" data-file="' + esc(p.fileId) +
          '" data-thumb="' + esc(p.thumbId || '') + '">' + (p.cap ? '<div class="cap">' + esc(p.cap) + '</div>' : '') + '</div>';
      }).join('') + '</div></div></div>';

    /* 上一個／下一個：照旅程順序、只算已開放的 */
    var done = trip.filter(function (t) { return t.done && unitOf(t.ord); }).map(function (t) { return t.ord; });
    var at = done.indexOf(TAB), prev = done[at - 1], next = done[at + 1];
    function nb(ord, nx) {
      var dir = nx ? '下一個單元 →' : '← 上一個單元';
      if (ord == null) return '<button class="x-go' + (nx ? ' nx' : '') + '" disabled><span class="cv"></span><span class="tx"><span class="d">' + dir +
        '</span><small>' + (nx ? '還沒開放' : '這是第一個') + '</small></span></button>';
      var t = tripOf(ord) || unitOf(ord);
      return '<button class="x-go' + (nx ? ' nx' : '') + '" data-tab="' + ord + '"><span class="cv">' + cover(ord) + '</span><span class="tx"><span class="d">' + dir +
        '</span><small>' + esc(t.nameZh || t.nameEn) + '</small></span></button>';
    }
    h += '<div class="x-end' + (u.homeQ ? '' : ' no-home') + '">' +
      (u.homeQ ? '<div class="x-home"><h3>回家聊聊藝術<span class="en">Talk About Art at Home</span></h3><div class="q">' + esc(u.homeQ) +
        (u.homeTip ? '<span class="t">' + esc(u.homeTip) + '</span>' : '') + '</div></div>' : '') +
      '<div class="x-nav">' + nb(prev, false) + nb(next, true) +
        (TAB === NEW ? '' : '<button class="x-latest" data-tab="' + NEW + '">回到最新<small>' + esc((unitOf(NEW) || {}).nameZh || '') + '</small></button>') +
      '</div></div></section>';

    $('body').innerHTML = h;
    $('footTip').innerHTML = ALL.length ? '<b>長按照片就能儲存作品喔！</b>' : '';

    /* 換單元：牆上的畫框按了留在原地；最下面的按鈕按了捲回這個單元的開頭 */
    Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (b) {
      b.onclick = function () {
        var n = Number(b.dataset.tab);
        if (n === TAB) return;
        TAB = n;
        var fromEnd = !!b.closest('.x-end');
        show(DATA);
        if (fromEnd) { var r = document.querySelector('.x-room'); if (r) r.scrollIntoView({ block: 'start' }); }
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('details.fold'), function (dd) {
      dd.addEventListener('toggle', function () { dd.dataset.touched = '1'; });
    });
    /* 手機：畫框那排是橫捲的，選到的那一幅捲到中間（用 scrollLeft，不要 scrollIntoView——那會連整頁一起捲） */
    var rl = document.querySelector('.x-rail'), on = rl && rl.querySelector('.x-fr.on');
    if (rl && on && rl.scrollWidth > rl.clientWidth) rl.scrollLeft = Math.max(0, on.offsetLeft - (rl.clientWidth - on.offsetWidth) / 2);
    syncFold();
    loadThumbs();
    Array.prototype.forEach.call(document.querySelectorAll('.x-ph'), function (box) {
      box.onclick = function () { big(Number(box.dataset.i)); };
    });
  };
})();

</script>
