  $('maskBody').innerHTML = '';
}

/* ══════════════════════════════════════════════════════════════
   「確定嗎？」「知道了」「請輸入」
   ⚠️ 不要用瀏覽器的 confirm()／alert()／prompt()。
      這一頁跑在 Apps Script 的沙箱 iframe 裡，手機上的內建瀏覽器
      （LINE、FB、Gmail 點開的那種）與 Chrome 對跨來源 iframe 的規則，
      都可能直接把它們忽略掉——**而且完全不報錯**，只是回傳 false／null，
      程式一看到就 return，按鈕於是變成「按了沒反應」。
      2026-09-13 在另一套網站（就視藝起來記錄）踩到並全部改掉，這邊一起改。
   ══════════════════════════════════════════════════════════════ */
var ASK = null;         /* 還沒有答案的那一題 */
var ASK_NO = false;     /* 那一題「取消」要回什麼（ask 回 false、askText 回 null） */
function askDone(v) {
  var f = ASK; ASK = null;
  if (f) f(v);
}
/** 回傳 Promise<boolean>。Esc、點外面、按取消，都是 false。 */
function ask(text, okText, title) {
  return new Promise(function (res) {
    askDone(ASK_NO);               /* 保險：上一題還開著就先當取消 */
    ASK = res; ASK_NO = false;
    openMask('<div class="modal ask"><h3>' + esc(title || '確定嗎？') + '</h3>' +
      '<p class="ask-t">' + esc(text) + '</p>' +
      '<div class="acts"><button class="btn ghost" id="mCancel">取消</button>' +
      '<button class="btn pink" id="mOk">' + esc(okText || '確定') + '</button></div></div>');
    $('mCancel').onclick = closeModal;
    $('mOk').onclick = function () { askDone(true); closeModal(); };
  });
}
/** 只有一顆「知道了」。取代 alert()。 */
function say(title, text) {
  askDone(ASK_NO);
  openMask('<div class="modal ask"><h3>' + esc(title) + '</h3>' +
    '<p class="ask-t">' + esc(text) + '</p>' +
    '<div class="acts"><button class="btn" id="mOk">知道了</button></div></div>');
  $('mOk').onclick = closeModal;
}
/** 取代 prompt()。回傳 Promise<字串|null>；取消是 null，跟 prompt 一樣。 */
function askText(title, label, value, okText) {
  return new Promise(function (res) {
    askDone(ASK_NO);
    ASK = res; ASK_NO = null;
    openMask('<div class="modal ask"><h3>' + esc(title) + '</h3>' +
      '<p class="ask-t">' + esc(label) + '</p>' +
      '<input class="pw-in" id="askIn" value="' + esc(value || '') + '">' +
      '<div class="acts"><button class="btn ghost" id="mCancel">取消</button>' +
      '<button class="btn" id="mOk">' + esc(okText || '確定') + '</button></div></div>');
    var ok = function () { var v = $('askIn').value; askDone(v); closeModal(); };
    $('mCancel').onclick = closeModal;
    $('mOk').onclick = ok;
    $('askIn').onkeydown = function (e) { if (e.key === 'Enter') ok(); };
    /* 手機上自動聚焦會把鍵盤叫出來，正好省一次點擊 */
    setTimeout(function () { try { $('askIn').focus(); $('askIn').select(); } catch (e) {} }, 30);
  });
}

function modal(title, body, onOk) {
  openMask('<div class="modal"><h3>' + esc(title) + '</h3>' + body +
    '<div class="acts"><button class="btn ghost" id="mCancel">取消</button>' +
    '<button class="btn" id="mOk">確定</button></div></div>');
  $('mCancel').onclick = closeModal;
  $('mOk').onclick = function () { if (onOk() !== false) closeModal(); };
}

function search(q) {
  q = String(q || '').trim().toLowerCase();
  if (!q) return;
  var hit = [];
  sortedUnits().forEach(function (u) {
    if ((u.nameEn + u.nameZh + u.descZh).toLowerCase().indexOf(q) >= 0) {
      hit.push({ t:'單元', a:u.nameEn + ' ' + u.nameZh, b:u.descZh, p:'prog' });
    }
  });
  S.classes.forEach(function (c) {
    if ((c.code + c.grade).toLowerCase().indexOf(q) >= 0) {
      hit.push({ t:'班級', a:c.code + ' ' + c.grade, b:'到進度檢核', p:'check', cls:c.code });
    }
  });
  S.notes.forEach(function (n) {
    if (String(n.text).toLowerCase().indexOf(q) >= 0) {
      hit.push({ t:'札記', a:n.date + ' ' + (n.cls || ''), b:n.text.slice(0, 80), p:'notes' });
    }
  });
  S.resources.forEach(function (r) {
    if ((r.title + r.note).toLowerCase().indexOf(q) >= 0) {
      hit.push({ t:'資源', a:r.title, b:r.note || r.url, p:'res' });
    }
  });
  openMask('<div class="modal"><h3>搜尋「' + esc(q) + '」　' + hit.length + ' 筆</h3>' +
    (hit.length ? '<div class="list">' + hit.slice(0, 40).map(function (x, i) {
      return '<div class="it"><span class="badge c-gray">' + x.t + '</span>' +
        '<div class="tx"><div class="a">' + esc(x.a) + '</div><div class="b">' + esc(x.b) + '</div></div>' +
        '<button class="btn ghost sm" data-hit="' + i + '">前往</button></div>';
    }).join('') + '</div>' : '<div class="empty-note">沒有找到。</div>') +
    '<div class="acts"><button class="btn ghost" id="mCancel">關閉</button></div></div>');
  $('mCancel').onclick = closeModal;
  Array.prototype.forEach.call(document.querySelectorAll('[data-hit]'), function (b) {
    b.onclick = function () {
      var x = hit[Number(b.dataset.hit)];
      if (x.cls) { UI.check.cls = x.cls; loadProg(); }
      closeModal(); go(x.p);
    };
  });
}

document.addEventListener('keydown', function (e) {

window.addEventListener('hashchange', function () {

var PHONE = isPhone();

/* 轉螢幕方向／拉動視窗，跨過手機與桌機的界線時整頁重畫。
   以前不重畫，轉橫再轉直會留著另一種版面的 HTML，欄位就縮不回去（2026-09-15 他回報）。
   只有「跨界線」才重畫，拉視窗時不會一直重繪。 */
(function watchViewport() {
  var was = isPhone(), t = null;
  function check() {
    var now = isPhone();
    if (now === was) return;
    was = now;
    if (!S) return;                  /* 資料還沒到，等 render 自己來 */
    drawNav();
    PAGE = fallbackPage(PAGE);
    render();
  }
  function later() { clearTimeout(t); t = setTimeout(check, 150); }
  window.addEventListener('resize', later);
  window.addEventListener('orientationchange', later);
})();

/* 快速記錄打到一半，隔一下就把草稿存一份（見 draftSave）。
   ⚠️ 用捕獲階段（第三個參數 true）。按鈕的 onclick 常常會整頁重畫，
      元素被換掉之後事件就不會再冒泡到 document，捕獲才一定收得到；
      真正要存的動作延後 600ms，那時候 UI.quick 已經更新好了。 */
(function watchDraft() {
  var t = null;
  function later() {
    if (PAGE !== 'quick') return;
    clearTimeout(t);
    t = setTimeout(draftSave, 600);
  }
  document.addEventListener('input', later, true);
  document.addEventListener('click', later, true);
})();

(function init() {
  var id = location.hash.replace('#', '');
  if (id && navPages().some(function (p) { return p.id === id; })) PAGE = id;
  else if (id) PAGE = fallbackPage(id);
  else if (PHONE) PAGE = 'quick';      /* 手機打開就直接進快速記錄 */
  document.addEventListener('DOMContentLoaded', function () {
    $('q').onkeydown = function (e) { if (e.key === 'Enter') search(this.value); };
  });
  if (document.readyState !== 'loading') {
    $('q').onkeydown = function (e) { if (e.key === 'Enter') search(this.value); };
  }
  boot('');
})();

  /* ── 縮放：課表、掛紙板、黑板的字都放進物件裡，放不下就整塊縮，絕不溢出 ── */
  function fitBox(box, inner, designW) {
    /* ⚠️ 物件的圖還沒載入時框是 0 寬，算出來比例＝0，整塊內容就縮不見了（2026-11-03 他問「今天要做的是空白的？」）。
       量不到就先不動，等圖載入／大小改變（ResizeObserver）再算 */
    if (!box || !inner || box.clientWidth < 20 || box.clientHeight < 20) return 0;
    /* ⚠️ 量高度之前一定要先清掉上一輪的 minHeight，不然會把自己撐高、比例越算越小（踩過：掛紙板縮到 0.39） */
    inner.style.transform = 'none'; inner.style.minHeight = '0'; inner.style.width = designW + 'px';
    var k = Math.min(box.clientWidth / designW, box.clientHeight / inner.offsetHeight);
    inner.style.width = (box.clientWidth / k) + 'px';
    k = Math.min(k, box.clientHeight / inner.offsetHeight);
    inner.style.width = (box.clientWidth / k) + 'px';
    inner.style.minHeight = (box.clientHeight / k) + 'px';   /* 高度也撐滿（課表的格子跟著長高） */
    inner.style.transform = 'scale(' + k + ')';
    return k;
  }
  function fitLine() {
    var e = document.getElementById('stuLine'), r = document.querySelector('.stu-in'); if (!e || !r) return;
    var f = r.clientWidth * (isTall() ? .021 : .0105); e.style.fontSize = f + 'px';
    while (e.scrollHeight > e.clientHeight + 1 && f > 8) { f -= .5; e.style.fontSize = f + 'px'; }
  }
  /* 掛紙板要排多寬（他 11-03：單元名稱一行寫完，拿「所有單元裡最長的名稱」來量，不是只看今天的）：
     每一列「名稱以外」的寬度取最大的，加上最長名稱的寬度；至少 300（字才夠大） */
  function fcWidth() {
    var g = document.querySelector('#stuFcIn .today-grid'); if (!g) return 300;
    var rows = g.querySelectorAll('.tcard'), a0 = g.querySelector('.tcard:not(.lost) .m .a') || g.querySelector('.tcard .m .a');
    if (!rows.length || !a0) return 300;
    var probe = el('span'); probe.style.cssText = 'position:absolute; visibility:hidden; white-space:nowrap; font:' + getComputedStyle(a0).font;
    document.body.appendChild(probe);
    var longest = 0;
    sortedUnits().forEach(function (u) { probe.textContent = u.nameZh || u.nameEn || ''; longest = Math.max(longest, probe.offsetWidth); });
    var other = 0, inn = document.getElementById('stuFcIn'), w0 = inn.style.width;
    inn.style.width = 'max-content';
    Array.prototype.forEach.call(rows, function (r) {
      var a = r.querySelector('.m .a'); if (!a) return;
      var keep = a.style.cssText; a.style.cssText = 'display:none';
      r.style.width = 'max-content'; other = Math.max(other, r.offsetWidth); r.style.width = ''; a.style.cssText = keep;
    });
    inn.style.width = w0; probe.remove();
    return Math.max(300, Math.ceil(other + longest + 14));
  }
  function fitRoom() {
    var c = document.getElementById('stuCork'), w = c && c.firstElementChild;
    if (w) {
      var tb = w.querySelector('table.tt'); if (tb) tb.style.height = 'auto';
      var k = fitBox(c, w, isTall() ? 440 : 520);
      /* 表格本身拉到軟木板的高度：多出來的高度平均分給每一節 */
      if (tb && k) { var extra = c.clientHeight / k - w.offsetHeight; if (extra > 4) tb.style.height = (tb.offsetHeight + extra - 2) + 'px'; }
    }
    var f = document.querySelector('.stu-fcv'); if (f) fitBox(f, document.getElementById('stuFcIn'), fcWidth());
    fitLine();
  }
  /* ⭐ 平板直拿（2026-11-06 他要的）：16:10 的工作室在 768 寬只剩上面一半、字最小 7px。
     直拿時換成 4:5 的直式工作室——同一批物件、同一份功能，只是重新擺位置（CSS 的 body.stu-tall）。
     手機（isPhone，≤600）照舊不套場景；橫拿、電腦照舊 16:10。 */
  var TALL_MQ = '(orientation:portrait) and (min-width:601px) and (max-width:1100px)';
  function isTall() { return !isPhone() && matchMedia(TALL_MQ).matches; }
  function setTall() { document.body.classList.toggle('stu-tall', isTall()); }
  addEventListener('resize', function () { setTall(); if (document.body.classList.contains('stu-home')) fitRoom(); });

  /* ── 點點：進度檢核＝攤開的班級記錄本 ──
     左頁：這一節（年級／班級／單元／日期）、班級牌＋單元、進度狀態、缺席座號
     右頁：課堂札記、作品照片、快速操作　　右緣：一班一張索引標籤　　書底下：班級進度一覽（總表）　　儲存列＝書籤帶 */
  function sceneCheck(p) {
    var filt = p.querySelector(':scope > .card.no-print'), khead = p.querySelector(':scope > .k-head');
    var stat = byTitle(p, /本次進度狀態/), note = byTitle(p, /課堂札記/), abs = byTitle(p, /缺席座號/);

    }).join(''));
    /* 左頁上半部精簡（他 11-03 同意的排法）：
       班級＝右邊書籤（年級、班級下拉與 201 大牌子收起來，元素還在、事件不動）；
       單元、日期（連堂時加第幾節）＝標題列上的黏土鈕；粗體單元標題拿掉；教學目標只留一行，「看完整」才攤開中英文 */
    if (filt) {

    put(L, filt); put(L, khead); put(L, stat); put(L, abs); put(L, note);
    /* 「複製上週紀錄」搬到課堂札記標題列（按鈕本身是原版那一顆，事件不變；他 11-03） */

    if (quick) quick.style.display = 'none';   /* 快速操作整欄不放（他 11-03：電腦版不需要；儲存用下面那條紅色的儲存列） */

  /* ── 步步：教學進度＝牆上的大進度地圖 ──
     上緣：篩選＝地圖上方的磁鐵條　右上：統計＋狀態圖例＝圖例框　中間：單元＝虛線小路上的一站一站（站牌＋編號圖釘） */
  function sceneProg(p) {
    coverBtns(p);
    var filt = p.querySelector(':scope > .card.no-print'), stats = p.querySelector(':scope > .grid.g4:not(.units)');
    var secT = p.querySelector(':scope > .sec-t'), legend = Array.prototype.filter.call(p.querySelectorAll(':scope > .grid.g4'), function (g) { return g.querySelector('.lg-i'); })[0];

    map.appendChild(el('div', 'roll roll-b'));
    var pal = el('img', 'pal'); pal.src = im('bb_act2'); pal.alt = ''; map.appendChild(pal);
    p.insertBefore(map, p.firstChild);
    rest.forEach(function (n) { if (n.parentNode === p && n !== map) road.appendChild(n); });

    if (units) Array.prototype.forEach.call(units.children, function (u, i) {

  /* ── 工具箱：系統設定＝打開的工具箱，一格一格的抽屜（每格上面一片彩色標籤）
        show＝圖圖的作品框：只留「班級成果頁」那一張（原版功能整張搬過來，按鈕都是原本那一份） ── */
  function sceneSet(p, show) {
    var cards = Array.prototype.slice.call(p.querySelectorAll('.card'));
    var sc = cards.filter(function (c) { var h = c.querySelector(':scope > h3'); return h && /班級成果頁/.test(h.textContent); })[0];
    if (show) {

      p.insertBefore(fr, p.firstChild); return;
    }
    var box = el('div', 'stu-box'), lid = el('div', 'lid'), tray = el('div', 'drawers');
    var TAGS = [[/班級 Classes|班級$/, '顏料盒', 'c1'], [/系統狀態/, '儀表', 'c2'], [/學年度與學期/, '行事曆', 'c3'], [/節次數量/, '時鐘轉鈕', 'c4'],
                [/管理通行碼/, '鎖頭', 'c5'], [/學期封存/, '檔案箱', 'c6'], [/開新學期/, '新的記錄本', 'c7']];
    cards.forEach(function (c) {
      if (c === sc) return;
      var h = c.querySelector(':scope > h3, :scope > summary'), t = h ? h.textContent : '';
      var tag = TAGS.filter(function (x) { return x[0].test(t); })[0];
      var d = el('div', 'drawer2 ' + (tag ? tag[2] : 'c0')); d.appendChild(el('span', 'dtag', tag ? tag[1] : '抽屜')); d.appendChild(c); tray.appendChild(d);
    });
    /* 他 11-03：「有的收起來、有的又很長，版面亂」→ 左邊一排抽屜標籤，右邊只拉出一格（記住上次開哪一格）。
       收起來的那幾張（<details>）拉出來時自動打開。原本的卡片整張搬進來，功能不動。 */
    var drs = Array.prototype.slice.call(tray.children), nav = el('div', 'dnav'), panel = el('div', 'dpanel');
    var last = 0; try { last = +(localStorage.getItem('tpBox') || 0); } catch (e) {}
    if (!(last >= 0 && last < drs.length)) last = 0;
    drs.forEach(function (d, i) {
      var c = d.querySelector('.card'), h = c && c.querySelector(':scope > h3, :scope > summary');
      var en = h && h.querySelector('.en2'), zh = '';
      if (h) { var hc = h.cloneNode(true); Array.prototype.forEach.call(hc.querySelectorAll('button, .en2, .right, .ci'), function (x) { x.remove(); }); zh = hc.textContent.replace(/[＋+]\s*$/, '').replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\uFE0F]/gu, '').trim(); }
      var b = el('button', 'dbtn ' + d.className.replace('drawer2', '').trim(),
        '<span class="dtag">' + esc((d.querySelector('.dtag') || {}).textContent || '') + '</span><b>' + esc(zh) + '</b><small>' + esc(en ? en.textContent : '') + '</small>');
      b.type = 'button';
      b.addEventListener('click', function () { pull(i); });
      nav.appendChild(b); panel.appendChild(d);
    });
    var gob = el('button', 'dbtn c8', '<span class="dtag">作品框</span><b>班級成果頁 →</b><small>在圖圖的角落</small>');
    gob.type = 'button'; gob.dataset.go2 = 'show'; nav.appendChild(gob);
    function pull(i) {   /* ⚠️ 不要叫 show：會蓋掉 sceneSet 的參數 show（函式宣告會提升） */
      drs.forEach(function (d, j) {

        if (j === i) { var dt = d.querySelector('details'); if (dt) dt.open = true; if (d.firstElementChild && d.firstElementChild.tagName === 'DETAILS') d.firstElementChild.open = true; }
      });
      try { localStorage.setItem('tpBox', i); } catch (e) {}
    }
    tray.appendChild(nav); tray.appendChild(panel); tray.classList.add('dlist');
    pull(last);
    if (sc) { sc.style.display = 'none'; p.appendChild(sc); }
    box.appendChild(lid); box.appendChild(tray);
    Array.prototype.slice.call(p.children).forEach(function (n) { if (!n.classList.contains('hero') && n !== sc) n.style.display = 'none'; });
    p.insertBefore(box, p.firstChild);

     ⚠️ 手機的規則照原版：一樣三頁（總覽／快速記錄／教學進度）、每一頁的內容與順序都不動、不搬 DOM。
     只在最上面加一段場景（角色＋黑板／對話），卡片換成場景裡的物件外觀（掛紙、軟木板、記錄本、地圖卡）。
     圖用 m_*_front（280px，一張 16 KB），手機不抓大張。 */
  var PH = { home: null, quick: 'dd', prog: 'bb' };
  function pim(k) { return im('m_' + k + '_front'); }
  function phoneNav() {
    var nav = document.getElementById('nav'); if (!nav) return;
    Array.prototype.forEach.call(nav.querySelectorAll('a[data-p]'), function (a) {
      var ic = a.querySelector('.ic'); if (!ic || ic.dataset.stu) return;
      var p = a.dataset.p;
      ic.dataset.stu = 1;
      /* 他 11-03：不要門、不要角色本人 → 黑板（總覽）、夾板＋相機（點點的快速記錄）、地圖＋旗子（步步的教學進度） */
      ic.innerHTML = '<img class="stu-nh" src="' + im('ci/nav_' + (p === 'quick' ? 'quick' : p === 'prog' ? 'prog2' : 'home')) + '" alt="">';
    });
    if (window.fitNav) fitNav();
  }
  /* 手機黑板：寫給老師自己的打氣話（依 課程理念.md 的語氣：重過程、願意再試、把空間留給孩子） */
  var PBB = [
    ['今天也辛苦了，你陪孩子走的每一步都算數。', 'Every step counts.'],
    ['慢一點沒關係，孩子正在找自己的答案。', 'They are finding their own way.'],
    ['一堂課不完美也沒關係，願意再試一次就很好。', 'Try again is for teachers too.'],
    ['你留給孩子的空間，他們都感受得到。', 'The room you give matters.'],
    ['今天只要記下一個孩子的小發現就好。', 'Notice one small thing today.'],
    ['卡住的地方，就是下一次最好的起點。', 'Stuck is a place to start.'],
    ['你不只是在教畫畫，是在守護孩子的想像力。', 'You keep the wonder alive.'],
    ['深呼吸，今天也是充滿可能的一天。', 'Today is full of possibilities.'],
    ['孩子的笑聲，就是這堂課最好的回饋。', 'Their joy is the best feedback.'],
    ['每一句「我想試試看」，都是你種下的。', 'You planted every "Let me try."'],
    ['記錄不是交差，是為了看見孩子的成長。', 'Records help you see them grow.'],
    ['你已經做得很好了，給自己一點掌聲。', 'You are doing great.']
  ];
  var MOTTO = ['不是教孩子畫出老師的想法，', '而是幫助他們找到自己的答案！'];   /* 他 11-03 定的字（依 課程理念.md 最核心的第一句） */
  function phoneFoot() {
    var f = document.querySelector('footer.foot'); if (!f || f.querySelector('.stu-motto')) return;
    f.insertBefore(el('div', 'stu-motto', esc(MOTTO[0]) + '<br>' + esc(MOTTO[1])), f.firstChild);
  }
  function phoneScene(v) {
    phoneFoot();
    var k = stats(), p = PAGE, sc = el('div', 'stu-ps no-print');
    if (p === 'home') {
      var line = PBB[Math.floor(Math.random() * PBB.length)];
      /* 他 11-03：教學總覽只留黑板（打氣的話）；角色只在快速記錄／教學進度兩頁 */
      sc.className += ' ps-home';
      sc.innerHTML =
        '<div class="ps-chalk" id="stuChalk" title="點一下換一句"><div class="hi">' + esc(greetEn()) + ' ' + esc(myName()) + '!</div><div class="ln" id="stuLine"></div></div>';
      v.insertBefore(sc, v.firstChild);
      setLine(line);
      /* 卡片換成牆上的物件：今天要做的＝掛紙板、本週課表＝軟木板 */
      Array.prototype.forEach.call(v.querySelectorAll('.card'), function (c) {
        var t = (c.querySelector('h3') || {}).textContent || '';
        if (/今天要做的/.test(t)) c.classList.add('ps-fc');
        else if (/本週課表/.test(t)) c.classList.add('ps-cork');
      });
    } else if (PH[p]) {
      var m = PH[p], say;
      if (p === 'quick') {
        var rt = todayRoute();
        say = rt.length ? '今天 <b>' + rt.length + '</b> 節，還有 <b>' + k.pending + '</b> 班沒記。<br>點上課的班，記完按最下面的儲存。'
                        : '今天沒有排課。<br>要補記別天的，按「換別班」。';
      } else {
        say = '已完成 <b>' + k.done + '</b> / ' + k.units + ' 個單元，<b>' + k.started + '</b> 個進行中。<br>每一格是一班走到哪裡。';
      }
      sc.className += ' ps-st ps-' + m;
      sc.innerHTML = '<span class="ps-who"><img src="' + im('av_' + m) + '" alt=""></span><div class="ps-say"><b class="nm">' + ST[m].name + '・' + ST[m].role + '</b><span>' + say + '</span></div>';
      v.insertBefore(sc, v.firstChild);
      v.classList.add('ps-' + p);
    }
  }

  /* ── 接手 render() ── */
  var _render = window.render;
  window.render = function () {
    /* 每週課堂札記一進來先只看本週（舊的在選單「全部週次／上週」裡查）。只設第一次，之後照他選的 */
    if (PAGE === 'notes' && !UI.notes.__stu) { UI.notes.__stu = 1; if (!UI.notes.wk) UI.notes.wk = 'this'; }
    _render.apply(this, arguments);
    var on = !isPhone(), b = document.body;
    b.classList.add('stu-skin');   /* 外觀（黏土按鈕、圖示）手機電腦都套；場景只在電腦（studio） */
    b.classList.toggle('studio', on);
    b.classList.remove('stu-home');
    b.classList.toggle('stu-phone', !on);
    var v0 = document.getElementById('views'); v0.classList.remove('ps-quick', 'ps-prog');
    if (!on) { phoneNav(); phoneScene(v0); return; }
    tools();
    var v = document.getElementById('views');
    setTall();
    if (PAGE === 'home') { b.classList.add('stu-home'); buildRoom(v); }
    else buildStation(v, OF[curPg()] || 'dd');
  };
  /* 場景裡的物件：data-go2＝換頁、data-mate＝進那位夥伴的第一站（⚠️ 不要用 data-st：原版進度狀態按鈕用了）、黑板＝換一句 */
  document.addEventListener('click', function (e) {
    if (document.body.classList.contains('stu-phone')) {   /* 手機的場景：角色＝換頁，黑板＝換一句 */
      var pg = e.target.closest('[data-pgo]'); if (pg) { e.preventDefault(); return go(pg.dataset.pgo); }
      var hp = e.target.closest('[data-hop]'); if (hp) { hp.classList.remove('hop'); void hp.offsetWidth; hp.classList.add('hop'); return; }
      if (e.target.closest('#stuChalk')) { var cur = (document.getElementById('stuLine') || {}).textContent || '', x;
        do { x = PBB[Math.floor(Math.random() * PBB.length)]; } while (cur.indexOf(x[0]) === 0 && PBB.length > 1);
        return setLine(x); }
      return;
    }
    if (!document.body.classList.contains('studio')) return;
    var g = e.target.closest('[data-go2]');
    if (g) { e.preventDefault(); var t = g.dataset.go2; window.__STU_SHOW = (t === 'show');
      /* 「班級成果頁」原本在系統設定裡；工作室版把它放在圖圖的作品框：同一頁（set）只留那一張卡 */
      if (t === 'show') { if (PAGE === 'set') return render(); return go('set'); } return go(t); }
    var m = e.target.closest('[data-mate]'); if (m && ST[m.dataset.mate]) { e.preventDefault(); return go(ST[m.dataset.mate].items[0][0]); }
    if (e.target.closest('#stuChalk')) return setLine(pickLine(true));
    /* 掛紙板本身（不是上面的按鈕）＝進點點的記錄本 */
    if (e.target.closest('#stuFc') && !e.target.closest('button, a')) return go('check');
  }, true);
  /* ── 登入（管理通行碼）與等待：工作室門口（2026-11-04）──
     原版這兩個畫面都寫在 #boot：開頁時 class=loading「載入中…」、askPass() 換成 .lock 表單、boot() 成功就 display:none。
     #boot 看得到的時候，後面鋪一層工作室（#stuGate：招牌＋四位夥伴站在地板上），#boot 本身變成墨綠黑板。
     等待時黑板換成「工作室開門中…」＋會跑的進度條，夥伴輪流跳（他：「讓人明確知道在等待」）。
     ⚠️ 載入失敗時原版也是 class=loading，但裡面是錯誤訊息——只有內容真的是「載入中」才換，錯誤照原樣留在黑板上。 */
  (function bootScene() {
    var bt = document.getElementById('boot');
    if (!bt) return;
    var g = document.createElement('div');
    g.id = 'stuGate'; g.setAttribute('aria-hidden', 'true');
    g.innerHTML = '<div class="gt-title"></div><i class="gt-m dd"></i><i class="gt-m bb"></i><i class="gt-m tt"></i><i class="gt-m xx"></i>';
    document.body.insertBefore(g, document.body.firstChild);
    function sync() {
      var on = bt.style.display !== 'none', b = document.body;
      b.classList.toggle('stu-boot', on);
      if (on) b.classList.add('stu-skin');
      var wait = on && bt.classList.contains('loading') && /^\s*載入中/.test(bt.textContent || '') && !bt.querySelector('.gt-wait');
      if (wait) bt.innerHTML = '<div class="gt-wait"><b>工作室開門中…</b><span>夥伴們正在把今天的資料搬上桌</span>' +
                               '<i class="gt-bar"><i></i></i><small>Loading…</small></div>';
      b.classList.toggle('stu-wait', on && !!bt.querySelector('.gt-wait'));
    }
    sync();
    new MutationObserver(sync).observe(bt, { attributes: true, attributeFilter: ['style', 'class'], childList: true });
  })();

  /* 已經畫過一次的話（腳本比 boot 晚到），補畫 */
  if (window.S) window.render();
})();

</script>
</body>
