  /* ⚠️ 負的左右邊界要跟 .wrap 的內距（--pad）一樣。寫死 -22px 是 2026-09-14m 之前
     的舊值，那一版把 --pad 從 22 收到 14 之後這條沒跟著改，
     進度檢核那一頁就一直多出 16px 的橫向捲動（2026-09-15 量到的）。 */
  margin:16px calc(var(--pad) * -1) -40px;
  padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));
  background:rgba(255,253,246,.97); border-top:1px solid var(--line);
  box-shadow:0 -6px 20px rgba(var(--shade),.08);
}
.save-bar .btn{margin-left:auto}
.save-bar b{font-size:15px}

/* 動線列右邊那一欄（手機首頁的「去記錄」） */
.route .act{
  display:flex; flex-direction:column; align-items:flex-end; gap:5px;
  flex:0 0 auto; margin-left:auto;
}
.route .act .s{font-size:13px; font-weight:700; white-space:nowrap}
.route .act .s.ok{color:var(--green)}
.route .act .s.no{color:var(--red)}

/* 手機上可以按的那些圓點，給一點「按得下去」的樣子 */
.dot.tap{cursor:pointer; box-shadow:0 0 0 1px rgba(40,90,74,.28); position:relative}
/* ⚠️ 這顆點在手機上是入口（按下去直接去記錄那一班），但九個排一列只有 24px，
   按下去很容易點到隔壁那班（2026-09-20 量到的）。
   用一層看不見的外框把「按得到的範圍」撐到 34，圓點本身的大小和排版一格都沒動。 */
.dot.tap::after{content:''; position:absolute; inset:-3px}
.dot.tap:active{transform:scale(.92)}

/* 新增資源的表單：欄位一起排進格線，整列鋪滿（欄位有上限會右邊空一塊） */
.res-form{
  display:grid; gap:12px;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));
}
#views .res-form .field{max-width:none}

/* 教學資源：一張張卡，照片直接出縮圖（點下去放大）。
   以前是一列一列的清單，一個單元三份資源就佔掉整個畫面高度。 */
.res-grid{
  display:grid; gap:12px;
  /* ⚠️ 一定要 auto-fill，不能用 auto-fit。auto-fit 會把空軌道收掉，
     一個單元只有一筆資源時那張卡就被拉到整列寬，圖片跟著撐成一條橫幅
     （2026-09-15 他圈的）。auto-fill 留著空軌道，卡片就維持縮圖大小。 */
  grid-template-columns:repeat(auto-fill,minmax(min(100%,196px),1fr));
}
.res-i{
  display:flex; flex-direction:column; border:1px solid var(--line);
  border-radius:12px; overflow:hidden; background:#fffdf6;
}
.res-i .pic{
  display:grid; place-items:center; height:124px; background:#f4efe1;
  overflow:hidden; text-decoration:none;
}
.res-i .pic img{width:100%; height:100%; object-fit:cover; cursor:zoom-in; display:block}
.res-i .pic.ic{font-size:38px}
.res-i .t{padding:9px 11px 0; font-size:14.5px; font-weight:700; line-height:1.4}
.res-i .t a{color:var(--grn)}
.res-i .b{padding:3px 11px 0; font-size:13px; color:var(--muted); line-height:1.55}
.res-i .f{
  display:flex; align-items:center; gap:8px; margin-top:auto;
  padding:8px 11px 9px;
}
.res-i .f .x{
  margin-left:auto; border:0; background:transparent; color:var(--muted);
  cursor:pointer; font-size:14px; border-radius:7px; padding:3px 7px;
}
@media (hover:hover){
  .res-i .f .x:hover{background:#fdeaee; color:#c2354a}
}

/* 假日小卡。一天一張、自動排欄——一列一列往下加的話，
   登記十天就是十列空蕩蕩的長條（2026-09-14 他回報）。 */
/* 一天一張小卡，日期和名稱排**同一行**——本來上下兩行、右邊又空掉一半
   （2026-09-15 他圈的）。卡片寬度跟著字走，一排放得下就放得下。 */
.hol-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.hol-i{
  position:relative; background:#fffaf0; border:1px solid #f0e2b6;
  border-radius:11px; padding:8px 34px 8px 12px;
  display:flex; align-items:baseline; gap:9px; flex:0 1 auto;
}
.hol-i .d{font-size:13px; font-weight:700; color:#9b5d28; white-space:nowrap}
.hol-i .n{font-size:15px; font-weight:700; word-break:break-word}
.hol-i .x{
  position:absolute; top:6px; right:6px; width:24px; height:24px; line-height:1;
  border:0; border-radius:7px; background:transparent; color:var(--muted);
  cursor:pointer; font-size:14px;
}
@media (hover:hover){
  .hol-i .x:hover{background:#f4e3c4; color:var(--ink)}
}

/* 一排小標籤（目前用在「還沒有資源的單元」） */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip-u{
  display:inline-flex; align-items:center; border-radius:999px;
  padding:5px 13px; font-size:14px; font-weight:700;
}

/* 卡片群組的小標題（不是卡片，所以不會把裡面的欄位推開） */
.sec-t{
  display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;
  font-size:16px; font-weight:700; margin:0 2px 9px;
}
/* 名稱、英文、說明排同一行：本來說明另起一行，右邊空一大塊、卡片又高
   （2026-09-15 他圈的）。放不下才折。 */
.lg-i{display:flex; align-items:center; gap:10px; padding:11px 14px}
.lg-i .tx{min-width:0; display:flex; align-items:baseline; flex-wrap:wrap; gap:2px 9px}
.lg-i .tx .a{font-weight:700; font-size:15px}
.lg-i .tx .b{font-size:13.5px; color:var(--muted); line-height:1.6}

/* 放假的那一天：課表上整欄壓成米黃色，一眼看得出來不上課 */
.tt th.hol{background:#fff6e5}
.tt td.hol{background:#fffaf0}
.tt th .hol-t{display:block; font-weight:700; font-size:13px; color:#9b5d28}
/* ⚠️ 只淡化「空格」，停課那幾格不要淡（2026-10-05 健檢）：
   以前整欄 opacity:.5，「本來是 103」疊上淺色字只剩 1.72，等於看不到——
   但那一行正是「哪一班少了哪一節」的紀錄（見臨時異動的規則）。 */
.tt td.hol .slot:not(.off){opacity:.5}

/* ── 臨時異動：停課與調課 ──────────────────────────────────
   兩種都是「只有那一天」的事，所以格子一律用虛線框——
   實線框留給固定課表，一眼分得出哪些是常態、哪些是這次而已。 */
/* 被全校活動佔掉的那一節（期中考、兒童節活動、大掃除…） */
.slot.off{
  background:#fff6e5; border:1px dashed #e3c894; color:#8a5c22;
}
.slot.off .cn{font-size:15px; line-height:1.3}
.slot.off .un{color:#7a5e35}          /* 以前 #a8814a＝3.3；小卡變玻璃後再加深一階 */
/* 調到別天去了：留一格影子，寫清楚跑去哪 */
.slot.moved{
  background:#fbf8ed; border:1px dashed #d5c9ae; color:#726d5e;   /* 以前 #8e8877＝3.3 */
}
.slot.moved .cn{text-decoration:line-through; font-size:16px}
.slot.moved .un{color:#746c5b}        /* 以前 #9a927f＝2.9 */
/* 別節調過來的那一格：照班級顏色，只加一圈虛線＋一個「調」 */
.slot.swap{box-shadow:0 0 0 1.5px #285a4a inset}
.swap-tag{
  display:inline-block; margin-left:5px; padding:1px 6px; border-radius:7px;
  background:var(--grn); color:#fff; font-size:11.5px; font-weight:700;
  font-style:normal; vertical-align:middle;
}
/* 動線卡裡那一列（停課／調走） */
.route .it.off .tx .a{color:#8a5c22}
.route .it.off .tx .b{color:#7a5e35}

/* 停課登記的節次勾選 */
.per-pick{display:flex; flex-wrap:wrap; gap:6px}
.per-pick button{
  padding:7px 13px; border-radius:10px; cursor:pointer; font-size:14px; font-weight:700;
  border:1px solid var(--line); background:#fffdf6; color:var(--ink2);
}
.per-pick button.on{background:var(--grn); border-color:var(--grn); color:#fff}
/* 只停幾節的那幾筆：左邊多一條線，跟整天放假分得開 */
.hol-i.part{background:#fffdf6; border-color:#e6dcc2}
.hol-i .p{font-size:13px; color:var(--muted); white-space:nowrap}

/* 調課清單 */
.mov-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.mov-i{
  position:relative; background:#fffdf6; border:1px dashed #d5c9ae;
  border-radius:11px; padding:8px 34px 8px 10px;
  display:flex; align-items:center; gap:8px; flex:0 1 auto;
}
.mov-i .plate{
  border-radius:9px; padding:3px 9px; font-size:15px; font-weight:700; line-height:1.3;
}
.mov-i .f,.mov-i .t{font-size:13.5px; white-space:nowrap}
.mov-i .f{color:var(--muted); text-decoration:line-through}
.mov-i .t{font-weight:700}
.mov-i .ar{color:var(--muted)}
.mov-i .nt{font-size:13px; color:var(--muted)}
.mov-i .x{
  position:absolute; top:6px; right:6px; width:24px; height:24px; line-height:1;
  border:0; border-radius:7px; background:transparent; color:var(--muted);
  cursor:pointer; font-size:14px;
}
@media (hover:hover){
  .mov-i .x:hover{background:#efe7d4; color:var(--ink)}
}

/* 今天少掉的那幾節（首頁與快速記錄）。
   ⚠️ 少一節最怕的是不知道為什麼，所以原因一定要跟班級寫在同一行。 */
.lost-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.lost-i{
  display:inline-flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink2);
  background:#fff6e5; border:1px dashed #e3c894; border-radius:11px; padding:6px 12px;
}
.lost-i b{color:#8a5c22}
.lost-i .plate{border-radius:8px; padding:2px 8px; font-size:14px; font-weight:700}
.qk-lost{display:flex; flex-direction:column; gap:6px; margin-top:8px}
.qk-lost span{
  font-size:14px; color:#8a5c22; background:#fff6e5; border:1px dashed #e3c894;
  border-radius:11px; padding:8px 12px;
}

/* 編輯課程視窗下半：「只有這一天」 */
.once{
  margin-top:14px; padding:12px 13px 11px; border-radius:13px;
  background:#fbf8ed; border:1px dashed #d5c9ae;
}
.once-h{font-size:14px; font-weight:700; color:var(--ink2); margin-bottom:9px}
.once-h b{color:var(--grn-d)}
.once-now{font-size:14px; line-height:1.6; margin-bottom:9px}
.once-act{display:flex; gap:8px; flex-wrap:wrap}
.once-r{display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; margin-bottom:9px}
.once-r .field{margin:0}
.once .hint{margin-top:2px}

.pill-term{
  display:inline-flex; gap:0; border:1px solid #ddd2ba; border-radius:11px; overflow:hidden;
}
.pill-term button{
  border:0; background:#fffdf6; padding:9px 20px; cursor:pointer; font-weight:700;
  color:var(--ink2);
}
.pill-term button.on{background:var(--grn); color:#fff}
@media print{
  .nav,.top,.foot,.no-print{display:none !important}
  .wrap{padding:0}
  .card{box-shadow:none; break-inside:avoid}
  body{font-size:11.5pt}
}
/* ⚠️ 這三條是一組的，改一條要一起算。頂欄由左到右是
   〔標題（中文＋英文）〕〔搜尋框〕〔學年度學期〕〔週次〕，量出來：
     · 標題連英文 640、只有中文 390；學年度 232、週次 220（排成一行、字放大之後）
     · 間距＋內距 76
   所以「英文還在」時整條要 1168 ＋ 搜尋框，「英文收掉」時只要 918 ＋ 搜尋框。
   搜尋框低於 240 就不好打字，兩條斷點是照這個算出來的。 */
@media (max-width:1410px){ .brand .t1 .enpart{display:none} }
/* 搜尋框收起來的那一條。固定的部分是 925（標題 397 ＋ 學年度 232 ＋ 週次 220
   ＋ 間距 36 ＋ 內距 40），所以搜尋框拿到的是「視窗寬 − 925」：
     1194（iPad Pro 11 橫拿）→ 269　1180（Air）→ 255　1151 → 226
     1133（mini）→ 208　1080 → 155　1024 → 99
   1150 以下才收起來——上面那幾台平板明明放得下（2026-09-18 他拍回來指出的），
   1080 以下就真的只剩一條縫了。 */
@media (max-width:1150px){ .search{display:none} }
/* 更窄的時候標題也收一級，學年度那一顆寫了完整學期之後才不會頂到週次 */
@media (max-width:1000px){ .brand .t1{font-size:23px} }
/* 手機：頂欄改成兩行，不然標題和教師名會被擠成一個字一行 */
/* ⚠️ 手機的斷點是「窄」**或**「矮而不寬」。
   橫著拿手機時寬度會變成 844，超過 820 就整個跑回桌機版；轉回直的又不會重畫，
   欄位就縮不回來（2026-09-15 他回報）。iOS 的網頁沒辦法真的鎖定螢幕方向，
   所以改成：橫的時候照樣走手機版面，內容再收成一條直的（見下面的 .wrap）。
   ⚠️ 以後新增手機專用的規則，兩個條件都要帶上，不要只寫 max-width。
   ⚠️ 2026-10-06 寬度從 820 改成 600：直拿的平板要走完整版面（他要的）。 */
@media (max-width:600px), (max-height:520px) and (max-width:1024px){
  /* 彈出視窗的按鈕在手機上直排、整列寬，主要動作在最下面＝拇指最好按的位置 */
  .modal .acts{flex-direction:column-reverse; gap:8px}
  .modal .acts .btn{width:100%; justify-content:center; padding:13px 16px; font-size:16px}
  /* 橫幅在手機上**只留學年度和第幾週**（2026-09-15 他圈的：
     標題、老師名字、學期在手機上佔掉一整排，而瀏覽器最上面本來就寫著網站名稱）。
     教師名字和學期要查的話在「系統設定」。 */
  /* ⚠️ 手機上這兩顆只是「現在是哪個學期、第幾週」，不是按鈕——不用留觸控高度，
     壓到 34 左右就好，省下來的十幾像素是捲動時一直都在的（2026-09-20 他圈的）。
     ⚠️ 高度要壓得下來，emoji 得先換成線條圖示：emoji 的行框比字高一截，
        內距再怎麼收都卡在 46px（量過）。 */
  /* ⚠️ 頂欄在手機上不要自己是一塊白的。白頂欄 ＋ 牛皮紙側標 ＋ 有色的紙，
     三條橫帶疊在一起，最上面那條看起來就是「貼上去的」（2026-09-20 他圈的）。
     底改成跟側標、跟整頁同一面資料夾（連水彩暈都對得起來），
     下面那條線和顏料條也一起收掉——同一面紙上不要再劃線。 */
  /* ⚠️ 側標在手機上做滿版：左右不要留白（2026-09-20 他要的）。
     桌機維持跟內容切齊那 14px——那是他 2026-09-14 畫兩條紅線要求的，不要一起動。
     手機的紙本來就是整片鋪到螢幕邊，側標跟著鋪滿才是同一面；
     留 14px 反而像三張卡片浮在中間。 */
  .nav{padding-left:0; padding-right:0}
  /* ⚠️ 側標鋪滿之後，那張紙的圓角就不能留：紙的左上／右上各缺一塊 14px 的圓角，
     牛皮紙從縫裡透出來，看起來像兩個角沒接上（2026-09-20 他圈的）。
     手機上整張紙鋪到螢幕邊，所以圓角和左右的邊線一起收掉，只留上緣那一條
     ——那條是側標坐著的邊，選到的那張會壓上去蓋掉。 */
  .main{border-radius:0; border-left-width:0; border-right-width:0}
  .main::before{display:none}           /* 手機的紙沒有圓角，不用那條唇 */
  .top{
    gap:8px; padding:6px 12px; border-bottom:0;
    background:var(--folder); background-attachment:fixed;
  }
  .top::after{display:none}
  .brand{display:none}
  .year-badge{flex:1 1 0; justify-content:center; font-size:16px; padding:6px 12px; gap:6px}
  .chip{flex:1 1 0; justify-content:center; padding:6px 12px; gap:6px}
  .chip .k{display:none}            /* 日期區間留給「本週課表」那張卡 */
  .chip .v{font-size:16px; line-height:1.25}
  /* ⚠️ 下緣只留 10px。手機上內容和頁尾插圖之間本來空著 62px
     （wrap 的 40 ＋ foot 的 22），捲到底看起來像少載了一塊（2026-09-20 他圈的）。 */
  .wrap{padding:14px 14px 10px}
  .foot{
    padding-top:6px;
    -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,0) 0, #000 26px);
    mask-image:linear-gradient(180deg, rgba(0,0,0,0) 0, #000 26px);
  }
  .foot .strip{margin-bottom:6px}
  .card{padding:14px}
  .card>h3{font-size:16px}
  /* ⚠️ 短的那種（日期）跟標題排同一行、靠右；長的放不下才自己掉到第二行。
     以前是一律 flex:1 1 100% 直接掉到第二行還靠左，日期看起來就像另一行資料
     （2026-09-20 他圈的）。 */
  .card>h3 .right{margin-left:auto; flex:0 1 auto; text-align:right}
  /* ⚠️ 基礎樣式是 nowrap。長的那種（待補進度的「還有 7 個要補・點號碼＝已補課…」306px）
     在 320 寬的手機上掉到第二行也還是塞不下，整頁就多出 15px 橫向捲動（2026-10-12 健檢）。
     手機上放不下就讓字自己折行；短的（日期）排在哪一行跟以前一樣。 */
  .card>h3 .right{white-space:normal; min-width:0; max-width:100%}
  /* 教學進度：手機上只要「各班進行到哪裡」，封面大圖、英文說明、編輯鈕都先收起來，
     一個畫面才看得到好幾個單元。桌機不動。 */
  .unit .cover{display:none}
  /* ⚠️ 封面藏起來了，左邊那條 150px 的封面欄也要一起收掉（2026-10-06 健檢）。
     以前「改回一欄」寫在 max-width:700px，可是手機版面是到 820（直拿的 iPad）
     和橫拿的手機都算——701~1024 這一段封面不見了、欄還在，進度條被擠到 0px。
     手機版面的條件一律跟 PHONE_MQ 走，不要另外寫寬度。 */
  .units>.unit{grid-template-columns:minmax(0,1fr)}
  .units>.unit>.hd,.units>.unit .d1,.units>.unit .d2,
  .units>.unit .prog-line,.units>.unit .cls-grid{grid-column:1}
  .g5,.g4,.g2{grid-template-columns:1fr}
  .unit .bd .d2{display:none}
  .unit .hd [data-eu]{display:none}
  .unit .bd .d1{font-size:14px}
  /* 手機上那排狀態圓點是入口，填滿欄寬比較好按（桌機是用滑鼠點，維持 24） */
  .cls-grid .cells .dot{width:28px; height:28px; font-size:14px}

  /* 手機上把「手感」的裝飾收掉：膠帶、旋轉在小螢幕上只會讓字歪、讓版面變擠。
     ⚠️ 這條要跟著新增——以後再加任何旋轉或膠帶，記得在這裡關掉。 */
  .hero::before{display:none}
  .stat .ic,.unit .no,.refl .no,.brand .logo{transform:none}
}

/* ── 用手指點的裝置（手機**和平板**）─────────────────────────
   ⚠️ 這一段以前寫在上面那個手機的媒體查詢裡，所以平板一直沒拿到：
   iPad 橫著拿是 1024，比 820 寬，缺席座號的 ✕ 在上面只有 14×20
   ——手指按下去常常按空（2026-09-18 量到的）。
   判斷的條件改成「有沒有滑鼠游標」，不是「畫面寬不寬」：
   手機、平板、觸控筆電都會拿到，接鍵盤滑鼠的桌機不會。 */
@media (pointer:coarse){
  /* ⚠️ 可以按的東西至少要 34×34。外觀幾乎沒變，只是把「按得到的範圍」撐開。 */
  .seat{padding:3px 6px 3px 13px}
  .seat button{
    min-width:34px; min-height:34px; padding:0; font-size:17px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .res-i .f .x{
    min-width:34px; min-height:34px; padding:0; font-size:16px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .hol-i{padding-right:44px}
  .hol-i .x{width:34px; height:34px; top:4px; right:4px; font-size:16px}
  /* 週次的 ‹ › 在平板上量到 33×34，差那 1px 就按不到（2026-09-18） */
  .btn.ghost{min-width:36px; min-height:36px}
  /* 教學資源那張卡的標題就是連結，只有 21px 高。
     ⚠️ 用「上下各撐 7px、再用負邊界收回來」的寫法：按得到的範圍變成 35px，
        但卡片的高度和行距一格都沒動（直接加 padding 會把每張卡撐高）。 */
  .res-i .t a{display:inline-block; padding:7px 0; margin:-7px 0}
  /* 首頁的「去處理」「查看全部」也是同一招：按得到的範圍撐到 34，行高一格沒動。
     ⚠️ 用 padding ＋ 負 margin，不要直接加 padding（卡片會被撐高）。 */
  .todo-more a{display:inline-block; padding:7px 4px; margin:-7px -4px}
  /* ⚠️ 只寫上下的 margin。寫成 `margin:-7px 0` 會把基礎樣式的 `margin-left:auto`
     一起蓋掉，那一段就不再靠右——而且這條只在「用手指的裝置」生效，
     桌機的瀏覽器量不出來，我在無頭瀏覽器裡看是靠右的、他手機上不是
     （2026-09-20 他圈的日期就是這個）。 */
  .card>h3 .right{display:inline-block; padding:7px 0; margin-top:-7px; margin-bottom:-7px}
  /* 收合標題（🔒 管理通行碼、🎨 成果頁的開場白…）也按得順一點 */
  /* ⚠️ 只加 min-height，不要動 display。summary 改成 flex 之後，
     有些瀏覽器會把預設的展開三角形吃掉（這一頁有兩種摺疊卡，一種本來就是 flex、
     一種靠預設樣式）。 */
  details.fold>summary{min-height:34px}
  /* ⚠️ 輸入框只要小於 16px，iOS 一點進去就會把整頁放大，還要自己兩指縮回來。
     成果頁那排網址欄是 13px、頂欄的搜尋框是 15px（2026-09-15／09-18 健檢抓到的）。
     用滑鼠的桌機維持原尺寸——那裡放得下比較多字，而且不會有放大這回事。 */
  .sh-row .u input{font-size:16px}
  /* ⚠️ 選擇器要跟全域那條（.search input[type=text]，15px）一樣重，不然輸給它——
     2026-10-06 量到 iPad 橫拿時搜尋框還是 15px，一點就放大 */
  .search input[type=text]{font-size:16px}
}

/* 很窄的手機（320，iPhone SE 一代那種）：學年度那一顆寫了完整的
   「115 學年度上學期」之後，跟週次那一張擠不下同一行（2026-09-18 量到週次被推出畫面）。
   兩顆都縮一級字就放得回去；375 以上完全不受影響。 */
@media (max-width:360px){
  .year-badge{font-size:15px; padding:8px 10px; gap:6px}
  .chip{padding:8px 10px; gap:7px}
  .chip .v{font-size:15px}
}

/* 橫著拿手機時，內容仍然收成一條直的（他說「固定直式操作」）。
   網頁沒辦法鎖定螢幕方向，但至少版面不會跟著橫過去、轉回來也不會有東西縮不回去。 */
@media (max-height:520px) and (max-width:1024px){
  .wrap{max-width:600px; margin-left:auto; margin-right:auto}
  /* 橫拿的手機只有 390 高：頂欄 47 ＋ 側標 51 ＋ 底下儲存列 84 黏著，
     內容只剩 208（2026-10-06 量的，快速記錄一次只看得到兩顆進度鈕）。
     頂欄跟著捲走（學年度、週次往回捲就看得到），只留側標黏著；儲存列收薄。 */
  .top{position:relative}
  .nav{top:0}
  .qk-bar{padding-top:8px; padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .qk-save{padding:9px}
  /* ⚠️ .qk-hint 不要藏：它只在「按儲存會刪掉進度紀錄」這種時候才出現 */
}

/* 平板（觸控、完整版面）：往下捲時頂欄跟著捲走，只留側標黏著（2026-10-06 他看過預覽選的）。
   iPad 橫拿時頂欄 108 ＋ 側標 82 一直佔著，再加上儲存列和鍵盤，內容幾乎沒地方。
   學年度、週次往回捲就看得到。⚠️ 用 pointer:coarse 分：桌機（滑鼠）完全不動。
   ⚠️ 紙的上緣那條唇（.main::before）原本黏在「頂欄＋側標」底下，這裡要跟著改成只算側標。 */
@media (hover:none) and (pointer:coarse) and (min-width:601px){
  .top{position:relative}
  .nav{top:0}
  .main::before{top:var(--navH,60px)}
}

/* 窄畫面（手機）：頁籤縮小、英文收起來，圖示放大當辨識點。
   導覽本來就已經是橫的了，這裡只調尺寸。 */
/* ⚠️ 導覽不在這裡調了。以前這一段把頁籤縮成手機的樣子，但斷點寫死在 900，
   901–1210 那一段（平板橫拿、筆電開一半）就沒人管，側標被切在畫面外。
   現在改由 fitNav() 量出來，見上面「導覽的三種排法」。 */
@media (max-width:900px){
  /* 這一段週次改回兩行（並排會擠出畫面），字就不要跟著放大，
     不然那張卡變成 62px 高，整條頂欄反而從 73 被撐到 87。 */
  .chip .v{font-size:17px}
  .chip .k{font-size:13px}
  .foot .pencils{height:76px}
  .hero h1{font-size:38px}
}

/* ══════════════════════════════════════════════════════════════
   玻璃質感（2026-09-21 美術改版）
   ── 一句話：紙不是玻璃，**浮在紙上面的東西**才是。 ──────────

   那張「紙」（.main）、資料夾側標那一條（.nav 的底）、頂欄、橫幅上的水彩，
   全部維持不透明——它們是底材。變成玻璃的是卡片、按鈕、欄位、彈出視窗、
   沒選到的頁籤、底下那條儲存列。

   立體感來自**邊緣**，不是影子：邊框換成漸層（左上亮、中間收、右下再亮一次
   ＝玻璃的厚度），內緣上下各一道光（＝玻璃的唇），再加上半透明和背景模糊。

   ⚠️ 這一整段刻意寫在最後面。很多條跟原本的規則權重一樣（例如 .btn.green、
      .pick.on、.nav a:hover），靠的是**寫在後面**才蓋得過去。
      不要把它往上搬，也不要在它後面再插規則。
   ⚠️ 十三個班級色、四個進度狀態色一個字都沒動。
   ⚠️ 成果頁（Show.html）有自己的一份，兩邊的變數要一起改。
   ══════════════════════════════════════════════════════════════ */

:root{
  /* 玻璃的底：暖白，只有六成——底下的紙、頁面色、水彩要透得出來。
     ⚠️ 不要再調低。低於 .5 之後，淺色頁（教學進度是米黃）上的正文
        對比會掉到 4.8 以下。 */
  /* ⚠️ 2026-10-05：從暖白 255,253,246 收成幾乎中性的白——藍底透上來的時候，
     暖白會跟藍色混成一點灰綠；中性白透出來就是乾淨的淺藍。透明度沒動。 */
  /* ⚠️ 2026-10-05 第二輪（他說「過多的效果會讓版面看起來有點花，反而看不清文字」）：
     .62 → .80、飽和 1.7 → 1.15。透明度太高時，底下頁面的紙色和水彩會一塊一塊透上來，
     字底下的顏色就一直在變；玻璃的感覺改由「邊緣」負責，不靠透明。 */
  --gl-tint:rgba(255,254,251,.80);
  --gl-tint-2:rgba(255,254,251,.70);      /* 次要元件（膠囊、欄位）透一點 */
  --gl-bf:blur(16px) saturate(1.15);

  /* 邊：左上亮 → 中間收掉 → 右下再亮一次。
     這一條就是「立體」的來源——玻璃的厚度是靠邊緣的反光讀出來的，
     不是靠陰影。單一顏色的細框做不出來，所以邊框改成漸層。 */
  /* ── 2026-10-05 加強（他說「玻璃質感沒有很明顯，邊緣沒有立體轉折的感覺」）──
     原本中段只收到 .20，亮暗差太小，邊看起來像一條均勻的淡線。
     現在：左上一整段白光 → 很快收掉 → 右下有一段真的暗下去（玻璃的厚度背光那一面）
     → 最角落再接一點回光。亮與暗之間的那個「折」就是立體轉折。 */
  /* ⚠️ 第二輪收斂：右下的暗段 .50 → .22。暗得太多，每張卡的右下角都是一塊灰，
     一整頁看下來就是幾十塊灰斑。留一點點「轉折」，不要讓它變成一條灰框。 */
  --gl-rim:linear-gradient(150deg,
      rgba(255,255,255,1) 0%,
      rgba(255,255,255,.55) 20%,
      rgba(255,255,255,.12) 45%,
      rgba(var(--edge),.22) 72%,
      rgba(var(--edge),.16) 90%,
      rgba(255,255,255,.60) 100%);

  /* 內緣：上面一道白光、下面一道回光＝一圈玻璃的唇。
     ⚠️ inset 的陰影會照著 border-radius 走，所以四角那個「各差一兩像素」的
        手裁圓角不會被破壞。 */
  /* ⚠️ 2026-10-05：上緣的光加粗成 1.5px、左緣補一道側光；下緣從「白色回光」改成
     一道**暗**邊——玻璃的底面是背光的，上亮下暗才讀得出弧度。
     最後那一圈 inset 模糊白光＝光在玻璃邊緣裡面折射，讓邊有厚度、不是一條線。 */
  /* 第二輪收斂：拿掉側光、內圈和那一圈 18px 的霧光（那一圈會把卡片四邊的字底弄得不均勻），
     只留上亮下暗兩條——光是這兩條就讀得出厚度。 */
  --gl-lift:inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(var(--shade),.07);
  --gl-ring:inset 0 0 0 1px rgba(255,255,255,.55);

  /* 影子：比現在深一階、也散一階。玻璃要浮起來才看得出是玻璃。
     色相照舊帶暖褐（白紙上不要浮出一圈冷灰）。 */
  /* 三層：貼地的那一圈（邊緣離開紙面）＋近影＋遠影。藍底上用石板藍才不會髒。 */
  --gl-drop:0 1px 2px rgba(var(--shade),.07), 0 10px 26px rgba(var(--shade),.09);
  /* 玻璃表面的反光：上方三分之一一片斜斜的亮面，往下淡掉。
     ⚠️ 只疊在 padding-box，邊框那一圈還是 --gl-rim 自己的漸層。
     ⚠️ 它會讓卡片上緣更白，正文對比只會變高，不會變低。 */
  /* ⚠️ 第二輪：**拿掉**。那一片斜反光就壓在卡片標題和第一行字底下，
     左上白、右下灰，字底下的顏色跟著變——是「看不清文字」最主要的原因。
     變數留著（寫成透明），要救回來只改這一行。 */
  --gl-sheen:linear-gradient(rgba(255,255,255,0), rgba(255,255,255,0)) padding-box;
}

/* 瀏覽器不支援 backdrop-filter 時（模糊做不出來），把底調實一點，
   免得變成「只是比較淡的卡片」。 */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{ --gl-tint:rgba(255,254,251,.93); --gl-tint-2:rgba(255,254,251,.88) }
}

/* 系統設定成「減少透明度」時一律回到實色（iOS 自己也是這樣做的） */
@media (prefers-reduced-transparency:reduce){
  :root{ --gl-tint:#fffdf6; --gl-tint-2:#fffdf6; --gl-bf:none }
}

/* ══ 1. 資訊卡 ═══════════════════════════════════════════════
   老師端和家長端的 .card 是同一個樣子，寫在一起。 */
.card,
.modal,
.lock{
  background:
    var(--gl-sheen),
    linear-gradient(var(--gl-tint), var(--gl-tint)) padding-box,
    var(--gl-rim) border-box;
  border:1px solid transparent;
  box-shadow:var(--gl-lift), var(--gl-drop);
  -webkit-backdrop-filter:var(--gl-bf);
          backdrop-filter:var(--gl-bf);
}

/* ── 卡片裡面的那一層小卡也是玻璃（2026-10-05）─────────────────
   他說「玻璃質感沒有很明顯」，放大看才發現：畫面上數量最多的那些小卡——
   統計卡、今天要做的每一節、單元卡、出席狀況每一班、單元省思、資源、成果頁清單——
   **根本沒有變成玻璃**，還是米白實色＋一圈米色細線。外面那張大卡再怎麼調，
   看到的大多是這些。
   ⚠️ 不模糊（不加 backdrop-filter）：外面那張大卡已經模糊過了，
      一頁幾十張小卡各自模糊在平板上會卡。
   ⚠️ **有狀態的那幾張不換底也不換邊**（.tcard.now 現在這節、.ab-c.ok 全到、
      .refl.done 寫好了、.rep-r.warn 連續缺席）——狀態就是靠那個底色和邊框畫的，
      換成玻璃就看不出來了。它們只多吃立體的那一組陰影。 */
.stat,
.unit{
  background:
    var(--gl-sheen),
    linear-gradient(var(--gl-tint), var(--gl-tint)) padding-box,
    var(--gl-rim) border-box;
  border-color:transparent;
  box-shadow:var(--gl-lift), var(--gl-drop);
}
/* ⚠️ 第二輪：**大卡片裡面的那一層小卡不做玻璃**（今天每一節、出席每一班、省思、
   缺席的孩子、資源、成果頁清單）。外面那張大卡已經有玻璃的邊和影子，
   裡面每一張再各自一圈立體邊＋影子＝同一塊地方疊兩層效果（他以前圈過的「多重邊框」）。
   改成：近乎不透明的白底（字底下一片乾淨）＋ 一條很淡的細線，沒有影子。
   ⚠️ 統計卡和單元卡是直接坐在紙上的，它們是「外層」，留著玻璃。
   ⚠️ 有狀態的那幾張照舊不動（見上一段）。 */
.tcard:not(.now),
.ab-c:not(.ok),
.refl:not(.done),
.rep-r:not(.warn),
.res-i,
.sh-row{
  background:rgba(255,255,255,.72);
  border-color:rgba(var(--edge),.20);
  box-shadow:none;
}

/* 卡片標題下面那條分隔線在玻璃上會太硬，收淡半階 */
.card>h3,
.card.fold[open]>summary{ border-bottom-color:rgba(var(--edge),.22) }

/* 彈出視窗的黑幕也跟著模糊——底下的畫面要「隔著毛玻璃看得到」，
   不是被一塊灰蓋住。
   ⚠️ 選擇器要帶 `.app ~`。家長端（Show.html）的 .mask 是**放大看照片**用的，
      底要維持接近全黑、也不要模糊（照片自己才是主角）；老師端才有 .app。 */
.mask{
  background:rgba(30,42,56,.42);   /* 2026-10-05 跟著藍底收冷一點（原本 40,44,34） */
  -webkit-backdrop-filter:blur(10px) saturate(1.2);
          backdrop-filter:blur(10px) saturate(1.2);
}

/* ══ 2. 橫幅 ═════════════════════════════════════════════════
   ⚠️ 橫幅維持不透明。它本身就是一張畫上水彩的紙（左上葉綠、左下麥黃、
      右邊接到插圖），透明化會把那兩塊暈洗掉、也會跟插圖的水彩紙打架。
      只給它玻璃的**邊**和**浮起來的影子**。 */
.hero{
  border-color:rgba(255,255,255,.58);
  box-shadow:var(--gl-ring), inset 0 1px 0 rgba(255,255,255,.92), var(--gl-drop);
}

/* ══ 3. 頂欄：整條**不做玻璃**（2026-09-21 他決定的，手機、平板、桌機一致）
   ═══════════════════════════════════════════════════════════
   這裡本來是整個改版最像 iOS 的一處：整條霧面玻璃，捲動時內容從它底下
   透著模糊走過去。但兩種裝置上都被否掉，理由是同一個——
   頂欄不是「浮在紙上的東西」，它是紙的一部分：
     · 手機上它吃 var(--folder) ＋ fixed，跟側標、跟整頁是同一面牛皮紙，
       一半透明就變回「貼上去的一條」（2026-09-20 修掉過的那個問題）。
     · 桌機上它是紙的抬頭，那條顏料盤壓在自己的邊線上；
       糊掉之後上緣就浮起來，跟下面那張紙分成兩塊。
   ⚠️ 以後要再試玻璃頂欄，記得這一條被否過兩次。

   ⚠️ 側標那一條（.nav 的底）同理，也不要透明化：它跟 body 吃同一支
      --folder ＋ background-attachment:fixed。只要有一處自己變半透明，
      那條水彩就對不起來了。

   ── 頂欄接下去那一條（2026-09-21，他要「和下面的底色一致過渡過去」）──
   桌機和平板本來是：米白的頂欄 → 一條 1px 的線 → 牛皮紙的側標 → 有色的紙，
   三條橫帶疊在一起，最上面那條看起來就是「貼上去的」。
   手機在 2026-09-20 已經修過同一件事，做法是把頂欄換成同一面資料夾；
   這裡把那個做法擴到所有寬度——不是畫一段漸層去「接」兩個顏色，
   而是**根本就是同一張紙**：
     · 跟 body、跟 .nav 吃同一支 var(--folder)
     · 三處都要 background-attachment:fixed，水彩暈才會對得起來、
       看不出接縫（少一處，那一條就會浮出來變成另一塊）
     · 下緣那條 1px 的線和那條顏料盤一起收掉——同一面紙上不要再劃線
   ⚠️ 顏料盤（.top::after）不是不見了，頁尾那條水彩橫條還在，
      「同一件事的兩端」只剩下面那一端。要救回來的話別畫在 .top 上，
      那又會把這一條切成兩塊。 */
.top{
  background:var(--folder); background-attachment:fixed;
  border-bottom:0;
}

.top::after{ display:none }

/* ⚠️ 標題後面那截英文要跟著調深。它本來是 --muted #636e67，坐在米白頂欄上
   對比 7.4；換成牛皮紙的底之後掉到 **3.48**，過不了全站那條 4.8。
   改成 --ink2 #44574f＝5.05，剛好在線上。
   （手機沒踩到這一條是因為 .brand 在手機上整組 display:none。）
   ⚠️ 以後在這一條上再放任何文字，都要拿 var(--frame)（現在是藍牛皮紙 #c7d2dd）去量，
      不是拿白色量。換成藍色時亮度沒變，這一組還是 5.03。 */
.brand .t1 .enpart{ color:var(--ink2) }

/* ── 網站名稱：拿掉前面那顆色票，字放大去填那一段空白 ─────────
   （2026-09-21 他圈的。這一段跟玻璃無關，不想要玻璃也可以只採用這一段。）

   量出來的數字（1920 寬、標題連英文 584px）：
     · 那顆色票連間距佔 58px
     · 標題和搜尋框之間的空白：1920 → 371、1600 → 51、1549 → 0
       （1549 以下就沒有空白了，再放大會直接去擠搜尋框）
   所以「可以放大的量」＝ 視窗寬 − 1491，而且只從 1492 開始才有。
   字級照這個線性長：calc(4.25vw − 36.4px)，下限 27px（＝原本的大小）、
   上限 45px。只吃九成的空白，留一成當安全邊界——

   ⚠️ 這裡**寧可小一點也不能算太滿**。.t1 是 overflow:hidden ＋
      text-overflow:ellipsis，算太滿的話字不會擠出去，是**被靜靜咬掉一截**，
      而且在你的螢幕上看不出來（2026-09-18 踩過一次，量到 265→202）。
      換字型、換標題字數，這三個數字都要重新量過。
   ⚠️ 英文那截改成 .52em（本來是寫死的 14px），跟著中文一起長，
      比例才不會在寬螢幕上失衡。 */
.brand .logo{ display:none }

.brand{ gap:0 }

.brand .t1{ font-size:clamp(27px, calc(4.25vw - 36.4px), 45px) }

.brand .t1 .enpart{ font-size:.52em; margin-left:.4em }

/* ⚠️ 上面那條 clamp 的權重（0,3,0）比原本那條 @media (max-width:1000px) 的
   `.brand .t1{font-size:23px}

`（0,2,0）高，會把它蓋掉——窄畫面標題就縮不回去、
   學年度那顆會被頂到。原樣補一條回來。 */
@media (max-width:1000px){ .brand .t1{ font-size:23px } }

/* 頂欄上那兩顆（搜尋框、週次）：底維持原本的實色 #fffdf6——它們坐在頂欄上，
   而頂欄不是玻璃，跟著透明只會把底下那條的顏色吃進來變濁。
   邊緣那一圈玻璃的唇留著，所以還是看得出是新的。
   ⚠️ 學年度那一顆（.year-badge）本來就有自己的漸層底，這一輪沒有動它。 */
.chip,
.search{
  background:linear-gradient(#fffdf6,#fffdf6) padding-box, var(--gl-rim) border-box;
  border:1px solid transparent;
  box-shadow:var(--gl-lift), 0 1px 3px rgba(var(--shade),.07);
}

.search:focus-within{
  box-shadow:var(--gl-lift), 0 0 0 3px rgba(40,90,74,.16);
}

.year-badge{
  border-color:rgba(255,255,255,.55);
  box-shadow:var(--gl-ring), inset 0 1px 0 rgba(255,255,255,.85),
             0 1px 3px rgba(var(--shade),.08);
}

/* ══ 4. 頁籤（他圈的那一條）═══════════════════════════════════
   現在的做法是在選到的那一張上面壓一條 3px 的圓角小棒，左右各內縮 10px：
   它是「貼在頁籤上的另一個東西」，所以兩端切得很直，也沒有跟著
   14px/12px 的圓角轉過去——他說的「沒有過渡到圓角」就是這個。

   改成：那個顏色**是頁籤自己的上緣**。
     · ::before 改成跟頁籤同寬、貼齊 border box，border-radius:inherit，
       所以顏色會照著 14px/12px 的圓角一起轉過去，兩端不再有切口。
     · 高度從 3px 拉到 22px，而且由上往下淡出。22 > 14（圓角半徑），
       整個圓弧都在顏色帶裡面，轉角才不會被切掉一塊。
     · 邊框也染上同一個頁面色（1px 的框本來就會照著圓角走），
       上緣那一道和左右兩邊因此是連著的。 */
.nav a.on::before{
  left:-1px; right:-1px; top:-1px; height:22px;
  border-radius:inherit;
  /* ⚠️ 這一條是**保底版**，給不支援 color-mix 的舊瀏覽器（Safari 16.2 以前）。
     不能只寫下面那條漂亮的：color-mix 不認得的話整條 background 會作廢，
     退回 Index.html 原本的 `background:var(--pg-ink)`，再被我這裡的 opacity:1
     一乘，就變成頂上一整塊 22px 的實色——比改版前還糟，而且不會報錯。
     所以濃度改用 opacity 控，顏色只用 var()。 */
  background:linear-gradient(180deg, var(--pg-ink) 0 2px, rgba(255,255,255,0) 100%);
  opacity:.42;
}

/* 認得 color-mix 的（Chrome 111＋／Safari 16.2＋）走這條：
   最上面 2px 濃一點、底下那一段收掉，層次比單純淡出好看。
   ⚠️ 2026-09-21 整組調淡（他說「稍重」）：52% / 22% / 8%。
      比例不要再往上加——這一條要讀起來像「紙被染了一道」，
      不是「上面壓了一條影子」。 */
@supports (color: color-mix(in srgb, red, blue)){
  .nav a.on::before{
    background:linear-gradient(180deg,
        color-mix(in srgb, var(--pg-ink) 52%, transparent) 0 2px,
        color-mix(in srgb, var(--pg-ink) 22%, transparent) 2px,
        color-mix(in srgb, var(--pg-ink) 8%, transparent) 42%,
        transparent 100%);
    opacity:1;
  }
}

.nav a.on{
  border-color:color-mix(in srgb, var(--pg-ink) 22%, var(--pg-line));
  box-shadow:0 -3px 10px rgba(var(--shade),.07);
}

/* 沒選到的那幾張＝霧面玻璃的小標籤。
   ⚠️ 選到的那一張**不**透明化：它要跟下面那張紙同色才連得起來。 */
.nav a{
  background:
    linear-gradient(var(--kraft-ga), var(--kraft-gb)) padding-box,
    linear-gradient(160deg, rgba(255,255,255,.75), rgba(255,255,255,.18) 48%,
                    rgba(255,255,255,.42)) border-box;
  border:1px solid transparent; border-bottom:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55);
  -webkit-backdrop-filter:blur(8px) saturate(1.3);
          backdrop-filter:blur(8px) saturate(1.3);
}

@media (hover:hover){
  .nav a:hover{
    background:
      linear-gradient(var(--kraft-ha), var(--kraft-hb)) padding-box,
      linear-gradient(160deg, rgba(255,255,255,.9), rgba(255,255,255,.3) 48%,
                      rgba(255,255,255,.55)) border-box;
    color:var(--ink2);
  }
}

/* 選到的那一張回到實色的頁面紙色（蓋掉上面那條） */
.nav a.on{
  background:var(--pg-sheet);
  -webkit-backdrop-filter:none; backdrop-filter:none;
}

/* 手機那一疊（.nav.side.mini）的影子要跟著加上內緣的光，
   不然疊起來只看得到影子、看不到厚度。 */
.nav.side.mini a{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 3px 0 7px rgba(var(--shade),.13);
}

.nav.side.mini a.on{
  box-shadow:-4px 0 10px rgba(var(--shade),.16), 4px 0 10px rgba(var(--shade),.16),
             0 -3px 8px rgba(var(--shade),.07);
}

/* ══ 5. 按鈕 ═════════════════════════════════════════════════
   實心那幾顆＝有顏色的玻璃：底色留九成（白字的對比不能掉），
   上面壓一層由上而下的光，加上上緣一道白邊、下緣一道暗邊＝一顆有弧度的鍵。
   ⚠️ 只改 background-color / background-image，不要用 background 簡寫——
      簡寫會把 .btn.green / .btn.pink / .btn.purple 的顏色一起洗掉。 */
.btn{
  background-color:rgba(40,90,74,.90);
  /* ⚠️ 2026-10-05：上半部的光在 48% 那裡「折」一下（.12 → .03），按鍵才有一個圓弧的轉角；
     下緣暗邊加粗到 2px。字在正中間，那裡的白只有 .03～.12，白字對比不會掉。 */
  /* ⚠️ 第二輪：中間那個「折」拿掉，回到一段平順的光——按鈕上有字，
     亮暗在字的正後方切一刀，字會看起來被劃了一條線。 */
  background-image:linear-gradient(180deg,
      rgba(255,255,255,.20) 0%, rgba(255,255,255,.05) 55%, rgba(0,0,0,.06) 100%);
  border:1px solid rgba(255,255,255,.24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.40),
             inset 0 -1px 0 rgba(0,0,0,.14),
             0 1px 2px rgba(var(--shade),.10),
             0 7px 16px rgba(40,90,74,.20);
  -webkit-backdrop-filter:blur(8px) saturate(1.4);
          backdrop-filter:blur(8px) saturate(1.4);
}

.btn.green { background-color:rgba(44,107,72,.90) }

.btn.pink  { background-color:rgba(177,48,72,.90) }

.btn.purple{ background-color:rgba(178,67,44,.90) }

/* 透明那一顆＝真的清玻璃 */
.btn.ghost{
  background-color:transparent;
  background-image:none;
  background:
    var(--gl-sheen),
    linear-gradient(var(--gl-tint-2), var(--gl-tint-2)) padding-box,
    var(--gl-rim) border-box;
  border:1px solid transparent;
  color:var(--ink);
  box-shadow:var(--gl-lift), 0 1px 3px rgba(var(--shade),.08), 0 6px 14px rgba(var(--shade),.07);
}

@media (hover:hover){
  .btn.ghost:hover{
    background:
      linear-gradient(rgba(255,255,255,.78), rgba(255,255,255,.78)) padding-box,
      var(--gl-rim) border-box;
    filter:none;
  }
}

/* 按下去的那一下要看得出來：玻璃被壓扁一點（光收掉、影子縮短） */
.btn:active{
  box-shadow:inset 0 2px 5px rgba(0,0,0,.18), 0 1px 2px rgba(var(--shade),.10);
  transform:translateY(1px);
}

.btn:disabled{ box-shadow:none; transform:none }

/* 上下學期那一組（分段控制） */
.pill-term{
  border-color:transparent;
  background:
    linear-gradient(var(--gl-tint-2), var(--gl-tint-2)) padding-box,
    var(--gl-rim) border-box;
  box-shadow:var(--gl-lift), 0 1px 3px rgba(var(--shade),.07);
  -webkit-backdrop-filter:blur(10px) saturate(1.5);
          backdrop-filter:blur(10px) saturate(1.5);
}

.pill-term button{ background:transparent }

.pill-term button.on{
  background:rgba(40,90,74,.90);
  background-image:linear-gradient(180deg, rgba(255,255,255,.26), rgba(0,0,0,.06));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
}

/* 四顆狀態選擇卡。
   ⚠️ 邊框維持「真的」邊框、不要換成漸層框——.pick.on 是靠
      border-color:currentColor 表示選到的，換成漸層框那一格就沒有選取樣子了。 */
.pick{
  background:rgba(255,254,251,.56);
  border-color:rgba(214,201,172,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 2px 8px rgba(var(--shade),.06);
  -webkit-backdrop-filter:blur(10px) saturate(1.4);
          backdrop-filter:blur(10px) saturate(1.4);
}

@media (hover:hover){
  .pick:hover{ border-color:rgba(var(--edge-l),.8); background:rgba(255,255,255,.72) }
}

.pick.on{ background:rgba(255,255,255,.80) }

/* ══ 6. 輸入欄位 ═════════════════════════════════════════════
   欄位是「凹」的，跟卡片相反：上緣一道暗、下緣一道亮。
   跟按鈕的凸剛好成一對，一眼分得出哪個可以按、哪個可以打字。 */
input[type=text],
input[type=date],
input[type=number],
select,
textarea,
.pw-in,
.lock input{
  background:rgba(255,255,255,.52);
  border-color:rgba(var(--edge-l),.45);
  box-shadow:inset 0 1px 2px rgba(var(--shade),.10), inset 0 -1px 0 rgba(255,255,255,.7);
  -webkit-backdrop-filter:blur(6px) saturate(1.2);
          backdrop-filter:blur(6px) saturate(1.2);
}

/* ⚠️ 搜尋框**裡面**那顆 input 不吃上面那條。它坐在膠囊裡面，本來就是
   border:0 ＋ 透明底——框已經畫在外面那顆膠囊上了（2026-09-18 修過
   「搜尋框裡面又畫了一個框」）。背景和邊框靠 `.search input[type=text]`
   自己的權重擋得住，但**陰影擋不住**（它沒宣告 box-shadow），
   不補這一條的話膠囊裡面上緣會多一道凹進去的暗影。 */
.search input[type=text]{ box-shadow:none }

input:focus,
select:focus,
textarea:focus{
  background:rgba(255,255,255,.82);
  border-color:var(--grn);
  box-shadow:inset 0 1px 2px rgba(var(--shade),.06), 0 0 0 3px rgba(40,90,74,.16);
}

/* ══ 7. 黏在上下緣的那兩條 ═══════════════════════════════════ */
.save-bar{
  background:rgba(255,254,251,.70);
  border-top-color:rgba(var(--edge),.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 -8px 24px rgba(var(--shade),.09);
  -webkit-backdrop-filter:blur(20px) saturate(1.15);
          backdrop-filter:blur(20px) saturate(1.15);
}

.toast{
  background:rgba(43,58,51,.80);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 10px 32px rgba(0,0,0,.30);
  -webkit-backdrop-filter:blur(16px) saturate(1.6);
          backdrop-filter:blur(16px) saturate(1.6);
}

.toast.err{ background:rgba(152,36,60,.84) }

/* ══ 9. 手機 ═════════════════════════════════════════════════
   ⚠️ 手機上**不做背景模糊**。
   backdrop-filter 每捲一格就要把元素底下那塊重算一次；一頁二十幾張卡
   同時在算，舊一點的 iPhone 捲起來就會頓。手機版的原則是「快，不是好看」
   ——在教室裡用的那三十秒不能卡。

   所以手機留下的是「不用重算」的那幾件：半透明的底（會透出這一頁的紙色）、
   邊緣那一圈光、以及收短的影子。玻璃的樣子還在，只是少了那層霧。
   例外是頂欄和底下的儲存列：整頁各只有一條，而且捲動時內容真的從它底下
   走過去——模糊在那兩條上面是「看得到的價值」，代價也只有兩個元素。 */
@media (max-width:600px), (max-height:520px) and (max-width:1024px){
  :root{
    --gl-bf:none;
    /* 沒有模糊了，底要調實一點，不然只是「比較淡的卡片」 */
    --gl-tint:rgba(255,254,251,.86);      /* 沒有模糊，比桌機（.80）再實一點 */
    --gl-tint-2:rgba(255,254,251,.76);
    --gl-drop:0 1px 1px rgba(var(--shade),.08), 0 6px 14px rgba(var(--shade),.09);
  }
  .card,
  .modal,
  .lock,
  .chip,
  .search,
  .pick,
  .nav a,

   斜反光、側光、霧光都是壓在字底下的東西——這一輪**不碰字底下**，分兩段，可以只要一段：
     (a) 邊與浮起：只動卡片的「邊緣一圈」和外面的影子，字底下一個像素都沒變。
     (b) 紙上的色暈：讓玻璃底下有東西可以透——大片、很淡、跟著視窗不動的兩團水彩，

   不要哪一段，整段刪掉就回到 2026-10-13a 的樣子。
   ⚠️ 手機、平板（用手指的）只吃 (a) 裡不用重算的那幾條；(b) 只給桌機。
   ⚠️ 不動：頂欄、側標、橫幅、十三個班級色、狀態色、大卡裡面的平小卡、成果頁。 */

      rgba(255,255,255,.85) 14%,
      rgba(255,255,255,.22) 36%,
