/* 一張課表。cells(day, period) 要回傳格子內容的 HTML（空字串＝沒課） */
/* 手機不畫五天的格子表——橫向捲動在手機上很難操作。
   改成「先選一天，再垂直列出那天的課」。 */
/* ⚠️ 這個條件一定要跟 CSS 手機斷點那一行一模一樣
   （`@media (max-width:600px), (max-height:520px) and (max-width:1024px)`）。
   橫著拿手機時寬度是 844，只看寬度就會判成桌機，然後整頁用桌機版面畫在手機上。 */
/* ⚠️ 2026-10-06 從 820 改成 600：直拿的 iPad（744～834）以前被當成手機，只剩三頁。
   他要平板直的也是完整版面；手機直拿最寬約 440，600 以下一定是手機。 */
var PHONE_MQ = '(max-width:600px), (max-height:520px) and (max-width:1024px)';
function isPhone() {
  return !!(window.matchMedia && window.matchMedia(PHONE_MQ).matches);
}

function timetable(cells, readonly) {
  if (isPhone()) return timetableDay(cells, readonly);
  return timetableGrid(cells, readonly);
}

function timetableDay(cells, readonly) {
  var d = Number(UI.sched.day) || todayDay() || 1;
  var h = '<div class="tt-days">' + [1, 2, 3, 4, 5].map(function (x) {
    return '<button data-ttd="' + x + '" class="' + (x === d ? 'on' : '') + '">' +
      '週' + DAYS[x].charAt(0) +
      '<small>' + esc(S.wk.days[x - 1].slice(5).replace('-', '/')) + '</small></button>';
  }).join('') + '</div>';

  var dHol = holidayOn(S.wk.days[d - 1]);
  if (dHol) h += '<div class="qk-pend ok" style="margin-bottom:10px">🏖️ 這一天放假：<b>' +
    esc(holName(dHol)) + '</b></div>';

  h += '<div class="tt-list">';
  var pers = allPeriods();
  for (var i = 0; i < pers.length; i++) {
    var p = pers[i];
    var lab = String(p.label || '').trim();
    if (lab) {
      h += '<div class="tt-r brk"><span class="tm">' + esc(p.start) + ' – ' + esc(p.end) + '</span>' +
           '<span class="nm">' + esc(lab) + '</span></div>';
      continue;
    }
    h += '<div class="tt-r"><span class="tm"><b>第 ' + esc(p.no) + ' 節</b>' +
         esc(p.start) + ' – ' + esc(p.end) + '</span>' +
         '<span class="cell">' + cells(d, Number(p.no)) + '</span></div>';
  }
  return h + '</div>';
}

function timetableGrid(cells, readonly) {
  var h = '<div class="scroll-x"><table class="tt' + (readonly ? ' ro' : '') + '"><thead><tr>' +
          '<th>Time / 時間</th>';
  var hols = [];
  for (var d = 1; d <= 5; d++) {
    var hd = holidayOn(S.wk.days[d - 1]);
    hols.push(hd);
    h += '<th' + (hd ? ' class="hol"' : '') + '>' +
         esc(S.wk.days[d - 1].slice(5).replace('-', '/')) + '（' + DAYS[d].charAt(0) + '）<br>' +
         (hd ? '<span class="hol-t">🏖️ ' + esc(holName(hd)) + '</span>'
             : '<span style="font-weight:500;color:#5e645f">' + DAYS[d].slice(2) + '</span>') +
         '</th>';
  }
  h += '</tr></thead><tbody>';
  var pers = allPeriods();
  for (var i = 0; i < pers.length; i++) {
    var p = pers[i];
    var lab = String(p.label || "").trim();
    h += "<tr><td class=\"tm\"><b>" + esc(p.start) + " – " + esc(p.end) + "</b>" +
         (lab ? esc(lab) : "第 " + esc(p.no) + " 節") + "</td>";
    if (lab) {                       /* 休息時段：橫跨整列，不排課 */
      h += "<td class=\"brk\" colspan=\"5\">" + esc(lab) + "</td></tr>";
      continue;
    }
    for (var d2 = 1; d2 <= 5; d2++) {
      h += '<td' + (hols[d2 - 1] ? ' class="hol"' : '') + '>' + cells(d2, Number(p.no)) + '</td>';
    }
    h += "</tr>";
  }
  return h + '</tbody></table></div>';
}

/* 「8:30」「8：30」「0830」都收，統一成「08:30」。後端也會再整理一次 */
function normTime(v) {
  v = String(v == null ? '' : v).trim().replace(/[：．.]/g, ':');
  if (!v) return '';
  var m = v.match(/^(\d{1,2})\s*:\s*(\d{1,2})$/) || v.match(/^(\d{1,2})(\d{2})$/);
  if (!m) return v;
  var h = Math.min(23, parseInt(m[1], 10)), mi = Math.min(59, parseInt(m[2], 10));
  if (isNaN(h) || isNaN(mi)) return v;
  return (h < 10 ? '0' : '') + h + ':' + (mi < 10 ? '0' : '') + mi;
}

function schedAt(day, period) {
  for (var i = 0; i < S.schedule.length; i++) {
    var r = S.schedule[i];
    if (Number(r.day) === Number(day) && Number(r.period) === Number(period)) return r;
  }
  return null;
}

/* ── 臨時異動：停課與調課 ───────────────────────────────────
   固定課表（`S.schedule`）是整個學期的，全校活動、調課**都不動它**——
   動了的話往後每一週都跟著錯（2026-09-19 他特別交代）。
   臨時的事情只認日期，分兩種：

   · **停課** `S.holidays` —— `periods` 空的＝整天（國定假日、颱風假）；
     填 `1|2` ＝只有那幾節（期中考、兒童節活動、大掃除）。其餘節次照常上課。
   · **調課** `S.moves` —— 某一天某一節的課，這一次挪到別天別節（可以跨週）。

   ⚠️ 要問「某一天的第幾節是哪一班」一律用 `slotOn(date, period)`。
   `schedAt(day, period)` 只回答固定課表本身，只有排課、編課表那兩處該用。 */
function perList(v) {
  if (v == null || v === '') return [];
  var arr = (v instanceof Array) ? v : String(v).split(/[|,、\s]+/);
  var out = [];
  for (var i = 0; i < arr.length; i++) {
    var n = Number(String(arr[i]).trim());
    if (n && !isNaN(n) && out.indexOf(n) < 0) out.push(n);
  }
  return out.sort(function (a, b) { return a - b; });
}
function perLabel(v) {
  var ps = perList(v);
  if (!ps.length) return '整天';
  return '第 ' + ps.join('、') + ' 節';
}

/* 那一天登記的停課。整天的排前面，判斷時先遇到 */
function blocksOn(date) {
  var d = ymd10(date);
  return (S.holidays || []).filter(function (h) { return ymd10(h.date) === d; })
    .sort(function (a, b) { return perList(a.periods).length - perList(b.periods).length; });
}
/* 這一節不上課嗎？回傳那一筆停課（整天的也算） */
function blockOn(date, period) {
  var bs = blocksOn(date);
  for (var i = 0; i < bs.length; i++) {
    var ps = perList(bs[i].periods);
    if (!ps.length || ps.indexOf(Number(period)) >= 0) return bs[i];
  }
  return null;
}
/* 整天不上課（假日、颱風假）。只佔幾節的活動不算——那天其他節還是要上課 */
function holidayOn(date) {
  var bs = blocksOn(date);
  for (var i = 0; i < bs.length; i++) if (!perList(bs[i].periods).length) return bs[i];
  return null;
}
function holName(h) { return (h && h.name) ? h.name : '放假'; }

/* 這一節的課被調走了 ／ 有別節的課被調到這一節 */
function movedOut(date, period) {
  return (S.moves || []).filter(function (m) {
    return ymd10(m.date) === ymd10(date) && Number(m.period) === Number(period);
  })[0] || null;
}
function movedIn(date, period) {
  return (S.moves || []).filter(function (m) {
    return ymd10(m.toDate) === ymd10(date) && Number(m.toPeriod) === Number(period);
  })[0] || null;
}

/* ⭐ 某一天的第幾節，實際上是哪一班。
   kind：`normal` 照課表｜`block` 停課｜`out` 調走了｜`in` 別節調過來｜`free` 空堂
   base ＝固定課表上本來是哪一班——停課那一格要寫「本來是 204」就靠它，
   他要的是「看得出哪個班的哪一節少掉了、為什麼」（2026-09-19）。 */
function slotOn(date, period) {
  var d = dayOfDate(date);
  var r = d ? schedAt(d, Number(period)) : null;
  var o = { no: Number(period), cls: r ? r.cls : '', base: r ? r.cls : '',
            room: r ? r.room : '', kind: r ? 'normal' : 'free',
            block: null, out: null, into: null };
  var b = blockOn(date, period);
  if (b) { o.cls = ''; o.kind = 'block'; o.block = b; return o; }
  var mo = r ? movedOut(date, period) : null;
  var mi = movedIn(date, period);
  /* 兩班對調時同一格既有人調走、又有人調進來：以調進來的為準 */
  if (mi) { o.cls = mi.cls; o.kind = 'in'; o.into = mi; o.out = mo; return o; }
  if (mo) { o.cls = ''; o.kind = 'out'; o.out = mo; return o; }
  return o;
}

/* 某一天實際要上的課（停課與調課都套過了），照節次排 */
function routeOn(date) {
  if (!dayOfDate(date)) return [];
  return teachPeriods().map(function (p) {
    var o = slotOn(date, Number(p.no));
    o.start = p.start; o.end = p.end;
    return o;
  }).filter(function (o) { return o.cls; });
}
/* 這一天少掉的課：本來有課、但被活動佔走或調到別節去了。
   首頁與動線卡要把原因寫出來——不然只會看到「今天少一節」卻不知道為什麼。 */
function lostOn(date) {
  if (!dayOfDate(date)) return [];
  return teachPeriods().map(function (p) { return slotOn(date, Number(p.no)); })
    .filter(function (o) { return o.base && (o.kind === 'block' || o.kind === 'out'); });
}
/* 這一節的異動，講成一句話 */
function slotWhy(o) {
  if (o.kind === 'block') return holName(o.block) +
    (o.base ? '（本來是 ' + o.base + '）' : '');
  if (o.kind === 'out') return '調到 ' + dateLabel(o.out.toDate) + ' 第 ' + o.out.toPeriod + ' 節';
  if (o.kind === 'in')  return '從 ' + dateLabel(o.into.date) + ' 第 ' + o.into.period + ' 節調來';
  return '';
}
function dateLabel(d) {
  var x = String(d || '');
  if (x.length < 10) return x;
  var w = ['日','一','二','三','四','五','六'][dayIdx(x)];
  return x.slice(5).replace('-', '/') + '（' + w + '）';
}
function uniq(arr) {
  var out = [];
  for (var i = 0; i < arr.length; i++) if (out.indexOf(arr[i]) < 0) out.push(arr[i]);
  return out;
}
function dayIdx(ymd) {
  var p = String(ymd || '').split('-');
  if (p.length < 3) return 0;
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getDay();
}

/* 某班「現在在上的單元」＝最後一次有紀錄、而且還沒完成的那個 */
/* 這一天、這一班、這個單元的札記。快速記錄那格與教學札記頁是同一份資料 */
function noteOf(date, cls, unitId) {
  var hit = S.notes.filter(function (n) {
    /* ⚠️ 日期過 ymd10() 再比，跟這一頁其他地方一致（2026-09-20 健檢補上）。
       札記那一格如果比不中，快速記錄會顯示成空白、存下去就把原本寫的蓋掉。 */
    return ymd10(n.date)    === ymd10(date) &&
           String(n.cls)    === String(cls) &&
           String(n.unitId) === String(unitId);
  })[0];
  return hit ? hit.text : '';
}

/* 這一班這個單元以前寫過的紀錄，新的在前面 */
function notesOf(cls, unitId, exceptDate) {
  return S.notes.filter(function (n) {
    return String(n.cls) === String(cls) && String(n.unitId) === String(unitId) &&
           String(n.date) !== String(exceptDate);
  }).sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
}

function currentUnit(cls) {
  var rows = S.progress.filter(function (p) { return String(p.cls) === String(cls); });
  rows.sort(function (a, b) { return String(b.updatedAt).localeCompare(String(a.updatedAt)); });
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].status !== 'done') return unitOf(rows[i].unitId);
  }
  return rows.length ? unitOf(rows[0].unitId) : null;
}

/* ── 節次紀錄 ─────────────────────────────────────────────────
   一節課一筆：哪一天、哪一節、哪一班、上的是哪個單元（「節次紀錄」分頁）。
   他一個班一次上兩節，兩節常常不是同一個單元（第一節把上次的收尾、
   第二節開新的），所以「這一班現在上到哪」不足以決定課表上每一格要寫什麼——
   以前後存的那一節會把整天蓋掉（2026-09-15 他回報）。
   ⚠️ 舊資料沒有節次紀錄，所有函式都要能退回原本那套「班級＋日期」的判斷。 */
function ymd10(x) { return String(x || '').slice(0, 10); }

function lessonAt(date, period, cls) {
  var ls = S.lessons || [];
  for (var i = 0; i < ls.length; i++) {
    var l = ls[i];
    if (ymd10(l.date) === ymd10(date) && Number(l.period) === Number(period) &&
        String(l.cls) === String(cls)) return l;
  }
  return null;
}
function lessonsOn(date, cls) {
  return (S.lessons || []).filter(function (l) {
    return ymd10(l.date) === ymd10(date) && (!cls || String(l.cls) === String(cls));
  });
}
/* 這一格該顯示哪個單元：有節次紀錄就照它，沒有才退回「這一班現在上到哪」 */
function unitForSlot(date, period, cls) {
  var l = lessonAt(date, period, cls);
  var u = l ? unitOf(l.unitId) : null;
  return u || currentUnit(cls);
}
/* 這一節記了沒。
   ⚠️ 有節次紀錄還不夠——進度被清掉時那一節也該算「還沒記」，
   不然卡片上會出現「還沒記」配「看紀錄」這種前後不一的組合。 */
function periodDone(date, period, cls) {
  var l = lessonAt(date, period, cls);
  if (l) return !!progOf(cls, l.unitId);
  if (lessonsOn(date, cls).length) return false;    /* 有別節的紀錄＝這一節真的還沒記 */
  return S.progress.some(function (p) {
    return String(p.cls) === String(cls) && ymd10(p.date) === ymd10(date);
  });
}
/* 這個單元一共上了幾節、平均一班幾節——下一輪排課要用的就是這個數字 */
function unitPeriods(unitId) {
  var ls = (S.lessons || []).filter(function (l) { return String(l.unitId) === String(unitId); });
  var byCls = {}, k, ks = [];
  for (var i = 0; i < ls.length; i++) byCls[ls[i].cls] = (byCls[ls[i].cls] || 0) + 1;
  for (k in byCls) ks.push(k);
  return { total: ls.length, classes: ks.length,
           avg: ks.length ? Math.round(ls.length / ks.length * 10) / 10 : 0 };
}
/* 某一天這一班實際有課的節次。
   ⚠️ 走 routeOn()，所以被活動佔掉的那一節不會跑出來，
   調到別天的那一節會出現在它真正上課的那一天。 */
function periodsOn(cls, date) {
  if (!cls) return [];
  return routeOn(date).filter(function (o) { return String(o.cls) === String(cls); })
    .map(function (o) { return o.no; });
}
/* 這一班今天預設要記哪一節：正在上的那節 → 第一節還沒記的 → 第一節 */
function periodFor(cls) {
  var ps = periodsOn(cls, S.today);
  if (!ps.length) return 0;
  var now = nowPeriodNo();
  if (ps.indexOf(now) >= 0) return now;
  for (var i = 0; i < ps.length; i++) {
    if (!periodDone(S.today, ps[i], cls)) return ps[i];
  }
  return ps[0];
}
</script>

<script>
/* ══════════════════════════════════════════════════════════════
   0. 快速記錄 Quick Record
      在班上拿手機用的那一頁：選班級 → 勾進度 → 點缺席號碼 →
      拍照 → 存。全部都是大按鈕，手指按得到。
   ══════════════════════════════════════════════════════════════ */
/* ── 今天上哪些班 ───────────────────────────────────────
   走進教室的時候，最想知道的是「現在這節是哪一班」。
   所以開啟時照時間自動選好，並且把整天的動線列出來。 */
function hhmmNow() {
  var d = new Date();
  return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' +
         (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
}

/* 今天實際要上的課（停課與調課都算過了），照時間排 */
function todayRoute() { return routeOn(S.today); }

/* 現在是第幾節（不在任何一節之內就回 0） */
/* 假日與停課的判斷都在上面那一區（blockOn／holidayOn／slotOn）。 */

/* 今天每一節走到哪一班、上哪個單元。
   課表管理（桌機右欄）和手機的教學總覽共用這一張——他說手機上也想看到，
   但不要為它多開一頁。 */
function routeCard(opts) {
  opts = opts || {};
  var h = '<div class="card' + (opts.action ? ' no-print' : '') + '"><h3>' +
    (opts.title || '<i class="ci ci-pin" aria-hidden="true">🗺️</i> 本日授課動線 <span class="en2">Today\'s Teaching Route</span>') +
    /* ⚠️ 只寫日期，不要再寫「第 N 週」——頂欄那顆卡一直寫著第幾週（2026-09-20 他圈的）。 */
    '<span class="right hint">' + esc(S.today.slice(5).replace('-', '/')) +
      '（' + ['日','一','二','三','四','五','六'][new Date().getDay()] + '）</span></h3>';
  var td = todayDay();
  if (!td) return h + '<div class="empty-note">今天是週末，沒有排課。</div></div>';
  var hd = holidayOn(S.today);
  if (hd) return h + '<div class="empty-note">🏖️ 今天放假：' + esc(holName(hd)) +
    '　好好休息。</div></div>';

  var nowNo = nowPeriodNo();
  h += '<div class="route">' + teachPeriods().map(function (p) {
    var o = slotOn(S.today, Number(p.no));
    /* 被全校活動佔掉的那一節：整列變灰，寫出活動名稱，
       後面補一句「本來是 204」——他要看得出哪個班的哪一節少掉了、為什麼。 */
    if (o.kind === 'block') {
      return '<div class="it off' + (Number(p.no) === nowNo ? ' now' : '') + '">' +
        '<div class="when"><span class="badge c-gray">停</span>' +
        '<span class="tm">' + esc(p.start) + ' – ' + esc(p.end) + '</span></div>' +
        '<div class="tx"><div class="a">' + esc(holName(o.block)) + '</div>' +
        '<div class="b">' + (o.base ? '這一節本來是 ' + esc(o.base) + '　不上課' : '全校活動') +
        '</div></div></div>';
    }
    /* 調到別天去了：這一節空下來，但要說清楚跑去哪 */
    if (o.kind === 'out') {
      return '<div class="it off' + (Number(p.no) === nowNo ? ' now' : '') + '">' +
        '<div class="when"><span class="badge c-gray">調</span>' +
        '<span class="tm">' + esc(p.start) + ' – ' + esc(p.end) + '</span></div>' +
        '<div class="tx"><div class="a">' + esc(o.out.cls) + ' 調課</div>' +
        '<div class="b">' + esc(slotWhy(o)) +
        (o.out.note ? '　' + esc(o.out.note) : '') + '</div></div></div>';
    }
    var r = o.cls ? { cls: o.cls } : null;
    /* ⚠️ 照「這一節」拿單元，不是照「這一班現在上到哪」。
       他一個班連上兩節、兩節可能不同單元（2026-09-15）。 */
    var u = r ? unitForSlot(S.today, Number(p.no), r.cls) : null;
    /* 手機首頁用同一張卡，但每一列多一顆「去記錄／看紀錄」——
       以前「今天要做的」和「本日授課動線」兩塊各列一次今天的節次，等於捲兩遍。 */
    var done = !!r && periodDone(S.today, Number(p.no), r.cls);
    return '<div class="it' + (r ? '' : ' free') + (Number(p.no) === nowNo ? ' now' : '') + '">' +
      '<div class="when"><span class="badge c-' + (r ? colorOf(r.cls) : 'gray') + '">' +
        esc(r ? r.cls : '–') + '</span>' +
        '<span class="tm">' + esc(p.start) + ' – ' + esc(p.end) + '</span></div>' +
      /* 手機（有「去記錄」那一版）右邊被按鈕吃掉寬度，
         單元名就只留中文、副標只留英文名，不要把整段說明也塞進來折三行。 */
      '<div class="tx"><div class="a">' +
        esc(r ? (u ? (opts.action ? (u.nameZh || u.nameEn) : u.nameEn) : '尚未開始單元')
              : '空堂 Free Period') +
        (o.kind === 'in' ? '<span class="swap-tag">調</span>' : '') + '</div>' +
      '<div class="b">' +
        (o.kind === 'in' ? esc(slotWhy(o)) + '　' : '') +
        esc(r ? (u ? (opts.action ? u.nameEn : u.nameZh + ' · ' + u.descZh)
                   : '到「進度檢核」選單元')
              : '可備課 · 整理教室') +
      '</div></div>' +
      (opts.action && r
        ? '<div class="act"><span class="s ' + (done ? 'ok' : 'no') + '">' +
          (done ? '✓ 已記錄' : '還沒記') + '</span>' +
          '<button class="btn ' + (done ? 'ghost ' : '') + 'sm" data-todo="' + esc(r.cls) +
          '" data-per="' + esc(p.no) + '">' +
          (done ? '看紀錄' : '去記錄') + '</button></div>'
        : '') +
      '</div>';
  }).join('') + '</div>';
  return h + (opts.extra || '') + '</div>';
}

function nowPeriodNo() {
  var now = hhmmNow(), pers = teachPeriods();
  for (var i = 0; i < pers.length; i++) {
    if (now >= pers[i].start && now <= pers[i].end) return Number(pers[i].no);
  }
  return 0;
}

/* 現在該記哪一班：正在上的那節，沒有就抓接下來最近的一節，
   都上完了就停在最後一節 */
function classNow() {
  var route = todayRoute();
  if (!route.length) return '';
  var now = hhmmNow();
  for (var i = 0; i < route.length; i++) {
    if (now <= route[i].end) return route[i].cls;
  }
  return route[route.length - 1].cls;
}

function quickInit() {
  var q = UI.quick;
  if (!q.cls) q.cls = classNow() || (sortedClasses()[0] || {}).code || '';
  if (!q.period) q.period = periodFor(q.cls);
  if (!q.unitId) {
    var u = unitForSlot(S.today, q.period, q.cls) || sortedUnits()[0];
    q.unitId = u ? u.id : '';
  }
  if (q.loaded !== q.cls + '|' + q.unitId) quickLoad();
}

/* 換班級或換節次之後，把單元切成「那一節上的那個」。
   那一節還沒記過就沿用這一班現在的單元。 */
function pickSlot(cls, period) {
  var q = UI.quick;
  q.pickUnit = false;                /* 換班級或換節次時，攤開的單元清單先收起來 */
  q.cls = cls;
  q.period = period || periodFor(cls);
  var u = unitForSlot(S.today, q.period, q.cls);
  if (u) q.unitId = u.id;
  quickLoad();
}

/* ── 打到一半的快速記錄，隨手存在這支手機上 ⭐ ─────────────────
 *  換頁不會弄丟（UI.quick 一直在記憶體裡），但**關掉分頁、重新整理、
 *  或手機把瀏覽器清掉**就沒了——下課後三十秒被叫走很常見（2026-09-15 他要的）。
 *  ⚠️ 只存這支手機，不會送到後端；存的是「還沒按儲存」的內容。
 *  ⚠️ 回填的規則很保守：**伺服器上這一班這個單元今天什麼都還沒有**才回填。
 *     已經存過的一律以伺服器為準，不能被舊草稿蓋掉。
 *  ⚠️ 只認今天的草稿。昨天沒存完的不要莫名其妙冒出來。 */
var DRAFT_K = 'tpDraftQuick';
var DRAFT_SAID = false;

function draftSave() {
  try {
    if (!S || PAGE !== 'quick') return;
    var q = UI.quick;
    var has = q.status || (q.note && q.note.trim()) || (q.seats && q.seats.length);
    if (!has) return localStorage.removeItem(DRAFT_K);
    localStorage.setItem(DRAFT_K, JSON.stringify({
      date: S.today, cls: q.cls, unitId: q.unitId,
      status: q.status || '', note: q.note || '', seats: q.seats || []
    }));
  } catch (e) { /* 無痕模式之類存不了，就只是沒有草稿 */ }
}

function draftRead() {
  try { return JSON.parse(localStorage.getItem(DRAFT_K) || 'null'); }
  catch (e) { return null; }
}

function draftClear() {
  DRAFT_SAID = false;
  try { localStorage.removeItem(DRAFT_K); } catch (e) {}
}

function quickLoad() {
  var q = UI.quick;
  q.loaded = q.cls + '|' + q.unitId;
  var p = progOf(q.cls, q.unitId);
  q.prgId  = p ? p.id : '';
  q.status = p ? p.status : '';      /* 沒紀錄就不預選，避免看起來已經選好 */
  q.note   = noteOf(S.today, q.cls, q.unitId) || (p ? p.note : '');
  var a = S.absences.filter(function (x) {
    return String(x.cls) === String(q.cls) && Number(x.week) === weekOfDate(S.today);
  })[0];
  q.seats = a ? seatList(a.seats).map(Number) : [];
  /* ⚠️ 日期一律先過 ymd10() 再比。試算表裡那一格如果不是日期格式、
     而是手打的字串（「2026-09-14 08:30」這種），後端只會把 Date 型別轉成 10 碼，
     字串是原樣傳回來的——直接用 === 比就會比不中，畫面上「今天記過了」
     就整個失效（2026-09-20 健檢抓到，整份只有三處漏掉）。 */
  q.savedToday = !!(p && ymd10(p.date) === S.today);

  /* 伺服器上這一格是空的，才把這支手機上沒存完的草稿接回來 */
  if (!q.status && !q.note && !q.seats.length) {
    var dr = draftRead();
    if (dr && dr.date === S.today &&
        String(dr.cls) === String(q.cls) && String(dr.unitId) === String(q.unitId)) {
      q.status = dr.status || '';
      q.note   = dr.note || '';
      q.seats  = dr.seats || [];
      if ((q.status || q.note || q.seats.length) && !DRAFT_SAID) {
        DRAFT_SAID = true;
        /* render 還在跑，等它畫完再說話 */
        setTimeout(function () { toast('幫你把上次沒存完的內容接回來了'); }, 60);
      }
    }
  }
}

/* 站在教室裡最該知道的一句話：現在點到的號碼裡，有誰已經常常不在。
   ⚠️ 只印一行。手機是拿來「快」的，不是拿來看統計的——詳細的在電腦版
   「出席狀況」那張『缺席不只一次的孩子』（2026-09-21）。 */
function repeatLine(cls, seats) {
  var hit = (seats || []).map(function (x) { return seatStat(cls, x); })
    .filter(function (o) { return o && o.before >= 1; })
    .sort(function (a, b) { return b.before - a.before || Number(a.seat) - Number(b.seat); });
  if (!hit.length) return '';
  return '<div class="qk-rep">⚠️ ' + hit.slice(0, 4).map(function (o) {
    var prev = o.weeks.filter(function (w) { return w.week < Number(S.wk.week); });
    var last = prev[prev.length - 1].week;
    return '<b>' + esc(o.seat) + ' 號</b>這學期第 ' + (o.before + 1) + ' 次' +
      (last === Number(S.wk.week) - 1 ? '（上週也沒來）' : '');
  }).join('、') + (hit.length > 4 ? ' 等' : '') + '</div>';
}

/* 這一班本週之前、還沒補進度的缺席紀錄，最近的排前面。
   ⚠️ 看的是「還沒補的」（seatsLeft），補完的號碼留在紀錄裡但不再出現在這裡。 */
/* 某一天是這學期第幾週（跟後端 weekInfo_ 同一條算法）。
   ⚠️ 記錄「某一天的課」時，缺席要對到那一天的那一週，不是畫面正在看的那一週
   （S.wk.week）——在課表按 › 看過下週再回來記，兩個就不一樣了（2026-10-06 健檢）。 */
/* ⚠️ 從「畫面這一週的星期一」往前後數，不從開學日算：兩個算出來本來一樣，
   但這樣就算設定裡的開學日有點怪，也不會跟頂欄寫的週次對不上。 */
function weekOfDate(d) {
  var mon = new Date(String(S.wk.monday || '').slice(0, 10) + 'T00:00:00+08:00');
  var t   = new Date(String(d || '').slice(0, 10) + 'T00:00:00+08:00');
  if (isNaN(mon) || isNaN(t)) return Number(S.wk.week);
  var w = Number(S.wk.week) + Math.floor(Math.round((t - mon) / 86400000) / 7);
  return Math.max(1, Math.min(Number(S.settings.weeks) || 20, w));
}

function pendingAbsent(cls) {
  return S.absences.filter(function (a) {
    return String(a.cls) === String(cls) &&
           Number(a.week) < Number(S.wk.week) &&
           seatsLeft(a).length;
  }).sort(function (a, b) { return Number(b.week) - Number(a.week); });
}

function weekLabel(w) {
  var d = Number(S.wk.week) - Number(w);
  if (d === 0) return '本週';
  if (d === 1) return '上週';
  if (d === 2) return '上上週';
  return '第 ' + w + ' 週';
}

function vQuick() {
  quickInit();
  var q = UI.quick, u = unitOf(q.unitId);
  var seatMax = Math.max(10, Math.min(60, Number(S.settings.seatMax) || 30));
  var phs = photosOf(q.prgId);
  var dayZh = ['日', '一', '二', '三', '四', '五', '六'][new Date().getDay()];

  var h = '<div class="qk">';

  /* ⚠️ 這裡本來有一張標題卡（班級牌 ＋「快速記錄」＋ 第幾週 ＋ 日期）。
     四樣裡有三樣是別的地方已經寫著的：「快速記錄」在側標上、「第 N 週」在頂欄、
     班級在底下那顆一直看得到的儲存鈕上（「儲存 106 班的紀錄」）。
     只有日期是它獨有的，所以日期併到「今天的課」那一行，整張卡拿掉，
     第一屏多出 63px（2026-09-20 他同意）。
     ⚠️「今天已記錄」那顆徽章也一起拿掉——同一件事在「今天的課」那張卡上是
     「已記」小標籤、在班級牌上是右上角那顆勾，已經講兩次了。 */

  /* 今天的課——走進教室第一眼要看到的 */
  var route = todayRoute(), nowNo = nowPeriodNo();
  var qHol = holidayOn(S.today);
  h += '<section><div class="lb">今天的課 <em>Today</em>' +
    '<span class="n">' + esc(S.today.slice(5).replace('-', '/')) + '（' + dayZh + '）・' +
    (qHol ? '放假' : (route.length ? route.length + ' 節' : '沒有排課')) +
    '</span></div>';
  if (qHol) {
    h += '<div class="qk-pend ok">🏖️ 今天放假：<b>' + esc(holName(qHol)) + '</b>。' +
      '要補記別天的紀錄，按下面的「換別班」挑一班。</div>';
  } else if (!route.length) {
    /* ⚠️ 班級清單預設是收起來的，所以這裡要寫「按換別班」，不是「在下面選班級」。 */
    h += '<div class="qk-pend ok">今天沒有排課。要補記別天的紀錄，' +
      '按下面的「換別班」挑一班。</div>';
  } else {
    h += '<div class="qk-route">' + route.map(function (r) {
      var done = periodDone(S.today, r.no, r.cls);
      return '<div class="qk-rt c-' + colorOf(r.cls) +
        (String(r.cls) === String(q.cls) && Number(r.no) === Number(q.period) ? ' on' : '') +
        (r.no === nowNo ? ' now' : '') +
        '" data-qr="' + esc(r.cls) + '" data-qrp="' + esc(r.no) + '">' +
        '<div class="p">第 ' + r.no + ' 節' + (r.no === nowNo ? '・現在' : '') +
          (r.kind === 'in' ? '・調' : '') + '</div>' +
        /* ⚠️ 班級和時間排同一行。本來是三行（節次／班級／時間），一張卡 83px 高，
           五節就佔掉大半個畫面（2026-09-20 他圈的）。併成兩行之後 57px，
           要看的東西一個都沒少。 */
        '<div class="b"><span class="c">' + esc(r.cls) + '</span>' +
        /* ⚠️ 記過了就把上課時間換成「已記」小標籤。
           不要塞勾、也不要「✓ 已記」——360 的手機一格只有 98px，
           多一顆勾就會斷成兩行、整排卡高低不齊（2026-09-20 量到的）。 */
        (done ? '<span class="tag"><b>已記</b></span>'
              : '<span class="t">' + esc(r.start) + '</span>') +
        '</div></div>';
    }).join('') + '</div>';
  }
  /* 今天少掉的那幾節，直接寫原因。
     在教室裡最怕的是「怎麼少一節」，而不是去別頁查為什麼（2026-09-19）。 */
  var qLost = lostOn(S.today);
  if (qLost.length) {
    h += '<div class="qk-lost">' + qLost.map(function (o) {
      return '<span><b>第 ' + o.no + ' 節</b> ' + esc(o.base) + '　' +
        esc(o.kind === 'block' ? holName(o.block) : slotWhy(o)) + '</span>';
    }).join('') + '</div>';
  }
  h += '</section>';

  /* 班級。⚠️ 平常用不到——今天要上的班在上面「今天的課」就點得到，
     這一整排九個大方塊佔掉半個畫面（2026-09-15 他問可不可以拿掉）。
     所以預設收起來，要補記別天／別班才展開；今天沒有課、
     或現在選的班不在今天的課裡，就自動打開（不然會找不到自己選的是哪一班）。 */
  /* ⚠️ q.showAll 是三態，不是 true/false：
     undefined＝還沒自己動過（預設收起來）；true／false＝他按過了，聽他的。
     以前寫成 `!!q.showAll || !route.length || !inRoute`，今天沒排課時
     後面那一項永遠是 true，按「收起來」整段不會收（2026-09-20 他回報）。
     ⚠️ 2026-09-20 再改：預設**一律收起來**，不要因為今天沒排課就自動攤開九張牌
     ——那一整排佔掉半個畫面，而要補記別天的時候按一下「換別班」就好。 */
  var allOpen = (q.showAll === undefined || q.showAll === null) ? false : !!q.showAll;
  h += '<section><div class="lb">' + (allOpen ? '所有班級' : '其他班級') +
    ' <em>All classes</em>' +
    '<button class="qk-more" data-qall="' + (allOpen ? '0' : '1') + '">' +
      (allOpen ? '收起來' + ico('up') : '換別班 · ' + S.classes.length + ' 班' + ico('down')) +
      '</button></div>' +
    (allOpen
      ? '<div class="qk-row">' + sortedClasses().map(function (c) {
          var done = S.progress.some(function (p) {
            return String(p.cls) === String(c.code) && ymd10(p.date) === S.today;
          });
          /* ⚠️ 只寫班級號碼。年級（「二年級」）九張牌寫九次，一個字都沒告訴他
             ——他自己的班全是二年級（2026-09-20 他說拿掉）。
             「今天記過了」改成右上角一顆小勾，不佔一整行。 */
          return '<div class="qk-cls c-' + colorOf(c.code) +
            (String(c.code) === String(q.cls) ? ' on' : '') +
            (done ? ' done' : '') +
            '" data-qc="' + esc(c.code) + '" title="' + esc(c.grade) + '">' + esc(c.code) +
            (done ? '<i class="tick" aria-label="今天記過了">' + ico('check') + '</i>' : '') +
            '</div>';
        }).join('') + '</div>'
      : '') + '</section>';

  /* 這一班今天連上兩節（含）以上時，要先說清楚「現在記的是哪一節」。
     兩節常常不是同一個單元——第一節把上次的收尾、第二節開新的（2026-09-15 他說的）。
     只有一節就不必問，免得多一次點擊。 */
  var myPers = periodsOn(q.cls, S.today);
  if (myPers.length > 1) {
    h += '<section><div class="lb">這是第幾節 <em>Period</em>' +
      '<span class="n">' + myPers.length + ' 節連堂</span></div><div class="qk-per">' +
      myPers.map(function (no) {
        var pl = lessonAt(S.today, no, q.cls);
        var pu = pl ? unitOf(pl.unitId) : null;
        return '<button data-qp="' + no + '"' +
          (Number(no) === Number(q.period) ? ' class="on"' : '') + '>' +
          '<b>第 ' + no + ' 節</b>' +
          '<span>' + (pu ? esc(pu.nameZh || pu.nameEn) : '還沒記') + '</span></button>';
      }).join('') + '</div></section>';
  }

  /* 上週沒來的人——走進教室第一件要知道的事 */
  var pend = pendingAbsent(q.cls);
  var pendN = pend.reduce(function (n, a) { return n + seatsLeft(a).length; }, 0);
  h += '<section><div class="lb">上週沒來 <em>Needs catch-up</em>' +
    '<span class="n">' + (pendN ? pendN + ' 人要補' : '全到') + '</span></div>';
  if (!pendN) {
    /* ⚠️ 全到就什麼都不畫。右邊那顆小字已經寫著「全到」，再鋪一整條綠框
       只是把下面要按的東西往下推 46px（2026-09-20 精簡）。 */
    h += '';
  } else {
    h += '<div class="qk-pend">' + pend.map(function (a) {
      return '<div class="r"><span class="wk">' + esc(weekLabel(a.week)) + '</span>' +
        '<span class="s">' + seatsLeft(a).map(function (x) {
          var st = seatStat(a.cls, x);
          return '<span class="seat' + (st && st.n >= 2 ? ' rep' : '') + '">' + esc(x) + ' 號' +
                 (st && st.n >= 2 ? '<i>×' + st.n + '</i>' : '') +
                 '<button data-qdone="' + esc(a.id) +
                 '" data-seat="' + esc(x) + '" title="已經補完了">✓</button></span>';
        }).join('') + '</span>' +
        (a.unitId ? '<span class="u">' + esc(unitName(a.unitId)) + '</span>' : '') + '</div>';
    }).join('') + '</div>' +
    '<div class="hint" style="margin-top:6px">補完進度就點號碼旁邊的 ✓，從清單移除。</div>';
  }
  h += '</section>';

  /* 單元。⚠️ 手機上不要用下拉選單——站著單手拿手機，選單要點兩次還看不到全貌
     （2026-09-15 他定的原則：能用按鈕就不要用選單）。
     但六個單元排成格子會佔掉大半個畫面，名字還被截掉（同一天他回報的）。
     所以平常**只顯示現在選的那一條**，點下去才整份攤開；
     攤開時一列一個，中英文名才放得完整。選完自動收回去。 */
  var allUnits = sortedUnits();
  var picking  = !!q.pickUnit;
  h += '<section><div class="lb">單元 <em>Unit</em>' +
    (picking
      ? '<button class="qk-more" data-qupick="0">取消' + ico('up') + '</button>'
      : '<span class="n">' + allUnits.length + ' 個</span>') + '</div>';
  if (picking) {
    h += '<div class="qk-units">' + allUnits.map(function (x) {
      return '<button data-qu="' + esc(x.id) + '"' +
        (String(x.id) === String(q.unitId) ? ' class="on"' : '') + '>' +
        '<span class="ic c-' + (x.color || 'blue') + '">' + coverInner(x) + '</span>' +
        '<span class="t"><b>' + esc(x.nameZh || x.nameEn) + '</b>' +
        '<span>' + esc(x.nameEn) + '</span></span></button>';
    }).join('') + '</div>';
  } else {
    h += '<button class="qk-unit-now" data-qupick="1">' +
      '<span class="ic c-' + ((u && u.color) || 'blue') + '">' + coverInner(u) + '</span>' +
      '<span class="t"><b>' + esc(u ? (u.nameZh || u.nameEn) : '還沒選單元') + '</b>' +
      '<span>' + esc(u ? u.nameEn : '點一下選一個') + '</span></span>' +
      '<span class="go">換單元' + ico('down') + '</span></button>';
      /* ⚠️ 這裡不要再印單元的教學目標。手機是站在教室裡用的，
         單元選好了就不必再讀一遍簡介，那三行把下面真正要按的東西推出畫面
         （2026-09-20 他圈掉）。要看簡介在「教學進度」那一頁。 */
  }
  h += '</section>';

  /* 進度 */
  h += '<section><div class="lb">進度到哪 <em>Progress</em></div><div class="qk-st">' +
    ST_ORDER.map(function (k) {
      var st = ST[k];
      return '<button data-qs="' + k + '" class="' + (q.status === k ? 'on ' + st.k : '') + '"' +
        (q.status === k ? ' style="color:' + st.c + '"' : '') + '>' +
        /* ⚠️ 用跟「狀態對照」「單元卡那排圓點」同一顆記號，不要另外畫一顆實心圓
           ——同一件事在這個網站上只能有一種長相（2026-09-20 他指出）。 */
        '<span class="dot ' + st.k + '">' + stMark(k) + '</span>' +
        '<span class="tx"><b>' + st.z + '</b><span>' + st.e + '</span></span></button>';
    }).join('') + '</div></section>';

  /* 缺席座號 */
  h += '<section><div class="lb">缺席座號 <em>Absent</em>' +
    '<span class="n">' + (q.seats.length ? q.seats.length + ' 人' : '全到') + '</span></div>' +
    '<div class="qk-pad">';
  for (var n = 1; n <= seatMax; n++) {
    h += '<button data-qn="' + n + '"' + (q.seats.indexOf(n) >= 0 ? ' class="on"' : '') + '>' + n + '</button>';
  }
  h += '</div><div class="qk-seats">' +
    (q.seats.length
      ? q.seats.slice().sort(function (a, b) { return a - b; }).map(function (x) {
          var st = seatStat(q.cls, x), k = st ? st.before + 1 : 1;   /* 含這一次 */
          return '<span class="seat' + (k >= 2 ? ' rep' : '') + '">' + x + ' 號' +
            (k >= 2 ? '<i>×' + k + '</i>' : '') +
            '<button data-qx="' + x + '">✕</button></span>';
        }).join('')
      : '<span class="none">沒有人缺席 · 點上面的號碼登記</span>') +
    '</div>' + repeatLine(q.cls, q.seats) + '</section>';

  /* 照片 */
  h += '<section><div class="lb">作品照片 <em>Photos</em>' +
    '<span class="n">' + phs.length + ' 張</span></div>' +
    '<button class="qk-cam" id="qCam">' + ico('cam') + '拍照</button>' +
    '<button class="qk-pick" id="qPick">' + ico('pic') + '匯入照片</button>' +
    /* ⚠️ 格子一律畫出來（沒照片時是空的、:empty 會把它收起來）：
       還在佇列裡的照片要插進這一格（pqPaint 找 data-pq） */
    '<div class="qk-photos" data-pq="' + esc(q.prgId || '') + '">' + phs.map(function (p) {
      return '<div class="ph" data-ph="' + esc(p.id) + '">' +
        '<img data-file="' + esc(p.fileId) + '" data-thumb="' + esc(p.thumbId || '') + '" alt="學生作品">' +
        '<button class="x" data-delph="' + esc(p.id) + '" title="刪除">✕</button></div>';
    }).join('') + '</div>' +
    '</section>';

  /* 課堂札記 */
  /* ⚠️ 這裡刻意不放輸入框——鍵盤一上來就會把它推到看不見的地方（見 feBlock）。
     藏在後面的 <textarea id="qNote"> 還在，底下那些 $('qNote').value 都照舊。 */
  h += '<section><div class="lb">課堂札記 <em>Class Note</em></div>' +
    feBlock('qNote', q.note, '今天學生們創意十足！', '課堂札記 Class Note') +
    '</section>';

  h += '<div class="qk-bar">' +
    '<button class="btn qk-save" id="qSave">' + ico('save') + '儲存 ' + esc(q.cls) + ' 班的紀錄</button>' +
    /* ⚠️ 一切正常的時候不要寫任何字。「進度、缺席、札記會一起存」是第一次用才需要的
       說明，每天看到只是佔掉一行、把頁尾往下推（2026-09-20 他劃掉）。
       只有「會刪掉紀錄」「這次少存一樣東西」這種要先知道的才留著。 */
    (q.status ? '' :
      '<div class="qk-hint">' +
      (q.prgId
        ? '⚠️ 沒有選進度狀態 —— 按儲存會把這個單元的進度紀錄刪掉。'
        : '沒有選進度狀態 —— 這次只會存缺席和札記。') +
      '</div>') +
    '</div>';

  return h + '</div>';
}

function aquick() {
  var q = UI.quick;

  Array.prototype.forEach.call(document.querySelectorAll('[data-qr]'), function (b) {
    b.onclick = function () {
      q.note = $('qNote') ? $('qNote').value : q.note;
      pickSlot(b.dataset.qr, Number(b.dataset.qrp || 0));
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-qc]'), function (b) {
    b.onclick = function () {
      q.note = $('qNote') ? $('qNote').value : q.note;
      pickSlot(b.dataset.qc, 0);
      render();
    };
  });

  /* 連堂時：換節次就把單元切成那一節上的那個 */
  Array.prototype.forEach.call(document.querySelectorAll('[data-qp]'), function (b) {
    b.onclick = function () {
      q.note = $('qNote') ? $('qNote').value : q.note;
      pickSlot(q.cls, Number(b.dataset.qp));
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-qu]'), function (b) {
    b.onclick = function () {
      q.note = $('qNote') ? $('qNote').value : q.note;
      q.unitId = b.dataset.qu;
      q.pickUnit = false;            /* 選完就收回去，不用再按一次 */
      quickLoad();
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-qupick]'), function (b) {
    b.onclick = function () {
      q.note = $('qNote') ? $('qNote').value : q.note;
      q.pickUnit = (b.dataset.qupick === '1');
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-qall]'), function (b) {
    b.onclick = function () {
      q.note = $('qNote') ? $('qNote').value : q.note;
      q.showAll = (b.dataset.qall === '1');   /* 按鈕上寫的就是按下去之後的狀態 */
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-qs]'), function (b) {
    b.onclick = function () {
      q.note = $('qNote').value;
      /* 點已經選起來的那個就取消——不小心點到才有辦法收回 */
      q.status = (q.status === b.dataset.qs) ? '' : b.dataset.qs;
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-qn]'), function (b) {
    b.onclick = function () {
      var n = Number(b.dataset.qn);
      var i = q.seats.indexOf(n);
      if (i >= 0) q.seats.splice(i, 1); else q.seats.push(n);
      q.note = $('qNote').value;
      render();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-qx]'), function (b) {
    b.onclick = function () {
      var i = q.seats.indexOf(Number(b.dataset.qx));
      if (i >= 0) q.seats.splice(i, 1);
      q.note = $('qNote').value;
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-qdone]'), function (b) {
    b.onclick = function () {
      q.note = $('qNote') ? $('qNote').value : q.note;
      seatDoneNow(b.dataset.qdone, b.dataset.seat, true, b.dataset.seat + ' 號已補完');
    };
  });

  $('qNote').oninput = function () { q.note = this.value; };

  /* 匯入照片：從照片庫選（iPhone 選單裡也還有「拍照」可以用，網頁相機打不開時的退路） */
  $('qPick').onclick = function () {
    q.note = $('qNote').value;
    if (!q.status && !q.prgId) {
      return toast('照片要掛在進度紀錄上，請先點一個進度狀態。', true);
    }
    $('qPick').disabled = true;
    ensurePrg().then(function (id) {
      $('qPick').disabled = false;
      pickPhotos(id);
    }).catch(function (e) { $('qPick').disabled = false; fail(e); });
  };
  /* 拍照＝連拍相機。相機在按下去的當下就開（iPhone 要在手勢裡要權限），紀錄同時去存——兩件事一起跑 */
  $('qCam').onclick = function () {
    q.note = $('qNote').value;
    if (!q.status && !q.prgId) {
      return toast('照片要掛在進度紀錄上，請先點一個進度狀態。', true);
    }
    openCam(ensurePrg());
  };

  Array.prototype.forEach.call(document.querySelectorAll('[data-delph]'), function (b) {
    b.onclick = function (ev) {
      ev.stopPropagation();
      ask('刪掉之後會移到垃圾桶，無法從網頁復原。', '刪除', '刪除這張照片？').then(function (yes) {
        if (!yes) return;
        call('apiDeletePhoto', b.dataset.delph).then(function () {
          dropPhotoLocal(b.dataset.delph);     /* 不用重抓整包資料 */
          refresh(null, '照片已刪除');
        }).catch(fail);
      });
    };
  });

  $('qSave').onclick = function () {
    q.note = $('qNote').value;
    okToDropProgress(q.cls, q.unitId, q.prgId, q.status).then(function (go) {
      if (!go) return;
      $('qSave').disabled = true;
      saveQuick().then(function (d) {
        refresh(d, q.cls + ' 班已儲存');
      }).catch(function (e) {
        $('qSave').disabled = false;
        fail(e);
      });
    });
  };
}

/* 進度與缺席一起存，回傳整包新資料 */
/* 取消選取後按儲存＝要刪掉這筆進度紀錄。刪之前一定要問清楚，
   而且要講明照片會不會一起消失。
   回傳 Promise<true> 代表可以繼續（有選狀態、或本來就沒紀錄，就不必問）。 */
function okToDropProgress(cls, unitId, prgId, status) {
  if (status) return Promise.resolve(true); /* 有選狀態＝不是要刪 */
  if (!prgId) return Promise.resolve(true); /* 本來就沒紀錄，沒什麼好刪 */
  var n = photosOf(prgId).length;
  var u = unitOf(unitId);
  var name = u ? (u.nameZh || u.nameEn) : '這個單元';
  return ask(
    (n ? '這個單元的 ' + n + ' 張作品照片也會一起刪掉。\n\n' : '') +
    '（如果只是想改狀態，按取消，直接點另一個狀態就好。）',
    '刪掉紀錄',
    '要刪掉 ' + cls + ' 班「' + name + '」的進度紀錄嗎？');
}

function saveQuick() {
  var q = UI.quick;
  if (!q.unitId) return Promise.reject(new Error('請先選一個單元。'));
  /* 進度和缺席同一次呼叫就存完，不要跑兩趟 */
  return call('apiSaveClassRecord', {
    cls: q.cls, unitId: q.unitId, status: q.status,
    date: S.today, note: q.note, period: q.period,
    week: weekOfDate(S.today), seats: q.seats.join(',')
  }).then(function (r) {
    q.prgId = r.prgId;
    draftClear();            /* 存進去了，草稿就不用留了 */
    return r.data;
  });
}

/* 要上傳照片就得先有進度紀錄。沒有就先幫他存一筆，不要丟錯誤給他 */
function ensurePrg() {
  var q = UI.quick;
  if (q.prgId) return Promise.resolve(q.prgId);
  toast('先幫你存一筆紀錄…');
  return saveQuick().then(function (d) {
    S = d;
    quickLoad();
    /* 沒重畫，格子上的 data-pq 還是空的——補上，待傳的照片才知道要插在這一格 */
    var box = document.querySelector('.qk-photos[data-pq=""]');
    if (box && q.prgId) box.dataset.pq = q.prgId;
    return q.prgId;
  });
}

function ahome() {

  Array.prototype.forEach.call(document.querySelectorAll('[data-todo]'), function (b) {
    b.onclick = function () {
      var cls = b.dataset.todo;
      var per = Number(b.dataset.per || 0);
      var target = isPhone() ? 'quick' : 'check';
      var u = (per ? unitForSlot(S.today, per, cls) : currentUnit(cls));
      if (target === 'quick') {
        UI.quick.cls = cls;
        UI.quick.period = per || periodFor(cls);
        if (u) UI.quick.unitId = u.id;
        UI.quick.loaded = '';
      } else {
        UI.check.cls = cls;
        var cl = clsOf(cls); if (cl) UI.check.grade = cl.grade;
        if (u) UI.check.unitId = u.id;
        UI.check.date = S.today;
        UI.check.period = per || periodFor(cls);
        UI.check.loaded = '';
      }
      go(target);
    };
  });
}

function bindGo() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function (b) {
    b.onclick = function (ev) { ev.preventDefault(); go(b.dataset.go); };

}

      var o = slotOn(date, p);
      /* 全校活動佔掉的那一節：格子換成活動名稱，底下留一行「本來是 204」。
         他要的是「一眼看出哪一節不用上、哪個班少掉了、為什麼」（2026-09-19）。 */
      if (o.kind === 'block') {
        return '<div class="slot off" data-d="' + d + '" data-p="' + p + '">' +
          '<span class="cn">' + esc(holName(o.block)) + '</span>' +
          (o.base ? '<span class="un">本來是 ' + esc(o.base) + '</span>' : '') + '</div>';
      }
      if (o.kind === 'out') {
        return '<div class="slot moved" data-d="' + d + '" data-p="' + p + '">' +
          '<span class="cn">' + esc(o.out.cls) + '</span>' +
          '<span class="un">→ ' + esc(dateLabel(o.out.toDate)) +
            ' 第' + esc(o.out.toPeriod) + '節</span></div>';
      }
      if (!o.cls) {
        return '<div class="slot empty" data-d="' + d + '" data-p="' + p + '">＋</div>';
      }
      /* ⚠️ 每一格各自查「這一天這一節上了什麼」。以前全用 currentUnit(班級)，
         所以同一班連上的兩節一定長一樣（2026-09-15 他截圖回報）。 */
      var u = unitForSlot(date, p, o.cls);
      return '<div class="slot c-' + colorOf(o.cls) + (o.kind === 'in' ? ' swap' : '') +
        '" data-d="' + d + '" data-p="' + p + '">' +
        '<span class="cn">' + esc(o.cls) +
          (o.kind === 'in' ? '<i class="swap-tag">調</i>' : '') + '</span>' +
        (o.kind === 'in'
          ? '<span class="un">' + esc(dateLabel(o.into.date)) + ' 第' + esc(o.into.period) + '節調來</span>'
          : (u ? '<span class="un">' + esc(u.nameEn) + '</span>' : '')) +
        (o.room && o.kind !== 'in' ? '<span class="un">' + esc(o.room) + '</span>' : '') + '</div>';
    }) + '</div>';

  /* 班級顏色對照 */
  h += '<div class="card"><h3><i class="ci ci-palette" aria-hidden="true">🎨</i> 班級顏色對照 <span class="en2">Class Color Legend</span></h3>' +
    '<div class="cl-legend">' + sortedClasses().map(function (c) {
      return '<span class="cl-lg c-' + colorOf(c.code) + '"><b>' + esc(c.code) + '</b>' +
        (c.grade ? '<i>' + esc(c.grade) + '</i>' : '') + '</span>';
    }).join('') + '</div></div>';

  /* ── 停課：整天，或只有幾節 ──────────────────────────────
     期中考佔一二節、兒童節活動辦到第一節、大掃除佔一二三節——
     其餘節次照常上課，所以節次是勾的，不是整天一刀切（2026-09-19 他要的）。 */
  var hols = (S.holidays || []).slice().sort(function (a, b) {
    return String(a.date).localeCompare(String(b.date)); });
  h += '<div class="card no-print" style="margin-top:16px">' +
    '<h3><i class="ci ci-beach" aria-hidden="true">🏖️</i> 假日與停課 <span class="en2">Days Off</span>' +
    '<span class="right hint">' + hols.length + ' 筆</span></h3>' +
    '<div class="row">' +
      '<div class="field" style="max-width:190px"><label>日期 Date</label>' +
        '<input type="date" id="hDate" value="' + esc(S.today) + '"></div>' +
      '<div class="field" style="max-width:320px"><label>原因</label>' +
        '<input type="text" id="hName" placeholder="期中考 · 兒童節活動 · 中秋節"></div>' +
      '<div><button class="btn" id="hAdd">登記停課</button></div>' +
    '</div>' +
    '<div class="field" style="max-width:none;margin-top:4px"><label>影響哪幾節 Periods</label>' +
      '<div class="per-pick" id="hPers">' +
      '<button type="button" class="on" data-hp="all">整天</button>' +
      teachPeriods().map(function (p) {
        return '<button type="button" data-hp="' + esc(p.no) + '">第 ' + esc(p.no) + ' 節</button>';
      }).join('') + '</div>' +
      '<div class="hint" style="margin-top:6px">' +
      '勾幾節就只停那幾節，其餘照常上課；一節都沒勾＝整天不上課。</div></div>' +
    (hols.length
      ? '<div class="hol-grid">' + hols.map(function (x) {
          var ps = perList(x.periods);
          var lost = ps.map(function (n) {
            var b = schedAt(dayOfDate(x.date), n);
            return b ? b.cls : '';
          }).filter(function (c) { return c; });
          return '<div class="hol-i' + (ps.length ? ' part' : '') + '">' +
            '<span class="d">' + esc(dateLabel(x.date)) + '</span>' +
            '<span class="n">' + esc(holName(x)) + '</span>' +
            '<span class="p">' + esc(perLabel(x.periods)) +
              (lost.length ? '　少了 ' + esc(uniq(lost).join('、')) : '') + '</span>' +
            '<button class="x no-print" data-delhol="' + esc(x.id) + '" title="取消這一筆">✕</button>' +
            '</div>';
        }).join('') + '</div>'
      : '<div class="hint" style="margin-top:12px">還沒有登記。登記之後，' +
        '課表上那幾節會標成不上課，首頁也不會再提醒你那幾節還沒記錄。</div>') +
    '</div>';

  /* ── 調課：只有那一次 ───────────────────────────────────
     固定課表不動，這裡列的是「哪一天的哪一節，這次改到哪」。
     登記在課表格子裡（點格子 → 只有這一天），這張只負責看與取消。 */
  var movs = (S.moves || []).slice().sort(function (a, b) {
    return String(a.date).localeCompare(String(b.date)); });
  h += '<div class="card no-print"><h3><i class="ci ci-swap" aria-hidden="true">🔁</i> 臨時調課 <span class="en2">One-off Swaps</span>' +
    '<span class="right hint">' + movs.length + ' 筆</span></h3>' +
    (movs.length
      ? '<div class="mov-grid">' + movs.map(function (m) {
          return '<div class="mov-i"><span class="plate c-' + colorOf(m.cls) + '">' +
            esc(m.cls) + '</span>' +
            '<span class="f">' + esc(dateLabel(m.date)) + ' 第' + esc(m.period) + '節</span>' +
            '<span class="ar">→</span>' +
            '<span class="t">' + esc(dateLabel(m.toDate)) + ' 第' + esc(m.toPeriod) + '節</span>' +
            (m.note ? '<span class="nt">' + esc(m.note) + '</span>' : '') +
            '<button class="x no-print" data-delmov="' + esc(m.id) + '" title="取消這筆調課">✕</button>' +
            '</div>';
        }).join('') + '</div>'
      : '<div class="hint" style="margin-top:12px">還沒有調課。' +
        '點課表上任何一格，最下面那一塊「只有這一天」就能把那一節調到別的空堂，' +
        '跨到別一週也可以。固定課表不會被改到。</div>') +
    '</div>';

  h += '</div><div>';

  /* 本日授課動線。手機的教學總覽用的是同一支（見 routeCard） */
  h += routeCard();

  /* 節次時間設定（含午休這類休息時段） */
  h += '<div class="card no-print"><h3><i class="ci ci-today" aria-hidden="true">⏰</i> 節次時間 <span class="en2">Period Times</span>' +
    '<button class="btn ghost sm right" id="perSave">儲存</button></h3>' +
    '<table class="tb per-tb"><thead><tr><th>節次</th><th>開始</th><th>結束</th></tr></thead><tbody id="perBody">' +
    allPeriods().map(function (p) {
      var lab = String(p.label || '').trim();
      return '<tr' + (lab ? ' style="background:#fdf6ec"' : '') + '>' +
        '<td style="width:86px">' + (lab ? esc(lab) : '第 ' + esc(p.no) + ' 節') + '</td>' +
        '<td><input type="text" inputmode="numeric" maxlength="5" placeholder="08:30" ' +
          'data-per="' + esc(p.no) + '" data-f="start" value="' + esc(p.start) + '"></td>' +
        '<td><input type="text" inputmode="numeric" maxlength="5" placeholder="09:10" ' +
          'data-per="' + esc(p.no) + '" data-f="end" value="' + esc(p.end) + '"></td></tr>';
    }).join('') + '</tbody></table>' +
    '<div class="hint" style="margin-top:8px">打 <b>8:30</b> 或 <b>0830</b> 都可以，' +
    '離開欄位就會自動整理成 08:30。午休的時間也在這裡改；' +
    '要加減上課節數請到「系統設定」。</div></div>';

  h += '</div></div>';
  return h;
}

function asched() {
  $('wkPrev').onclick = function () { boot(Math.max(1, S.wk.week - 1)); };
  $('wkNext').onclick = function () { boot(S.wk.week + 1); };
  $('wkNow').onclick  = function () { boot(''); };
  $('scTerm').onchange = function () {
    var sel = this;
    call('apiSwitchTerm', sel.value).then(function (d) { refresh(d, '已切換學期'); })
      .catch(function (e) { sel.value = S.settings.term; fail(e); });   /* 沒切成功，選單要跟著退回來 */
  };
  $('scTeacher').onchange = function () {
    call('apiSaveSettings', { teacher: this.value }).then(function (d) {
      refresh(d, '已更新教師名稱'); }).catch(fail);
  };
  $('scAdd').onclick = function () { editSlot(1, 1); };

  /* 停課：整天或只有幾節。「整天」和節次是互斥的，按哪一邊就把另一邊關掉 */
  if ($('hPers')) {
    Array.prototype.forEach.call($('hPers').querySelectorAll('button'), function (b) {
      b.onclick = function () {
        var all = $('hPers').querySelector('[data-hp="all"]');
        if (b.dataset.hp === 'all') {
          Array.prototype.forEach.call($('hPers').querySelectorAll('button'), function (x) {
            x.classList.toggle('on', x === b);
          });
        } else {
          b.classList.toggle('on');
          all.classList.remove('on');
          /* 一節都沒勾就退回「整天」，不要留在什麼都沒選的狀態 */
          if (!$('hPers').querySelector('button.on')) all.classList.add('on');
        }
      };
    });
  }
  if ($('hAdd')) $('hAdd').onclick = function () {
    var d = $('hDate').value;
    if (!d) return toast('請先選日期。', true);
    var ps = [];
    Array.prototype.forEach.call($('hPers').querySelectorAll('button.on'), function (b) {
      if (b.dataset.hp !== 'all') ps.push(Number(b.dataset.hp));
    });
    $('hAdd').disabled = true;
    call('apiSaveHoliday', { date:d, name:$('hName').value.trim(), periods:ps })
      .then(function (r) { refresh(r, ps.length ? '已登記停課' : '已登記放假'); })
      .catch(function (e) { $('hAdd').disabled = false; fail(e); });
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-delhol]'), function (b) {
    /* 那顆 ✕ 很小、又在課表格子旁邊，誤觸就少一筆停課——先問一句 */
    b.onclick = function () {
      ask('取消之後，那一天的課會照固定課表算回來。', '取消這一筆', '要取消這一筆停課嗎？')
        .then(function (yes) {
          if (!yes) return;
          call('apiDeleteHoliday', b.dataset.delhol)
            .then(function (r) { refresh(r, '已取消這一筆停課'); }).catch(fail);
        });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-delmov]'), function (b) {
    b.onclick = function () {
      ask('取消之後，課會回到原本那一節。', '取消這筆調課', '要取消這筆調課嗎？')
        .then(function (yes) {
          if (!yes) return;
          call('apiDeleteMove', b.dataset.delmov)
            .then(function (r) { refresh(r, '已取消這筆調課，課回到原本那一節'); }).catch(fail);
        });
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('.slot[data-d]'), function (s) {
    s.onclick = function () { editSlot(Number(s.dataset.d), Number(s.dataset.p)); };
  });

  Array.prototype.forEach.call($('perBody').querySelectorAll('input'), function (i) {
    i.onblur = function () { i.value = normTime(i.value); };
  });

  $('perSave').onclick = function () {
    var map = {};
    Array.prototype.forEach.call($('perBody').querySelectorAll('input'), function (i) {
      var n = i.dataset.per;
      map[n] = map[n] || { no: Number(n), label: labelOfPeriod(n) };
      map[n][i.dataset.f] = normTime(i.value);
    });
    var rows = [];
    for (var k in map) rows.push(map[k]);
    rows.sort(function (a, b) { return Number(a.no) - Number(b.no); });
    call('apiSavePeriods', rows).then(function (d) { refresh(d, '節次時間已儲存'); }).catch(fail);
  };
}

/* 點一格課表 → 選班級／教室 */
function editSlot(day, period) {
  if (isArchived()) return toast('這個學期已封存，只能查看。', true);
  var cur  = schedAt(day, period) || { cls:'', room:'', note:'' };
  var date = S.wk.days[day - 1];
  modal('編輯課程',
    '<div class="row"><div class="field"><label>星期</label><select id="mDay">' +
      [1,2,3,4,5].map(function (d) {
        return '<option value="' + d + '"' + (d === day ? ' selected' : '') + '>週' + DAYS[d] + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label>節次</label><select id="mPer">' +
      teachPeriods().map(function (p) {
        return '<option value="' + p.no + '"' + (Number(p.no) === period ? ' selected' : '') +
          '>第 ' + p.no + ' 節　' + p.start + '–' + p.end + '</option>';
      }).join('') + '</select></div></div>' +
    '<div class="row" style="margin-top:12px"><div class="field"><label>班級</label>' +
      '<select id="mCls"><option value="">（這節沒課）</option>' +
      sortedClasses().map(function (c) {
        return '<option value="' + esc(c.code) + '"' + (String(c.code) === String(cur.cls) ? ' selected' : '') +
          '>' + esc(c.code) + '　' + esc(c.grade) + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label>教室（可留白）</label>' +
      '<input type="text" id="mRoom" value="' + esc(cur.room) + '" placeholder="例如 美術教室 A"></div></div>' +
    '<div class="hint" style="margin-top:8px">上面這一塊是<b>整個學期</b>的固定課表，改了每一週都會變。</div>' +
    onceBox(date, period),
    function () {
      var d = Number($('mDay').value), p = Number($('mPer').value);
      var rows = S.schedule.filter(function (r) {
        return !(Number(r.day) === day && Number(r.period) === period) &&
               !(Number(r.day) === d && Number(r.period) === p);
      });
      var code = $('mCls').value;
      if (code) rows.push({ day:d, period:p, cls:code, room:$('mRoom').value.trim(), note:'' });
      call('apiSaveSchedule', rows).then(function (x) {
        closeModal(); refresh(x, code ? '課表已更新' : '已清空這一節');
      }).catch(fail);
      return false;
    });
  onceWire(date, period);
}

/* ── 「只有這一天」──────────────────────────────────────────
   臨時的事情全部集中在這裡：這一節停課（全校活動），或這一節這次調到別處。
   ⚠️ 固定課表不動——他明講過臨時調整不可以改到整學期的課表（2026-09-19）。
   登記一律從「有課的那一格」出發：空堂格子不給調課，
   不然還要先問「要把誰調過來」，在課表上點兩次反而容易點錯。 */
function onceBox(date, period) {
  var o = slotOn(date, period);
  var head = '<div class="once"><div class="once-h">只有這一天　<b>' +
    esc(dateLabel(date)) + ' 第 ' + esc(period) + ' 節</b></div>';

  if (o.kind === 'block') {
    var ps = perList(o.block.periods);
    return head + '<div class="once-now">這一節已登記不上課：<b>' + esc(holName(o.block)) + '</b>' +
      '（' + esc(perLabel(o.block.periods)) + '）' +
      (o.base ? '　本來是 ' + esc(o.base) + '　' : '') +
      '</div><div class="once-act"><button class="btn ghost sm" id="oDelHol">' +
      (ps.length ? '取消這筆停課' : '取消整天放假') + '</button></div></div>';
  }
  if (o.kind === 'out') {
    return head + '<div class="once-now">這一節（' + esc(o.out.cls) + '）已經調到 <b>' +
      esc(dateLabel(o.out.toDate)) + ' 第 ' + esc(o.out.toPeriod) + ' 節</b>' +
      (o.out.note ? '　' + esc(o.out.note) : '') +
      '</div><div class="once-act"><button class="btn ghost sm" id="oDelMov">取消調課</button>' +
      '</div></div>';
  }
  if (o.kind === 'in') {
    return head + '<div class="once-now">這一節是 <b>' + esc(o.into.cls) + '</b> 從 ' +
      esc(dateLabel(o.into.date)) + ' 第 ' + esc(o.into.period) + ' 節調過來的。' +
      '</div><div class="once-act"><button class="btn ghost sm" id="oDelMov">取消調課（課回到原本那一節）</button>' +
      '</div></div>';
  }
  if (!o.cls) {
    return head + '<div class="hint">這一節是空堂。要把別節的課調到這裡，' +
      '請點<b>那一節</b>的格子，在它的「只有這一天」裡選調到這一節。</div></div>';
  }

  /* 有課，而且這一天還沒有任何異動 */
  return head +
    '<div class="once-r"><div class="field" style="max-width:260px"><label>這一節停課</label>' +
      '<input type="text" id="oWhy" placeholder="期中考 · 兒童節活動 · 大掃除"></div>' +
      '<div><button class="btn ghost sm" id="oBlock">登記停課</button></div></div>' +
    '<div class="once-r"><div class="field" style="max-width:190px"><label>這次調到哪一天</label>' +
      '<input type="date" id="oDate" value="' + esc(date) + '"></div>' +
      '<div class="field" style="max-width:170px"><label>第幾節</label><select id="oPer">' +
      teachPeriods().map(function (p) {
        return '<option value="' + esc(p.no) + '"' +
          (Number(p.no) === Number(period) ? ' selected' : '') + '>第 ' + esc(p.no) + ' 節</option>';
      }).join('') + '</select></div>' +
      '<div><button class="btn sm" id="oMove">調過去</button></div></div>' +
    '<div class="hint" id="oTip"></div>' +
    '<div class="hint">調到別一週也可以，日期直接選。' +
    '紀錄、缺席都照<b>實際上課那一天</b>算，不用另外處理。</div></div>';
}

function onceWire(date, period) {
  var o = slotOn(date, period);

  if ($('oDelHol')) $('oDelHol').onclick = function () {
    $('oDelHol').disabled = true;
    call('apiDeleteHoliday', o.block.id)
      .then(function (r) { closeModal(); refresh(r, '已取消停課，這一節恢復上課'); })
      .catch(function (e) { $('oDelHol').disabled = false; fail(e); });
  };
  if ($('oDelMov')) $('oDelMov').onclick = function () {
    var m = o.out || o.into;
    $('oDelMov').disabled = true;
    call('apiDeleteMove', m.id)
      .then(function (r) { closeModal(); refresh(r, '已取消調課，課回到原本那一節'); })
      .catch(function (e) { $('oDelMov').disabled = false; fail(e); });
  };
  if ($('oBlock')) $('oBlock').onclick = function () {
    $('oBlock').disabled = true;
    call('apiSaveHoliday', { date:date, periods:[Number(period)], name:$('oWhy').value.trim() })
      .then(function (r) { closeModal(); refresh(r, '這一節已登記停課'); })
      .catch(function (e) { $('oBlock').disabled = false; fail(e); });
  };

  /* 目標那一節現在是什麼，邊選邊講——兩班對調時才不會忘了另外那一筆 */
  function tip() {
    if (!$('oTip')) return;
    var d = $('oDate').value, p = Number($('oPer').value);
    if (!d || !p) return;
    if (d === date && p === Number(period)) {
      $('oTip').textContent = '這就是原本那一節。要調課請改日期或節次。';
      return;
    }
    var t = slotOn(d, p);
    var msg;
    if (t.kind === 'block') msg = '⚠️ ' + dateLabel(d) + ' 第 ' + p + ' 節是「' +
      holName(t.block) + '」，那一節不上課。';
    else if (t.cls) msg = '⚠️ ' + dateLabel(d) + ' 第 ' + p + ' 節本來是 ' + t.cls +
      ' 的課。兩班對調的話，記得也幫 ' + t.cls + ' 登記一筆。';
    else msg = '✓ ' + dateLabel(d) + ' 第 ' + p + ' 節是空堂。';
    $('oTip').textContent = msg;
  }
  if ($('oDate')) { $('oDate').onchange = tip; }
  if ($('oPer'))  { $('oPer').onchange  = tip; tip(); }

  if ($('oMove')) $('oMove').onclick = function () {
    var d = $('oDate').value, p = Number($('oPer').value);
    if (!d || !p) return toast('請選要調到哪一天的第幾節。', true);
    $('oMove').disabled = true;
    call('apiSaveMove', { date:date, period:Number(period), cls:o.cls,
                          toDate:d, toPeriod:p, note:'' })
      .then(function (r) {
        closeModal();
        refresh(r, o.cls + ' 已改到 ' + dateLabel(d) + ' 第 ' + p + ' 節');
      })
      .catch(function (e) { $('oMove').disabled = false; fail(e); });
  };
}

</script>

<script>
/* ══════════════════════════════════════════════════════════════
   3. 教學進度 Teaching Progress
      看的是「每個單元，各班進行到哪裡」的總覽。
   ══════════════════════════════════════════════════════════════ */
/* ── 🎬 預告（2026-11-13）────────────────────────────────────
   哪些單元有預告片，問小劇院的 trailers.json（照單元代號 code）。在瀏覽器抓，後台不用管影片。
   抓不到（還沒上線、404）就當作都沒有：教學進度不出現「預告」那一排。
   開給哪幾班存在單元的 trailer 欄（Code.gs 的 apiSetTrailer），家長成果頁照這個決定要不要亮。 */
var TRL_URL = 'https://visual-arts-fun-studio.longpuchris.workers.dev/trailers.json';
var TRL = window.__TRL__ || null, TRL_ASKED = !!TRL;
function loadTrl() {
  if (TRL_ASKED) return;
  TRL_ASKED = true;
  fetch(TRL_URL, { credentials: 'omit', cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (o) { TRL = o || {}; if (PAGE === 'prog') render(); })
    .catch(function () { TRL = {}; });
}
function hasTrl(u) { var c = String(u.code || '').trim(); return !!(c && TRL && TRL[c] && TRL[c].id); }
function trlOn(u) {
  var o = {};
  String(u.trailer == null ? '' : u.trailer).split(/[|,、\s]+/).forEach(function (c) { if (c) o[c] = 1; });
  return o;
}

function unitStage(u, classes) {
  var rows = S.progress.filter(function (p) {
    return String(p.unitId) === String(u.id) &&
           classes.some(function (c) { return String(c.code) === String(p.cls); });
  });
  if (!rows.length) return 'none';
  var doneN = rows.filter(function (r) { return r.status === 'done'; }).length;
  if (doneN >= classes.length && classes.length) return 'done';
  if (rows.some(function (r) { return r.status === 'almost' || r.status === 'done'; })) return 'almost';
  return 'in';
}

function vProg() {
  /* 手機上這一頁只做一件事：一眼看到各班進行到哪裡。
     橫幅、學期切換、年級／班級篩選、統計卡、狀態對照全部收起來，
     還沒開始的單元也不列——沒開始的看了也沒資訊。 */
  var phone = isPhone();
  loadTrl();
  var h = phone ? '' : hero('Teaching Progress', '教學進度', '追蹤孩子的學習旅程，看見創意的成長！',
    'Track the learning journey. Nurture creativity. Celebrate every step!',
    '每個單元，各班進行到哪裡，這一頁一次看完。');

  var grades = [];
  S.classes.forEach(function (c) { if (grades.indexOf(c.grade) < 0) grades.push(c.grade); });
  var fG = UI.prog.grade || '', fC = UI.prog.cls || '';
  var classes = sortedClasses().filter(function (c) {
    return (!fG || c.grade === fG) && (!fC || String(c.code) === String(fC));
  });

  /* ⚠️ 學期這組按鈕也要包在 .field 裡、也要給它標籤。沒有標籤的話，
     這一排只有中間兩格有標籤那一行，左邊的學期、右邊的按鈕就空了 31px 在上面，
     看起來像兩個標籤浮在半空中（2026-09-20 他圈出來的就是這個）。
     flex:0 0 auto ＝ 不要跟著長，寬度照按鈕本身。 */
  if (!phone) h += '<div class="card no-print"><div class="row">' +
    '<div class="field" style="flex:0 0 auto"><label>學期 Semester</label>' +
    '<div class="pill-term">' +
      '<button data-sem="1" class="' + (S.settings.semester === '1' ? 'on' : '') + '">上學期 First Semester</button>' +
      '<button data-sem="2" class="' + (S.settings.semester === '2' ? 'on' : '') + '">下學期 Second Semester</button>' +
    '</div></div>' +
    '<div class="field" style="max-width:200px"><label>年級 Grade</label><select id="fGrade">' +
      '<option value="">全部年級 All Grades</option>' + grades.map(function (g) {
        return '<option value="' + esc(g) + '"' + (g === fG ? ' selected' : '') + '>' + esc(g) + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field" style="max-width:200px"><label>班級 Class</label>' +
      selClasses('fCls', fC, '全部班級 All Classes') + '</div>' +
    '<div style="margin-left:auto"><button class="btn" id="uAdd">＋ 新增單元 Add Unit</button></div>' +
    '</div></div>';

  var units = sortedUnits();
  var cnt = { none:0, in:0, almost:0, done:0 };
  units.forEach(function (u) { cnt[unitStage(u, classes)]++; });

  if (!phone) {
    h += '<div class="grid g4" style="margin-bottom:16px">' +
      statCard('<i class="ci ci-units" aria-hidden="true">📚</i>', 'blue',   'Total Units',      '總單元數', units.length, '個單元') +
      statCard('<i class="ci ci-inprog" aria-hidden="true">🔄</i>', 'yellow', 'In Progress',      '進行中',   cnt['in'],    '個單元') +
      statCard('<i class="ci ci-almost" aria-hidden="true">⏳</i>', 'green',  'Almost Complete',  '即將完成', cnt.almost,   '個單元') +
      statCard('<i class="ci ci-done" aria-hidden="true">✅</i>', 'pink',   'Completed',        '已完成',   cnt.done,     '個單元') +
      '</div>';
  } else {
    units = units.filter(function (u) { return unitStage(u, classes) !== 'none'; });
  }

  /* ⚠️ 這一頁整頁共用同一組四欄格線：上面四張統計卡、中間狀態對照、下面單元卡，
     直線全部對得起來。以前單元卡是「三欄＋右邊 340px 的狀態對照」，
     跟統計卡的四欄錯開十幾個像素——2026-09-14 他圈出來的就是這個。 */
  /* 狀態對照做成四張小卡，跟統計卡、單元卡**同一條格線**。
     包在一張卡裡的話，裡面那四格會被卡片內距推開 9px，直線就又對不齊了。 */
  if (!phone) h += '<div class="sec-t">⭐ 狀態對照 <span class="en2">Status Legend</span>' +
    '<span class="hint">單元卡下面那排圓點就是這四種</span></div>' +
    '<div class="grid g4" style="margin-bottom:16px">' + ST_ORDER.map(function (k) {
      var st = ST[k];
      return '<div class="card lg-i" style="margin:0"><span class="dot ' + st.k + '">' +
        stMark(k) + '</span>' +
        '<div class="tx"><span class="a">' + st.z + '</span>' +
        '<span class="hint">' + st.e + '</span>' +
        '<span class="b">' + st.d + '</span></div></div>';
    }).join('') + '</div>';

  /* 一列兩張的橫式卡（2026-09-14 他畫的）。
     直式一列四張時每張只有 307px，封面小、說明擠；
     橫式之後左邊放封面、右邊放說明與各班狀態，看得清楚多了。
     ⚠️ 中間那條直線還是落在 50%，跟上面四欄的統計卡對得起來。 */
  /* ⚠️ 九個班都「全部完成」的單元**只有手機才收起來**（2026-09-21 他改的）。
     手機是站在教室裡快速看「這一週還有哪幾班沒跟上」用的，做完的單元佔一整張卡
     就會把還在進行的擠出畫面；桌機不一樣，他要的是整學期的全貌，
     收起來反而要多點一下（2026-09-20 本來是三種裝置同一套，這次改掉）。
     ⚠️ 這條規則以後也照這個方向：**要精簡就只精簡手機，桌機看得到全部。** */
  var foldDone  = phone;
  var liveUnits = foldDone
    ? units.filter(function (u) { return unitStage(u, classes) !== 'done'; })
    : units;
  var doneUnits = foldDone
    ? units.filter(function (u) { return unitStage(u, classes) === 'done'; })
    : [];

  function unitCard(u) {
    var doneN = classes.filter(function (c) {
      var p = progOf(c.code, u.id); return p && p.status === 'done';
    }).length;
    var pct = classes.length ? Math.round(doneN / classes.length * 100) : 0;
    var lp  = unitPeriods(u.id);
    return '<div class="unit"><div class="hd">' +
      '<div class="no c-' + (u.color || 'blue') + '">' + esc(u.ord) + '</div>' +
      /* 中英文排成同一行（放不下才折）。上下兩行時中間會空出一段，
         右邊又剩一大塊白——2026-09-14 他圈的就是這個。 */
      /* ⚠️ 中文在前、英文在後（全站同一條規則，2026-09-20 統一）。 */
      '<div class="nm"><span class="z">' + esc(u.nameZh) + '</span>' +
        '<span class="e">' + esc(u.nameEn) + '</span></div>' +
      '<button class="btn ghost sm no-print" style="margin-left:auto" data-eu="' + esc(u.id) + '">編輯</button>' +
      '</div>' +
      '<div class="cover c-' + (u.color || 'blue') + '">' + coverInner(u) + '</div>' +
      '<div class="bd">' +
        '<div class="d1">' + esc(u.descZh) + '</div>' +
        '<div class="d2">' + esc(u.descEn) + '</div>' +
        '<div class="prog-line"><span class="hint">進度 ' + doneN + '/' + classes.length + ' 班</span>' +
          '<span class="bar"><i style="width:' + pct + '%"></i></span><b>' + pct + '%</b>' +
          /* 下一輪排課要知道「這個單元要留幾節」——2026-09-15 他要的就是這個數字。
             一個班連上兩節、兩節不同單元時，節次紀錄才分得出來。 */
          (lp.total ? '<span class="hint lp">' + lp.avg + ' 節/班</span>' : '') + '</div>' +
        '<div class="cls-grid">' +
          '<div class="r"><span class="lb">班級</span><span class="cells">' +
            classes.map(function (c) {
              return '<span class="cell-cls c-' + colorOf(c.code) + '">' + esc(c.code) + '</span>';
            }).join('') + '</span></div>' +
          '<div class="r"><span class="lb">狀態</span><span class="cells">' +
            classes.map(function (c) {
              var p = progOf(c.code, u.id);
              var s = p ? ST[p.status] : null;
              /* 手機上這顆圓點是入口：按下去直接進快速記錄，班級與單元都選好，
                 不用再自己切頁、選班級、選單元（2026-09-14 加的）。 */
              return '<span class="dot ' + (s ? s.k : 'c-gray') + (phone ? ' tap' : '') + '"' +
                (phone ? ' data-qgo="' + esc(c.code) + '|' + esc(u.id) + '"' : '') +
                ' title="' + esc(c.code + ' ' + (s ? s.z : '未開始') +
                  (phone ? '（點一下去記錄）' : '')) + '">' +
                (s ? stMark(p.status) : '–') + '</span>';
            }).join('') + '</span></div>' +
          trlRow(u) +
        '</div>' +
      '</div></div>';
  }

  /* 🎬 預告那一排：只有小劇院真的有這個單元的預告片才出現。
     每一班一顆開關，只給**還沒開始**的班（已經開過的也留著，才關得掉）；
     下面再一顆「整個年級一起開」：年級照單元代號第一個字（二上-05 → 二年級的班），對不到就用這張卡上的班。 */
  function trlRow(u) {
    if (!hasTrl(u)) return '';
    var on = trlOn(u);
    var cells = classes.map(function (c) {
      var k = String(c.code);
      if (progOf(k, u.id) && !on[k]) return '<span></span>';
      return '<button type="button" class="dot trl-t' + (on[k] ? ' on' : '') + '" data-trl="' + esc(u.id) + '|' + esc(k) + '"' +
        ' title="' + esc(k + (on[k] ? ' 已開放預告（點一下關掉）' : ' 開放預告')) + '">🎬</button>';
    }).join('');
    var g0 = String(u.code || '').trim().charAt(0);
    var gc = classes.filter(function (c) { return String(c.grade || '').charAt(0) === g0; });
    if (!gc.length) gc = classes;
    var todo = gc.filter(function (c) { return !progOf(String(c.code), u.id); });
    var all = todo.length && todo.every(function (c) { return on[String(c.code)]; });
    return '<div class="r"><span class="lb">預告</span><span class="cells">' + cells + '</span></div>' +
      (todo.length ? '<div class="trl-all no-print"><span class="hint">🎬 開放預告：家長成果頁點得開</span>' +
        '<button type="button" class="btn ghost sm" data-trlg="' + esc(u.id) + '|' + (all ? '0' : '1') + '|' +
          esc(todo.map(function (c) { return c.code; }).join(',')) + '">' +
          (all ? '全部關閉' : '整個' + esc(gc[0].grade || '年級') + '開放') + '</button></div>' : '');
  }

  h += '<div class="grid g2 units">';
  h += liveUnits.map(unitCard).join('') ||
    '<div class="card empty-note">' +
    (units.length
      ? '🎉 所有單元、所有班級都完成了。下面可以打開來看。'
      : (phone ? '還沒有班級記過進度。到「快速記錄」記一筆就會出現在這裡。'
               : '還沒有單元，按右上角「新增單元」。')) + '</div>';
  h += '</div>';

  if (doneUnits.length) {
    h += '<details class="card fold done-units"><summary><i class="ci ci-done" aria-hidden="true">✅</i> 全部班級都完成的單元' +
      '<span class="n">' + doneUnits.length + ' 個</span>' +
      '<span class="en2">All classes complete</span></summary>' +
      '<div class="grid g2 units">' + doneUnits.map(unitCard).join('') + '</div></details>';
  }

  /* 這裡本來還有一張「📋 Unit List 單元管理」，列的是左邊同一批單元、
     連編輯鈕都一樣，等於同一頁把清單印兩次。2026-09-13 拿掉。
     狀態對照本來在右邊那條 340px 的側欄，2026-09-14 改成上面那條四欄的橫幅。 */
  return h;
}

function aprog() {
  /* 切換學期要跑一趟伺服器（重新讀整包資料），一兩秒跑不掉。
     所以按下去先把畫面切過去、鎖住按鈕、跳一句話，不要讓他站在那裡猜按到沒有。
     真的失敗再切回來——寧可晚一秒說「失敗」，也不要一秒都沒有反應。 */
  var sems = document.querySelectorAll('[data-sem]');
  Array.prototype.forEach.call(sems, function (b) {
    b.onclick = function () {
      if (b.className.indexOf('on') >= 0) return;   /* 已經在這個學期了 */
      var to = b.dataset.sem;
      Array.prototype.forEach.call(sems, function (x) {
        x.className = (x === b) ? 'on wait' : '';
        x.disabled = true;
      });
      toast('切換到' + (to === '2' ? '下' : '上') + '學期…');
      call('apiSwitchTerm', S.settings.year + '-' + to)
        .then(function (d) { refresh(d, '已切換到' + (to === '2' ? '下' : '上') + '學期'); })
        .catch(function (e) {
          Array.prototype.forEach.call(sems, function (x) {
            x.className = (x.dataset.sem === S.settings.semester) ? 'on' : '';
            x.disabled = false;
          });
          fail(e);
        });
    };
  });
  /* 手機上這三個沒有畫出來（見 vProg），所以要先確認存在 */
  if ($('fGrade')) $('fGrade').onchange = function () { UI.prog.grade = this.value; render(); };
  if ($('fCls'))   $('fCls').onchange   = function () { UI.prog.cls   = this.value; render(); };
  if ($('uAdd'))   $('uAdd').onclick    = function () { editUnit(null); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-eu]'), function (b) {
    b.onclick = function () { editUnit(b.dataset.eu); };
  });
  /* 🎬 預告開關：一班一顆／整個年級一顆 */
  function setTrl(unitId, list, on, btn) {
    if (isArchived()) return toast('這個學期已封存，只能查看。', true);
    btn.disabled = true;
    call('apiSetTrailer', unitId, list, on)
      .then(function (d) { refresh(d, (list.length > 1 ? list.length + ' 班' : list[0] + ' 班') + (on ? '已開放預告 🎬' : '已關閉預告')); })
      .catch(function (e) { btn.disabled = false; fail(e); });
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-trl]'), function (b) {
    b.onclick = function () {
      var x = b.dataset.trl.split('|');
      setTrl(x[0], [x[1]], b.className.indexOf(' on') < 0, b);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-trlg]'), function (b) {
    b.onclick = function () {
      var x = b.dataset.trlg.split('|');
      setTrl(x[0], x[2].split(','), x[1] === '1', b);
    };
  });
  /* 手機：點某一班的圓點 → 帶著那個班、那個單元跳進快速記錄 */
  Array.prototype.forEach.call(document.querySelectorAll('[data-qgo]'), function (b) {
    b.onclick = function () {
      var x = b.dataset.qgo.split('|');
      UI.quick.cls = x[0];
      UI.quick.unitId = x[1];
      quickLoad();
      go('quick');
    };
  });
}

function editUnit(id) {
  if (isArchived()) return toast('這個學期已封存，只能查看。', true);
  var u = id ? unitOf(id) : { ord:S.units.length + 1, color:'blue' };

  modal(id ? '編輯單元' : '新增單元',
    '<div class="row"><div class="field" style="flex:0 0 90px"><label>序號</label>' +
      '<input type="number" id="uOrd" value="' + esc(u.ord || 1) + '" min="1"></div>' +
    '<div class="field"><label>英文名稱</label>' +
      '<input type="text" id="uEn" value="' + esc(u.nameEn || '') + '" placeholder="All About Me"></div>' +
    '<div class="field"><label>中文名稱</label>' +
      '<input type="text" id="uZh" value="' + esc(u.nameZh || '') + '" placeholder="關於我"></div></div>' +
    /* 單元代號（2026-11-12）：跟故事動畫工作室、小劇院對得上；教學資源會自動列出這個單元的小劇院影片 */
    '<div class="field" style="margin-top:12px;max-width:260px"><label>單元代號（小劇院影片用）</label>' +
      '<input type="text" id="uCode" value="' + esc(u.code || '') + '" placeholder="二上-05"></div>' +
    '<div class="field" style="margin-top:12px"><label>🍿 挑戰爆米花（小劇院大廳的爆米花機，一行一題；英文可寫在「｜」後面）</label>' +
      '<textarea id="uFin" rows="3" placeholder="幫國王設計一個新寶座｜Draw a new throne.">' + esc(u.finish || '') + '</textarea>' +
      '<div class="hint">小劇院已經有每單元三題預設題目，這裡寫的會接在後面。</div></div>' +
    '<div class="field" style="margin-top:12px"><label>中文說明</label>' +
      '<input type="text" id="uDz" value="' + esc(u.descZh || '') + '" placeholder="探索自我 · 自畫像"></div>' +
    '<div class="field" style="margin-top:12px"><label>英文說明</label>' +
      '<input type="text" id="uDe" value="' + esc(u.descEn || '') + '"></div>' +
    '<div class="field" style="margin-top:12px"><label>教學目標（中文）</label>' +
      '<textarea id="uGz" placeholder="運用線條、形狀與色彩，創造出想像中的…">' + esc(u.goalZh || '') + '</textarea></div>' +
    '<div class="field" style="margin-top:12px"><label>教學目標（英文）</label>' +
      '<textarea id="uGe">' + esc(u.goalEn || '') + '</textarea></div>' +
    '<div class="row" style="margin-top:12px"><div class="field" style="flex:0 0 120px"><label>圖示</label>' +
      '<input type="text" id="uIc" value="' + esc(u.icon || '') + '" placeholder="🎨" maxlength="4"></div>' +
    '<div class="field"><label>代表色</label><select id="uCo">' +
      colorOptions(u.color || 'blue') + '</select></div></div>' +
    /* 挑好的一盤，點一下就換。自己貼別的 emoji 也還是可以（上面那格）。 */
    '<div class="field" style="margin-top:10px"><label>挑一個圖示</label>' +
      '<div class="emoji-pick" id="uIcPick">' + UNIT_ICONS.map(function (g) {
        return '<div class="g"><span>' + esc(g[0]) + '</span>' + g[1].map(function (e) {
          return '<button type="button" data-ic="' + esc(e) + '"' +
            (e === u.icon ? ' class="on"' : '') + '>' + e + '</button>';
        }).join('') + '</div>';

              '<div class="hint">放一張學生作品或範例照片，教學進度頁的單元卡、' +

    /* ── 成果頁（家長端）的內容。全部選填，沒填那一塊就不會出現在成果頁。

    '<details class="card fold" style="margin-top:14px"><summary><i class="ci ci-palette" aria-hidden="true">🎨</i> 成果頁內容' +

    '<div class="hint" style="margin-bottom:12px">' +
    '填了才會出現在班級成果頁。每一格都可以先空著，之後想到再回來補。<br>' +
    '成果頁上只會出現兩塊說明：<b>「今天，我們在學什麼？」</b>和' +
    '<b>「這堂課練習的，不只是畫畫」</b>。' +
    '「孩子怎麼學」和「課堂英文」留在這裡當課程資訊，家長看不到。<br>' +
    '⚠️ 這個單元要<b>照片上傳完＋進度標成「完成」</b>，家長那邊才看得到整個單元。</div>' +
    '<div class="field"><label>今天，我們在學什麼？（一段話）</label>' +
      '<textarea id="uLearn" placeholder="一個簡單的形狀，可以變成多少種不同的東西？…">' +
      esc(u.learnZh || '') + '</textarea>' +
      '<div class="hint">留白的話，成果頁上這一塊就不出現。</div></div>' +

    '<div class="field" style="margin-top:12px"><label>孩子怎麼學？（一段話）' +

    '<div class="field" style="margin-top:12px"><label>課堂裡的英文句子（一行一句，英文｜中文）' +
      '<span class="hint" style="font-weight:500">　· 課程資訊，不會出現在成果頁</span></label>' +
      '<textarea id="uPhr" placeholder="What do you see?|你看到了什麼？&#10;What could it be?|它還可能變成什麼？">' +
      esc(u.phrases || '') + '</textarea></div>' +
    '<div class="field" style="margin-top:12px"><label>這堂課練習的能力（一行一項，名稱｜說明）</label>' +

    '<div class="field" style="margin-top:12px"><label>課堂觀察（寫給家長看的，可以分段）</label>' +
      '<textarea id="uNote" placeholder="一開始有些孩子會說「我不知道要畫什麼」，但當我們把紙轉一轉…">' +
      esc(u.noteZh || '') + '</textarea></div>' +
    '<div class="field" style="margin-top:12px"><label>想留給家長的一句話</label>' +
      '<input type="text" id="uQuote" value="' + esc(u.quoteZh || '') +
      '" placeholder="比起畫得像不像，我更在意孩子相信自己的想法值得被畫出來。"></div>' +
    /* 作品區上面那一句（2026-10-05）。本來寫死「每個孩子，看見的都不一樣」，
       八個單元都同一句；每個單元的作品不一樣，這一句也要各自寫。 */
    '<div class="field" style="margin-top:12px"><label>學生作品上面的那一句（中文）</label>' +

      '<div class="hint">每個單元的作品不一樣，這一句也各寫各的。留白的話只寫「學生作品」。</div></div>' +
